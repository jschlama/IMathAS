    e = e.replace(/\blogbase\b/g, '_logbase'); e = e.replace(/\blog\b/g, 'Math.log10'); e = e.replace(/\bln\b/g, 'Math.log'); e = e.replace(/\bexp\b/g, 'Math.exp');
    e = e.replace(/\bfloor\b/g, 'Math.floor'); e = e.replace(/\bceil\b/g, 'Math.ceil'); e = e.replace(/\bround\b/g, 'Math.round');
    e = e.replace(/(?<![A-Za-z])pi(?![A-Za-z])/gi, 'Math.PI');
    e = e.replace(/(?<![A-Za-z0-9.])e(?![A-Za-z0-9])/g, 'Math.E'); // 1e+21 is a literal, not 1·e
    const vars = Session.get('exprVars', {});
    for (const [name, val] of Object.entries(vars)) {
      if (name === 'X' || name === 'Y') continue;
      const re = new RegExp('\\b' + name + '\\b(?!\\s*\\()', 'gi');
      // Parenthesised: a negative value would otherwise land straight in
      // front of a `**` (A = -3 in `A^2` → `-3**2`, a SyntaxError) or bind
      // wrongly after a `-`. `(-3)**2` is both legal and correct.
      e = e.replace(re, '(' + String(val) + ')');
    }
    const _sind = a => Math.sin(a * Math.PI / 180);
    const _cosd = a => Math.cos(a * Math.PI / 180);
    const _tand = a => Math.tan(a * Math.PI / 180);
    const _logbase = (b, x) => Math.log(x) / Math.log(b);
    const fn = new Function('x', 'y', '_sind', '_cosd', '_tand', '_logbase', '"use strict"; return (' + e + ')');
    const bound = (x, y) => fn(x, y, _sind, _cosd, _tand, _logbase);
    bound(0, 0); // test
    return bound;
  },

  // ─── Detect undefined parameters for sliders ───
  detectParams(exprStr) {
    // Strip calculus operator syntax first so its tokens — the 'd' in d/dx and
    // the function letter in f'(x) — aren't mistaken for slider parameters.
    exprStr = String(exprStr)
      .replace(/d\s*\/\s*d[a-zA-Z]/g, ' ')
      .replace(/\b[a-zA-Z]\s*'/g, ' ');
    // Find single-letter variables that aren't x, e, pi, or stored vars
    const vars = Session.get('exprVars', {});
    const reserved = new Set(['x','y','r','t','e','pi','theta','sin','cos','tan','asin','acos','atan','sqrt','cbrt','abs','ln','log','logbase','exp','floor','ceil','round']);
    const found = new Set();
    const re = /\b([a-zA-Z])\b/g;
    let m;
    while ((m = re.exec(exprStr)) !== null) {
      const v = m[1].toLowerCase();
      // A letter applied as a function — f(…) — or defined via f(x)= is a
      // function reference, not a slider parameter.
      if (exprStr[m.index + 1] === '(') continue;
      if (this.namedFunctions && this.namedFunctions[v]) continue;
      if (!reserved.has(v) && !vars[m[1].toUpperCase()]) {
        found.add(m[1].toLowerCase());
      }
    }
    return [...found];
  },

  // ─── Add with support for implicit, piecewise, and sliders ───
  addSmart(exprStr, displayStr, latex) {
    const rhs = exprStr.trim();

    // Check for implicit equation: has both x and y, not y=f(x)
    if (/\by\b/i.test(rhs) && /\bx\b/i.test(rhs)) {
      // It's implicit — rearrange LHS - RHS = 0
      const parts = rhs.split('=');
      let implicitExpr;
      if (parts.length === 2) {
        implicitExpr = `(${parts[0].trim()}) - (${parts[1].trim()})`;
      } else {
        implicitExpr = rhs;
      }
      try {
        const implicitFn = this.compileImplicit(implicitExpr);
        const id = this.nextId++;
        const color = this.colors[this.expressions.length % this.colors.length];
        const displayLatex = latex || this.exprToLatex(displayStr || exprStr);
        this.expressions.push({
          id, expr: displayStr || exprStr, rawExpr: rhs,
          latex: displayLatex,
          fn: null, implicitFn: implicitFn,
          color, visible: true, lineWidth: 2.5, dash: []
        });
        // Auto-fit: scan to find bounding box of the curve
        const scanRange = 50;
        const scanSteps = 100;
        let cxMin = Infinity, cxMax = -Infinity, cyMin = Infinity, cyMax = -Infinity;
        let found = false;
        for (let i = 0; i <= scanSteps; i++) {
          for (let j = 0; j <= scanSteps; j++) {
            const sx = -scanRange + 2 * scanRange * i / scanSteps;
            const sy = -scanRange + 2 * scanRange * j / scanSteps;
            try {
              const v = implicitFn(sx, sy);
              if (Math.abs(v) < scanRange * 0.5) {
                cxMin = Math.min(cxMin, sx); cxMax = Math.max(cxMax, sx);
                cyMin = Math.min(cyMin, sy); cyMax = Math.max(cyMax, sy);
                found = true;
              }
            } catch(e) {}
          }
        }
        if (found && isFinite(cxMin)) {
          const pad = Math.max((cxMax - cxMin), (cyMax - cyMin), 2) * 0.3;
          this.xMin = cxMin - pad; this.xMax = cxMax + pad;
          this.yMin = cyMin - pad; this.yMax = cyMax + pad;
        }
        this.panel.classList.add('visible');
        this.updateRows();
        this.render();
        return id;
      } catch(err) {
        // Fall through to normal compile
      }
    }

    // Check for piecewise
    if (rhs.startsWith('{')) {
      const fn = this.compilePiecewise(rhs);
      const id = this.nextId++;
      const color = this.colors[this.expressions.length % this.colors.length];
      const displayLatex = latex || this.exprToLatex(displayStr || exprStr);
      this.expressions.push({
        id, expr: displayStr || exprStr, rawExpr: rhs,
        latex: displayLatex,
        fn, color, visible: true, lineWidth: 2.5, dash: [],
        piecewise: true
      });
      this.panel.classList.add('visible');
      this.updateRows();
      this.render();
      return id;
    }

    // Check for slider parameters
    const params = this.detectParams(rhs);
    if (params.length > 0) {
      // Compile with parameters as free variables
      const compiledExpr = this._compileExpr(rhs, params);
      const paramFn = this._buildFn(compiledExpr, params);
      const id = this.nextId++;
      const color = this.colors[this.expressions.length % this.colors.length];
      const displayLatex = latex || this.exprToLatex(displayStr || exprStr);
      const sliders = {};
      params.forEach(p => { sliders[p] = { min: -10, max: 10, value: 1, step: 0.1 }; });
      // Wrap paramFn to use current slider values
      const entry = {
        id, expr: displayStr || exprStr, rawExpr: rhs,
        latex: displayLatex,
        fn: x => paramFn(x, entry.sliderValues),
        color, visible: true, lineWidth: 2.5, dash: [],
        sliders, sliderValues: {},
        paramFn // keep original for re-binding
      };
      params.forEach(p => { entry.sliderValues[p] = sliders[p].value; });
      this.expressions.push(entry);
      this.panel.classList.add('visible');
      this.updateRows();
      this.render();
      return id;
    }

    // Standard y = f(x)
    return this.add(rhs, displayStr, latex);
  },

  // ─── Compound-inequality band: a < x < b (vertical strip) or a < y < b
  // (horizontal band). Each bound keeps its own strictness for dashing. ───
  addBand(axis, lo, hi, loStrict, hiStrict, displayStr, latex) {
    const id = this.nextId++;
    const color = this.colors[this.expressions.length % this.colors.length];
    const label = displayStr || `${lo} < ${axis} < ${hi}`;
    const entry = {
      id, expr: label, rawExpr: label,
      latex: latex || this.exprToLatex(label),
      fn: null, color, visible: true, lineWidth: 2.5, dash: [],
      _loStrict: !!loStrict, _hiStrict: !!hiStrict,
    };
    if (axis === 'y') entry.bandY = [lo, hi]; else entry.bandX = [lo, hi];
    this.expressions.push(entry);
    this.panel.classList.add('visible');
    this.updateRows();
    this.render();
    return id;
  },

  // ─── Vertical line x = c — not representable as y = f(x) ───
  addVLine(val, displayStr, latex) {
    const id = this.nextId++;
    const color = this.colors[this.expressions.length % this.colors.length];
    const label = displayStr || `x = ${val}`;
    this.expressions.push({
      id, expr: label, rawExpr: label,
      latex: latex || this.exprToLatex(label),
      fn: null, vlineX: val, color, visible: true, lineWidth: 2.5, dash: [],
    });
    this.panel.classList.add('visible');
    this.updateRows();
    this.render();
    return id;
  },

  add(exprStr, displayStr, latex) {
    const fn = this.compile(exprStr);
    const id = this.nextId++;
    const color = this.colors[this.expressions.length % this.colors.length];
    // Store LaTeX as primary display; fall back to converting plain text
    const displayLatex = latex || this.exprToLatex(displayStr || exprStr);
    this.expressions.push({
      id, expr: displayStr || exprStr, rawExpr: exprStr,
      latex: displayLatex,
      fn, color, visible: true, lineWidth: 2.5, dash: []
    });
    this.panel.classList.add('visible');
    this.updateRows();
    this.render();
    return id;
  },

  remove(id) {
    this.expressions = this.expressions.filter(e => e.id !== id);
    // Remove pinned points belonging to this expression
    if (this._pinnedPoints) {
      this._pinnedPoints = this._pinnedPoints.filter(pt => {
        if (Array.isArray(pt.exprId)) return !pt.exprId.includes(id);
        return pt.exprId !== id;
      });
    }
    // Remove named function if this expression defined one
    if (this.namedFunctions) {
      const entry = this.expressions.find(e => e.funcName);
      // Rebuild namedFunctions from remaining expressions
      this.namedFunctions = {};
      this.expressions.forEach(e => { if (e.funcName) this.namedFunctions[e.funcName] = e.rawExpr; });
    }
    if (!this.expressions.length) this.panel.classList.remove('visible');
    this.updateRows();
    this.render();
  },

  updateExpr(id, newExprStr, newLatex, silent) {
    const entry = this.expressions.find(e => e.id === id);
    if (!entry) return;
    try {
      // Convert LaTeX to plain text for compilation
      let plainText = newExprStr || '';
      if (newLatex) {
        if (window._latexToExpr) {
          plainText = window._latexToExpr(newLatex);
        } else {
          plainText = newLatex; // raw fallback
        }
      }
      plainText = plainText.trim();
      if (!plainText) { showToast('Empty expression'); return; }

      // Compound band edit: a < x < b / a < y < b — mirror the ExprEngine route.
      const bandEdit = plainText.match(/^(.+?)\s*(<=|<|>=|>)\s*([xy])\s*(<=|<|>=|>)\s*(.+)$/i);
      if (bandEdit && !/\b[xy]\b/i.test(bandEdit[1]) && !/\b[xy]\b/i.test(bandEdit[5])
          && bandEdit[2][0] === bandEdit[4][0]) {
        let v1 = NaN, v2 = NaN;
        try { v1 = this.compile(bandEdit[1].trim())(0); v2 = this.compile(bandEdit[5].trim())(0); } catch (err) {}
        if (isFinite(v1) && isFinite(v2)) {
          let lo = v1, hi = v2;
          let loStrict = !bandEdit[2].includes('='), hiStrict = !bandEdit[4].includes('=');
          if (bandEdit[2][0] === '>') {
            lo = v2; hi = v1;
            loStrict = !bandEdit[4].includes('='); hiStrict = !bandEdit[2].includes('=');
          }
          if (lo < hi) {
            entry.fn = null; entry.implicitFn = null; entry.vlineX = null;
            entry._regionOp = null; entry._fillSide = null; entry._fillStrict = false;
            entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
            entry.bandX = null; entry.bandY = null;
            if (bandEdit[3].toLowerCase() === 'y') entry.bandY = [lo, hi]; else entry.bandX = [lo, hi];
            entry._loStrict = loStrict; entry._hiStrict = hiStrict;
            entry.expr = plainText; entry.rawExpr = plainText;
            entry.latex = newLatex || this.exprToLatex(plainText);
            this.render();
            return;
          }
        }
      }

      // Inequality row edits — mirror the ExprEngine routes so editing a row
      // to/from an inequality keeps (or gains) its boundary + region shading.
      const ineqEdit = plainText.match(/^([xy])\s*(<=|>=|<|>)\s*(.+)$/i);
      if (ineqEdit) {
        const lhs = ineqEdit[1].toLowerCase(), iop = ineqEdit[2], irhs = ineqEdit[3].trim();
        if (lhs === 'x' && !/\b[xy]\b/i.test(irhs)) {
          // x <op> c — vertical boundary + left/right half-plane
          let v = NaN;
          try { v = this.compile(irhs)(0); } catch (err) {}
          if (isFinite(v)) {
            entry.vlineX = v;
            entry.fn = null; entry.implicitFn = null; entry._regionOp = null;
            entry.bandX = null; entry.bandY = null;
            entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
            entry._fillSide = (iop[0] === '>') ? 'right' : 'left';
            entry._fillStrict = !iop.includes('=');
            entry.expr = plainText; entry.rawExpr = plainText;
            entry.latex = newLatex || this.exprToLatex(plainText);
            this.render();
            return;
          }
        } else if (lhs === 'y' && !/\by\b/i.test(irhs)) {
          // y <op> f(x) or y <op> c — boundary curve + above/below region
          let bfn = null;
          try {
            bfn = /\bx\b/i.test(irhs) ? this.compile(irhs)
                                      : this.compile(String(this.compile(irhs)(0)));
          } catch (err) {}
          if (bfn) {
            entry.fn = bfn;
            entry.vlineX = null; entry.implicitFn = null; entry._regionOp = null;
            entry.bandX = null; entry.bandY = null;
            entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
            entry._fillSide = (iop[0] === '>') ? 'above' : 'below';
            entry._fillStrict = !iop.includes('=');
            entry.expr = plainText; entry.rawExpr = irhs;
            entry.latex = newLatex || this.exprToLatex(plainText);
            this.render();
            return;
          }
        }
      }

      // Implicit inequality edit: f(x,y) <op> g(x,y) (e.g. x+y < 10) — must
      // run before the implicit (=) branch, whose /=/ test matches "<=".
      if (!/[{}]/.test(plainText) && /\bx\b/i.test(plainText) && /\by\b/i.test(plainText)) {
        const gI = plainText.match(/^([^<>=]+?)\s*(<=|>=|<|>)\s*([^<>=]+)$/);
        if (gI) {
          const implicitExpr = `(${gI[1].trim()}) - (${gI[3].trim()})`;
          const implicitFn = this.compileImplicit(implicitExpr);
          entry.fn = null; entry.vlineX = null;
          entry.bandX = null; entry.bandY = null;
          entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
          entry._fillSide = null;
          entry.implicitFn = implicitFn;
          entry._regionOp = gI[2][0];
          entry._fillStrict = !gI[2].includes('=');
          entry.expr = plainText; entry.rawExpr = implicitExpr;
          entry.latex = newLatex || this.exprToLatex(plainText);
          this.render();
          return;
        }
      }

      // Vertical line: x = const (no y) — must not fall through to the
      // y=f(x) compile below, which would graph the slanted y = x - c.
      const xEq = plainText.match(/^x\s*=\s*(.+)$/i);
      if (xEq && !/\by\b/i.test(xEq[1])) {
        let v = NaN;
        try { v = this.compile(xEq[1])(0); } catch (err) {}
        if (isFinite(v)) {
          entry.vlineX = v;
          entry.fn = null; entry.implicitFn = null; entry._regionOp = null;
          entry.bandX = null; entry.bandY = null;
          entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
          entry._fillSide = null; entry._fillStrict = false;
          entry.expr = plainText; entry.rawExpr = plainText;
          entry.latex = newLatex || this.exprToLatex(plainText);
          this.render();
          return;
        }
      }

      // Check for implicit equation (has both x and y with =)
      if (/=/.test(plainText) && /\bx\b/i.test(plainText) && /\by\b/i.test(plainText)) {
        const parts = plainText.split('=');
        if (parts.length === 2) {
          const implicitExpr = `(${parts[0].trim()}) - (${parts[1].trim()})`;
          const implicitFn = this.compileImplicit(implicitExpr);
          entry.fn = null;
          entry.vlineX = null;
          entry.bandX = null; entry.bandY = null;
          entry._fillSide = null; entry._fillStrict = false; entry._regionOp = null;
          entry.implicitFn = implicitFn;
          entry.expr = plainText;
          entry.rawExpr = implicitExpr;
          entry.latex = newLatex || this.exprToLatex(plainText);
          this.render();
          return;
        }
      }

      // Detect function notation: f(x) = expr
      const fnMatch = plainText.match(/^([a-zA-Z])\s*\(\s*x\s*\)\s*=\s*(.+)$/);
      const yMatch = plainText.match(/^y\s*=\s*(.+)$/i);
      const m = yMatch || fnMatch;
      const rhs = m ? (fnMatch ? fnMatch[2] : m[1]) : plainText;
      if (fnMatch) {
        this.namedFunctions[fnMatch[1].toLowerCase()] = rhs;
        entry.funcName = fnMatch[1].toLowerCase();
      }
      // Slider parameters can appear or disappear mid-edit (T4.3): editing
      // y = x² into y = a·x² grows an 'a' slider (prior slider state kept)
      // instead of erroring. Row UI catches up via the commit-path
      // updateRows(); live (silent) edits must never rebuild rows — that
      // would destroy the MathQuill field being typed in.
      const params = this.detectParams(rhs);
      if (params.length > 0) {
        const compiledExpr = this._compileExpr(rhs, params);
        const paramFn = this._buildFn(compiledExpr, params);
        entry.paramFn = paramFn;
        entry.sliders = entry.sliders || {};
        entry.sliderValues = entry.sliderValues || {};
        params.forEach(p => {
          if (!entry.sliders[p]) entry.sliders[p] = { min: -10, max: 10, value: 1, step: 0.1 };
          if (entry.sliderValues[p] === undefined) entry.sliderValues[p] = entry.sliders[p].value;
        });
        Object.keys(entry.sliders).forEach(p => {
          if (!params.includes(p)) { delete entry.sliders[p]; delete entry.sliderValues[p]; }
        });
        entry.fn = x => paramFn(x, entry.sliderValues);
      } else {
        entry.fn = this.compile(rhs);
        if (entry.sliders && Object.keys(entry.sliders).length) {
          entry.sliders = {}; entry.sliderValues = {}; entry.paramFn = null;
        }
      }
      entry.implicitFn = null;
      entry.vlineX = null;
      entry.bandX = null; entry.bandY = null;
      entry._fillSide = null; entry._fillStrict = false; entry._regionOp = null;
      entry.expr = plainText;
      entry.rawExpr = rhs;
      entry.latex = newLatex || this.exprToLatex(plainText);
      this.render();
    } catch(err) {
      if (!silent) showToast('Invalid: ' + (err.msg || err.message));
    }
  },

  closeAllPopovers() {
    if (!this.listEl) return;
    this.listEl.querySelectorAll('.ge-style-pop.visible').forEach(p => p.classList.remove('visible'));
  },

  // Clear every live slider-animation interval by id. Leaves each slider's
  // st.playing flag intact so surviving rows can resume after a rebuild.
  _killAnimTimers() {
    if (this._animTimers) {
      this._animTimers.forEach(t => { if (typeof t === 'function') t(); else clearInterval(t); });
      this._animTimers.clear();
    }
  },

  updateRows() {
    if (!this.listEl) return;
    // Stop every running slider-animation timer — the DOM rows that own them
    // are about to be wiped. Rows still flagged playing restart their timer as
    // they rebuild (see the resume call in the slider builder).
    this._killAnimTimers();
    this.listEl.innerHTML = '';
    // Curve cycle (T2.5): every color ≥3:1 contrast on BOTH themes
    // (#f8f8fa light / #0e0e14 dark); ordered so adjacent hues stay
    // distinguishable under common color-vision deficiencies.
    const allColors = ['#3b74d1','#d9542b','#1f9d61','#8b5cf6','#c2373b','#0e9bb5','#b07d10','#d33d8b','#5b8a1e','#7a6ff0','#98622e','#64748b'];

    this.expressions.forEach(entry => {
      // Ghost expressions are visible on graph but hidden from expression list
      if (entry._ghost) return;

      // ── Action entries: a Run button + ticker loop (no graph) ──
      if (entry.action) {
        const arow = document.createElement('div');
        arow.className = 'graph-expr-row';
        const lbl = document.createElement('span');
        lbl.style.cssText = 'flex:1;min-width:0;font-family:var(--mono);font-size:13px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        lbl.textContent = entry.expr;
        arow.appendChild(lbl);
        const runBtn = document.createElement('button');
        runBtn.className = 'ge-action-btn';
        runBtn.textContent = 'Run';
        runBtn.onclick = () => Graph.runAction(entry);
        arow.appendChild(runBtn);
        const st = (entry._tick = entry._tick || { playing: false, timer: null });
        Graph._animTimers = Graph._animTimers || new Set();
        const loopBtn = document.createElement('button');
        loopBtn.className = 'ge-action-btn ge-action-loop' + (st.playing ? ' playing' : '');
        loopBtn.title = 'Run repeatedly';
        const stopT = () => {
          if (st.timer) { Graph._animTimers.delete(st.timer); clearInterval(st.timer); st.timer = null; }
          st.playing = false; loopBtn.textContent = '▶'; loopBtn.classList.remove('playing');
        };
        const startT = () => {
          if (st.timer) { Graph._animTimers.delete(st.timer); clearInterval(st.timer); }
          st.playing = true; loopBtn.textContent = '❙❙'; loopBtn.classList.add('playing');
          st.timer = setInterval(() => Graph.runAction(entry), 120);
          Graph._animTimers.add(st.timer);
        };
        loopBtn.textContent = st.playing ? '❙❙' : '▶';
        loopBtn.onclick = () => { if (st.playing) stopT(); else startT(); };
        arow.appendChild(loopBtn);
        const del = document.createElement('button');
        del.className = 'ge-row-del'; del.textContent = '×'; del.style.opacity = '1'; del.style.position = 'static';
        del.title = 'Delete action';
        del.onclick = () => { stopT(); Graph.remove(entry.id); };
        arow.appendChild(del);
        if (st.playing) startT(); // resume after a rebuild (timer was killed)
        this.listEl.appendChild(arow);
        return;
      }

      const row = document.createElement('div');
      row.className = 'graph-expr-row';

      // Toggle switch (pure on/off, no long-press)
      const toggle = document.createElement('button');
      toggle.className = 'ge-toggle ' + (entry.visible ? 'on' : 'off');
      toggle.style.background = entry.visible ? entry.color : 'var(--bd)';
      toggle.title = entry.visible ? 'Hide' : 'Show';
      const knob = document.createElement('div');
      knob.className = 'ge-knob';
      toggle.appendChild(knob);
      toggle.onclick = (e) => {
        e.stopPropagation();
        entry.visible = !entry.visible;
        toggle.className = 'ge-toggle ' + (entry.visible ? 'on' : 'off');
        toggle.style.background = entry.visible ? entry.color : 'var(--bd)';
        toggle.title = entry.visible ? 'Hide' : 'Show';
        label.classList.toggle('disabled', !entry.visible);
        this.render();
      };
      // (toggle appended after styleBtn below)

      // Expression label — rendered math display, click to edit
      const labelWrap = document.createElement('span');
      labelWrap.className = 'ge-mq-static' + (entry.visible ? '' : ' disabled');
      labelWrap.style.color = entry.color;
      // Store reference for deferred rendering
      entry._labelWrap = labelWrap;

      // Click to edit — switch to MathQuill editable field
      labelWrap.onclick = (e) => {
        e.stopPropagation();
        if (entry.plainLabel) return;

        const editWrap = document.createElement('span');
        editWrap.style.cssText = 'flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:4px;padding:2px 6px;background:var(--sf);';
        const editSpan = document.createElement('span');
        editWrap.appendChild(editSpan);
        labelWrap.replaceWith(editWrap);

        let editField = null;
        const origLatex = entry.latex || this.exprToLatex(entry.expr);
        const self = this;

        // Define finish handlers BEFORE creating MathQuill field
        function finishEdit() {
          if (editField) {
            try {
              const newLatex = editField.latex();
              if (newLatex && newLatex !== origLatex) {
                self.updateExpr(entry.id, null, newLatex);
              }
            } catch(err) {}
          }
          self.updateRows();
        }

        if (typeof MathQuill !== 'undefined') {
          try {
            const MQ = MathQuill.getInterface(2);
            let liveTimer = null;
            editField = MQ.MathField(editSpan, {
              spaceBehavesLikeTab: false,
              autoCommands: 'pi theta sqrt alpha sigma mu chi nthroot',
              autoOperatorNames: 'sin cos tan asin acos atan log logbase ln exp mean median stdev normaldist tdist binomialdist chisquareddist abs cbrt floor ceil pow',
              handlers: {
                enter: () => finishEdit(),
                edit: () => {
                  clearTimeout(liveTimer);
                  liveTimer = setTimeout(() => {
                    try {
                      const latex = editField.latex();
                      if (latex) self.updateExpr(entry.id, null, latex, true);
                    } catch(e) {}
                  }, 150);
                },
              }
            });
            editField.latex(origLatex);
            editField.focus();
            editSpan.style.color = entry.color;
            editSpan.querySelectorAll('*').forEach(el => { el.style.color = entry.color; });
          } catch(e) {
            // Fallback to plain text
            editWrap.innerHTML = '';
            const input = document.createElement('input');
            input.type = 'text'; input.value = entry.expr;
            input.style.cssText = 'border:none;outline:none;font-family:var(--mono);font-size:13px;width:100%;background:transparent;color:var(--tx);';
            editWrap.appendChild(input);
            input.focus(); input.select();
            input.addEventListener('blur', () => {
              const newText = input.value.trim();
              if (newText && newText !== entry.expr) self.updateExpr(entry.id, newText);
              self.updateRows();
            });
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
              if (ev.key === 'Escape') { input.value = entry.expr; input.blur(); }
            });
            return;
          }
        }

        // Handle blur on MathQuill (click outside)
        editWrap.addEventListener('focusout', () => {
          setTimeout(() => {
            if (!editWrap.contains(document.activeElement)) finishEdit();
          }, 150);
        });

        // Handle Escape
        editSpan.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') {
            ev.preventDefault();
            self.updateRows();
          }
        });
      };
      const label = labelWrap;

      // Style button (opens popover) — gear icon
      const styleBtn = document.createElement('button');
      styleBtn.className = 'ge-style-btn';
      styleBtn.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" style="width:12px;height:12px"><path d="M8.5 1h3l.4 2.4a6.5 6.5 0 011.6.9l2.3-.8 1.5 2.6-1.9 1.5a6.5 6.5 0 010 1.8l1.9 1.5-1.5 2.6-2.3-.8a6.5 6.5 0 01-1.6.9L11.5 19h-3l-.4-2.4a6.5 6.5 0 01-1.6-.9l-2.3.8-1.5-2.6 1.9-1.5a6.5 6.5 0 010-1.8L2.7 9.1l1.5-2.6 2.3.8a6.5 6.5 0 011.6-.9L8.5 1zM10 7a3 3 0 100 6 3 3 0 000-6z"/></svg>';
      styleBtn.title = 'Line style';
      styleBtn.onclick = (e) => {
        e.stopPropagation();
        const wasOpen = pop.classList.contains('visible');
        this.closeAllPopovers();
        if (!wasOpen) pop.classList.add('visible');
      };

      // Append in order: gear → toggle → equation → delete
      row.appendChild(styleBtn);
      row.appendChild(toggle);
      row.appendChild(labelWrap);

      // Delete button (visible on hover)
      const del = document.createElement('button');
      del.className = 'ge-delete';
      del.textContent = '\u00D7';
      del.title = 'Remove';
      del.onclick = () => this.remove(entry.id);
      row.appendChild(del);

      // A row the embedding page GIVES (kovalna-add fixed: true — a question's
      // point, asymptote or reference curve): listed, drawn and traced like any
      // other, but the student cannot hide, restyle, retype or delete it.
      if (entry._fixed) {
        row.classList.add('ge-fixed');
        styleBtn.disabled = true; styleBtn.style.visibility = 'hidden';
        toggle.disabled = true; toggle.onclick = (e) => e.stopPropagation();
        toggle.title = ''; toggle.style.cursor = 'default';
        labelWrap.onclick = null; labelWrap.style.cursor = 'default';
        del.remove();
      }

      // Style popover
      const pop = document.createElement('div');
      pop.className = 'ge-style-pop';
      pop.onclick = (e) => e.stopPropagation();

      // Color picker
      const colorLabel = document.createElement('label');
      colorLabel.textContent = 'Color';
      pop.appendChild(colorLabel);
      const colorGrid = document.createElement('div');
      colorGrid.className = 'ge-color-grid';
      allColors.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'ge-color-swatch' + (c === entry.color ? ' active' : '');
        sw.style.background = c;
        sw.onclick = () => {
          entry.color = c;
          toggle.style.background = entry.visible ? c : 'var(--bd)';
          colorGrid.querySelectorAll('.active').forEach(a => a.classList.remove('active'));
          sw.classList.add('active');
          // Update equation label color to match
          if (entry._labelWrap) {
            entry._labelWrap.style.color = c;
            entry._labelWrap.querySelectorAll('*').forEach(el => { el.style.color = c; });
          }
          this.render();
        };
        colorGrid.appendChild(sw);
      });
      pop.appendChild(colorGrid);

      // Line style — visual SVG previews
      const styleLabel = document.createElement('label');
      styleLabel.textContent = 'Style';
      pop.appendChild(styleLabel);
      const styleRow = document.createElement('div');
      styleRow.className = 'ge-style-options';
      const styles = [
        { dash: [], svg: '<line x1="0" y1="2" x2="48" y2="2" stroke="currentColor" stroke-width="2.5"/>' },
        { dash: [12, 6], svg: '<line x1="0" y1="2" x2="48" y2="2" stroke="currentColor" stroke-width="2.5" stroke-dasharray="12 6"/>' },
        { dash: [2, 5], svg: '<line x1="0" y1="2" x2="48" y2="2" stroke="currentColor" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>' },
        { dash: [12, 5, 2, 5], svg: '<line x1="0" y1="2" x2="48" y2="2" stroke="currentColor" stroke-width="2.5" stroke-dasharray="12 5 2 5"/>' },
      ];
      styles.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'ge-style-opt' + (JSON.stringify(entry.dash) === JSON.stringify(s.dash) ? ' active' : '');
        btn.innerHTML = '<svg viewBox="0 0 48 4" xmlns="http://www.w3.org/2000/svg">' + s.svg + '</svg>';
        btn.onclick = () => {
          entry.dash = s.dash;
          styleRow.querySelectorAll('.active').forEach(a => a.classList.remove('active'));
          btn.classList.add('active');
          this.render();
        };
        styleRow.appendChild(btn);
      });
      pop.appendChild(styleRow);

      // Thickness — 4 discrete options with visual preview
      const widthLabel = document.createElement('label');
      widthLabel.textContent = 'Thickness';
      pop.appendChild(widthLabel);
      const widthRow = document.createElement('div');
      widthRow.className = 'ge-width-options';
      const widths = [1, 2, 3.5, 5];
      widths.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'ge-width-opt' + (entry.lineWidth === w ? ' active' : '');
        const line = document.createElement('div');
        line.className = 'ge-width-line';
        line.style.width = '24px';
        line.style.height = Math.max(w, 1) + 'px';
        btn.appendChild(line);
        btn.onclick = () => {
          entry.lineWidth = w;
          widthRow.querySelectorAll('.active').forEach(a => a.classList.remove('active'));
          btn.classList.add('active');
          this.render();
        };
        widthRow.appendChild(btn);
      });
      pop.appendChild(widthRow);

      row.appendChild(pop);
      this.listEl.appendChild(row);

      // ─── Slider UI for parametric expressions ───
      if (entry.sliders && Object.keys(entry.sliders).length) {
        const sliderWrap = document.createElement('div');
        sliderWrap.className = 'ge-sliders';
        Object.keys(entry.sliders).forEach(param => {
          const s = entry.sliders[param];
          const sRow = document.createElement('div');
          sRow.className = 'ge-slider-row';

          const label = document.createElement('span');
          label.className = 'ge-slider-label';
          label.textContent = param;
          label.style.color = entry.color;
          sRow.appendChild(label);

          const minInput = document.createElement('input');
          minInput.className = 'ge-slider-bound';
          minInput.type = 'number';
          minInput.value = s.min;
          minInput.title = 'Min';
          sRow.appendChild(minInput);

          const slider = document.createElement('input');
          slider.className = 'ge-slider-input';
          slider.type = 'range';
          slider.min = s.min;
          slider.max = s.max;
          slider.step = s.step;
          slider.value = entry.sliderValues[param];
          slider.style.accentColor = entry.color;
          sRow.appendChild(slider);

          const maxInput = document.createElement('input');
          maxInput.className = 'ge-slider-bound';
          maxInput.type = 'number';
          maxInput.value = s.max;
          maxInput.title = 'Max';
          sRow.appendChild(maxInput);

          const valDisplay = document.createElement('span');
          valDisplay.className = 'ge-slider-val';
          valDisplay.textContent = Number(entry.sliderValues[param]).toFixed(1);
          sRow.appendChild(valDisplay);

          // ── Animation play/pause — sweeps the value min↔max and bounces ──
          // State lives on the entry so it survives updateRows() rebuilds.
          const animState = (entry._anim = entry._anim || {});
          const st = (animState[param] = animState[param] || { playing: false, dir: 1, timer: null });
          const playBtn = document.createElement('button');
          playBtn.className = 'ge-slider-play';
          playBtn.title = 'Animate parameter';
          sRow.appendChild(playBtn);

          // Speed (0.5×/1×/2×/4×) and sweep mode (bounce ⇄ / loop ↻) — T4.4.
          // State lives on st so it survives updateRows() rebuilds.
          st.speed = st.speed || 1;
          st.mode = st.mode || 'bounce';
          const speedBtn = document.createElement('button');
          speedBtn.className = 'ge-slider-opt';
          const renderSpeed = () => { speedBtn.textContent = (st.speed === 0.5 ? '½' : st.speed) + '×'; };
          speedBtn.title = 'Animation speed';
          speedBtn.onclick = () => {
            const steps = [0.5, 1, 2, 4];
            st.speed = steps[(steps.indexOf(st.speed) + 1) % steps.length];
            renderSpeed();
          };
          renderSpeed();
          sRow.appendChild(speedBtn);
          const modeBtn = document.createElement('button');
          modeBtn.className = 'ge-slider-opt';
          const renderMode = () => {
            modeBtn.textContent = st.mode === 'loop' ? '↻' : '⇄';
            modeBtn.title = st.mode === 'loop' ? 'Loop (min → max, repeat)' : 'Bounce (min ⇄ max)';
          };
          modeBtn.onclick = () => { st.mode = st.mode === 'loop' ? 'bounce' : 'loop'; renderMode(); };
          renderMode();
          sRow.appendChild(modeBtn);
          const PLAY = '▶', PAUSE = '❙❙';
          const renderBtn = () => {
            playBtn.textContent = st.playing ? PAUSE : PLAY;
            playBtn.classList.toggle('playing', st.playing);
          };
          Graph._animTimers = Graph._animTimers || new Set();
          const stopAnim = () => {
            if (st.timer) {
              Graph._animTimers.delete(st.timer);
              if (typeof st.timer === 'function') st.timer(); else clearInterval(st.timer);
              st.timer = null;
            }
            st.playing = false; renderBtn();
          };
          const startAnim = () => {
            if (st.timer) stopAnim();
            st.playing = true; renderBtn();
            // rAF + dt stepping: sweep ≈ 4s regardless of display Hz (T1.6)
            const h = { id: 0, last: performance.now() };
            const stepFrame = (now) => {
              const lo = parseFloat(slider.min), hi = parseFloat(slider.max);
              if (!isFinite(lo) || !isFinite(hi) || hi <= lo) { stopAnim(); return; }
              const dt = Math.min(100, now - h.last); h.last = now;
              const delta = (hi - lo) * dt * (st.speed || 1) / 4000;
              let v = (entry.sliderValues[param] || 0) + delta * st.dir;
              if (st.mode === 'loop') {
                st.dir = 1;
                if (v >= hi) v = lo;
              } else if (v >= hi) { v = hi; st.dir = -1; }
              else if (v <= lo) { v = lo; st.dir = 1; }
              entry.sliderValues[param] = v;
              slider.value = v;
              valDisplay.textContent = v.toFixed(1);
              Graph.scheduleRender();
              h.id = requestAnimationFrame(stepFrame);
            };
            h.id = requestAnimationFrame(stepFrame);
            st.timer = () => cancelAnimationFrame(h.id);
            Graph._animTimers.add(st.timer);
          };
          playBtn.onclick = () => { if (st.playing) stopAnim(); else startAnim(); };

          slider.oninput = () => {
            if (st.playing) stopAnim(); // manual drag takes over from animation
            const v = parseFloat(slider.value);
            entry.sliderValues[param] = v;
            valDisplay.textContent = v.toFixed(1);
            this.scheduleRender();
          };
          minInput.onchange = () => {
            const v = parseFloat(minInput.value);
            if (!isNaN(v)) { s.min = v; slider.min = v; }
          };
          maxInput.onchange = () => {
            const v = parseFloat(maxInput.value);
            if (!isNaN(v)) { s.max = v; slider.max = v; }
          };

          // Resume animation if this slider was playing before the rebuild.
          if (st.playing) startAnim(); else renderBtn();

          sliderWrap.appendChild(sRow);
        });
        this.listEl.appendChild(sliderWrap);
        if (entry._fixed) sliderWrap.querySelectorAll('input, button').forEach((n) => { n.disabled = true; });
      }

      // ─── Riemann rectangle-count slider ───
      if (entry.riemannData) {
        const rd = entry.riemannData;
        const sumOf = () => {
          const dx = (rd.b - rd.a) / rd.n;
          let s = 0;
          for (let i = 0; i < rd.n; i++) {
            const xl = rd.a + i * dx;
            const xs = rd.type === 'right' ? xl + dx : (rd.type === 'mid' ? xl + dx / 2 : xl);
            const v = rd.fn(xs);
            if (isFinite(v)) s += v * dx;
          }
          return s;
        };
        const wrap = document.createElement('div');
        wrap.className = 'ge-sliders';
        const sRow = document.createElement('div');
        sRow.className = 'ge-slider-row';
        const label = document.createElement('span');
        label.className = 'ge-slider-label'; label.textContent = 'n'; label.style.color = entry.color;
        sRow.appendChild(label);
        const slider = document.createElement('input');
        slider.className = 'ge-slider-input'; slider.type = 'range';
        slider.min = 1; slider.max = 100; slider.step = 1; slider.value = rd.n;
        slider.style.accentColor = entry.color;
        sRow.appendChild(slider);
        const valDisplay = document.createElement('span');
        valDisplay.className = 'ge-slider-val'; valDisplay.style.minWidth = '78px';
        valDisplay.textContent = `${rd.n} · ≈${M.fmt(sumOf(), 4)}`;
        sRow.appendChild(valDisplay);
        slider.oninput = () => {
          rd.n = parseInt(slider.value);
          valDisplay.textContent = `${rd.n} · ≈${M.fmt(sumOf(), 4)}`;
          this.render();
        };
        wrap.appendChild(sRow);
        this.listEl.appendChild(wrap);
      }
    });

    // Deferred MathQuill rendering — use requestAnimationFrame to ensure DOM is ready
    requestAnimationFrame(() => {
      if (typeof MathQuill === 'undefined') return;
      try {
        const MQ = MathQuill.getInterface(2);
        this.expressions.forEach(entry => {
          if (!entry._labelWrap) return;
          // Plain labels (scatter data, residuals) — skip MathQuill
          if (entry.plainLabel) {
            entry._labelWrap.innerHTML = '';
            const span = document.createElement('span');
            span.textContent = entry.expr;
            span.style.color = entry.color;
            span.style.fontFamily = 'var(--font)';
            span.style.fontSize = '14px';
            span.style.fontWeight = '500';
            span.style.fontStyle = 'italic';
            entry._labelWrap.appendChild(span);
            return;
          }
          try {
            const latex = entry.latex || this.exprToLatex(entry.expr);
            entry._labelWrap.innerHTML = '';
            const mqSpan = document.createElement('span');
            entry._labelWrap.appendChild(mqSpan);
            const staticField = MQ.StaticMath(mqSpan);
            staticField.latex(latex);
            entry._labelWrap.style.color = entry.color;
            entry._labelWrap.querySelectorAll('*').forEach(el => { el.style.color = entry.color; });
          } catch(e) {
            console.log('MQ render fail for:', entry.expr, e.message || e);
            entry._labelWrap.textContent = entry.expr;
            entry._labelWrap.style.color = entry.color;
          }
        });
      } catch(e) {
        console.log('MQ init error:', e);
      }
    });
  },

  // Split `s` on a top-level separator (ignoring nested (), [], {}).
  _splitTop(s, sep) {
    const out = []; let cur = '', d = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '(' || c === '[' || c === '{') d++;
      else if (c === ')' || c === ']' || c === '}') d--;
      if (c === sep && d === 0) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    if (cur.trim()) out.push(cur);
    return out;
  },

  // A piecewise/restricted condition → readable LaTeX. Handles inequalities
  // (x >= 0 → x \ge 0) and interval notation ([0,5] → 0 \le x \le 5).
  _condToLatex(cond) {
    const c = cond.trim();
    const iv = c.match(/^([\[(])\s*([^,]+?)\s*,\s*([^,\])]+?)\s*([\])])$/);
    if (iv) {
      const isInf = (v) => /^[-+]?(oo|inf|infinity|\\infty)$/i.test(String(v).trim());
      const lo = iv[2].trim(), hi = iv[3].trim();
      const parts = [];
      if (!isInf(lo)) parts.push(this.exprToLatex(lo) + (iv[1] === '[' ? ' \\le ' : ' < ') + 'x');
      if (!isInf(hi)) parts.push('x' + (iv[4] === ']' ? ' \\le ' : ' < ') + this.exprToLatex(hi));
      return parts.join(',\\ ') || 'x';
    }
    // theta / pi as symbols: a polar or parametric restriction is written in
    // them ("0 <= theta <= pi/4"), and the row otherwise spelled them out.
    return c.replace(/>=/g, ' \\ge ').replace(/<=/g, ' \\le ').replace(/!=/g, ' \\ne ')
      .replace(/(?<![a-zA-Z\\])theta(?![a-zA-Z])/g, '\\theta ').replace(/\u03B8/g, '\\theta ')
      .replace(/(?<![a-zA-Z\\])pi(?![a-zA-Z])/g, '\\pi ')
      .replace(/\s+/g, ' ').trim();
  },

  // ─── Polar / parametric parameter range ───
  // The interval a curve's own parameter runs over: its {restriction}, with
  // any open side falling back to ±4π (the range these curves were always
  // drawn over, and the one @kovalna/kalcgraph-core uses, so a stem draws the
  // same stretch in both engines).
  curveRange(expr) {
    const d = expr && expr.tDomain;
    const lo = d && isFinite(d[0]) ? d[0] : -4 * Math.PI;
    const hi = d && isFinite(d[1]) ? d[1] : 4 * Math.PI;
    return hi > lo ? [lo, hi] : [-4 * Math.PI, 4 * Math.PI];
  },
  // Sample count for that range: the old fixed counts were tuned for 8π, so
  // keep that density per radian (a long restriction gets more, a single
  // petal still gets enough to be round).
  curveSteps(expr, perPi) {
    const [lo, hi] = this.curveRange(expr);
    return Math.min(8000, Math.max(240, Math.ceil((hi - lo) / Math.PI * perPi)));
  },

  // ─── Slope field geometry ───
  // dy/dx = f(x, y) as a lattice of short segments. This is the same
  // arithmetic as packages/kalcgraph-core/src/engine/slopeField.js (this build
  // is a concatenation and cannot import it) — change both together; the
  // reasoning lives there. In short: the lattice step is a 1-2-5 number chosen
  // for ~44px between segments, so they sit on round coordinates at any zoom;
  // and every segment is the same length ON SCREEN, its direction worked out
  // in pixels, so the length never depends on the window's aspect ratio.
  slopeFieldStep(pxPerUnit) {
    if (!(pxPerUnit > 0) || !isFinite(pxPerUnit)) return NaN;
    const ideal = 44 / pxPerUnit;
    const pow = Math.pow(10, Math.floor(Math.log10(ideal)));
    let best = pow, bestErr = Infinity;
    [pow, 2 * pow, 5 * pow, 10 * pow].forEach(c => {
      const err = Math.abs(Math.log(c / ideal));
      if (err < bestErr) { bestErr = err; best = c; }
    });
    return best;
  },
  // `step` is the field's own {step = …} as [stepX, stepY]: the lattice is
  // then the same points at every slot size (the automatic one is chosen from
  // the scale, so a ±5 window loses every other integer point on a phone).
  // It is kept up to 200 segments across the window, then doubles.
  slopeFieldSegments(f, view, pxPerUnitX, pxPerUnitY, step) {
    const none = { stepX: NaN, stepY: NaN, lengthPx: 0, segments: [] };
    const { xMin, xMax, yMin, yMax } = view;
    if (![xMin, xMax, yMin, yMax].every(Number.isFinite) || !(xMax > xMin) || !(yMax > yMin)) return none;
    if (!(pxPerUnitX > 0) || !(pxPerUnitY > 0) || !isFinite(pxPerUnitX) || !isFinite(pxPerUnitY)) return none;
    const fixed = Array.isArray(step) && step[0] > 0 && step[1] > 0 && isFinite(step[0]) && isFinite(step[1]);
    let stepX = fixed ? step[0] : this.slopeFieldStep(pxPerUnitX);
    let stepY = fixed ? step[1] : this.slopeFieldStep(pxPerUnitY);
    if (!(stepX > 0) || !(stepY > 0)) return none;
    const cap = fixed ? 200 : 80;
    while ((xMax - xMin) / stepX > cap) stepX *= 2;
    while ((yMax - yMin) / stepY > cap) stepY *= 2;
    const lengthPx = 0.62 * Math.min(stepX * pxPerUnitX, stepY * pxPerUnitY);
    const half = lengthPx / 2;
    const segments = [];
    const i0 = Math.ceil(xMin / stepX - 1e-9), i1 = Math.floor(xMax / stepX + 1e-9);
    const j0 = Math.ceil(yMin / stepY - 1e-9), j1 = Math.floor(yMax / stepY + 1e-9);
    for (let i = i0; i <= i1; i++) {
      const x = i * stepX;
      for (let j = j0; j <= j1; j++) {
        const y = j * stepY;
        let m;
        try { m = f(x, y); } catch (e) { continue; }
        if (typeof m !== 'number' || isNaN(m)) continue;
        let ux, uy; // unit direction on screen (y up)
        if (!isFinite(m)) { ux = 0; uy = 1; }
        else {
          const sx = pxPerUnitX, sy = m * pxPerUnitY;
          const n = Math.hypot(sx, sy);
          ux = sx / n; uy = sy / n;
        }
        const dx = (ux * half) / pxPerUnitX, dy = (uy * half) / pxPerUnitY;
        segments.push([x - dx, y - dy, x + dx, y + dy]);
      }
    }
    return { stepX, stepY, lengthPx, segments };
  },

  // ─── Convert expression text to LaTeX for display ───
  exprToLatex(expr) {
    let s = String(expr);

    // Piecewise / restricted-domain: render readably instead of letting the
    // grouping braces vanish (which mushes "x^2 {x>0}" into "x^2x>0"). The
    // equation panel is single-line MathQuill, so this is a spaced one-liner;
    // for true multi-line cases, author the equation in the prompt with KaTeX
    // (\begin{cases}) and hide the slot's list via equation="false".
    const pw = s.match(/^\s*(y\s*=\s*)?\{\s*([\s\S]+)\}\s*$/);
    if (pw && /:/.test(pw[2])) {
      const rows = this._splitTop(pw[2], ',').map(p => {
        const ci = p.indexOf(':');
        if (ci < 0) return this.exprToLatex(p.trim());
        return this.exprToLatex(p.slice(ci + 1).trim()) + ',\\ ' + this._condToLatex(p.slice(0, ci).trim());
      });
      if (rows.length) return (pw[1] ? 'y=' : '') + rows.join(';\\ \\ ');
    }
    const rd = s.match(/^\s*(y\s*=\s*)?([\s\S]+?)\s*\{\s*([^:{}]+?)\s*\}\s*$/);
    if (rd && !/:/.test(rd[3]) && (/[<>]/.test(rd[3]) || /^[\[(].*,.*[\])]$/.test(rd[3].trim()))) {
      return (rd[1] ? 'y=' : '') + this.exprToLatex(rd[2].trim()) + ',\\ ' + this._condToLatex(rd[3].trim());
    }

    // Normalize ** to ^
    s = s.replace(/\*\*/g, '^');

    // Inequality operators (x <= 3, y >= x^2) → proper relation symbols
    s = s.replace(/>=/g, '\\ge ').replace(/<=/g, '\\le ');

    // Convert (a)/(b) and a/b patterns to \frac{a}{b}
    // Handle (expr)/(expr)
    s = s.replace(/\(([^()]+)\)\/\(([^()]+)\)/g, '\\frac{$1}{$2}');
    // Handle number/number like 1/2
    s = s.replace(/(\d+)\/(\d+)/g, '\\frac{$1}{$2}');

    // Convert decimal coefficients to fractions where clean: 0.5 → \frac{1}{2}, etc.
    const decFracs = [[0.5,'1','2'],[0.25,'1','4'],[0.75,'3','4'],[0.2,'1','5'],[0.4,'2','5'],[0.6,'3','5'],[0.8,'4','5'],
                       [0.125,'1','8'],[0.375,'3','8'],[0.625,'5','8'],[0.875,'7','8'],[0.1,'1','10'],[0.3,'3','10'],[0.7,'7','10'],[0.9,'9','10']];
    decFracs.forEach(([dec, num, den]) => {
      const re = new RegExp('(?<![\\d.])' + String(dec).replace('.', '\\.') + '(?![\\d])');
      s = s.replace(re, '\\frac{' + num + '}{' + den + '}');
      // Also negative
      const reNeg = new RegExp('(?<![\\d.])-' + String(dec).replace('.', '\\.') + '(?![\\d])');
      s = s.replace(reNeg, '-\\frac{' + num + '}{' + den + '}');
    });

    // Functions → LaTeX commands
    s = s.replace(/\bsqrt\(([^)]*)\)/g, '\\sqrt{$1}');
    s = s.replace(/\bcbrt\(([^)]*)\)/g, '\\sqrt[3]{$1}');
    s = s.replace(/\bsin\b/g, '\\sin'); s = s.replace(/\bcos\b/g, '\\cos'); s = s.replace(/\btan\b/g, '\\tan');
    s = s.replace(/\basin\b/g, '\\arcsin'); s = s.replace(/\bacos\b/g, '\\arccos'); s = s.replace(/\batan\b/g, '\\arctan');
    s = s.replace(/\blogbase\(\s*([^,]+?)\s*,\s*([^)]+)\)/g, '\\log_{$1}($2)');
    s = s.replace(/\bln\b/g, '\\ln'); s = s.replace(/\blog\b/g, '\\log');
    s = s.replace(/\bexp\(([^)]*)\)/g, 'e^{$1}');
    s = s.replace(/\babs\(([^)]*)\)/g, '\\left|$1\\right|');
    s = s.replace(/\bpi\b/gi, '\\pi');
    s = s.replace(/\btheta\b/gi, '\\theta');

    // Superscripts: x^2 → x^{2}, x^(expr) → x^{expr}
    s = s.replace(/\^(\d+)/g, '^{$1}');
    s = s.replace(/\^\(([^)]+)\)/g, '^{$1}');

    // Drop * between coefficient and variable/function: 2*x → 2x, 3*\sin → 3\sin
    s = s.replace(/(\d)\s*\*\s*([a-zA-Z\\])/g, '$1$2');
    s = s.replace(/(\})\s*\*\s*([a-zA-Z\\])/g, '$1$2');
    // Drop remaining * (rare cases)
    s = s.replace(/\*/g, '\\cdot ');

    // Clean up extra spaces
    s = s.replace(/\s+/g, ' ').trim();

    return s;
  },

  // ─── Bisection root finder: find x where f(x) ≈ 0 ───
  findRoots(fn, xMin, xMax, steps) {
    steps = steps || 500;
    const roots = [];
    const dx = (xMax - xMin) / steps;
    let prevY;
    try { prevY = fn(xMin); } catch(e) { prevY = NaN; }
    for (let i = 1; i <= steps; i++) {
      const x = xMin + i * dx;
      let y;
      try { y = fn(x); } catch(e) { y = NaN; prevY = NaN; continue; }
      if (isFinite(prevY) && isFinite(y) && prevY * y < 0) {
        let lo = x - dx, hi = x;
        for (let j = 0; j < 50; j++) {
          const mid = (lo + hi) / 2;
          let midY;
          try { midY = fn(mid); } catch(e) { break; }
          if (!isFinite(midY)) break;
          if (Math.abs(midY) < 1e-12) { lo = hi = mid; break; }
          if (midY * fn(lo) < 0) hi = mid; else lo = mid;
        }
        const root = (lo + hi) / 2;
        if (!roots.some(r => Math.abs(r - root) < dx * 2)) roots.push(root);
      }
      if (isFinite(y) && Math.abs(y) < 1e-12 && !roots.some(r => Math.abs(r - x) < dx * 2)) roots.push(x);
      prevY = y;
    }
    return roots;
  },

  // ─── Find local extrema via numerical derivative sign changes ───
  findExtrema(fn, xMin, xMax, steps) {
    steps = steps || 500;
    const extrema = [];
    const dx = (xMax - xMin) / steps;
    const h = dx * 0.001; // small h for numerical derivative
    const deriv = x => { try { return (fn(x + h) - fn(x - h)) / (2 * h); } catch(e) { return NaN; } };
    let prevD;
    try { prevD = deriv(xMin); } catch(e) { prevD = NaN; }
    for (let i = 1; i <= steps; i++) {
      const x = xMin + i * dx;
      let d;
      try { d = deriv(x); } catch(e) { d = NaN; prevD = NaN; continue; }
      if (isFinite(prevD) && isFinite(d) && prevD * d < 0) {
        // Derivative sign change — bisect for exact location
        let lo = x - dx, hi = x;
        for (let j = 0; j < 50; j++) {
          const mid = (lo + hi) / 2;
          const midD = deriv(mid);
          if (!isFinite(midD)) break;
          if (Math.abs(midD) < 1e-10) { lo = hi = mid; break; }
          if (midD * deriv(lo) < 0) hi = mid; else lo = mid;
        }
        const ex = (lo + hi) / 2;
        let ey; try { ey = fn(ex); } catch(e) { prevD = d; continue; }
        if (isFinite(ey) && !extrema.some(e => Math.abs(e.x - ex) < dx * 2)) {
          const type = prevD > 0 ? 'max' : 'min';
          extrema.push({ x: ex, y: ey, type });
        }
      }
      prevD = d;
    }
    return extrema;
  },

  // ─── Find intersections between two functions ───
  findIntersections(fn1, fn2, xMin, xMax) {
    // Coincident curves (identical, or overlapping across most of the
    // window) have no discrete intersection points. Without this guard the
    // zero difference function trips findRoots' |y| < 1e-12 test at every
    // sample, blanketing the overlap in intersection dots.
    let same = 0, total = 0;
    for (let i = 0; i <= 24; i++) {
      const x = xMin + (xMax - xMin) * i / 24;
      let a, b;
      try { a = fn1(x); b = fn2(x); } catch (e) { continue; }
      if (!isFinite(a) || !isFinite(b)) continue;
      total++;
      if (Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b))) same++;
    }
    if (total >= 5 && same / total > 0.6) return [];
    return this.findRoots(x => fn1(x) - fn2(x), xMin, xMax, 500);
  },

  // ─── Compute all key points (but don't render until clicked) ───
  computeKeyPoints() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const xRange = this.xMax - this.xMin, yRange = this.yMax - this.yMin;
    const toSX = x => (x - this.xMin) / xRange * w;
    const toSY = y => h - (y - this.yMin) / yRange * h;
    const fp = v => this.fmtPi(v, 4);

    const visExprs = this.expressions.filter(e => e.visible && e.fn && !e.scatterData);
    this._keyPoints = [];

    visExprs.forEach(expr => {
      // Piecewise discontinuities already get a filled endpoint dot on the
      // canvas. A key-point hollow overlay dot at the same spot would mask that
      // filled dot (it reads as an open circle), so suppress key points that
      // land on a genuine jump boundary. Continuous corners (e.g. a V vertex)
      // have no endpoint dot, so their key point is kept.
      let onFilledEndpoint = () => false;
      if (expr.fn && expr.fn._piecewise) {
        const bounds = new Set();
        expr.fn._piecewise.forEach(piece => {
          if (!piece.cond) return;
          (piece.cond.match(/(-?[\d.]+)\s*[<>]=?\s*x|x\s*[<>]=?\s*(-?[\d.]+)/g) || []).forEach(b => {
            const mm = b.match(/x\s*[<>]=?\s*(-?[\d.]+)/) || b.match(/(-?[\d.]+)\s*[<>]=?\s*x/);
            if (mm && isFinite(parseFloat(mm[1]))) bounds.add(parseFloat(mm[1]));
          });
        });
        const eps = Math.max(xRange * 1e-3, 1e-6);
        const ytol = Math.max(Math.abs(yRange) * 2e-3, 1e-6);
        const safe = (xv) => { try { const y = expr.fn(xv); return isFinite(y) ? y : NaN; } catch(e) { return NaN; } };
        onFilledEndpoint = (xv) => [...bounds].some(b => {
          if (Math.abs(xv - b) >= eps) return false;
          const at = safe(b), l = safe(b - eps), r = safe(b + eps);
          if (!isFinite(at)) return false;                 // no filled dot drawn
          const cont = isFinite(l) && isFinite(r) && Math.abs(l - at) < ytol && Math.abs(r - at) < ytol;
          return !cont;                                    // discontinuity → filled dot exists here
        });
      }
      // Y-intercept
      if (this.xMin <= 0 && this.xMax >= 0 && !onFilledEndpoint(0)) {
        try {
          const y0 = expr.fn(0);
          if (isFinite(y0) && y0 >= this.yMin && y0 <= this.yMax) {
            this._keyPoints.push({ x: 0, y: y0, sx: toSX(0), sy: toSY(y0), label: `(0, ${fp(y0)})`, color: expr.color, type: 'y-int', exprId: expr.id });
          }
        } catch(e) {}
      }
      // X-intercepts
      const roots = this.findRoots(expr.fn, this.xMin, this.xMax);
      roots.forEach(r => {
        if (onFilledEndpoint(r)) return;
        const sy = toSY(0);
        if (sy >= 0 && sy <= h) {
          this._keyPoints.push({ x: r, y: 0, sx: toSX(r), sy, label: `(${fp(r)}, 0)`, color: expr.color, type: 'x-int', exprId: expr.id });
        }
      });
      // Local extrema
      const extrema = this.findExtrema(expr.fn, this.xMin, this.xMax);
      extrema.forEach(pt => {
        if (onFilledEndpoint(pt.x)) return;
        const sx = toSX(pt.x), sy = toSY(pt.y);
        if (sx >= -10 && sx <= w + 10 && sy >= -10 && sy <= h + 10) {
          const typeLabel = pt.type === 'max' ? 'max' : 'min';
          this._keyPoints.push({ x: pt.x, y: pt.y, sx, sy, label: `${typeLabel} (${fp(pt.x)}, ${fp(pt.y)})`, color: expr.color, type: pt.type, exprId: expr.id });
        }
      });
    });

    // Intersections between pairs
    for (let i = 0; i < visExprs.length; i++) {
      for (let j = i + 1; j < visExprs.length; j++) {
        const ixs = this.findIntersections(visExprs[i].fn, visExprs[j].fn, this.xMin, this.xMax);
        ixs.forEach(x => {
          let y; try { y = visExprs[i].fn(x); } catch(e) { return; }
          if (!isFinite(y)) return;
          const sx = toSX(x), sy = toSY(y);
          if (sx >= -10 && sx <= w + 10 && sy >= -10 && sy <= h + 10) {
            this._keyPoints.push({ x, y, sx, sy, label: `intersect (${fp(x)}, ${fp(y)})`, color: '#888', type: 'intersect', dual: [visExprs[i].color, visExprs[j].color], exprId: [visExprs[i].id, visExprs[j].id] });
          }
        });
      }
    }
  },

  // ─── Render key points: all as dots, pinned ones with labels ───
  renderPinnedPoints() {
    if (!this.kpOverlay) return;
    this.kpOverlay.innerHTML = '';
    // Key-point inspection disabled (qcode keyPoints="false"): draw no dots or
    // labels so students must locate intercepts/extrema unaided.
    if (window._kalcFrozen && window._kalcFrozen.keyPoints) return;
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const xRange = this.xMax - this.xMin, yRange = this.yMax - this.yMin;
    const toSX = x => (x - this.xMin) / xRange * w;
    const toSY = y => h - (y - this.yMin) / yRange * h;
    if (!this._pinnedPoints) this._pinnedPoints = [];

    const isPinned = (pt) => this._pinnedPoints.some(p => Math.abs(p.x - pt.x) < 1e-6 && Math.abs(p.y - pt.y) < 1e-6);

    // Draw ALL key points as small hollow dots
    (this._keyPoints || []).forEach(pt => {
      const sx = toSX(pt.x), sy = toSY(pt.y);
      if (sx < -10 || sx > w + 10 || sy < -10 || sy > h + 10) return;
      const pinned = isPinned(pt);
      const dot = document.createElement('div');
      dot.className = 'kp-dot';
      dot.style.left = sx + 'px';
      dot.style.top = sy + 'px';
      if (pinned) {
        dot.style.background = pt.dual ? `linear-gradient(135deg, ${pt.dual[0]} 50%, ${pt.dual[1]} 50%)` : pt.color;
        dot.style.borderColor = pt.dual ? '#fff' : pt.color;
        dot.style.width = '12px'; dot.style.height = '12px';
      } else {
        dot.style.background = 'var(--sf, #fff)';
        dot.style.borderColor = pt.color;
        dot.style.width = '8px'; dot.style.height = '8px';
        dot.style.opacity = '0.8';
      }
      this.kpOverlay.appendChild(dot);

      if (pinned) {
        const lbl = document.createElement('div');
        lbl.className = 'kp-label';
        lbl.textContent = pt.label;
        lbl.style.display = 'block';

        const margin = 10;
        const labelAbove = () => { lbl.style.left = sx + 'px'; lbl.style.top = (sy - margin) + 'px'; lbl.style.transform = 'translate(-50%, -100%)'; };
        const labelBelow = () => { lbl.style.left = sx + 'px'; lbl.style.top = (sy + margin) + 'px'; lbl.style.transform = 'translate(-50%, 0)'; };
        const labelRight = () => { lbl.style.left = (sx + margin) + 'px'; lbl.style.top = sy + 'px'; lbl.style.transform = 'translate(0, -50%)'; };
        const labelLeft = () => { lbl.style.left = (sx - margin) + 'px'; lbl.style.top = sy + 'px'; lbl.style.transform = 'translate(-100%, -50%)'; };

        if (pt.type === 'min') { if (sy + 40 > h) labelAbove(); else labelBelow(); }
        else if (pt.type === 'max') { if (sy < 40) labelBelow(); else labelAbove(); }
        else if (pt.type === 'y-int') { if (sx + 80 > w) labelLeft(); else labelRight(); }
        else if (pt.type === 'x-int') { if (sy < 40) labelBelow(); else labelAbove(); }
        else { if (sy < 40) labelBelow(); else labelAbove(); }

        requestAnimationFrame(() => {
          const lblRect = lbl.getBoundingClientRect();
          const overlayRect = this.kpOverlay.getBoundingClientRect();
          if (lblRect && overlayRect) {
            if (lblRect.right > overlayRect.right - 4) {
              lbl.style.left = (w - 4) + 'px';
              lbl.style.transform = lbl.style.transform.replace(/translate\([^)]*\)/, 'translate(-100%, ' + (lbl.style.transform.includes('-100%') ? '-100%' : '-50%') + ')');
            }
            if (lblRect.left < overlayRect.left + 4) {
              lbl.style.left = '4px';
              lbl.style.transform = lbl.style.transform.replace(/translate\([^)]*\)/, 'translate(0, ' + (lbl.style.transform.includes('-100%') ? '-100%' : '-50%') + ')');
            }
          }
        });
        this.kpOverlay.appendChild(lbl);
      }
    });
  },

  // ─── Handle click on canvas — pin nearest key point ───
  onCanvasClick(e) {
    if (this.isDragging) return;
    // A click that selected/moved an image shouldn't also pin a key point.
    if (this._imageJustInteracted) { this._imageJustInteracted = false; return; }
    // Skip if click was on a UI overlay (gear menu, buttons, etc.)
    if (e.target.closest('button, .sketch-gear-wrap, .sketch-gear-menu, .kalc-sketch-ui, select, input')) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    // ─── Sketch mode: intercept clicks for point placement ───
    if (window._kalcSketch && window._kalcSketch.active) {
      window._kalcSketch.handleClick(mx, my, rect.width, rect.height);
      return;
    }

    // Key-point inspection disabled (qcode keyPoints="false") — ignore clicks.
    if (window._kalcFrozen && window._kalcFrozen.keyPoints) return;

    // Key points skipped during motion? A click needs fresh ones now.
    if (this._keyPointsStale) { this.computeKeyPoints(); this._keyPointsStale = false; }

    // Find nearest key point within snap distance
    if (!this._keyPoints || !this._keyPoints.length) return;
    let bestDist = 20; // pixel snap radius
    let bestPt = null;
    this._keyPoints.forEach(pt => {
      const dist = Math.sqrt((pt.sx - mx) ** 2 + (pt.sy - my) ** 2);
      if (dist < bestDist) { bestDist = dist; bestPt = pt; }
    });

    if (bestPt) {
      if (!this._pinnedPoints) this._pinnedPoints = [];
      // Toggle: if already pinned at this location, unpin it
      const existing = this._pinnedPoints.findIndex(p => Math.abs(p.x - bestPt.x) < 1e-6 && Math.abs(p.y - bestPt.y) < 1e-6);
      if (existing >= 0) {
        this._pinnedPoints.splice(existing, 1);
      } else {
        this._pinnedPoints.push({ ...bestPt });
      }
      this.renderPinnedPoints();
    }
  },

  // ─── Trace: snap to nearest curve and show coords ───
  // A touch (or pen) press that lands on a curve becomes a trace gesture
  // instead of a pan. Returns true when it did. Everything a press could
  // already mean keeps priority: a sketch in progress, an image handle, a
  // draggable point, and the display-slot freeze flags.
  _beginTouchTrace(e) {
    if (!e.pointerType || e.pointerType === 'mouse') return false;
    const frozen = window._kalcFrozen || {};
    if (frozen.trace) return false;
    if (window._kalcSketch && window._kalcSketch.active) return false;
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (this._imageAt && this._imageAt(mx, my, rect.width, rect.height)) return false;
    if (this._scatterPointAt && this._scatterPointAt(mx, my)) return false;
    const hit = this.traceAt(mx, my, { radius: 36, touch: true });
    if (!hit) return false;              // traceAt hid any sticky readout
    this._stopMotion();
    // Locked on: the finger follows that curve wherever it goes (a function
    // reads at the finger's x, TI-style; polar snaps to its nearest point).
    this._touchTrace = { lock: hit, radius: Infinity, touch: true };
    this._traceSticky = false;
    return true;
  },

  // opts.lock: only that curve is considered (a locked touch gesture);
  // opts.radius: hit distance in px (30 for a pointer, wider for a finger);
  // opts.touch: the label sits ABOVE the point, clear of the fingertip.
  // Returns the traced curve, or null.
  traceAt(mx, my, opts) {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const xRange = this.xMax - this.xMin, yRange = this.yMax - this.yMin;
    const gx = this.xMin + mx / w * xRange;
    const lock = opts && opts.lock;

    let bestDist = (opts && opts.radius) || 30;
    let bestExpr = null, bestY = 0, bestSY = 0;
    const toSY = y => h - (y - this.yMin) / yRange * h;

    const toSX = x => (x - this.xMin) / xRange * w;

    this.expressions.forEach(expr => {
      if (!expr.visible || expr.scatterData) return;
      if (lock && expr !== lock) return;

      if (expr.polar && expr.polarFn) {
        // Polar trace: find closest point by sampling theta
        const sv = expr.sliderValues || {};
        const steps = 720;
        const [thetaLo, thetaHi] = this.curveRange(expr);
        let closestDist = bestDist, closestTheta = 0, closestR = 0;
        for (let i = 0; i <= steps; i++) {
          const theta = thetaLo + (thetaHi - thetaLo) * i / steps;
          let r;
          try { r = expr.polarFn(theta, sv); } catch(e) { continue; }
          if (!isFinite(r)) continue;
          const px = r * Math.cos(theta), py = r * Math.sin(theta);
          const screenX = toSX(px), screenY = toSY(py);
          const dist = Math.sqrt((screenX - mx) ** 2 + (screenY - my) ** 2);
          if (dist < closestDist) {
            closestDist = dist; closestTheta = theta; closestR = r;
          }
        }
        if (closestDist < bestDist) {
          bestDist = closestDist;
          bestExpr = expr;
          bestY = closestR * Math.sin(closestTheta);
          bestSY = toSY(bestY);
          // Store polar info for label
          expr._traceR = closestR;
          expr._traceTheta = closestTheta;
          expr._traceSX = toSX(closestR * Math.cos(closestTheta));
        }
        return;
      }

      if (!expr.fn) return;
      try {
        const y = expr.fn(gx);
        if (!isFinite(y)) return;
        const sy = toSY(y);
        const dist = Math.abs(sy - my);
        if (dist < bestDist) {
          bestDist = dist;
          bestExpr = expr;
          bestY = y;
          bestSY = sy;
          expr._traceR = null;
        }
      } catch(e) {}
    });

    const _hovId = bestExpr ? bestExpr.id : null;
    if (_hovId !== this._hoverExprId) { this._hoverExprId = _hovId; this.scheduleRender(); }
    if (bestExpr && this.traceDot && this.traceLabel && !(window._kalcSketch && window._kalcSketch.hideTrace)) {
      const isPolar = bestExpr.polar && bestExpr._traceR != null;
      const sx = isPolar ? bestExpr._traceSX : mx;
      const dotSY = isPolar ? toSY(bestExpr._traceR * Math.sin(bestExpr._traceTheta)) : bestSY;
      this.traceDot.style.display = 'block';
      this.traceDot.style.left = sx + 'px';
      this.traceDot.style.top = dotSY + 'px';
      this.traceDot.style.background = bestExpr.color;
      this.traceLabel.style.display = 'block';
      this.traceLabel.style.left = sx + 'px';
      this.traceLabel.style.top = dotSY + 'px';
      if (isPolar) {
        this.traceLabel.textContent = `r=${this.fmtPi(bestExpr._traceR, 3)}, \u03B8=${this.fmtPi(bestExpr._traceTheta, 3)}`;
      } else {
        this.traceLabel.textContent = `(${this.fmtPi(gx, 3)}, ${this.fmtPi(bestY, 3)})`;
      }
      this.traceLabel.style.color = bestExpr.color;
      this.traceLabel.classList.toggle('touch', !!(opts && opts.touch));
      return bestExpr;
    }
    this.hideTrace();
    return null;
  },

  hideTrace() {
    this._traceSticky = false;
    if (this.traceDot) this.traceDot.style.display = 'none';
    if (this.traceLabel) this.traceLabel.style.display = 'none';
    if (this._hoverExprId != null) { this._hoverExprId = null; this.scheduleRender(); }
  },

  render() {
    if (!this.canvas || !this.ctx) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    if (w < 10 || h < 10) {
      if (!this._renderRetryId) {
        this._renderRetryId = setInterval(() => {
          const r = this.canvas.parentElement.getBoundingClientRect();
          if (r.width >= 10 && r.height >= 10) {
            clearInterval(this._renderRetryId);
            this._renderRetryId = null;
            this.render();
          }
        }, 100);
      }
      return;
    }
    if (this._renderRetryId) { clearInterval(this._renderRetryId); this._renderRetryId = null; }
    // Reallocating the backing store clears + reallocs — only do it when
    // the size or dpr actually changed; otherwise clearRect. (T1.5)
    const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (this.canvas.width !== bw || this.canvas.height !== bh) {
      this.canvas.width = bw;
      this.canvas.height = bh;
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
    }
    const ctx = this.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // The window is honoured as given unless the aspect is locked (the
    // default, and always under a polar grid, which would otherwise draw as
    // ellipses): locked, the smaller dimension is expanded so both axes share
    // one units-per-pixel. Every window used to be forced square here on
    // every frame, so y = x² could never be shown reaching 100 over x = ±10,
    // and no exponential could be shown at all. A locked HOST window
    // (_lockedWindow) is the base each frame so a frozen display can't drift.
    const base = this._lockedWindow || { xMin: this.xMin, xMax: this.xMax, yMin: this.yMin, yMax: this.yMax };
    const bxRange = base.xMax - base.xMin;
    const byRange = base.yMax - base.yMin;
    const xUnitsPerPx = bxRange / w;
    const yUnitsPerPx = byRange / h;
    if (!this.aspectLock && !this._polarGrid) {
      this.xMin = base.xMin; this.xMax = base.xMax; this.yMin = base.yMin; this.yMax = base.yMax;
    } else if (yUnitsPerPx > xUnitsPerPx) {
      const idealXRange = yUnitsPerPx * w;
      const cx = (base.xMin + base.xMax) / 2;
      this.xMin = cx - idealXRange / 2;
      this.xMax = cx + idealXRange / 2;
      this.yMin = base.yMin; this.yMax = base.yMax;
    } else {
      const idealYRange = xUnitsPerPx * h;
      const cy = (base.yMin + base.yMax) / 2;
      this.yMin = cy - idealYRange / 2;
      this.yMax = cy + idealYRange / 2;
      this.xMin = base.xMin; this.xMax = base.xMax;
    }

    const adjXRange = this.xMax - this.xMin, adjYRange = this.yMax - this.yMin;
    const toScreenX = x => (x - this.xMin) / adjXRange * w;
    const toScreenY = y => h - (y - this.yMin) / adjYRange * h;
    const fromScreenX = sx => this.xMin + sx / w * adjXRange;
    const fromScreenY = sy => this.yMax - sy / h * adjYRange;

    // Get theme colors
    const styles = getComputedStyle(document.documentElement);
    const bgColor = styles.getPropertyValue('--sf').trim() || '#fff';
    const bdColor = styles.getPropertyValue('--bd').trim() || '#ddd';
    const txColor = styles.getPropertyValue('--tx').trim() || '#1a1a1a';
    const tx3Color = styles.getPropertyValue('--tx3').trim() || '#999';

    // Background
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, w, h);

    // Grid — support custom step sizes including pi multiples
    const ticks = V.niceTicks;
    const parseStep = (stepStr) => {
      if (!stepStr) return null;
      const s = stepStr.trim().toLowerCase();
      if (s === 'pi') return Math.PI;
      if (s === 'pi/2') return Math.PI / 2;
      if (s === 'pi/3') return Math.PI / 3;
      if (s === 'pi/4') return Math.PI / 4;
      if (s === 'pi/6') return Math.PI / 6;
      const piMatch = s.match(/^(\d*\.?\d*)\s*\*?\s*pi(?:\s*\/\s*(\d+))?$/);
      if (piMatch) {
        const coeff = piMatch[1] ? parseFloat(piMatch[1]) : 1;
        const denom = piMatch[2] ? parseInt(piMatch[2]) : 1;
        return coeff * Math.PI / denom;
      }
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    };
    // Returns { text, frac } where frac = { sign, numer, denom } for stacked rendering
    const parsePiTick = (v, step) => {
      if (!step) return { text: Graph.fmtTick(v) };
      const piRatio = v / Math.PI;
      if (Math.abs(piRatio - Math.round(piRatio * 12) / 12) < 0.001) {
        const r = Math.round(piRatio * 12) / 12;
        if (Math.abs(r) < 0.001) return { text: '0' };
        if (Math.abs(r - 1) < 0.001) return { text: '\u03C0' };
        if (Math.abs(r + 1) < 0.001) return { text: '-\u03C0' };
        const sign = r < 0 ? '-' : '';
        const absR = Math.abs(r);
        // Try to express as n*pi/d
        for (let d = 1; d <= 12; d++) {
          const n = absR * d;
          if (Math.abs(n - Math.round(n)) < 0.01) {
            const ni = Math.round(n);
            if (d === 1) return { text: sign + (ni === 1 ? '\u03C0' : ni + '\u03C0') };
            const g = Graph._gcd(ni, d);
            const sn = ni / g, sd = d / g;
            if (sd === 1) return { text: sign + (sn === 1 ? '\u03C0' : sn + '\u03C0') };
            return { frac: { sign, numer: (sn === 1 ? '' : sn) + '\u03C0', denom: String(sd) } };
          }
        }
      }
      return { text: Graph.fmtTick(v) };
    };
    // Draw a tick label — stacked fraction if needed
    const drawTickLabel = (ctx, parsed, x, y, align) => {
      if (parsed.text) {
        ctx.textAlign = align || 'center';
        ctx.fillText(parsed.text, x, y);
      } else if (parsed.frac) {
        const f = parsed.frac;
        const oldFont = ctx.font;
        const sz = parseInt(oldFont) || 10;
        const smallSz = Math.max(7, sz - 1);
        ctx.textAlign = align || 'center';
        const prefix = f.sign || '';
        const prefixW = prefix ? ctx.measureText(prefix).width : 0;
        const cx = x + prefixW / 2;
        if (prefix) { ctx.fillText(prefix, x - prefixW / 2, y); }
        ctx.font = smallSz + 'px ' + (oldFont.split(' ').slice(1).join(' ') || 'monospace');
        ctx.fillText(f.numer, cx, y - sz * 0.35);
        ctx.fillText(f.denom, cx, y + sz * 0.45);
        // Fraction bar
        const nw = ctx.measureText(f.numer).width;
        const dw = ctx.measureText(f.denom).width;
        const barW = Math.max(nw, dw) + 2;
        ctx.beginPath();
        ctx.moveTo(cx - barW / 2, y - sz * 0.05);
        ctx.lineTo(cx + barW / 2, y - sz * 0.05);
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = 0.6;
        ctx.stroke();
        ctx.font = oldFont;
      }
    };
    const xStep = parseStep(this._xStep);
    const yStep = parseStep(this._yStep);
    let xTicks, yTicks;
    if (xStep) {
      xTicks = [];
      const start = Math.ceil(this.xMin / xStep) * xStep;
      for (let v = start; v <= this.xMax; v += xStep) xTicks.push(v);
    } else {
      xTicks = ticks(this.xMin, this.xMax, Math.floor(w / 80));
    }
    if (yStep) {
      yTicks = [];
      const start = Math.ceil(this.yMin / yStep) * yStep;
      for (let v = start; v <= this.yMax; v += yStep) yTicks.push(v);
    } else {
      yTicks = ticks(this.yMin, this.yMax, Math.floor(h / 60));
    }

    ctx.strokeStyle = bdColor;
    ctx.lineWidth = 0.4;
    ctx.globalAlpha = 0.5;
    if (!window._kalcHideGrid) {
    if (this._polarGrid) {
      // Polar grid — concentric circles + radial lines
      const ox = toScreenX(0), oy = toScreenY(0);
      const maxR = Math.max(Math.abs(this.xMax), Math.abs(this.xMin), Math.abs(this.yMax), Math.abs(this.yMin));
      const step = parseStep(this._xStep) || (maxR > 10 ? 2 : maxR > 4 ? 1 : 0.5);
      for (let r = step; r <= maxR * 1.5; r += step) {
        const rpx = r / adjXRange * w;
        ctx.beginPath(); ctx.arc(ox, oy, rpx, 0, 2 * Math.PI); ctx.stroke();
      }
      for (let a = 0; a < 12; a++) {
        const angle = a * Math.PI / 6;
        const len = maxR * 2;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(toScreenX(len * Math.cos(angle)), toScreenY(len * Math.sin(angle)));
        ctx.stroke();
      }
    } else {
      // Breathing grid (T2.3): the next-finer grid level fades in
      // continuously with zoom so grid steps never pop into place.
      const _gridLines = (vals, vertical, alpha) => {
        if (alpha <= 0.02 || !vals.length) return;
        ctx.globalAlpha = 0.5 * alpha;
        vals.forEach(v => {
          ctx.beginPath();
          if (vertical) { ctx.moveTo(toScreenX(v), 0); ctx.lineTo(toScreenX(v), h); }
          else { ctx.moveTo(0, toScreenY(v)); ctx.lineTo(w, toScreenY(v)); }
          ctx.stroke();
        });
      };
      const _minorGrid = (min, max, count, majors) => {
        if (majors.length < 2) return null;
        const step = majors[1] - majors[0];
        const rough = (max - min) / Math.max(1, count);
        const mag = Math.pow(10, Math.floor(Math.log10(step) + 1e-9));
        const unit = Math.round(step / mag);
        const nextUp = (unit === 1 ? 2 : unit === 2 ? 5 : 10) * mag;
        const finer = (unit === 1 ? 0.5 : unit === 2 ? 1 : 2) * mag;
        // 1 when the finer grid is about to take over as major, 0 when the
        // current major was just adopted — continuous in log-zoom.
        const t = (Math.log(nextUp) - Math.log(Math.max(rough, step))) / (Math.log(nextUp) - Math.log(step));
        const alpha = Math.max(0, Math.min(1, t));
        if (alpha <= 0.02) return null;
        const vals = [];
        const start = Math.ceil(min / finer) * finer;
        for (let v = start; v <= max + finer * 0.01; v += finer) {
