      return {
        type: 'inference', val: t,
        label: `t(${df}) = ${M.fmt(t,4)}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080' : '\u2192 Fail to reject H\u2080'}\nH\u2080: \u03BC_d = 0\nd\u0304 = ${M.fmt(dbar,4)}, s_d = ${M.fmt(sd,4)}, n = ${n}\n95% CI for \u03BC_d: (${M.fmt(lo,4)}, ${M.fmt(hi,4)})`,
        viz: V.confidenceInterval(lo, hi, dbar, { nullVal: 0, label: '\u03BC_d', clevel: 95 })
      };
    }

    if (name === 'zproptest') {
      const x = parseFloat(parts[0]), n = parseFloat(parts[1]);
      const p0 = parts.length >= 3 ? parseFloat(parts[2]) : 0.5;
      const phat = x/n, se0 = Math.sqrt(p0*(1-p0)/n);
      const z = (phat-p0)/se0;
      const pval = 2*(1-M.normcdf(Math.abs(z)));
      const zstar = M.invNorm(0.975);
      const seCI = Math.sqrt(phat*(1-phat)/n);
      const lo = phat-zstar*seCI, hi = phat+zstar*seCI;
      const reject = pval < 0.05;
      return {
        type: 'inference', val: z,
        label: `z = ${M.fmt(z,4)}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080' : '\u2192 Fail to reject H\u2080'}\nH\u2080: p = ${p0}\np\u0302 = ${x}/${n} = ${M.fmt(phat,6)}\n95% CI: (${M.fmt(lo,6)}, ${M.fmt(hi,6)})\nConditions: np\u2080=${M.fmt(n*p0,1)} \u2265 10? ${n*p0>=10?'\u2713':'\u2717'}  n(1-p\u2080)=${M.fmt(n*(1-p0),1)} \u2265 10? ${n*(1-p0)>=10?'\u2713':'\u2717'}`,
        viz: V.confidenceInterval(lo, hi, phat, { nullVal: p0, label: 'p', clevel: 95 })
      };
    }
    
    if (name === 'zproptest2') {
      const x1=parseFloat(parts[0]), n1=parseFloat(parts[1]), x2=parseFloat(parts[2]), n2=parseFloat(parts[3]);
      const p1=x1/n1, p2=x2/n2, pc=(x1+x2)/(n1+n2);
      const se0=Math.sqrt(pc*(1-pc)*(1/n1+1/n2));
      const z=(p1-p2)/se0;
      const pval=2*(1-M.normcdf(Math.abs(z)));
      const zstar=M.invNorm(0.975);
      const seCI=Math.sqrt(p1*(1-p1)/n1+p2*(1-p2)/n2);
      const lo=(p1-p2)-zstar*seCI, hi=(p1-p2)+zstar*seCI;
      const reject = pval < 0.05;
      return {
        type: 'inference', val: z,
        label: `z = ${M.fmt(z,4)}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080' : '\u2192 Fail to reject H\u2080'}\nH\u2080: p\u2081 = p\u2082\np\u0302\u2081 = ${M.fmt(p1,4)}, p\u0302\u2082 = ${M.fmt(p2,4)}\n95% CI for p\u2081\u2212p\u2082: (${M.fmt(lo,6)}, ${M.fmt(hi,6)})`
      };
    }
    
    if (name === 'chisqgof') {
      const obs = this.resolveList(parts[0]);
      let exp = this.resolveList(parts[1]);
      const total = M.sum(obs);
      if (M.sum(exp) < obs.length + 1) exp = exp.map(p => p * total);
      if (obs.length !== exp.length) throw { msg: 'Observed and expected must have same length.', hint: 'Same number of categories' };
      const df = obs.length - 1;
      let chi2 = 0;
      for (let i = 0; i < obs.length; i++) chi2 += (obs[i]-exp[i])**2/exp[i];
      const pval = 1-M.chi2cdf(chi2, df);
      const reject = pval < 0.05;
      return {
        type: 'inference', val: chi2,
        label: `\u03C7\u00B2 = ${M.fmt(chi2,4)}, df = ${df}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080' : '\u2192 Fail to reject H\u2080'}\nMin expected: ${M.fmt(Math.min(...exp),2)} ${Math.min(...exp)>=5?'\u2713 All \u2265 5':'\u2717 Some < 5'}`,
        viz: V.chi2Curve(chi2, df)
      };
    }

    if (name === 'chisqind') {
      // Expects a flat matrix encoded as multiple list args: chisqind([row1], [row2], ...)
      const rows = parts.map(p => this.resolveList(p));
      const r = rows.length, c = rows[0].length;
      const rowTotals = rows.map(row => M.sum(row));
      const colTotals = []; for(let j=0;j<c;j++){let s=0;for(let i=0;i<r;i++)s+=rows[i][j];colTotals.push(s);}
      const grand = M.sum(rowTotals);
      let chi2 = 0;
      rows.forEach((row,i) => row.forEach((o,j) => { const exp = rowTotals[i]*colTotals[j]/grand; chi2 += (o-exp)**2/exp; }));
      const df = (r-1)*(c-1);
      const pval = 1-M.chi2cdf(chi2, df);
      const reject = pval < 0.05;
      return {
        type: 'inference', val: chi2,
        label: `\u03C7\u00B2 = ${M.fmt(chi2,4)}, df = ${df}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080' : '\u2192 Fail to reject H\u2080'}\n${r}\u00D7${c} table, grand total = ${grand}`,
        viz: V.chi2Curve(chi2, df)
      };
    }
    
    if (name === 'lsrl' || name === 'linregttest') {
      const xs = this.resolveList(parts[0]), ys = this.resolveList(parts[1]);
      if (xs.length !== ys.length) throw { msg: 'X and Y must have equal length.', hint: 'Paired data required' };
      const reg = M.lsrl(xs, ys);
      const strength = Math.abs(reg.r)>0.8?'Strong':Math.abs(reg.r)>0.5?'Moderate':'Weak';
      let label = `\u0177 = ${M.fmt(reg.a,4)} + ${M.fmt(reg.b,4)}x\nr = ${M.fmt(reg.r,6)}, r\u00B2 = ${M.fmt(reg.r2,6)}\nslope b = ${M.fmt(reg.b,6)}, intercept a = ${M.fmt(reg.a,6)}\nSE(b) = ${M.fmt(reg.sb,6)}, SE(resid) = ${M.fmt(reg.se,6)}\n${M.fmt(reg.r2*100,1)}% of variability explained. ${strength} linear association.`;
      if (name === 'linregttest') {
        const t = reg.b / reg.sb, df = reg.n - 2;
        const pval = 2*(1-M.tcdf(Math.abs(t), df));
        const reject = pval < 0.05;
        label += `\nt = ${M.fmt(t,4)}, df = ${df}, p = ${M.fmt(pval,6)}  ${reject ? '\u2192 Reject H\u2080: \u03B2=0' : '\u2192 Fail to reject H\u2080: \u03B2=0'}`;
      }
      // Plot on graph canvas
      if (typeof Graph !== 'undefined' && Graph.panel) {
        Graph.expressions.push({
          id: Graph.nextId++, expr: 'Data', rawExpr: '', latex: null, plainLabel: true,
          fn: null, color: '#888', visible: true, lineWidth: 0, dash: [],
          scatterData: { xs, ys }
        });
        const regColor = Graph.colors[Graph.expressions.length % Graph.colors.length];
        Graph.expressions.push({
          id: Graph.nextId++, expr: `\u0177 = ${M.fmt(reg.a,4)} + ${M.fmt(reg.b,4)}x`, rawExpr: '',
          latex: Graph.exprToLatex(`y = ${M.fmt(reg.a,4)} + ${M.fmt(reg.b,4)}*x`),
          fn: reg.predict, color: regColor, visible: true, lineWidth: 2.5, dash: [],
          // Full precision and parenthesized so a negative slope round-trips.
          _srcExpr: `(${reg.a}) + (${reg.b})*x`
        });
        Graph.expressions.push({
          id: Graph.nextId++, expr: 'Residuals', rawExpr: '', latex: null, plainLabel: true,
          fn: null, color: '#e74c3c', visible: false, lineWidth: 0, dash: [],
          scatterData: { xs: [...xs], ys: reg.residuals }, isResidual: true
        });
        const xMin = Math.min(...xs), xMax = Math.max(...xs);
        const yMin = Math.min(...ys), yMax = Math.max(...ys);
        const xPad = (xMax-xMin)*0.15||1, yPad = (yMax-yMin)*0.15||1;
        Graph.xMin = Math.min(0, xMin-xPad); Graph.xMax = xMax+xPad;
        Graph.yMin = Math.min(0, yMin-yPad); Graph.yMax = yMax+yPad;
        Graph.panel.classList.add('visible');
        Graph.updateRows(); Graph.render();
      }
      return {
        type: 'inference', val: reg.r2,
        label: label,
        viz: null
      };
    }
    
    if (name === 'correlation') {
      const xs = this.resolveList(parts[0]), ys = this.resolveList(parts[1]);
      if (xs.length !== ys.length) throw { msg: 'X and Y must have equal length.', hint: 'Paired data required' };
      const reg = M.lsrl(xs, ys);
      // Plot scatter on graph canvas
      if (typeof Graph !== 'undefined' && Graph.panel) {
        Graph.expressions.push({
          id: Graph.nextId++, expr: 'Scatter data', rawExpr: '', latex: null, plainLabel: true,
          fn: null, color: '#888', visible: true, lineWidth: 0, dash: [],
          scatterData: { xs, ys }
        });
        const xMin = Math.min(...xs), xMax = Math.max(...xs);
        const yMin = Math.min(...ys), yMax = Math.max(...ys);
        const xPad = (xMax-xMin)*0.15||1, yPad = (yMax-yMin)*0.15||1;
        Graph.xMin = Math.min(0, xMin-xPad); Graph.xMax = xMax+xPad;
        Graph.yMin = Math.min(0, yMin-yPad); Graph.yMax = yMax+yPad;
        Graph.panel.classList.add('visible');
        Graph.updateRows(); Graph.render();
      }
      return { type: 'value', val: reg.r, label: 'r (correlation)' };
    }

    // Covariance & rank correlation (Desmos parity) — same paired-list shape
    // as correlation, but numeric-only (no scatter side effect).
    if (name === 'cov' || name === 'covp' || name === 'spearman') {
      const xs = this.resolveList(parts[0]), ys = this.resolveList(parts[1] || '');
      if (!xs.length || xs.length !== ys.length) throw { msg: 'X and Y must be equal-length lists.', hint: `Example: ${name}(L1, L2)` };
      if (name === 'spearman') {
        const rank = (arr) => {
          const idx = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
          const rk = new Array(arr.length);
          let i = 0;
          while (i < idx.length) {
            let j = i;
            while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
            const avg = (i + j) / 2 + 1;   // ties share their average rank
            for (let k = i; k <= j; k++) rk[idx[k][1]] = avg;
            i = j + 1;
          }
          return rk;
        };
        return { type: 'value', val: M.lsrl(rank(xs), rank(ys)).r, label: 'ρ (Spearman rank correlation)' };
      }
      if (name === 'cov' && xs.length < 2) throw { msg: 'Need at least 2 pairs for sample covariance.', hint: 'cov divides by n − 1' };
      const mx = M.mean(xs), my = M.mean(ys);
      let acc = 0;
      for (let i = 0; i < xs.length; i++) acc += (xs[i] - mx) * (ys[i] - my);
      return {
        type: 'value',
        val: acc / (name === 'cov' ? xs.length - 1 : xs.length),
        label: name === 'cov' ? 'sample covariance' : 'population covariance',
      };
    }

    throw { msg: `Unknown inference function "${name}".`, hint: 'Available: ttest, ttest2, pairedttest, zproptest, zproptest2, chisqgof, chisqind, lsrl, linregttest, correlation, cov, covp, spearman' };
  },

  // ─── Autocomplete: get suggestions for partial input ───
  getCompletions(partial) {
    const lower = partial.toLowerCase();
    const results = [];
    // Check function names
    for (const [name, entry] of Object.entries(this.registry)) {
      if (name.startsWith(lower)) {
        results.push({ name, sig: entry.sig, cat: entry.cat, desc: entry.desc });
      }
    }
    // Check aliases
    for (const [alias, target] of Object.entries(this.aliases)) {
      if (alias.toLowerCase().startsWith(lower) && !results.find(r => r.name === target)) {
        const entry = this.registry[target];
        if (entry) results.push({ name: target, sig: entry.sig, cat: entry.cat, desc: entry.desc, alias });
      }
    }
    // Check list names
    const filledLists = DataLists.getFilledLists();
    for (const listName of filledLists) {
      if (listName.toLowerCase().startsWith(lower)) {
        results.push({ name: listName, sig: '', cat: 'List', desc: `${DataLists.count(listName)} values` });
      }
    }
    // Check stored variables
    const storedVars = Session.get('exprVars', {});
    for (const [varName, varVal] of Object.entries(storedVars)) {
      if (varName.toLowerCase().startsWith(lower) && !results.find(r => r.name === varName)) {
        results.push({ name: varName, sig: '', cat: 'Variable', desc: `= ${M.fmt(varVal, 6)}` });
      }
    }
    // Sort: exact prefix first, then alphabetical
    results.sort((a, b) => {
      const aExact = a.name.toLowerCase().startsWith(lower) ? 0 : 1;
      const bExact = b.name.toLowerCase().startsWith(lower) ? 0 : 1;
      if (aExact !== bExact) return aExact - bExact;
      return a.name.localeCompare(b.name);
    });
    return results.slice(0, 8);
  }
};

// EXPRESSION BAR — UI Component Builder
function buildExpressionBar() {
  const wrapper = document.createElement('div');
  wrapper.className = 'expr-bar-wrapper';
  wrapper.id = 'exprBarWrapper';

  // ─── Main bar ───
  const bar = document.createElement('div');
  bar.className = 'expr-bar';

  const icon = document.createElement('div');
  icon.className = 'expr-bar-icon';
  icon.textContent = '\u0192';
  icon.title = 'Expression mode';
  bar.appendChild(icon);

  // MathQuill editable field (or fallback input)
  const mqSpan = document.createElement('span');
  mqSpan.id = 'exprMqField';
  bar.appendChild(mqSpan);

  // Placeholder text
  const placeholder = document.createElement('div');
  placeholder.className = 'mq-placeholder';
  placeholder.textContent = 'Type an expression\u2026';
  bar.appendChild(placeholder);

  // Fallback plain input (hidden if MathQuill loads)
  const fallbackInput = document.createElement('input');
  fallbackInput.type = 'text';
  fallbackInput.id = 'exprInput';
  fallbackInput.className = 'expr-fallback-input';
  fallbackInput.placeholder = 'Type an expression\u2026';
  fallbackInput.setAttribute('autocomplete', 'off');
  fallbackInput.setAttribute('spellcheck', 'false');
  fallbackInput.style.display = 'none';
  bar.appendChild(fallbackInput);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'expr-bar-submit';
  submitBtn.innerHTML = '\u23CE';
  submitBtn.setAttribute('aria-label', 'Evaluate expression');
  submitBtn.title = 'Evaluate (Enter)';
  bar.appendChild(submitBtn);

  // On-screen math keypad toggle (T4.1) — MathLive's virtual keyboard.
  // Touch devices get it automatically on focus; this is the mouse path.
  if (typeof MathfieldElement !== 'undefined') {
    const kbBtn = document.createElement('button');
    kbBtn.className = 'expr-bar-keypad';
    kbBtn.innerHTML = '&#9000;';
    kbBtn.setAttribute('aria-label', 'Toggle on-screen math keypad');
    kbBtn.title = 'On-screen keypad';
    kbBtn.onclick = (e) => { e.stopPropagation(); if (window._kalcToggleKeypad) window._kalcToggleKeypad(); };
    bar.appendChild(kbBtn);
  }

  wrapper.appendChild(bar);

  // ─── List pills ───
  const pills = document.createElement('div');
  pills.className = 'expr-list-pills';
  pills.id = 'exprListPills';
  wrapper.appendChild(pills);

  // ─── Inline result (hidden — results go to feed) ───
  const result = document.createElement('div');
  result.className = 'expr-result';
  result.id = 'exprResult';
  result.style.display = 'none';
  wrapper.appendChild(result);

  // ─── Viz area ───
  const vizArea = document.createElement('div');
  vizArea.className = 'calc-expr-viz';
  vizArea.id = 'exprVizArea';
  wrapper.appendChild(vizArea);

  // ─── Results feed (merged history + results) ───
  const feedMount = document.createElement('div');
  feedMount.id = 'resultsFeedMount';
  wrapper.appendChild(feedMount);

  // ─── Empty state ───
  // The graph panel stays hidden until something plots, so a fresh session
  // was a toolbar, a bar and blank space — a graphing calculator with no
  // graph. Three runnable examples per mode show the syntax and produce a
  // result on the first click; the card leaves as soon as the feed or the
  // graph has anything in it, and never comes back over real work.
  const emptyState = document.createElement('div');
  emptyState.className = 'expr-empty';
  emptyState.id = 'exprEmptyState';
  emptyState.hidden = true;
  const emptyTitle = document.createElement('div');
  emptyTitle.className = 'expr-empty-title';
  emptyTitle.textContent = 'Type an expression above, or try one:';
  emptyState.appendChild(emptyTitle);
  const chipRow = document.createElement('div');
  chipRow.className = 'expr-empty-chips';
  const EMPTY_EXAMPLES = [
    { code: 'y = x^2 - 3', mode: 'calc' },
    { code: '(1, 2); (3, 4)', mode: 'calc' },
    { code: 'sqrt(2)/2', mode: 'calc' },
    { code: 'mean([12, 15, 18, 22])', mode: 'stats' },
    { code: 'L1 = [3, 5, 8, 13]', mode: 'stats' },
    { code: 'normaldist(0, 1).cdf(1.5)', mode: 'stats' },
  ];
  EMPTY_EXAMPLES.forEach(ex => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'expr-empty-chip ' + (ex.mode === 'stats' ? 'stats-only' : 'calc-only');
    chip.textContent = ex.code;
    chip.title = 'Run this example';
    chip.onclick = (e) => {
      e.stopPropagation();
      if (typeof _helpInsertExample === 'function') _helpInsertExample(ex.code);
      runExpression();
    };
    chipRow.appendChild(chip);
  });
  emptyState.appendChild(chipRow);
  wrapper.appendChild(emptyState);
  function updateEmptyState() {
    const hasHistory = (Session.get('calcHistory', []) || []).length > 0;
    const gp = document.getElementById('graphPanel');
    const hasGraph = !!(gp && gp.classList.contains('visible'));
    emptyState.hidden = hasHistory || hasGraph;
  }
  document.addEventListener('calc-history-change', updateEmptyState);
  setTimeout(() => {
    updateEmptyState();
    const gp = document.getElementById('graphPanel');
    if (gp) new MutationObserver(updateEmptyState).observe(gp, { attributes: true, attributeFilter: ['class'] });
  }, 60);

  // "Open in Table" buttons live inside feed richHtml (innerHTML that gets
  // re-rendered), so clicks are delegated. Capture phase + stopPropagation
  // keep the feed row's own click-to-reload from also firing.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('.expr-open-table');
    if (!btn) return;
    e.stopPropagation(); e.preventDefault();
    try { if (typeof Graph !== 'undefined' && Graph.toggleListEditor) Graph.toggleListEditor(); } catch (err) {}
  }, true);

  // ─── Autocomplete dropdown ───
  const acDropdown = document.createElement('div');
  acDropdown.className = 'expr-autocomplete';
  acDropdown.id = 'exprAutocomplete';
  wrapper.appendChild(acDropdown);


  // ═══════════════════════════════════════════════════════════════
  // LATEX → EXPRESSION TRANSLATOR
  // ═══════════════════════════════════════════════════════════════

  // ─── Big operators: Σ, lim, ∫ ───────────────────────────────────
  // Turns the notation MathLive produces into the functional calls the engine
  // compiles (see Graph._rewriteCalculus):
  //
  //   \sum_{i=1}^{10} i^2      → sum(i^2, i, 1, 10)
  //   \sum_{n=1}^{\infty} …    → sum(…, n, 1, Infinity)
  //   \lim_{x\to2} f           → lim(f, x, 2, 0)      ( ^+ / ^- → side ±1 )
  //   \int_{0}^{4} x^2 dx      → integral(0, 4, x^2)  (Kalc's existing fn)
  //
  // These are the same canonical forms server/graders/expression.js normalizes
  // student answers into, so what a student computes here and what the grader
  // accepts are the same notation. kalcSmoke.mjs pins that agreement.
  //
  // An indefinite ∫ (no bounds) is deliberately NOT accepted: Kalc is a numeric
  // engine with no symbolic antiderivative, and silently returning something
  // would be worse than saying so.

  // Extent of a Σ/lim body: it binds like a PRODUCT, so it runs until a
  // top-level + or -, matching bindSumBody() in the grader. `\sum_{i=1}^{n} i^2
  // + 5` is (Σi²) + 5, not Σ(i²+5).
  function bigOpBody(s, start) {
    let i = start;
    while (i < s.length && /\s/.test(s[i])) i++;
    if (s[i] === '+' || s[i] === '-') i++; // a leading sign belongs to the body
    let depth = 0;
    for (; i < s.length; i++) {
      const c = s[i];
      if (c === '(' || c === '[' || c === '{') depth++;
      else if (c === ')' || c === ']' || c === '}') {
        if (depth === 0) break; // closing a group we are nested inside
        depth--;
      } else if (depth === 0 && (c === '+' || c === '-' || c === ',' || c === '=')) break;
    }
    const body = s.slice(start, i).trim();
    return body ? { body, end: i } : null;
  }

  // Read a balanced {...} group starting at i. Returns null if unbalanced.
  function readBraceGroup(s, i) {
    if (s[i] !== '{') return null;
    let depth = 0;
    for (let k = i; k < s.length; k++) {
      if (s[k] === '{') depth++;
      else if (s[k] === '}') { depth--; if (depth === 0) return { text: s.slice(i + 1, k), end: k + 1 }; }
    }
    return null;
  }

  // One LaTeX argument: a {group}, a \command token, or a single character.
  // MathLive serializes single-token arguments WITHOUT braces (\frac12,
  // \frac\pi2, \sqrt2), which a braces-only reader left unconverted —
  // typing 1/2 and pressing Enter then did nothing at all.
  function readArg(s, i) {
    while (i < s.length && /\s/.test(s[i])) i++;
    if (i >= s.length) return null;
    if (s[i] === '{') return readBraceGroup(s, i);
    const cmd = s.slice(i).match(/^\\[A-Za-z]+/);
    if (cmd) return { text: cmd[0], end: i + cmd[0].length };
    return { text: s[i], end: i + 1 };
  }

  // Read a LaTeX limit box: _{...} or ^{...}, or a single bare token (\int_0^4).
  function bigOpArg(s, i) {
    if (s[i] !== '_' && s[i] !== '^') return null;
    const kind = s[i];
    let j = i + 1;
    if (s[j] === '{') {
      let depth = 0;
      for (let k = j; k < s.length; k++) {
        if (s[k] === '{') depth++;
        else if (s[k] === '}') { depth--; if (depth === 0) return { kind, text: s.slice(j + 1, k), end: k + 1 }; }
      }
      return null;
    }
    // Unbraced, so LaTeX scope is exactly ONE token: a command (\pi, \infty)
    // or a single character. Matching greedily would read \int_0^4x^2dx as an
    // upper bound of "4x" — LaTeX means \int_0^{4} x^2 dx, and MathLive always
    // braces anything longer than one character anyway.
    const m = /^(\\[A-Za-z]+|[A-Za-z0-9])/.exec(s.slice(j));
    return m ? { kind, text: m[1], end: j + m[1].length } : null;
  }

  function extractBigOperators(str) {
    let s = String(str);
    s = s.replace(/\\limits/g, '');
    // ∞ in a bound, in every spelling students and authors use. Bounded so it
    // cannot fire inside a name ("floor" contains "oo").
    s = s.replace(/\\infty/g, 'infinity').replace(/∞/g, 'infinity');
    s = s.replace(/(?<![A-Za-z0-9\\])(?:oo|infty)(?![A-Za-z0-9])/gi, 'infinity');

    // ─ Σ ─
    for (let guard = 0; guard < 30; guard++) {
      const m = /\\sum\s*/.exec(s);
      if (!m) break;
      let i = m.index + m[0].length;
      const a = bigOpArg(s, i);
      if (!a) break;
      const b = bigOpArg(s, a.end);
      if (!b || a.kind === b.kind) break;
      const sub = (a.kind === '_' ? a : b).text;
      const sup = (a.kind === '^' ? a : b).text;
      const head = /^\s*([A-Za-z][A-Za-z0-9]*)\s*=\s*(\S[\s\S]*?)\s*$/.exec(sub);
      if (!head) break;
      const body = bigOpBody(s, b.end);
      if (!body) break;
      s = s.slice(0, m.index) + `sum((${body.body}),${head[1]},(${head[2]}),(${sup}))` + s.slice(body.end);
    }

    // ─ lim ─
    for (let guard = 0; guard < 30; guard++) {
      const m = /\\lim\s*/.exec(s);
      if (!m) break;
      const a = bigOpArg(s, m.index + m[0].length);
      if (!a || a.kind !== '_') break;
      const arrow = /^\s*([A-Za-z][A-Za-z0-9]*)\s*(?:\\to|\\rightarrow|->|→)\s*([\s\S]+?)\s*$/.exec(a.text);
      if (!arrow) break;
      let point = arrow[2], side = 0;
      const oneSided = /\^\{?\s*([+-])\s*\}?$/.exec(point);
      if (oneSided) {
        side = oneSided[1] === '+' ? 1 : -1;
        point = point.slice(0, oneSided.index).trim();
      }
      if (!point) break;
      const body = bigOpBody(s, a.end);
      if (!body) break;
      s = s.slice(0, m.index) + `lim((${body.body}),${arrow[1]},(${point}),${side})` + s.slice(body.end);
    }

    // ─ ∫ ─ the trailing differential delimits the body and names the variable
    for (let guard = 0; guard < 30; guard++) {
      const m = /\\int\s*/.exec(s);
      if (!m) break;
      let i = m.index + m[0].length;
      let lo = null, hi = null;
      for (let pass = 0; pass < 2; pass++) {
        const a = bigOpArg(s, i);
        if (!a) break;
        if (a.kind === '_') lo = a.text; else hi = a.text;
        i = a.end;
      }
      const rest = s.slice(i);
      // Find the differential that closes the body. NO \b before the d: in
      // "x^2dx" the d follows a digit, so there is no word boundary there and
      // the integral would never be recognized. The trailing lookahead is what
      // keeps this off the d inside names like nderiv.
      let dm = null;
      for (const cand of rest.matchAll(/(?:\\[,;: ]|\s)*d([A-Za-z])(?![A-Za-z0-9])/g)) {
        let depth = 0;
        for (let k = 0; k < cand.index; k++) {
          const ch = rest[k];
          if (ch === '(' || ch === '[' || ch === '{') depth++;
          else if (ch === ')' || ch === ']' || ch === '}') depth--;
        }
        if (depth === 0) { dm = cand; break; }
      }
      if (!dm) break;
      const body = rest.slice(0, dm.index).trim();
      if (!body) break;
      const end = i + dm.index + dm[0].length;
      if (lo == null || hi == null) {
        // Indefinite — no numeric answer exists. Emit a marker the engine
        // turns into a clear message instead of a wrong number.
        s = s.slice(0, m.index) + '_indefinite_integral_' + s.slice(end);
        continue;
      }
      s = s.slice(0, m.index) + `integral((${lo}),(${hi}),(${body}),${dm[1]})` + s.slice(end);
    }
    return s;
  }

  // Every multi-letter name the engine or the graph accepts, so MathLive types
  // each as ONE token. Built from the engine's own registry + aliases rather
  // than a hand list: a name missing here is typed letter by letter, and
  // MathLive's word shortcuts fire inside it ("normalcdf" became n∨malcdf,
  // "sort(" became s∨t( — with no error, because "or" is a valid symbol).
  // Graph-level names live in Graph._rewriteCalculus / expandSequences and
  // have no registry entry, so they are listed here.
  const GRAPH_FN_NAMES = 'integral area tangent nderiv riemann sum lim seq arithseq geomseq recurseq sort unique join shuffle cdf pdf inversecdf';
  let _opNamesCache = null;
  function kalcOperatorNames() {
    if (_opNamesCache) return _opNamesCache;
    const names = new Set(GRAPH_FN_NAMES.split(' '));
    try {
      Object.keys(ExprEngine.registry).forEach(n => names.add(n));
      Object.keys(ExprEngine.aliases).forEach(n => names.add(n));
    } catch (e) {}
    _opNamesCache = [...names].filter(n => /^[A-Za-z][A-Za-z0-9]+$/.test(n)).join(' ');
    return _opNamesCache;
  }

  function latexToExpr(latex) {
    let s = latex;

    // Remove \left \right wrappers
    s = s.replace(/\\left\\\{/g, '{').replace(/\\right\\\}/g, '}');
    s = s.replace(/\\left\(/g, '(').replace(/\\right\)/g, ')');
    s = s.replace(/\\left\[/g, '[').replace(/\\right\]/g, ']');
    s = s.replace(/\\left\|/g, '|').replace(/\\right\|/g, '|');
    // Bare literal braces (\{ from typed/inserted piecewise syntax — the
    // MathLive adapter normalizes \lbrace to \{, but nothing consumed it here
    // and the stray backslashes broke the piecewise compiler downstream).
    s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
    s = s.replace(/\\colon/g, ':');

    // Comparison operators — LaTeX and unicode
    s = s.replace(/\\ge\b/g, '>=').replace(/\\le\b/g, '<=');
    s = s.replace(/\\geq\b/g, '>=').replace(/\\leq\b/g, '<=');
    s = s.replace(/\\gt\b/g, '>').replace(/\\lt\b/g, '<');
    s = s.replace(/\\ne\b/g, '!=').replace(/\\neq\b/g, '!=');
    s = s.replace(/\u2265/g, '>=').replace(/\u2264/g, '<=');
    s = s.replace(/\u2260/g, '!=').replace(/\u00D7/g, '*');
    // Ellipsis (range lists [1...10]) \u2014 MathLive may serialize typed dots
    s = s.replace(/\\[lc]?dots\b/g, '...').replace(/\u2026/g, '...');

    // Fractions: \frac{a}{b} → ((a)/(b)), with BALANCED brace reading.
    // A regex over [^{}]* cannot match a numerator that itself contains a
    // group — \frac{x^{2}}{3} — and the old loop left such a fraction
    // unconverted, after which the generic brace→paren pass downstream turned
    // it into "\frac(x^(2))*(3)": a fraction silently became a MULTIPLICATION.
    // Reading balanced groups fixes that; nested \frac survives in the
    // captured text and is converted by a later turn of the loop.
    for (let guard = 0; guard < 200; guard++) {
      const at = s.indexOf('\\frac');
      if (at < 0) break;
      const num = readArg(s, at + 5);
      if (!num) break;
      const den = readArg(s, num.end);
      if (!den) break;
      s = s.slice(0, at) + `((${num.text})/(${den.text}))` + s.slice(den.end);
    }

    // Square root: \sqrt[3]{x} → cbrt(x), \sqrt{x} → sqrt(x)
    s = s.replace(/\\sqrt\[3\]\{([^{}]*)\}/g, 'cbrt($1)');
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, 'sqrt($1)');
    // Compact single-token forms MathLive emits: \sqrt2, \sqrt\pi, \sqrt[3]x
    s = s.replace(/\\sqrt\[3\]\s*(\\[A-Za-z]+|[^\s\\{}\[\]])/g, 'cbrt($1)');
    s = s.replace(/\\sqrt\s*(\\[A-Za-z]+|[^\s\\{}\[\]])/g, 'sqrt($1)');
    // Floor / ceiling brackets (typed "floor(" / "ceil(" fire MathLive's own
    // \lfloor…\rfloor shortcut; the \left/\right pass above doesn't know them)
    s = s.replace(/\\left\\lfloor|\\lfloor/g, 'floor(').replace(/\\right\\rfloor|\\rfloor/g, ')');
    s = s.replace(/\\left\\lceil|\\lceil/g, 'ceil(').replace(/\\right\\rceil|\\rceil/g, ')');

    // Trig/math functions with braced arguments: \sin{x} → sin(x)
    s = s.replace(/\\(sin|cos|tan|sec|csc|cot|arcsin|arccos|arctan|ln|log|exp|min|max)\{([^{}]*)\}/g, '$1($2)');

    // Trig/math functions with parenthesized args: \sin(x) → sin(x)
    s = s.replace(/\\(sin|cos|tan|sec|csc|cot|arcsin|arccos|arctan|ln|log|exp|min|max)\s*\(/g, '$1(');

    // Trig/math functions with bare arguments (no parens/braces):
    // \sin followed by content until next operator or end → sin(content)
    // e.g. \sin\frac{1}{2}\pi → after frac conversion: \sin((1)/(2))pi
    // We handle this AFTER frac/sqrt conversion but BEFORE stripping remaining \commands
    s = s.replace(/\\(sin|cos|tan|sec|csc|cot|arcsin|arccos|arctan|ln|log|exp|min|max)\s+/g, '$1 ');
    // Now strip the backslash from any remaining \sin etc (no argument attached)
    s = s.replace(/\\(sin|cos|tan|sec|csc|cot|arcsin|arccos|arctan|ln|log|exp|min|max)/g, '$1');

    // operatorname
    s = s.replace(/\\operatorname\{([^{}]+)\}/g, '$1');

    // Tilde (\sim from MathQuill)
    s = s.replace(/\\sim/g, '~');

    // Greek letters
    s = s.replace(/\\theta/g, 'theta');
    s = s.replace(/\\pi/g, 'pi');
    s = s.replace(/\\mu/g, 'mu');
    s = s.replace(/\\sigma/g, 'sigma');
    s = s.replace(/\\alpha/g, 'alpha');
    s = s.replace(/\\chi/g, 'chi');

    // Big operators — Σ, lim, ∫. MUST run before the sub/superscript stripping
    // below, which would otherwise dissolve the limit boxes that carry the
    // index, bounds and approach point.
    s = extractBigOperators(s);

    // e^{x} → exp(x)
    s = s.replace(/(?<![A-Za-z])e\^\{([^{}]*)\}/g, 'exp($1)');
    s = s.replace(/(?<![A-Za-z])e\^([0-9])/g, 'exp($1)');

    // Superscripts: x^{n} → x^(n)
    s = s.replace(/\^\{([^{}]*)\}/g, '^($1)');

    // Log with subscript base: \log_{b}(x) → logbase(b, x) or log_{b}{x} → logbase(b, x)
    // Must come BEFORE generic subscript stripping
    s = s.replace(/log_\{([^{}]+)\}\s*\(([^)]*)\)/g, 'logbase($1, $2)');
    s = s.replace(/log_\{([^{}]+)\}\s*\{([^{}]*)\}/g, 'logbase($1, $2)');
    s = s.replace(/log_\{([^{}]+)\}\s*([A-Za-z0-9.]+)/g, 'logbase($1, $2)');
    s = s.replace(/log_([0-9])\s*\(([^)]*)\)/g, 'logbase($1, $2)');
    s = s.replace(/log_([0-9])\s*([A-Za-z0-9.]+)/g, 'logbase($1, $2)');

    // Subscripts: strip remaining
    s = s.replace(/_\{([^{}]*)\}/g, '$1');
    s = s.replace(/_([0-9])/g, '$1');

    // Operators
    s = s.replace(/\\cdot/g, '*');
    s = s.replace(/\\times/g, '*');
    s = s.replace(/\\div/g, '/');
    s = s.replace(/\\pm/g, '+-');

    // Clean up remaining LaTeX
    s = s.replace(/\\ /g, ' ');
    s = s.replace(/\\,/g, '');

    // Convert remaining braces to parens — but preserve piecewise {cond: expr}
    // braces and domain-restriction braces (y = x^2 {x > 0}, {[0, 5]}, {(-2, 3]});
    // both syntaxes need literal { } to reach the engine.
    const _lastGroup = s.match(/\{([^{}]*)\}\s*$/);
    const isPiecewise = /\{[^{}]*:[^{}]*\}/.test(s) ||
      (_lastGroup && (/[<>]/.test(_lastGroup[1]) || /^[\[(].*,.*[\])]$/.test(_lastGroup[1].trim())));
    if (isPiecewise) {
      // Protect the piecewise braces (first { and last } that contain : syntax)
      const firstBrace = s.indexOf('{');
      const lastBrace = s.lastIndexOf('}');
      if (firstBrace >= 0 && lastBrace > firstBrace) {
        const before = s.slice(0, firstBrace);
        const inner = s.slice(firstBrace + 1, lastBrace);
        const after = s.slice(lastBrace + 1);
        // Convert any braces inside the piecewise (from leftover LaTeX) to parens
        const cleanInner = inner.replace(/\{/g, '(').replace(/\}/g, ')');
        s = before.replace(/\{/g, '(').replace(/\}/g, ')') + '{' + cleanInner + '}' + after.replace(/\{/g, '(').replace(/\}/g, ')');
      } else {
        s = s.replace(/\{/g, '(').replace(/\}/g, ')');
      }
    } else {
      s = s.replace(/\{/g, '(').replace(/\}/g, ')');
    }

    // MathQuill implicit multiplication: insert * between adjacent terms
    // e.g. "2pi" → "2*pi", "(3)(4)" → "(3)*(4)", "2(3)" → "2*(3)"
    s = Graph._implicitMul(s);                             // 2pi → 2*pi, 2( → 2*( … but 2e5 stays a number
    // But don't insert * after function names — undo those
    // Same name set MathLive types as single tokens — the old hand list here
    // lacked ttest2 / zproptest2, so their digit got a `*` inserted before `(`.
    const fnRe = new RegExp('(' + kalcOperatorNames().split(' ').join('|') + ')\\*\\(', 'gi');
    s = s.replace(fnRe, '$1(');

    // Clean up double parens
    s = s.replace(/\(\(([^()]+)\)\)/g, '($1)');

    // Clean up spaces
    s = s.replace(/\s+/g, ' ').trim();

    return s;
  }

  // ═══ EVENT WIRING ═══
  let acIndex = -1;
  let acItems = [];
  let mathField = null;
  let useMathQuill = false;

  // Get current expression text (from MathQuill or fallback)
  function getExprText() {
    if (useMathQuill && mathField) {
      const latex = mathField.latex();
      return latexToExpr(latex);
    }
    return fallbackInput.value.trim();
  }

  function getExprLatex() {
    if (useMathQuill && mathField) return mathField.latex();
    return fallbackInput.value;
  }

  function setExprText(text) {
    if (useMathQuill && mathField) {
      mathField.latex(text);
    } else {
      fallbackInput.value = text;
    }
    updatePlaceholder();
  }

  // Errors are the ONE thing the inline #exprResult shows. Results go to the
  // feed and the element stays display:none for them (inline style, set at
  // build) — the catch below used to write the error into that hidden box, so
  // an unknown function, a stray operator or a fraction MathLive serialized
  // compactly all failed with nothing on screen: "Enter is broken".
  let _errorLatex = null; // what the bar held when the error was shown
  function showExprError(msg, hint) {
    const el = document.getElementById('exprResult');
    if (!el) return;
    _errorLatex = getExprLatex();
    el.innerHTML = `<div class="expr-result-error" role="alert">${msg}${hint ? '<span class="expr-error-hint">' + hint + '</span>' : ''}</div>`;
    el.classList.add('visible', 'has-error');
    el.style.display = '';
  }
  function hideExprError() {
    const el = document.getElementById('exprResult');
    if (!el || !el.classList.contains('has-error')) return;
    el.classList.remove('visible', 'has-error');
    el.innerHTML = '';
    el.style.display = 'none';
  }
  const escapeHtml = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Engine errors carry their own {msg, hint}; anything else is a raw
  // JavaScript error from the compiled expression, which reads as gibberish
  // ("Unexpected end of input") to a student.
  function describeError(err) {
    if (err && err.msg) return { msg: err.msg, hint: err.hint || '' };
    const m = String(err && err.message || err || 'Unknown error');
    let name = m.match(/^(\w+) is not (?:defined|a function)/);
    if (name) return { msg: `"${escapeHtml(name[1])}" isn't a function or variable the calculator knows.`, hint: 'Check the spelling, or open Help for the list of functions.' };
    if (/Unexpected (end of input|token|number|identifier|string)|Invalid or unexpected|missing \)|Unexpected end/.test(m)) {
      return { msg: 'That expression is incomplete or has a stray symbol.', hint: 'Check for a missing number, operator, or closing parenthesis.' };
    }
    return { msg: escapeHtml(m), hint: '' };
  }

  function clearExpr() {
    if (useMathQuill && mathField) {
      mathField.latex('');
    } else {
      fallbackInput.value = '';
    }
    updatePlaceholder();
  }

  function focusExpr() {
    if (useMathQuill && mathField) {
      mathField.focus();
    } else {
      fallbackInput.focus();
    }
  }

  function isExprEmpty() {
    if (useMathQuill && mathField) return mathField.latex().trim() === '';
    return fallbackInput.value.trim() === '';
  }

  let exprFocused = false;

  function updatePlaceholder() {
    placeholder.classList.toggle('hidden', exprFocused || !isExprEmpty());
  }

  // ─── Format exact value representations with fraction toggle ───
  function formatExactValues(val) {
    if (typeof val !== 'number' || !isFinite(val) || Number.isInteger(val)) return '';
    const exacts = ExactValues.findExact(val);
    if (!exacts || !exacts.length) return '';
    
    // Find the best fraction representation for the toggle button
    const fracExact = exacts.find(e => /^\-?\d+\/\d+$/.test(e.display));
    const otherExacts = exacts.filter(e => e !== fracExact);
    
    let html = '';
    
    // Build the exact values line
    const allParts = exacts.map(e =>
      `<span class="exact-val">${e.display}</span>${e.label ? ' <span class="exact-label">(' + e.label + ')</span>' : ''}`
    );
    html += `<div class="expr-result-exact">\u2248 ${allParts.join(' \u00A0=\u00A0 ')}</div>`;
    
    // Decimal secondary line (shown when fraction is primary)
    html += `<div class="expr-result-decimal-secondary">\u2248 ${M.fmt(val, 10)}</div>`;
    
    return html;
  }
  
  // Build the fraction toggle button (inserted into the result-value div)
  function buildFracButton(val) {
    const exacts = ExactValues.findExact(val);
    if (!exacts || !exacts.length) return '';
    // Find the best display form for the toggle
    const best = exacts[0];
    return `<span class="expr-result-frac">${best.display}</span><button class="frac-convert-btn" title="Toggle fraction/decimal" onclick="this.classList.toggle('active');this.closest('.expr-result-value').classList.toggle('frac-mode')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="12" x2="20" y2="12"/><circle cx="12" cy="7" r="2"/><circle cx="12" cy="17" r="2"/></svg></button>`;
  }

  function showViz(vizEl, html) {
    vizEl.innerHTML = html;
    vizEl.className = 'calc-expr-viz visible';
    if (!vizEl.querySelector('.viz-dismiss')) {
      const btn = document.createElement('button');
      btn.className = 'viz-dismiss';
      btn.textContent = '✕';
      btn.title = 'Dismiss';
      btn.onclick = () => { vizEl.innerHTML = ''; vizEl.className = 'calc-expr-viz'; };
      vizEl.appendChild(btn);
    }
  }
  function hideViz(vizEl) {
    vizEl.innerHTML = ''; vizEl.className = 'calc-expr-viz';
  }

  function runExpression() {
    if (window._kalcFrozen && window._kalcFrozen.input) return;
    const val = getExprText();
    if (!val) return;
    // Capture LaTeX before evaluating (for graph display)
    const currentLatex = getExprLatex();
    const resultEl = document.getElementById('exprResult');
    const vizEl = document.getElementById('exprVizArea');
    hideExprError();
    try {
      const res = ExprEngine.evaluate(val, currentLatex);
      if (!res) {
        showExprError("Couldn't read that expression.", 'Open Help for the syntax the calculator understands.');
        return;
      }

      if (res.type === 'assignment') {
        // Confirm what was stored — the old silent clear read as "nothing
        // happened" (especially for lists). Results display through the FEED
        // (the inline #exprResult stays display:none by design), so the
        // confirmation + Table shortcut ride the history entry's richHtml;
        // the button's click is delegated (see the .expr-open-table handler).
        const labelHtml = `<div class="expr-result-label">${res.label}</div>`;
        resultEl.innerHTML = labelHtml;
        resultEl.classList.add('visible');
        hideViz(vizEl);
        updateListPills();
        res._historyHtml = labelHtml + (res.count > 1
          ? ' <button type="button" class="expr-open-table">Open in Table</button>' : '');
      } else if (res.type === 'viz') {
        resultEl.innerHTML = ''; resultEl.classList.remove('visible');
        showViz(vizEl, res.viz);
      } else if (res.type === 'graph') {
        resultEl.innerHTML = ''; resultEl.classList.remove('visible');
        hideViz(vizEl);
        clearExpr();
        return;
      } else if (res.type === 'inference') {
        let html = '';
        if (res.label) {
          // Parse the label into structured sections
          const lines = res.label.split('\n');
          html += '<div class="inference-result">';
          lines.forEach((line, i) => {
            if (i === 0) {
              // First line: test stat, p-value, decision
              const hasReject = line.includes('\u2192');
              if (hasReject) {
                const [stats, decision] = line.split(/\s*\u2192\s*/);
                const isReject = decision && decision.includes('Reject H');
                html += `<div class="inf-headline">${stats}</div>`;
                html += `<div class="decision ${isReject ? 'reject' : 'fail'}"><svg viewBox="0 0 16 16" fill="currentColor" style="width:12px;height:12px">${isReject ? '<path d="M8 1a7 7 0 100 14A7 7 0 008 1zm3.7 4.3a.5.5 0 01.1.7l-4.5 5.5a.5.5 0 01-.7.1l-2.5-2a.5.5 0 01.6-.8l2.1 1.7 4.2-5.1a.5.5 0 01.7-.1z"/>' : '<circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1" fill="none"/><line x1="5" y1="5" x2="11" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="5" x2="5" y2="11" stroke="currentColor" stroke-width="1.5"/>'}</svg> \u2192 ${decision}</div>`;
              } else {
                html += `<div class="inf-headline">${line}</div>`;
              }
            } else if (line.startsWith('H\u2080:') || line.startsWith('H₀:')) {
              html += `<div class="inf-hyp">${line}</div>`;
            } else if (line.includes('CI:') || line.includes('CI for')) {
              html += `<div class="inf-ci">${line}</div>`;
            } else if (line.includes('Condition') || line.includes('\u2713') || line.includes('\u2717')) {
              html += `<div class="inf-cond">${line}</div>`;
            } else {
              html += `<div class="inf-stats">${line}</div>`;
            }
          });
          html += '</div>';
        }
        resultEl.innerHTML = html;
        resultEl.classList.add('visible');
        if (res.viz) { showViz(vizEl, res.viz); }
        else { hideViz(vizEl); }
      } else if (res.type === 'list-info') {
        resultEl.innerHTML = `<div class="expr-result-label">${res.label}</div>`;
        resultEl.classList.add('visible');
        hideViz(vizEl);
      } else {
        let html = '';
        if (res.val !== null && res.val !== undefined) {
          const fracBtn = buildFracButton(res.val);
          html += `<div class="expr-result-value">
            <span class="expr-result-eq">=</span>
            <span class="expr-result-num">${M.fmt(res.val, 10)}</span>
            ${fracBtn}
          </div>`;
          // Show exact representations (fractions, pi multiples, sqrt forms)
          html += formatExactValues(res.val);
        }
        if (res.label) {
          html += `<div class="expr-result-label">${res.label}</div>`;
        }
        resultEl.innerHTML = html;
        resultEl.classList.add('visible');
        if (res.viz) {
          showViz(vizEl, res.viz);
        } else {
          hideViz(vizEl);
        }
      }

      // Save to unified results feed
      const history = Session.get('calcHistory', []);
      const numResult = (res.val !== null && typeof res.val === 'number') ? res.val : null;
      const entry = { expr: val, latex: currentLatex || null, result: numResult, time: Date.now() };
      // For rich results (inference, stats), store the rendered HTML and key value
      if (res.type === 'inference' && res.label) {
        entry.richHtml = resultEl.innerHTML;
        // Extract key numeric value (p-value or test stat) for click-to-insert
        const pMatch = res.label.match(/p[- ]?(?:value)?\s*[=≈]\s*([\d.eE\-]+)/i);
        const tMatch = res.label.match(/[tz]\s*[=≈]\s*([\d.\-]+)/i);
        entry.keyValue = pMatch ? pMatch[1] : (tMatch ? tMatch[1] : (numResult != null ? M.fmt(numResult, 8) : null));
      } else if (res.type === 'list-info' && res.label) {
        entry.richHtml = resultEl.innerHTML;
      } else if (res.type === 'assignment' && res._historyHtml) {
        entry.richHtml = res._historyHtml;
      }
      history.unshift(entry);
      if (history.length > 50) history.pop();
      Session.set('calcHistory', history);
      try { document.dispatchEvent(new CustomEvent('calc-history-change')); } catch(e) {}

      // Clear expression bar after successful evaluation
      clearExpr();

    } catch (err) {
      const d = describeError(err);
      showExprError(d.msg, d.hint);
      hideViz(vizEl);
    }
    closeAutocomplete();
  }

  function showAutocomplete(items) {
    const ac = document.getElementById('exprAutocomplete');
    if (!items.length) { closeAutocomplete(); return; }
    acItems = items;
    acIndex = -1;
    ac.innerHTML = '';
    items.forEach((item) => {
      const el = document.createElement('button');
      el.className = 'expr-ac-item';
      el.innerHTML = `<span><span class="expr-ac-name">${item.name}</span><span class="expr-ac-sig">${item.sig}</span></span><span class="expr-ac-cat">${item.cat}</span>`;
      el.onclick = () => acceptCompletion(item);
      ac.appendChild(el);
    });
    ac.classList.add('visible');
  }

  function closeAutocomplete() {
    const ac = document.getElementById('exprAutocomplete');
    if (ac) { ac.classList.remove('visible'); }
    acItems = [];
    acIndex = -1;
  }

  function acceptCompletion(item) {
    const noParen = item.cat === 'List' || item.cat === 'Variable';
    const text = item.name + (noParen ? '' : '(');
    if (useMathQuill && mathField) {
      // In MathQuill, type the completion
      mathField.typedText(text);
    } else {
      const curVal = fallbackInput.value;
      const match = curVal.match(/([A-Za-z]\w*)$/);
      if (match) {
        fallbackInput.value = curVal.slice(0, curVal.length - match[1].length) + text;
      } else {
        fallbackInput.value = curVal + text;
      }
    }
    focusExpr();
    closeAutocomplete();
    updatePlaceholder();
  }

  function updateListPills() {
    const pillsEl = document.getElementById('exprListPills');
    if (!pillsEl) return;
    pillsEl.innerHTML = '';

    // Show stored variables
    const vars = Session.get('exprVars', {});
    Object.entries(vars).forEach(([name, val]) => {
      const pill = document.createElement('button');
      pill.className = 'expr-list-pill expr-var-pill';
      const pretty = ExprEngine.fmtName(name);
      pill.title = `${pretty} = ${val}`;
      pill.innerHTML = `<strong class="pill-name">${pretty}</strong> <span class="pill-eq">=</span> <span class="pill-val">${M.fmt(val, 6)}</span><span class="pill-remove">\u00D7</span>`;
      pill.onclick = (e) => {
        if (e.target.closest('.pill-remove')) {
          e.stopPropagation();
          const v = Session.get('exprVars', {});
          delete v[name];
          Session.set('exprVars', v);
          updateListPills();
          showToast(`${pretty} cleared`);
          return;
        }
        if (e.target.closest('.pill-name')) {
          // Click on name → insert just the variable name into expression bar
          if (useMathQuill && mathField) {
            mathField.typedText(name);
          } else {
            fallbackInput.value += name;
          }
        } else {
          // Click on value or equals → load full assignment for editing
          const assignText = `${name} = ${val}`;
          if (useMathQuill && mathField) {
            mathField.latex('');
            mathField.typedText(assignText);
          } else {
            fallbackInput.value = assignText;
          }
        }
        focusExpr();
        updatePlaceholder();
      };
      pillsEl.appendChild(pill);
    });

    // Show data lists
    const filled = DataLists.getFilledLists();
    filled.forEach(name => {
      const data = M.parse(DataLists.get(name));
      const pretty = ExprEngine.fmtName(name);
      const preview = data.slice(0, 4).join(', ') + (data.length > 4 ? ', \u2026' : '');
      const pill = document.createElement('button');
      pill.className = 'expr-list-pill';
      pill.title = `${pretty} = [${data.join(', ')}]`;
      pill.innerHTML = `<strong class="pill-name">${pretty}</strong> <span class="pill-eq">=</span> <span class="pill-data">[${preview}]</span> <span class="pill-count">(${data.length})</span><span class="pill-remove">\u00D7</span>`;
      pill.onclick = (e) => {
        if (e.target.closest('.pill-remove')) {
          e.stopPropagation();
          DataLists.remove(name);
          updateListPills();
          showToast(`${pretty} cleared`);
          return;
        }
        if (e.target.closest('.pill-name')) {
          // Click on name → insert just the list name
          if (useMathQuill && mathField) {
            mathField.typedText(name);
          } else {
            fallbackInput.value += name;
          }
        } else {
          // Click on data/count → load full assignment for editing
          const assignText = `${name} = [${data.join(', ')}]`;
          if (useMathQuill && mathField) {
            mathField.latex('');
            mathField.typedText(assignText);
          } else {
            fallbackInput.value = assignText;
          }
        }
        focusExpr();
        updatePlaceholder();
      };
      pillsEl.appendChild(pill);
    });
  }

  function highlightAcItem() {
    const ac = document.getElementById('exprAutocomplete');
    const items = ac.querySelectorAll('.expr-ac-item');
    items.forEach((el, i) => el.classList.toggle('selected', i === acIndex));
    if (items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
  }

  submitBtn.onclick = runExpression;

  document.addEventListener('click', (e) => {
    if (!wrapper.contains(e.target)) closeAutocomplete();
  });

  document.addEventListener('liststore-change', updateListPills);
  setTimeout(updateListPills, 100);

  // ─── Expose helpers for dropdowns ───
  window._latexToExpr = latexToExpr;
  window._getExprLatex = getExprLatex;
  window._exprInsert = (text) => {
    if (useMathQuill && mathField) {
      // A root becomes the radical box with the cursor inside it — no paren,
      // which used to be typed INSIDE the radical (\sqrt{(}). The named
      // functions MathLive knows become their commands; anything else (asin,
      // nCr, mean…) is inserted as spelled — \asin is not a command.
      let latex = text;
      latex = latex.replace(/^sqrt\($/, '\\sqrt');
      latex = latex.replace(/^cbrt\($/, '\\sqrt[3]');
      latex = latex.replace(/^(sin|cos|tan|ln|log|exp)\($/, '\\$1(');
      if (latex !== text) {
        mathField.cmd(latex.replace(/\($/, ''));
        if (latex.endsWith('(')) mathField.typedText('(');
      } else {
        mathField.typedText(text);
      }
      mathField.focus();
    } else {
      const inp = fallbackInput;
      const pos = inp.selectionStart || inp.value.length;
      inp.value = inp.value.slice(0, pos) + text + inp.value.slice(pos);
      inp.focus();
      const newPos = pos + text.length;
      inp.setSelectionRange(newPos, newPos);
    }
    updatePlaceholder();
  };

  // Templates — a polar equation, a regression model, `a -> a + 1` — are
  // INSERTED AT THE CURSOR, never set over the bar: a menu click must not be
  // able to wipe what the student typed. The plain→LaTeX conversion is the
  // one the Help gallery and the empty-state chips use (they clear first,
  // because "try it" means try THIS), so a template renders the same from
  // every door. Literal braces must be escaped or MathLive swallows them as
  // group delimiters; `*` becomes \cdot so latexToExpr reads it back.
  function plainToLatex(plain) {
    let latex = plain;
    latex = latex.replace(/\{/g, '\\{').replace(/\}/g, '\\}');
    latex = latex.replace(/<=/g, '\\le ').replace(/>=/g, '\\ge ');
    latex = latex.replace(/\*/g, '\\cdot ');
    latex = latex.replace(/\^(\d+)/g, '^{$1}');
    latex = latex.replace(/\btheta\b/gi, '\\theta ');
    latex = latex.replace(/\bpi\b/g, '\\pi ');
    latex = latex.replace(/\b(sin|cos|tan|asin|acos|atan|ln|log|exp)\(/g, '\\$1(');
    return latex;
  }
  window._plainToLatex = plainToLatex;
  window._exprInsertTemplate = (plain) => {
    if (useMathQuill && mathField) {
      mathField.write(plainToLatex(plain));
      mathField.focus();
    } else {
      const inp = fallbackInput;
      const pos = inp.selectionStart || inp.value.length;
      inp.value = inp.value.slice(0, pos) + plain + inp.value.slice(pos);
      inp.focus();
      const newPos = pos + plain.length;
      inp.setSelectionRange(newPos, newPos);
    }
    updatePlaceholder();
  };

  // ─── Initialize MathQuill after DOM is ready ───
  setTimeout(() => {
    try {
      if (typeof MathQuill !== 'undefined') {
        const MQ = MathQuill.getInterface(2);
        mathField = MQ.MathField(document.getElementById('exprMqField'), {
          spaceBehavesLikeTab: false,
          supSubsRequireOperand: true,
          autoCommands: 'pi theta sqrt alpha sigma mu chi nthroot',
          autoOperatorNames: kalcOperatorNames(),
          handlers: {
            enter: () => runExpression(),
            edit: () => {
              // MathLive fires several input events on the Enter itself, so
              // the error only clears once the bar's content actually changes.
              if (getExprLatex() !== _errorLatex) hideExprError();
              updatePlaceholder();
              const latex = mathField.latex();
              // Auto-insert parenthesis after function names — a MathQuill-era
              // helper. MathLive's smartFence auto-closes parens as students
              // type them, and injecting a bare '(' would corrupt its latex.
              const fnNames = /\\(?:sin|cos|tan|asin|acos|atan|ln|log|exp|abs|floor|ceil|round|cbrt)$/;
              if (!MathQuill.__mathlive && fnNames.test(latex)) {
                setTimeout(() => { mathField.typedText('('); }, 0);
              }
              // Autocomplete trigger
              const expr = latexToExpr(latex);
              const match = expr.match(/([A-Za-z]\w*)$/);
              if (match && match[1].length >= 2) {
                showAutocomplete(ExprEngine.getCompletions(match[1]));
              } else {
                closeAutocomplete();
              }
            }
          }
        });
        useMathQuill = true;
        mqSpan.style.flex = '1';
        mqSpan._mqField = mathField;
        fallbackInput.style.display = 'none';
        // Track focus/blur on MathQuill
        const mqEl = document.getElementById('exprMqField');
        mqEl.addEventListener('focusin', () => { exprFocused = true; updatePlaceholder(); });
        mqEl.addEventListener('focusout', () => { exprFocused = false; updatePlaceholder(); });
        // Click anywhere in the bar to focus MathQuill
        wrapper.addEventListener('mousedown', (e) => {
          if (e.target.closest('button') || e.target.closest('.expr-autocomplete') || e.target.closest('.expr-ref-panel')) return;
          // Small delay to let MathQuill's own click handling run first
          setTimeout(() => mathField.focus(), 0);
        });
        // Handle Escape key on MathQuill
        document.getElementById('exprMqField').addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            const resultEl = document.getElementById('exprResult');
            const vizEl = document.getElementById('exprVizArea');
            if (resultEl) { resultEl.classList.remove('visible'); resultEl.innerHTML = ''; }
            if (vizEl) { hideViz(vizEl); }
            clearExpr();
          }
          if (e.key === 'Tab') {
            const ac = document.getElementById('exprAutocomplete');
            if (ac && ac.classList.contains('visible') && acItems.length) {
              e.preventDefault();
              acceptCompletion(acItems[Math.max(acIndex, 0)]);
            }
          }
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            const ac = document.getElementById('exprAutocomplete');
            if (ac && ac.classList.contains('visible')) {
              e.preventDefault();
              if (e.key === 'ArrowDown') acIndex = Math.min(acIndex + 1, acItems.length - 1);
              else acIndex = Math.max(acIndex - 1, 0);
              highlightAcItem();
            }
          }
        });
        updatePlaceholder();
      } else {
        throw new Error('MathQuill not loaded');
      }
    } catch (err) {
      // Fallback to plain input
      console.log('MathQuill not available, using plain input:', err);
      useMathQuill = false;
      mqSpan.style.display = 'none';
      placeholder.style.display = 'none';
      fallbackInput.style.display = 'block';
      // Wire fallback input events
      fallbackInput.addEventListener('focus', () => { exprFocused = true; updatePlaceholder(); });
      fallbackInput.addEventListener('blur', () => { exprFocused = false; updatePlaceholder(); });
      fallbackInput.addEventListener('input', () => {
        const val = fallbackInput.value;
        const match = val.match(/([A-Za-z]\w*)$/);
        if (match && match[1].length >= 2) {
          showAutocomplete(ExprEngine.getCompletions(match[1]));
        } else {
          closeAutocomplete();
        }
      });
      fallbackInput.addEventListener('keydown', (e) => {
        const ac = document.getElementById('exprAutocomplete');
        const isOpen = ac && ac.classList.contains('visible');
        if (e.key === 'Enter') {
          e.preventDefault();
          if (isOpen && acIndex >= 0 && acItems[acIndex]) acceptCompletion(acItems[acIndex]);
          else runExpression();
          return;
        }
        if (e.key === 'Escape') {
          if (isOpen) { closeAutocomplete(); e.preventDefault(); return; }
          const resultEl = document.getElementById('exprResult');
          const vizEl = document.getElementById('exprVizArea');
          if (resultEl) { resultEl.classList.remove('visible'); resultEl.innerHTML = ''; }
          if (vizEl) { hideViz(vizEl); }
          fallbackInput.value = '';
          e.preventDefault();
          return;
        }
        if (e.key === 'Tab' && isOpen && acItems.length) { e.preventDefault(); acceptCompletion(acItems[Math.max(acIndex, 0)]); return; }
        if (isOpen) {
          if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, acItems.length - 1); highlightAcItem(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightAcItem(); }
        }
      });
    }
  }, 100);

  return wrapper;
}


// ═══ GLOBAL KEYBOARD NAVIGATION ═══
document.addEventListener('keydown', (e) => {
  // Don't capture if user is in an input field. MathLive events retarget to
  // the <math-field> host (MathQuill's hidden textarea used to absorb this).
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.target.closest && e.target.closest('math-field')) return;

  // Escape — no-op at global level
  // T = toggle theme
  if (e.key.toUpperCase() === 'T' && !e.ctrlKey && !e.metaKey && e.target.tagName !== 'INPUT') {
    toggleTheme();
    e.preventDefault();
  }
});
