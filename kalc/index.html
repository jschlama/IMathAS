    attachTypingRules(mf);

    if (handlers.edit) mf.addEventListener('input', () => handlers.edit());
    if (handlers.enter) {
      // Host-level keydown (composed) — deterministic, no double-fire with
      // MathLive's own 'change' semantics (which also commits on blur).
      mf.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); handlers.enter(); }
      });
    }

    const api = {
      latex(v) {
        if (v !== undefined) {
          try { mf.setValue(v, { silenceNotifications: true }); } catch (e) {}
          return api;
        }
        try { return normalizeLatex(mf.getValue('latex')); } catch (e) { return ''; }
      },
      typedText(s) {
        try { mf.insert(String(s), { focus: true, mode: 'math' }); } catch (e) {}
        return api;
      },
      // MathQuill cmd() receives a bare command ('\sqrt', '\sqrt[3]', '\sin').
      cmd(s) {
        try {
          if (/^\\sqrt(\[\d+\])?$/.test(s)) {
            mf.insert(s + '{#?}', { selectionMode: 'placeholder', focus: true });
          } else {
            mf.insert(s + ' ', { focus: true });
          }
        } catch (e) {}
        return api;
      },
      write(s) { return api.typedText(s); },
      focus() { try { mf.focus(); } catch (e) {} return api; },
      blur() { try { mf.blur(); } catch (e) {} return api; },
      __mf: mf,
    };
    return api;
  }

  window.MathQuill = {
    __mathlive: true, // call sites can skip MathQuill-era workarounds
    getInterface() {
      return {
        MathField: (el, config) => makeField(el, config || {}),
        StaticMath(el) {
          const api = {
            latex(v) {
              if (v === undefined) return el._latex || '';
              el._latex = v;
              try {
                el.innerHTML = MathLive.convertLatexToMarkup(v);
              } catch (e) {
                el.textContent = v;
              }
              return api;
            },
          };
          return api;
        },
      };
    },
  };

  // Manual virtual-keyboard toggle for mouse/keyboard users (T4.1); touch
  // users get the keyboard automatically on focus via the 'auto' policy.
  window._kalcToggleKeypad = function () {
    try {
      const kb = window.mathVirtualKeyboard;
      if (!kb) return;
      if (kb.visible) { kb.hide(); return; }
      // The keyboard attaches to the focused mathfield; make sure one has focus.
      const mf = document.querySelector('math-field');
      if (mf && document.activeElement !== mf) mf.focus();
      kb.show({ animate: true });
    } catch (e) {}
  };
})();
// ═══ SESSION PERSISTENCE ═══
const Session = {
  _basePrefix: 'statlab_',
  _prefix: 'statlab_',
  _testMode: false,
  _questionId: null,
  _prefKeys: new Set(['theme', 'angleMode', 'statsMode']), // safe prefs — shared across questions
  _store: (() => { try { return window.localStorage; } catch(e) { return null; } })(),

  init() {
    try {
      const params = new URLSearchParams(window.location.search);
      const qid = params.get('q');
      const isExam = params.get('exam') === '1';
      // Exam mode: use sessionStorage (cleared when browser closes)
      if (isExam) {
        try { this._store = window.sessionStorage; } catch(e) {}
      }
      if (qid) {
        this._testMode = true;
        this._questionId = qid.replace(/[^a-zA-Z0-9_-]/g, '');
        if (this._store) {
          const currentQPrefix = this._basePrefix + 'q_' + this._questionId + '_';
          Object.keys(this._store)
            .filter(k => k.startsWith(this._basePrefix + 'q_') && !k.startsWith(currentQPrefix))
            .forEach(k => this._store.removeItem(k));
        }
      }
    } catch(e) {}
  },

  // Get the correct prefix for a key — prefs stay global, data is question-scoped in test mode
  _keyFor(key) {
    if (this._testMode && !this._prefKeys.has(key)) {
      return this._basePrefix + 'q_' + this._questionId + '_' + key;
    }
    return this._basePrefix + key;
  },

  set(key, val) { try { if (this._store) this._store.setItem(this._keyFor(key), JSON.stringify(val)); } catch(e) {} },
  get(key, fallback = null) {
    try { if (!this._store) return fallback; const v = this._store.getItem(this._keyFor(key)); return v !== null ? JSON.parse(v) : fallback; } catch(e) { return fallback; }
  },
  remove(key) { try { if (this._store) this._store.removeItem(this._keyFor(key)); } catch(e) {} },
  clear() {
    try {
      if (this._store) {
        // In test mode, only clear current question's data (not prefs)
        if (this._testMode) {
          const qPrefix = this._basePrefix + 'q_' + this._questionId + '_';
          Object.keys(this._store).filter(k => k.startsWith(qPrefix)).forEach(k => this._store.removeItem(k));
        } else {
          Object.keys(this._store).filter(k => k.startsWith(this._basePrefix)).forEach(k => this._store.removeItem(k));
        }
      }
    } catch(e) {}
  },
  isTestMode() { return this._testMode; },
  getQuestionId() { return this._questionId; }
};
Session.init();

// ═══ EXACT VALUE DETECTION ═══
const ExactValues = {
  // Known exact trig values and their representations
  knownValues: [
    // Fractions
    { dec: 0.5, display: '1/2' },
    { dec: 0.25, display: '1/4' },
    { dec: 0.75, display: '3/4' },
    { dec: 1/3, display: '1/3' },
    { dec: 2/3, display: '2/3' },
    { dec: 1/6, display: '1/6' },
    { dec: 5/6, display: '5/6' },
    { dec: 1/8, display: '1/8' },
    { dec: 3/8, display: '3/8' },
    { dec: 5/8, display: '5/8' },
    { dec: 7/8, display: '7/8' },
    // Square roots
    { dec: Math.sqrt(2), display: '\u221A2' },
    { dec: Math.sqrt(3), display: '\u221A3' },
    { dec: Math.sqrt(5), display: '\u221A5' },
    { dec: Math.sqrt(2)/2, display: '\u221A2/2' },
    { dec: Math.sqrt(3)/2, display: '\u221A3/2' },
    { dec: Math.sqrt(3)/3, display: '\u221A3/3' },
    { dec: (1+Math.sqrt(5))/2, display: '(1+\u221A5)/2', label: '\u03C6 golden ratio' },
    // Negatives of all the above are handled by checking sign
  ],

  // Check if a number is a recognizable fraction (using continued fraction algorithm)
  toFraction(dec, maxDenom) {
    maxDenom = maxDenom || 1000;
    if (Number.isInteger(dec)) return null;
    const sign = dec < 0 ? -1 : 1;
    const abs = Math.abs(dec);
    
    // Continued fraction algorithm — much more accurate than brute force
    let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
    let x = abs;
    for (let i = 0; i < 30; i++) {
      const a = Math.floor(x);
      const h = a * h1 + h2;
      const k = a * k1 + k2;
      if (k > maxDenom) break;
      h2 = h1; h1 = h;
      k2 = k1; k1 = k;
      const rem = x - a;
      if (Math.abs(rem) < 1e-12) break;
      x = 1 / rem;
    }
    
    const num = sign * h1;
    const den = k1;
    if (den <= 1 || den > maxDenom) return null;
    if (Math.abs(abs - h1/k1) > 1e-9) return null;
    
    // Simplify via GCD
    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
    const g = gcd(Math.abs(h1), k1);
    const sNum = num / g * sign * sign; // keep original sign
    const sDen = den / g;
    if (sDen === 1) return null;
    if (sDen > maxDenom) return null;
    return { num: sign * Math.abs(sNum), den: sDen, display: `${sign * Math.abs(sNum)}/${sDen}` };
  },

  // Check if a number is a multiple of pi
  toPiMultiple(dec) {
    const ratio = dec / Math.PI;
    const frac = this.toFraction(ratio, 24);
    if (frac) {
      if (frac.num === 1 && frac.den === 1) return '\u03C0';
      if (frac.num === -1 && frac.den === 1) return '-\u03C0';
      if (frac.den === 1) return `${frac.num}\u03C0`;
      if (frac.num === 1) return `\u03C0/${frac.den}`;
      if (frac.num === -1) return `-\u03C0/${frac.den}`;
      return `${frac.num}\u03C0/${frac.den}`;
    }
    // Check simple integer multiples
    if (Math.abs(ratio - Math.round(ratio)) < 1e-10 && Math.round(ratio) !== 0) {
      const n = Math.round(ratio);
      if (n === 1) return '\u03C0';
      if (n === -1) return '-\u03C0';
      return `${n}\u03C0`;
    }
    return null;
  },

  // Find exact representation for a decimal
  findExact(dec) {
    if (!isFinite(dec) || Number.isInteger(dec)) return null;
    const results = [];
    const sign = dec < 0 ? -1 : 1;
    const abs = Math.abs(dec);

    // Check known exact values
    for (const kv of this.knownValues) {
      if (Math.abs(abs - kv.dec) < 1e-10) {
        results.push({ display: sign < 0 ? '-' + kv.display : kv.display, label: kv.label || '' });
      }
    }

    // Check pi multiples
    const piForm = this.toPiMultiple(dec);
    if (piForm) results.push({ display: piForm, label: '' });

    // Check simple fraction
    const frac = this.toFraction(dec, 100);
    if (frac && !results.find(r => r.display === frac.display)) {
      results.push({ display: frac.display, label: '' });
    }

    return results.length > 0 ? results : null;
  }
};


// ═══ DATA LISTS (L1–L6) ═══
const DataLists = {
  lists: Session.get('dataLists', {}), // { L1: "1 2 3", L2: "4 5 6", ... }
  activeList: Session.get('activeList', 'L1'),

  save(name, raw) {
    this.lists[name] = raw;
    Session.set('dataLists', this.lists);
    this.updateAllUI();
    try { document.dispatchEvent(new CustomEvent('liststore-change')); } catch(e) {}
  },

  get(name) { return this.lists[name] || ''; },

  remove(name) {
    delete this.lists[name];
    Session.set('dataLists', this.lists);
    this.updateAllUI();
    try { document.dispatchEvent(new CustomEvent('liststore-change')); } catch(e) {}
  },

  has(name) { return name in this.lists && this.lists[name].trim().length > 0; },

  count(name) {
    if (!this.has(name)) return 0;
    return M.parse(this.lists[name]).length;
  },

  setActive(name) {
    this.activeList = name;
    Session.set('activeList', name);
    this.updateAllUI();
  },

  getFilledLists() {
    return Object.keys(this.lists).filter(k => this.lists[k] && this.lists[k].trim().length > 0);
  },

  // Load a list into a textarea
  loadInto(name, textareaId) {
    const el = document.getElementById(textareaId);
    if (!el || !this.has(name)) return;
    el.value = this.lists[name];
    el.classList.remove('invalid');
    this.updateDataCount(textareaId);
    showToast(`Loaded ${name} (${this.count(name)} values)`);
  },

  // Save from a textarea into a list
  saveFrom(name, textareaId) {
    const el = document.getElementById(textareaId);
    if (!el) return;
    const raw = el.value.trim();
    if (!raw) { showToast('No data to save'); return; }
    this.save(name, raw);
    showToast(`Saved to ${name} (${this.count(name)} values)`);
  },

  // Build the list strip UI component
  buildStrip(textareaId, onSelect) {
    const strip = document.createElement('div');
    strip.className = 'list-strip';
    strip.dataset.for = textareaId;

    const label = document.createElement('span');
    label.className = 'list-label';
    label.textContent = 'Lists';
    strip.appendChild(label);

    for (let i = 1; i <= 6; i++) {
      const name = 'L' + i;
      const btn = document.createElement('button');
      btn.className = 'list-btn';
      btn.dataset.list = name;
      btn.id = `listBtn_${textareaId}_${name}`;
      btn.innerHTML = `${name}<span class="list-count"></span>`;
      btn.onclick = () => {
        if (this.has(name)) {
          this.loadInto(name, textareaId);
          if (onSelect) onSelect(name);
        } else {
          showToast(`${name} is empty`);
        }
      };
      strip.appendChild(btn);
    }

    // Save button
    const saveBtn = document.createElement('button');
    saveBtn.className = 'list-action-btn';
    saveBtn.textContent = 'Save →';
    saveBtn.title = 'Save current data to the active list';
    saveBtn.onclick = () => {
      this.saveFrom(this.activeList, textareaId);
    };
    strip.appendChild(saveBtn);

    // Clear button
    const clearBtn = document.createElement('button');
    clearBtn.className = 'list-action-btn danger';
    clearBtn.textContent = 'Clear';
    clearBtn.title = 'Clear the active list';
    clearBtn.onclick = () => {
      this.remove(this.activeList);
      showToast(`${this.activeList} cleared`);
    };
    strip.appendChild(clearBtn);

    return strip;
  },

  // Update the data count badge near a textarea
  updateDataCount(textareaId) {
    const badge = document.getElementById(`dataCount_${textareaId}`);
    if (!badge) return;
    const el = document.getElementById(textareaId);
    if (!el) return;
    const raw = el.value.trim();
    if (!raw) { badge.classList.remove('visible'); badge.textContent = ''; return; }
    const count = M.parse(raw).length;
    badge.textContent = `${count} value${count !== 1 ? 's' : ''} detected`;
    badge.classList.add('visible');
  },

  // Build a data count badge
  buildCountBadge(textareaId) {
    const badge = document.createElement('div');
    badge.className = 'data-count-badge';
    badge.id = `dataCount_${textareaId}`;
    return badge;
  },

  // Update all list strip UIs in the DOM
  updateAllUI() {
    document.querySelectorAll('.list-strip').forEach(strip => {
      const textareaId = strip.dataset.for;
      for (let i = 1; i <= 6; i++) {
        const name = 'L' + i;
        const btn = document.getElementById(`listBtn_${textareaId}_${name}`);
        if (!btn) continue;
        btn.classList.toggle('has-data', this.has(name));
        btn.classList.toggle('active', name === this.activeList);
        const tip = btn.querySelector('.list-count');
        if (tip) {
          tip.textContent = this.has(name) ? `${this.count(name)} values` : 'empty';
        }
      }
    });
  },

  _uiCallbacks: [],
  onUpdate(fn) { this._uiCallbacks.push(fn); }
};

// EXPRESSION ENGINE — Phase 1
// Regex-based function dispatch for descriptive stats + list assignment
// ═══════════════════════════════════════════════════════════════
const ExprEngine = {
  // ─── Pretty name formatting for variables and lists ───
  fmtName(name) {
    const n = name.toUpperCase();
    // List names: L1 → L₁, L2 → L₂, etc.
    const listMatch = n.match(/^L(\d)$/);
    if (listMatch) return 'L' + '\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089'[parseInt(listMatch[1])];
    // Greek letters
    const greek = { MU:'\u03BC', SIGMA:'\u03C3', ALPHA:'\u03B1', BETA:'\u03B2', CHI:'\u03C7',
      LAMBDA:'\u03BB', THETA:'\u03B8', DELTA:'\u03B4', GAMMA:'\u03B3', EPSILON:'\u03B5',
      TAU:'\u03C4', OMEGA:'\u03C9', PHI:'\u03C6', PSI:'\u03C8', RHO:'\u03C1' };
    if (greek[n]) return greek[n];
    // Common stat names
    const statNames = { XBAR:'x\u0304', YBAR:'y\u0304', PHAT:'p\u0302', NHAT:'n\u0302' };
    if (statNames[n]) return statNames[n];
    // Single letter: keep lowercase italic-style
    if (n.length === 1) return n.toLowerCase();
    // Multi-letter: return as-is but lowercase
    return name.toLowerCase();
  },

  // ─── Function Registry ───
  // Each entry: { sig: display signature, cat: category, desc: short description, fn: resolver }
  registry: {
    mean:      { sig: '(list)', cat: 'Statistic', desc: 'Arithmetic mean', fn: d => ({ val: M.mean(d), label: 'x\u0304' }) },
    median:    { sig: '(list)', cat: 'Statistic', desc: 'Median', fn: d => ({ val: M.median(d), label: 'Med' }) },
    stdev:     { sig: '(list)', cat: 'Statistic', desc: 'Sample std dev (s)', fn: d => {
      if (d.length < 2) throw { msg: 'Need at least 2 values for sample standard deviation.', hint: 'stdev requires n \u2265 2' };
      return { val: M.sd(d), label: 'Sx' };
    }},
    stdevp:    { sig: '(list)', cat: 'Statistic', desc: 'Population std dev (\u03C3)', fn: d => ({ val: M.psd(d), label: '\u03C3x' }) },
    'var':     { sig: '(list)', cat: 'Statistic', desc: 'Sample variance (s\u00B2)', fn: d => {
      if (d.length < 2) throw { msg: 'Need at least 2 values for sample variance.', hint: 'var requires n \u2265 2' };
      return { val: M.sVar(d), label: 's\u00B2' };
    }},
    varp:      { sig: '(list)', cat: 'Statistic', desc: 'Population variance (\u03C3\u00B2)', fn: d => ({ val: M.pVar(d), label: '\u03C3\u00B2' }) },
    total:     { sig: '(list)', cat: 'Statistic', desc: 'Sum of values', fn: d => ({ val: M.sum(d), label: '\u03A3x' }) },
    length:    { sig: '(list)', cat: 'Statistic', desc: 'Count of values', fn: d => ({ val: d.length, label: 'n' }) },
    min:       { sig: '(list)', cat: 'Statistic', desc: 'Minimum', fn: d => ({ val: Math.min(...d), label: 'Min' }) },
    max:       { sig: '(list)', cat: 'Statistic', desc: 'Maximum', fn: d => ({ val: Math.max(...d), label: 'Max' }) },
    q1:        { sig: '(list)', cat: 'Statistic', desc: 'First quartile', fn: d => {
      if (d.length < 2) throw { msg: 'Need at least 2 values for quartiles.', hint: 'Try adding more data points' };
      return { val: M.q1q3(d).q1, label: 'Q1' };
    }},
    q3:        { sig: '(list)', cat: 'Statistic', desc: 'Third quartile', fn: d => {
      if (d.length < 2) throw { msg: 'Need at least 2 values for quartiles.', hint: 'Try adding more data points' };
      return { val: M.q1q3(d).q3, label: 'Q3' };
    }},
    iqr:       { sig: '(list)', cat: 'Statistic', desc: 'Interquartile range', fn: d => {
      if (d.length < 2) throw { msg: 'Need at least 2 values for IQR.', hint: 'IQR = Q3 \u2212 Q1' };
      const { q1, q3 } = M.q1q3(d);
      return { val: q3 - q1, label: 'IQR' };
    }},
    range:     { sig: '(list)', cat: 'Statistic', desc: 'Range (max \u2212 min)', fn: d => ({ val: Math.max(...d) - Math.min(...d), label: 'Range' }) },
    mad:       { sig: '(list)', cat: 'Statistic', desc: 'Mean absolute deviation', fn: d => {
      const m = M.mean(d);
      return { val: M.mean(d.map(v => Math.abs(v - m))), label: 'MAD' };
    }},
    quantile:  { sig: '(list, p)', cat: 'Statistic', desc: 'p-th quantile (0 \u2264 p \u2264 1)', fn: null, listNumFn: (d, a) => {
      if (a.length !== 1 || !(a[0] >= 0 && a[0] <= 1)) throw { msg: 'quantile(list, p) needs p between 0 and 1.', hint: 'Example: quantile(L1, 0.9)' };
      return { val: M.quantile(d, a[0]), label: `Q(${a[0]})` };
    }},
    quartile:  { sig: '(list, q)', cat: 'Statistic', desc: 'Quartile q = 0\u20134', fn: null, listNumFn: (d, a) => {
      if (a.length !== 1 || !(a[0] >= 0 && a[0] <= 4)) throw { msg: 'quartile(list, q) needs q between 0 and 4.', hint: 'Example: quartile(L1, 3)' };
      return { val: M.quantile(d, a[0] / 4), label: `Q${a[0]}` };
    }},
    cov:       { sig: '(X, Y)', cat: 'Statistic', desc: 'Sample covariance', fn: null, inferenceFn: true },
    covp:      { sig: '(X, Y)', cat: 'Statistic', desc: 'Population covariance', fn: null, inferenceFn: true },
    spearman:  { sig: '(X, Y)', cat: 'Statistic', desc: 'Spearman rank correlation', fn: null, inferenceFn: true },
    // Combinatorics (take 2 numeric args, not a list)
    ncr:       { sig: '(n, r)', cat: 'Combinatorics', desc: 'Combinations', fn: null, numeric: true,
      numFn: args => {
        if (args.length !== 2) throw { msg: 'nCr requires exactly 2 arguments: nCr(n, r)', hint: 'Example: nCr(10, 3)' };
        return { val: M.nCr(args[0], args[1]), label: 'nCr' };
      }
    },
    npr:       { sig: '(n, r)', cat: 'Combinatorics', desc: 'Permutations', fn: null, numeric: true,
      numFn: args => {
        if (args.length !== 2) throw { msg: 'nPr requires exactly 2 arguments: nPr(n, r)', hint: 'Example: nPr(10, 3)' };
        return { val: M.nPr(args[0], args[1]), label: 'nPr' };
      }
    },
    factorial: { sig: '(n)', cat: 'Combinatorics', desc: 'n!', fn: null, numeric: true,
      numFn: args => {
        if (args.length !== 1) throw { msg: 'factorial requires exactly 1 argument: factorial(n)', hint: 'Example: factorial(5)' };
        const n = args[0];
        if (Number.isInteger(n)) {
          if (n < 0) throw { msg: 'factorial is undefined for a negative integer.', hint: 'Example: factorial(5) = 120' };
          return { val: M.fact(n), label: 'n!' };
        }
        // A non-integer extends through the gamma function, n! = Γ(n + 1),
        // as on a TI-84 and Desmos; the poles at negative integers are
        // refused above and anything below −1 is not worth a surprise.
        if (n < -1) throw { msg: 'factorial(n) needs n ≥ −1 (or a non-negative integer).', hint: 'Non-integers use n! = Γ(n + 1); example: 0.5! ≈ 0.8862' };
        return { val: Math.exp(M.lnGamma(n + 1)), label: 'n! = Γ(n+1)' };
      }
    },
    // Visualization functions (return viz, not a number)
    histogram: { sig: '(list)', cat: 'Visualization', desc: 'Frequency histogram', fn: null, vizFn: (d, args) => {
      const bins = (args && args.length > 0) ? args[0] : Math.min(Math.ceil(Math.sqrt(d.length)), 15);
      // Add to graph canvas
      const dataMin = Math.min(...d), dataMax = Math.max(...d);
      const binW = (dataMax - dataMin) / bins || 1;
      const counts = new Array(bins).fill(0);
      d.forEach(v => { let b = Math.floor((v - dataMin) / binW); if (b >= bins) b = bins - 1; counts[b]++; });
      const maxCount = Math.max(...counts);
      if (typeof Graph !== 'undefined') {
        const id = Graph.nextId++;
        const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
        Graph.expressions.push({
          id, expr: `histogram (${d.length} values)`, rawExpr: '',
          latex: '\\text{histogram}', fn: null,
          color, visible: true, lineWidth: 0, dash: [],
          plainLabel: true,
          histData: { dataMin, binW, counts, bins }
        });
        Graph.xMin = dataMin - binW; Graph.xMax = dataMax + binW;
        Graph.yMin = -maxCount * 0.1; Graph.yMax = maxCount * 1.2;
        Graph.panel.classList.add('visible');
        Graph.updateRows(); Graph.render();
      }
      return { val: null, label: `${bins} bins, range [${M.fmt(dataMin,2)}, ${M.fmt(dataMax,2)}]`, viz: V.histogram(d, bins) };
    }},
    dotplot:   { sig: '(list)', cat: 'Visualization', desc: 'Dot plot', fn: null, vizFn: (d) => {
      const sorted = [...d].sort((a, b) => a - b);
      const groups = new Map();
      sorted.forEach(v => { const k = Math.round(v * 1e9) / 1e9; groups.set(k, (groups.get(k) || 0) + 1); });
      const maxStack = Math.max(...groups.values());
      if (typeof Graph !== 'undefined') {
        const id = Graph.nextId++;
        const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
        Graph.expressions.push({
          id, expr: `dotplot (${d.length} values)`, rawExpr: '',
          latex: '\\text{dotplot}', fn: null,
          color, visible: true, lineWidth: 0, dash: [],
          plainLabel: true,
          dotData: { values: sorted }

        const min = sorted[0], max = sorted[sorted.length - 1];
        const pad = (max - min) * 0.15 || 1;

        Graph.panel.classList.add('visible');

    boxplot:   { sig: '(list)', cat: 'Visualization', desc: 'Box-and-whisker plot', fn: null, vizFn: (d) => {

      const whiskerLo = sorted.find(v => v >= q1 - 1.5*iqr) || min;

  aliases: {
    'average': 'mean', 'avg': 'mean', 'sd': 'stdev', 'stddev': 'stdev',

    'variance': 'var', 'variancep': 'varp', 'sdp': 'stdevp',

    'squareroot': 'sqrt', 'cuberoot': 'cbrt', 'absolute': 'abs',
