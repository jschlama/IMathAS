          const r = Math.round(v * 1e10) / 1e10;
          if (Math.abs(r / step - Math.round(r / step)) > 1e-6) vals.push(r);
        }
        return { vals, alpha };
      };
      _gridLines(xTicks, true, 1);
      _gridLines(yTicks, false, 1);
      if (!xStep) { const m = _minorGrid(this.xMin, this.xMax, Math.floor(w / 80), xTicks); if (m) _gridLines(m.vals, true, m.alpha); }
      if (!yStep) { const m = _minorGrid(this.yMin, this.yMax, Math.floor(h / 60), yTicks); if (m) _gridLines(m.vals, false, m.alpha); }
      ctx.globalAlpha = 0.5;
    }
    }
    ctx.globalAlpha = 1;

    // Axes
    ctx.strokeStyle = txColor;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.3;
    if (this.yMin <= 0 && this.yMax >= 0) {
      const y0 = toScreenY(0);
      ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke();
    }
    if (this.xMin <= 0 && this.xMax >= 0) {
      const x0 = toScreenX(0);
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, h); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Tick labels
    ctx.fillStyle = tx3Color;
    ctx.font = '10px ' + (styles.getPropertyValue('--mono').trim() || 'monospace');
    ctx.textAlign = 'center';
    xTicks.forEach(v => {
      if (Math.abs(v) < 1e-10) return;
      const xParsed = xStep ? parsePiTick(v, xStep) : { text: Graph.fmtTick(v) };
      drawTickLabel(ctx, xParsed, toScreenX(v), Math.min(Math.max(toScreenY(0) + 14, 14), h - 4), 'center');
    });
    ctx.textAlign = 'right';
    yTicks.forEach(v => {
      if (Math.abs(v) < 1e-10) return;
      const yParsed = yStep ? parsePiTick(v, yStep) : { text: Graph.fmtTick(v) };
      drawTickLabel(ctx, yParsed, Math.min(Math.max(toScreenX(0) - 6, 28), w - 4), toScreenY(v) + 3, 'right');
    });
    // Origin label
    if (this.xMin < 0 && this.xMax > 0 && this.yMin < 0 && this.yMax > 0) {
      ctx.textAlign = 'right';
      ctx.fillText('0', toScreenX(0) - 6, toScreenY(0) + 14);
    }

    // Background images — above the grid, below the curves (so you can trace).
    if (this._images && this._images.length) {
      const panFrozen = !!(window._kalcFrozen && window._kalcFrozen.pan);
      this._images.forEach(im => {
        if (!im.img || !im.img.complete || !im.img.width || im.w == null || im.h == null) return;
        const sx = toScreenX(im.x - im.w / 2);
        const sy = toScreenY(im.y + im.h / 2);
        const sw = im.w / (this.xMax - this.xMin) * w;
        const sh = im.h / (this.yMax - this.yMin) * h;
        ctx.save();
        ctx.globalAlpha = im.opacity == null ? 1 : im.opacity;
        try { ctx.drawImage(im.img, sx, sy, sw, sh); } catch (e) {}
        ctx.restore();
        // Selection chrome (only when images are movable — not in frozen views)
        if (im._selected && !panFrozen) {
          ctx.save();
          ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
          ctx.strokeRect(sx, sy, sw, sh);
          ctx.setLineDash([]);
          // resize handle (bottom-right)
          ctx.fillStyle = '#3b82f6';
          ctx.fillRect(sx + sw - 10, sy + sh - 10, 10, 10);
          // delete handle (top-right)
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(sx + sw - 10, sy, 10, 10);
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(sx + sw - 8, sy + 2); ctx.lineTo(sx + sw - 2, sy + 8);
          ctx.moveTo(sx + sw - 2, sy + 2); ctx.lineTo(sx + sw - 8, sy + 8);
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    // Per-render state for curve fade-in (T2.4): disabled in display/exam
    // embeds and under prefers-reduced-motion; first render never fades.
    const _nowMs = performance.now();
    const _fadeEnabled = !this._reducedMotion() &&
      !document.querySelector('.app.display-only') &&
      !(typeof Session !== 'undefined' && Session.isTestMode && Session.isTestMode());

    // Plot each expression
    this.expressions.forEach(expr => {
      if (!expr.visible) return;
      if (expr.action) return; // action entries are list-only, never drawn

      // Compound-inequality band: a < x < b (vertical strip) / a < y < b
      // (horizontal band). Fill is clamped so panning past one boundary
      // keeps the region shaded; each boundary dashes when its bound is strict.
      if (expr.bandX || expr.bandY) {
        const isX = !!expr.bandX;
        const lim = isX ? w : h;
        const toS = isX ? toScreenX : toScreenY;
        const sLo = toS((isX ? expr.bandX : expr.bandY)[0]);
        const sHi = toS((isX ? expr.bandX : expr.bandY)[1]);
        const a = Math.max(0, Math.min(Math.min(sLo, sHi), lim));
        const b = Math.max(0, Math.min(Math.max(sLo, sHi), lim));
        ctx.save();
        ctx.fillStyle = expr.color;
        ctx.globalAlpha = 0.16;
        if (isX) ctx.fillRect(a, 0, b - a, h);
        else ctx.fillRect(0, a, w, b - a);
        ctx.restore();
        const drawBound = (s, strict) => {
          if (s < -10 || s > lim + 10) return;
          ctx.strokeStyle = expr.color;
          ctx.lineWidth = expr.lineWidth || 2.5;
          ctx.lineCap = 'round';
          ctx.setLineDash(strict ? [6, 4] : (expr.dash || []));
          ctx.beginPath();
          if (isX) { ctx.moveTo(s, 0); ctx.lineTo(s, h); }
          else { ctx.moveTo(0, s); ctx.lineTo(w, s); }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineCap = 'butt';
        };
        drawBound(sLo, expr._loStrict);
        drawBound(sHi, expr._hiStrict);
        return;
      }

      // Vertical line x = c
      if (expr.vlineX != null) {
        const sx = toScreenX(expr.vlineX);
        // x-inequality half-plane shading (x < c → left of the boundary,
        // x > c → right). Fills even when the boundary itself is off-screen
        // (clamped edge), so panning away from x = c keeps the region shaded.
        if (expr._fillSide) {
          const bx = Math.max(0, Math.min(sx, w));
          ctx.save();
          ctx.fillStyle = expr.color;
          ctx.globalAlpha = 0.16;
          if (expr._fillSide === 'left') ctx.fillRect(0, 0, bx, h);
          else ctx.fillRect(bx, 0, w - bx, h);
          ctx.restore();
        }
        if (sx >= -10 && sx <= w + 10) {
          ctx.strokeStyle = expr.color;
          ctx.lineWidth = expr.lineWidth || 2.5;
          ctx.lineCap = 'round';
          // Strict boundary (x < c, x > c) is dashed — same Desmos convention
          // as the y-form inequality curves.
          ctx.setLineDash((expr._fillSide && expr._fillStrict) ? [6, 4] : (expr.dash || []));
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx, h);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineCap = 'butt';
        }
        return;
      }

      // Dynamic point data (from point tuples with sliders)
      if (expr.pointData && expr.getPoints) {
        const points = expr.getPoints();
        ctx.fillStyle = expr.color;
        points.forEach(pt => {
          if (!isFinite(pt.x) || !isFinite(pt.y)) return;
          const sx = toScreenX(pt.x), sy = toScreenY(pt.y);
          if (sx >= -10 && sx <= w + 10 && sy >= -10 && sy <= h + 10) {
            ctx.beginPath();
            ctx.arc(sx, sy, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = bgColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // Draw coordinate label
            ctx.fillStyle = expr.color;
            ctx.font = '10px ' + (styles.getPropertyValue('--mono').trim() || 'monospace');
            ctx.textAlign = 'left';
            ctx.fillText(`(${Graph.fmtPi(pt.x, 3)}, ${Graph.fmtPi(pt.y, 3)})`, sx + 8, sy - 6);
          }
        });
        return;
      }

      // Riemann sum rectangles on canvas
      if (expr.riemannData) {
        const { a, b, n, type, fn } = expr.riemannData;
        const dx = (b - a) / n;
        const y0 = toScreenY(0);
        for (let i = 0; i < n; i++) {
          const xl = a + i * dx;
          const xr = xl + dx;
          const xs = type === 'right' ? xr : (type === 'mid' ? (xl + xr) / 2 : xl);
          let hy;
          try { hy = fn(xs); } catch (e) { continue; }
          if (!isFinite(hy)) continue;
          const sx1 = toScreenX(xl), sx2 = toScreenX(xr);
          const syTop = toScreenY(hy);
          const rx = Math.min(sx1, sx2), rw = Math.abs(sx2 - sx1);
          const ry = Math.min(syTop, y0), rh = Math.abs(y0 - syTop);
          ctx.fillStyle = expr.color;
          ctx.globalAlpha = 0.18;
          ctx.fillRect(rx, ry, rw, rh);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = expr.color;
          ctx.lineWidth = 1;
          ctx.strokeRect(rx, ry, rw, rh);
        }
        return;
      }

      // Area-under-curve shading on canvas
      if (expr.areaData) {
        const { a, b, fn } = expr.areaData;
        const y0 = toScreenY(0);
        const lo = Math.min(a, b), hi = Math.max(a, b);
        const px0 = Math.max(0, Math.min(w, Math.round(toScreenX(lo))));
        const px1 = Math.max(0, Math.min(w, Math.round(toScreenX(hi))));
        const safe = (xv) => { try { const y = fn(xv); return isFinite(y) ? y : null; } catch (e) { return null; } };
        // Filled region between the curve and the x-axis.
        ctx.save();
        ctx.fillStyle = expr.color; ctx.globalAlpha = 0.18;
        ctx.beginPath();
        let started = false, lastPx = px0;
        for (let px = px0; px <= px1; px++) {
          const y = safe(fromScreenX(px));
          if (y === null) continue;
          const sy = toScreenY(y);
          if (!started) { ctx.moveTo(px, y0); ctx.lineTo(px, sy); started = true; }
          else ctx.lineTo(px, sy);
          lastPx = px;
        }
        if (started) { ctx.lineTo(lastPx, y0); ctx.closePath(); ctx.fill(); }
        ctx.globalAlpha = 1;
        // Curve outline along the top of the shaded band.
        ctx.beginPath(); started = false;
        for (let px = px0; px <= px1; px++) {
          const y = safe(fromScreenX(px));
          if (y === null) { started = false; continue; }
          const sy = toScreenY(y);
          if (!started) { ctx.moveTo(px, sy); started = true; } else ctx.lineTo(px, sy);
        }
        ctx.strokeStyle = expr.color; ctx.lineWidth = 2; ctx.stroke();
        // Boundary verticals at a and b.
        ctx.lineWidth = 1.5;
        [[lo, px0], [hi, px1]].forEach(([xv, px]) => {
          const y = safe(xv); if (y === null) return;
          ctx.beginPath(); ctx.moveTo(px, y0); ctx.lineTo(px, toScreenY(y)); ctx.stroke();
        });
        ctx.restore();
        return;
      }

      // Histogram on canvas
      if (expr.histData) {
        const { dataMin, binW, counts, bins } = expr.histData;
        ctx.fillStyle = expr.color;
        ctx.globalAlpha = 0.5;
        for (let i = 0; i < bins; i++) {
          const x1 = toScreenX(dataMin + i * binW);
          const x2 = toScreenX(dataMin + (i + 1) * binW);
          const y0 = toScreenY(0);
          const yTop = toScreenY(counts[i]);
          ctx.fillRect(x1, yTop, x2 - x1, y0 - yTop);
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = 1;
        for (let i = 0; i < bins; i++) {
          const x1 = toScreenX(dataMin + i * binW);
          const x2 = toScreenX(dataMin + (i + 1) * binW);
          const y0 = toScreenY(0);
          const yTop = toScreenY(counts[i]);
          ctx.strokeRect(x1, yTop, x2 - x1, y0 - yTop);
        }
        return;
      }

      // Dot plot on canvas — stacked circles per distinct value, the i-th
      // dot of a stack centered at data height i + 0.5.
      if (expr.dotData) {
        const groups = new Map();
        expr.dotData.values.forEach(v => {
          const k = Math.round(v * 1e9) / 1e9;
          groups.set(k, (groups.get(k) || 0) + 1);
        });
        ctx.fillStyle = expr.color;
        const rPx = Math.max(3, Math.min(9, Math.abs(toScreenY(0) - toScreenY(1)) * 0.42));
        groups.forEach((n, v) => {
          const sx = toScreenX(v);
          if (sx < -20 || sx > w + 20) return;
          for (let i = 0; i < n; i++) {
            const sy = toScreenY(i + 0.5);
            if (sy < -20 || sy > h + 20) continue;
            ctx.beginPath();
            ctx.arc(sx, sy, rPx, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        return;
      }

      // Boxplot on canvas (horizontal, centered at y=1)
      if (expr.boxData) {
        const { min, max, med, q1, q3, whiskerLo, whiskerHi, outliers } = expr.boxData;
        const yCenter = toScreenY(1);
        const boxH = 40;
        const yTop = yCenter - boxH / 2, yBot = yCenter + boxH / 2;
        // Whisker lines
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toScreenX(whiskerLo), yCenter); ctx.lineTo(toScreenX(q1), yCenter);
        ctx.moveTo(toScreenX(q3), yCenter); ctx.lineTo(toScreenX(whiskerHi), yCenter);
        ctx.stroke();
        // Whisker caps
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toScreenX(whiskerLo), yTop + 8); ctx.lineTo(toScreenX(whiskerLo), yBot - 8);
        ctx.moveTo(toScreenX(whiskerHi), yTop + 8); ctx.lineTo(toScreenX(whiskerHi), yBot - 8);
        ctx.stroke();
        // Box
        ctx.fillStyle = expr.color;
        ctx.globalAlpha = 0.15;
        const bx1 = toScreenX(q1), bx2 = toScreenX(q3);
        ctx.fillRect(bx1, yTop, bx2 - bx1, boxH);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx1, yTop, bx2 - bx1, boxH);
        // Median line
        ctx.strokeStyle = bgColor;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(toScreenX(med), yTop); ctx.lineTo(toScreenX(med), yBot); ctx.stroke();
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(toScreenX(med), yTop); ctx.lineTo(toScreenX(med), yBot); ctx.stroke();
        // Outliers
        outliers.forEach(v => {
          ctx.beginPath();
          ctx.arc(toScreenX(v), yCenter, 4, 0, Math.PI * 2);
          ctx.fillStyle = expr.color;
          ctx.fill();
          ctx.strokeStyle = bgColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
        return;
      }

      // Scatter data points (from regression)
      if (expr.scatterData) {
        const { xs, ys } = expr.scatterData;
        // For residual plots, draw a zero reference line and stem lines
        if (expr.isResidual) {
          const y0 = toScreenY(0);
          ctx.strokeStyle = expr.color;
          ctx.globalAlpha = 0.3;
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 3]);
          ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.5;
          xs.forEach((x, i) => {
            const sx = toScreenX(x), sy = toScreenY(ys[i]);
            ctx.beginPath(); ctx.moveTo(sx, y0); ctx.lineTo(sx, sy); ctx.stroke();
          });
          ctx.globalAlpha = 1;
        }
        // _ptConnect → draw a polyline through the points in order (Desmos
        // "table with lines"). Drawn before the dots so markers sit on top.
        if (expr._ptConnect && xs.length > 1) {
          ctx.strokeStyle = expr.color;
          ctx.lineWidth = expr.lineWidth || 2;
          ctx.setLineDash(expr.dash || []);
          ctx.beginPath();
          let started = false;
          xs.forEach((x, i) => {
            const sx = toScreenX(x), sy = toScreenY(ys[i]);
            if (!started) { ctx.moveTo(sx, sy); started = true; } else { ctx.lineTo(sx, sy); }
          });
          ctx.stroke();
          ctx.setLineDash([]);
        }
        // _ptStyle="none" → the polyline alone, no markers: a curve sent as
        // sampled points (a graph-to-equation question's target, whose
        // equation is the answer and so never reaches the page).
        if (expr._ptStyle === 'none') return;
        // _ptStyle="open" → hollow dots (open circles); _ptLabels[i] → a text
        // label next to each point. Both additive: plain scatter is unchanged.
        const _open = expr._ptStyle === 'open';
        const _labels = expr._ptLabels;
        ctx.fillStyle = expr.color;
        xs.forEach((x, i) => {
          const sx = toScreenX(x), sy = toScreenY(ys[i]);
          if (sx >= -10 && sx <= w + 10 && sy >= -10 && sy <= h + 10) {
            ctx.beginPath();
            ctx.arc(sx, sy, _open ? 4.5 : 4, 0, Math.PI * 2);
            if (_open) {
              ctx.fillStyle = bgColor; ctx.fill();
              ctx.strokeStyle = expr.color; ctx.lineWidth = 2; ctx.stroke();
              ctx.fillStyle = expr.color;
            } else {
              ctx.fill();
              ctx.strokeStyle = bgColor; ctx.lineWidth = 1.5; ctx.stroke();
            }
            if (_labels && _labels[i]) {
              ctx.font = 'bold 12px ' + (styles.getPropertyValue('--mono').trim() || 'monospace');
              ctx.textAlign = 'left';
              ctx.textBaseline = 'alphabetic';
              // Halo (stroke in bg color) so the label stays legible over a curve.
              ctx.lineWidth = 3; ctx.strokeStyle = bgColor;
              ctx.strokeText(String(_labels[i]), sx + 10, sy - 10);
              ctx.fillStyle = expr.color;
              ctx.fillText(String(_labels[i]), sx + 10, sy - 10);
            }
          }
        });
        return;
      }

      // Implicit equation rendering (marching squares)
      if (expr.implicitFn && !expr.fn) {
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = expr.lineWidth || 2.5;
        ctx.lineJoin = 'round';
        ctx.setLineDash(expr.dash || []);
        // Strict implicit inequality (x+y < 10) → dashed boundary, same
        // Desmos convention as the y-form and vertical inequalities. Applied
        // by skipping segments below (setLineDash is a no-op on micro-subpaths).
        const _ineqSkip = !!(expr._regionOp && expr._fillStrict);
        ctx.beginPath();
        // Grid resolution — ~1.5px per cell for smooth curves
        const cellSize = 1.5;
        const gw = Math.ceil(w / cellSize), gh = Math.ceil(h / cellSize);
        const cellW = w / gw, cellH = h / gh;
        // Evaluate grid of values
        const grid = [];
        for (let gy = 0; gy <= gh; gy++) {
          grid[gy] = new Float64Array(gw + 1);
          for (let gx = 0; gx <= gw; gx++) {
            const mx = fromScreenX(gx * cellW);
            const my = fromScreenY(gy * cellH);
            try { grid[gy][gx] = expr.implicitFn(mx, my); } catch(e) { grid[gy][gx] = NaN; }
          }
        }
        // March through cells — linear interpolation on edges
        for (let gy = 0; gy < gh; gy++) {
          for (let gx = 0; gx < gw; gx++) {
            const v00 = grid[gy][gx], v10 = grid[gy][gx+1];
            const v01 = grid[gy+1][gx], v11 = grid[gy+1][gx+1];
            if (!isFinite(v00) || !isFinite(v10) || !isFinite(v01) || !isFinite(v11)) continue;
            // Cell corners in screen space
            const sx = gx * cellW, sy = gy * cellH;
            // Classify corners: positive or negative
            const idx = (v00 > 0 ? 8 : 0) | (v10 > 0 ? 4 : 0) | (v11 > 0 ? 2 : 0) | (v01 > 0 ? 1 : 0);
            if (idx === 0 || idx === 15) continue; // no crossing
            // Interpolation helper
            const lerp = (a, b, va, vb) => a + (b - a) * va / (va - vb);
            // Edge midpoints (top=0, right=1, bottom=2, left=3)
            const top   = [lerp(sx, sx + cellW, v00, v10), sy];
            const right  = [sx + cellW, lerp(sy, sy + cellH, v10, v11)];
            const bottom = [lerp(sx, sx + cellW, v01, v11), sy + cellH];
            const left   = [sx, lerp(sy, sy + cellH, v00, v01)];
            // Lookup: which edges to connect
            const segments = {
              1: [[left,bottom]], 2: [[bottom,right]], 3: [[left,right]],
              4: [[top,right]], 5: [[top,left],[bottom,right]], 6: [[top,bottom]],
              7: [[top,left]], 8: [[top,left]], 9: [[top,bottom]],
              10: [[top,right],[bottom,left]], 11: [[top,right]], 12: [[left,right]],
              13: [[bottom,right]], 14: [[bottom,left]]
            };
            (segments[idx] || []).forEach(([p1, p2]) => {
              if (_ineqSkip) {
                // setLineDash can't dash marching-squares output — every
                // ~1.5px segment is its own subpath, so the dash phase never
                // advances and the stroke reads solid. Emulate a [6,4] dash
                // by skipping segments based on position along the segment's
                // dominant axis (locally consistent for any curve direction).
                const t = Math.abs(p2[0] - p1[0]) >= Math.abs(p2[1] - p1[1])
                  ? (p1[0] + p2[0]) / 2 : (p1[1] + p2[1]) / 2;
                if (((t % 10) + 10) % 10 >= 6) return;
              }
              ctx.moveTo(p1[0], p1[1]);
              ctx.lineTo(p2[0], p2[1]);
            });
          }
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Implicit inequality region fill — reuse the marching-squares sign
        // grid: paint grid cells where F satisfies the operator onto an
        // offscreen grid-resolution canvas, then scale it up (the stretch +
        // image smoothing softens the cell edges under the stroked boundary).
        if (expr._regionOp) {
          const want = expr._regionOp === '<' ? -1 : 1;
          const off = this._regionCanvas || (this._regionCanvas = document.createElement('canvas'));
          if (off.width !== gw || off.height !== gh) { off.width = gw; off.height = gh; }
          const octx = off.getContext('2d');
          const img = octx.createImageData(gw, gh);
          const hex = /^#?([0-9a-f]{6})$/i.exec(expr.color || '');
          const rgbN = hex ? parseInt(hex[1], 16) : 0x888888;
          const rr = (rgbN >> 16) & 255, gg = (rgbN >> 8) & 255, bb = rgbN & 255;
          for (let gy = 0; gy < gh; gy++) {
            for (let gx = 0; gx < gw; gx++) {
              const v = grid[gy][gx];
              if (isFinite(v) && v * want > 0) {
                const k = (gy * gw + gx) * 4;
                img.data[k] = rr; img.data[k + 1] = gg; img.data[k + 2] = bb;
                img.data[k + 3] = 41; // ≈ 0.16 alpha, matching the y-form fill
              }
            }
          }
          octx.putImageData(img, 0, 0);
          const smoothing = ctx.imageSmoothingEnabled;
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(off, 0, 0, gw, gh, 0, 0, gw * cellW, gh * cellH);
          ctx.imageSmoothingEnabled = smoothing;
        }
        return;
      }

      // Slope field rendering: dy/dx = f(x, y)
      if (expr.slopeField && expr.fieldFn) {
        const field = this.slopeFieldSegments(expr.fieldFn,
          { xMin: this.xMin, xMax: this.xMax, yMin: this.yMin, yMax: this.yMax },
          w / (this.xMax - this.xMin), h / (this.yMax - this.yMin), expr.fieldStep);
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = expr.lineWidth || 1.6;
        ctx.lineCap = 'round';
        ctx.setLineDash([]); // a dashed 25px segment is noise
        ctx.beginPath();
        field.segments.forEach(sg => {
          ctx.moveTo(toScreenX(sg[0]), toScreenY(sg[1]));
          ctx.lineTo(toScreenX(sg[2]), toScreenY(sg[3]));
        });
        ctx.stroke();
        ctx.lineCap = 'butt';
        return;
      }

      // Polar curve rendering: r = f(theta)
      if (expr.polar && expr.polarFn) {
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = expr.lineWidth || 2.5;
        ctx.lineJoin = 'round';
        ctx.setLineDash(expr.dash || []);
        ctx.beginPath();
        let drawing = false;
        const steps = this.curveSteps(expr, 150);
        const [thetaLo, thetaHi] = this.curveRange(expr); // ±4π unless restricted
        const sv = expr.sliderValues || {};
        for (let i = 0; i <= steps; i++) {
          const theta = thetaLo + (thetaHi - thetaLo) * i / steps;
          let r;
          try { r = expr.polarFn(theta, sv); } catch(e) { drawing = false; continue; }
          if (!isFinite(r)) { drawing = false; continue; }
          const px = r * Math.cos(theta);
          const py = r * Math.sin(theta);
          const sx = toScreenX(px), sy = toScreenY(py);
          if (sx < -50 || sx > w + 50 || sy < -50 || sy > h + 50) { drawing = false; continue; }
          if (!drawing) { ctx.moveTo(sx, sy); drawing = true; }
          else { ctx.lineTo(sx, sy); }
        }
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }

      // Parametric curve rendering: x = f(t), y = g(t)
      if (expr.parametric && expr.paramXFn && expr.paramYFn) {
        ctx.strokeStyle = expr.color;
        ctx.lineWidth = expr.lineWidth || 2.5;
        ctx.lineJoin = 'round';
        ctx.setLineDash(expr.dash || []);
        ctx.beginPath();
        let drawing = false;
        const steps = this.curveSteps(expr, 188);
        const [tMin, tMax] = this.curveRange(expr); // ±4π unless restricted
        const sv = expr.sliderValues || {};
        for (let i = 0; i <= steps; i++) {
          const t = tMin + (tMax - tMin) * i / steps;
          let px, py;
          try { px = expr.paramXFn(t, sv); py = expr.paramYFn(t, sv); } catch(e) { drawing = false; continue; }
          if (!isFinite(px) || !isFinite(py)) { drawing = false; continue; }
          const sx = toScreenX(px), sy = toScreenY(py);
          if (sx < -50 || sx > w + 50 || sy < -50 || sy > h + 50) { drawing = false; continue; }
          if (!drawing) { ctx.moveTo(sx, sy); drawing = true; }
          else { ctx.lineTo(sx, sy); }
        }
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }

      // Function curve
      if (!expr.fn) return;

        // reuse the cached set during pan/zoom; a settled render recomputes.

        } else {

      // steep and oscillatory sections render smooth instead of ragged.
      // Draws strictly left-to-right; asymptote breaks stay breaks (the

      const _refine = (x0, sy0, x1, sy1, depth) => {
        if (depth <= 0) return;

      for (let px = 0; px <= w; px++) {

        try {

      }

      // continuous join (e.g. the vertex of a V where both branches meet) no
      // circle is shown; at a jump, the defined value gets a closed dot and the
      // "missing" one-sided limit gets an open circle.
      if (expr.fn && expr.fn._piecewise) {

        const bvals = new Set();
        expr.fn._piecewise.forEach(piece => {
          if (!piece.cond) return;
          const bounds = piece.cond.match(/(-?[\d.]+)\s*[<>]=?\s*x|x\s*[<>]=?\s*(-?[\d.]+)/g);
          if (!bounds) return;
          bounds.forEach(b => {
            const mm = b.match(/x\s*[<>]=?\s*(-?[\d.]+)/) || b.match(/(-?[\d.]+)\s*[<>]=?\s*x/);
            if (mm && isFinite(parseFloat(mm[1]))) bvals.add(parseFloat(mm[1]));

        });
        const safeFn = (xv) => { try { const y = expr.fn(xv); return isFinite(y) ? y : NaN; } catch(e) { return NaN; } };
        const eps = Math.max((this.xMax - this.xMin) * 1e-4, 1e-7);
        const ytol = Math.max(Math.abs(this.yMax - this.yMin) * 2e-3, 1e-6);

        bvals.forEach(val => {

  fmtTick(v) {
    if (Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0)) return v.toExponential(0);
    if (Number.isInteger(v)) return String(v);

  },

  // Format a value as a pi fraction if it's close to one, otherwise decimal

  _gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; },

  // Auto-zoom to fit all visible content
  zoomToFit() {
    let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
    let found = false;
    // A circle, a rose or a Lissajous is GEOMETRY: fitting it to the panel
    // would draw it as an ellipse, so those keep equal units. Function
    // curves and data are fitted on both axes independently.
    let geometric = false;

    this.expressions.forEach(expr => {
      if (!expr.visible) return;

      // Scatter data / point data
      if (expr.scatterData) {
        expr.scatterData.xs.forEach(x => { xMin = Math.min(xMin, x); xMax = Math.max(xMax, x); });
        expr.scatterData.ys.forEach(y => { yMin = Math.min(yMin, y); yMax = Math.max(yMax, y); });

        return;
      }
      if (expr.pointData && expr.getPoints) {
        expr.getPoints().forEach(pt => {
          if (isFinite(pt.x) && isFinite(pt.y)) {
            xMin = Math.min(xMin, pt.x); xMax = Math.max(xMax, pt.x);
            yMin = Math.min(yMin, pt.y); yMax = Math.max(yMax, pt.y);
            found = true;
          }
        });
        return;
      }
      if (expr.histData) {
        xMin = Math.min(xMin, expr.histData.dataMin);
        xMax = Math.max(xMax, expr.histData.dataMin + expr.histData.binW * expr.histData.bins);
        yMax = Math.max(yMax, Math.max(...expr.histData.counts));
        yMin = Math.min(yMin, 0);
        found = true;
        return;
      }
      if (expr.boxData) {
        xMin = Math.min(xMin, expr.boxData.whiskerLo);
        xMax = Math.max(xMax, expr.boxData.whiskerHi);
        if (expr.boxData.outliers) expr.boxData.outliers.forEach(v => { xMin = Math.min(xMin, v); xMax = Math.max(xMax, v); });
        yMin = -1; yMax = 3;
        found = true;
        return;
      }
      if (expr.dotData) {
        const vals = expr.dotData.values;
        xMin = Math.min(xMin, vals[0]);
        xMax = Math.max(xMax, vals[vals.length - 1]);
        const groups = new Map();
        vals.forEach(v => { const k = Math.round(v * 1e9) / 1e9; groups.set(k, (groups.get(k) || 0) + 1); });

        yMax = Math.max(yMax, Math.max(...groups.values()) + 0.5);

            if (isFinite(r)) {

              yMin = Math.min(yMin, py); yMax = Math.max(yMax, py);
              found = true;
            }
          } catch(e) {}
        }
        return;
      }

      // Parametric curves
      if (expr.parametric && expr.paramXFn && expr.paramYFn) {
        geometric = true;
        const sv = expr.sliderValues || {};
        const [fLo, fHi] = this.curveRange(expr);
        for (let i = 0; i <= 500; i++) {
          const t = fLo + (fHi - fLo) * i / 500;
          try {
            const px = expr.paramXFn(t, sv), py = expr.paramYFn(t, sv);
            if (isFinite(px) && isFinite(py)) {
              xMin = Math.min(xMin, px); xMax = Math.max(xMax, px);
              yMin = Math.min(yMin, py); yMax = Math.max(yMax, py);
              found = true;
            }
          } catch(e) {}
        }
        return;
      }

      // Implicit equations

        // Sample broadly to find curve extent

        for (let i = 0; i <= 100; i++) {

      // ±10 fills the panel up to 100. Only a curve with nothing finite in

      const yPad = yRange * 0.15;
      this.xMin = xMin - xPad;
      this.xMax = xMax + xPad;
      this.yMin = yMin - yPad;
      this.yMax = yMax + yPad;
    }
    // Geometry keeps equal units. Otherwise the fit is free — unless it
    // already lands within a few percent of square, where the lock costs
    // nothing and keeps the grid honest.
    if (found && !geometric && this.canvas) {
      const r = this.canvas.getBoundingClientRect();
      const ux = (this.xMax - this.xMin) / Math.max(1, r.width), uy = (this.yMax - this.yMin) / Math.max(1, r.height);

    } else {
      this.aspectLock = true;
    }

    this.render();
  },

  // Score how "round" a range is — higher = simpler numbers
  _rangeRoundness(min, max) {
    let score = 0;
    const range = max - min;
    // Integer endpoints score high
    if (Number.isInteger(min)) score += 3;
    if (Number.isInteger(max)) score += 3;
    // Symmetric around zero
    if (Math.abs(min + max) < 0.001) score += 2;
    // Round range (integer, or simple multiple of 5/10)
    if (Number.isInteger(range)) score += 2;
    if (range % 5 === 0) score += 1;
    if (range % 10 === 0) score += 1;
    // Pi multiples
    const piRatio = range / Math.PI;
    if (Math.abs(piRatio - Math.round(piRatio)) < 0.01) score += 2;
    return score;
  },

  // ═══ Motion engine (SPEC_KOVALNA_KALC_V4 Phase 1) ═══════════════════
  // One rAF loop drives coalesced renders (T1.1), eased zoom toward a target
  // window (T1.2), and inertial panning (T1.4). Interaction handlers mutate
  // state and call scheduleRender()/_animateWindowTo()/_startInertia()
  // instead of rendering synchronously per input event.
  _rafId: null,
  _renderQueued: false,
  _targetWin: null,
  _inertiaV: null,

  scheduleRender() {
    this._renderQueued = true;
    this._ensureMotionLoop();
  },

  // True while the viewport is being actively manipulated — render() uses
  // this to reuse per-expression caches (piecewise jump pre-pass, T1.5).
  _interacting() {
    return !!(this.isDragging || this._pinch || this._targetWin || this._inertiaV);
  },

  _reducedMotion() {
    return typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  },

  _animateWindowTo(win) {
    this._inertiaV = null;
    if (this._reducedMotion()) {
      this.xMin = win.xMin; this.xMax = win.xMax; this.yMin = win.yMin; this.yMax = win.yMax;
      this._targetWin = null;
      this.scheduleRender();
      return;
    }
    this._targetWin = { xMin: win.xMin, xMax: win.xMax, yMin: win.yMin, yMax: win.yMax };
    this._ensureMotionLoop();
  },

  _startInertia(vx, vy) {
    // vx/vy in graph units per ms; ignore micro-flicks (< 0.15 px/ms)
    if (!this.canvas) return;
    const rect = this.canvas.getBoundingClientRect();
    const pxPerMs = Math.hypot(
      vx / (this.xMax - this.xMin) * rect.width,
      vy / (this.yMax - this.yMin) * rect.height,
    );
    if (!isFinite(pxPerMs) || pxPerMs < 0.15 || this._reducedMotion()) return;
    this._inertiaV = { vx, vy };
    this._ensureMotionLoop();
  },

  _stopMotion() { this._targetWin = null; this._inertiaV = null; },

  _ensureMotionLoop() {
    if (this._rafId != null) return;
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(50, now - last) || 16;
      last = now;
      let active = false;

      // Eased zoom: exponential approach, snap within a tenth of a pixel
      if (this._targetWin) {
        const t = this._targetWin;
        const k = 1 - Math.pow(0.02, dt / 180);
        this.xMin += (t.xMin - this.xMin) * k; this.xMax += (t.xMax - this.xMax) * k;
        this.yMin += (t.yMin - this.yMin) * k; this.yMax += (t.yMax - this.yMax) * k;
        const rect = this.canvas ? this.canvas.getBoundingClientRect() : { width: 1 };
        const tol = 0.1 * (this.xMax - this.xMin) / Math.max(1, rect.width);
        if (Math.abs(t.xMin - this.xMin) < tol && Math.abs(t.xMax - this.xMax) < tol &&
            Math.abs(t.yMin - this.yMin) < tol && Math.abs(t.yMax - this.yMax) < tol) {
          this.xMin = t.xMin; this.xMax = t.xMax; this.yMin = t.yMin; this.yMax = t.yMax;
          this._targetWin = null; // cleared before the render below → settled render
        } else active = true;
        this._renderQueued = true;
      }

      // Inertial pan: decay ~0.92 per 60Hz frame, framerate-independent
      if (this._inertiaV) {
        const v = this._inertiaV;
        this.xMin += v.vx * dt; this.xMax += v.vx * dt;
        this.yMin += v.vy * dt; this.yMax += v.vy * dt;
        const decay = Math.pow(0.92, dt / 16.7);
        v.vx *= decay; v.vy *= decay;
        const rect = this.canvas ? this.canvas.getBoundingClientRect() : { width: 1, height: 1 };
        const pxPerMs = Math.hypot(
          v.vx / (this.xMax - this.xMin) * rect.width,
          v.vy / (this.yMax - this.yMin) * rect.height,
        );
        if (!isFinite(pxPerMs) || pxPerMs < 0.01) this._inertiaV = null;
        else active = true;
        this._renderQueued = true;
      }

      if (this._renderQueued) { this._renderQueued = false; this.render(); }
      if (active || this._renderQueued) this._rafId = requestAnimationFrame(tick);
      else this._rafId = null;
    };
    this._rafId = requestAnimationFrame(tick);
  },

  // Nearest draggable scatter point within `radius` px of a mouse position.
  // Uses the logical window — render() writes the equal-scale-adjusted
  // window back, so logical and rendered transforms agree. (T5.1)
  _scatterPointAt(mx, my, radius = 8) {
    if (!this.canvas) return null;
    const rect = this.canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const xr = this.xMax - this.xMin, yr = this.yMax - this.yMin;
    let best = null, bestD = radius;
    this.expressions.forEach((e) => {
      if (!e.visible || !e.scatterData || !e._draggable || e._fixed || e.isResidual) return;
      e.scatterData.xs.forEach((x, i) => {
        const sx = (x - this.xMin) / xr * w;
        const sy = h - (e.scatterData.ys[i] - this.yMin) / yr * h;
        const d = Math.hypot(sx - mx, sy - my);
        if (d < bestD) { bestD = d; best = { entry: e, idx: i }; }
      });
    });
    return best;
  },

  // Two-pointer pinch: scale the gesture-start window about the graph point
  // under the original midpoint, then translate with the midpoint. (T1.3)
  _onPinchMove() {
    const [a, b] = [...this._pointers.values()];
    const pin = this._pinch;
    if (!a || !b || !pin || !this.canvas) return;
    const rect = this.canvas.getBoundingClientRect();
    const frozen = window._kalcFrozen || {};
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const scale = frozen.zoom ? 1 : pin.dist / dist;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const w0 = pin.win;
    const gx = w0.xMin + (pin.mid.x - rect.left) / rect.width * (w0.xMax - w0.xMin);
    const gy = w0.yMax - (pin.mid.y - rect.top) / rect.height * (w0.yMax - w0.yMin);
    let xMin = gx - (gx - w0.xMin) * scale, xMax = gx + (w0.xMax - gx) * scale;
    let yMin = gy - (gy - w0.yMin) * scale, yMax = gy + (w0.yMax - gy) * scale;
    if (!frozen.pan) {
      const dxg = (mid.x - pin.mid.x) / rect.width * (xMax - xMin);
      const dyg = (mid.y - pin.mid.y) / rect.height * (yMax - yMin);
      xMin -= dxg; xMax -= dxg; yMin += dyg; yMax += dyg;
    }
    if (frozen.zoom && frozen.pan) return;
    this.xMin = xMin; this.xMax = xMax; this.yMin = yMin; this.yMax = yMax;
    this.scheduleRender();
  },

  // ═══ Keyboard graph navigation (T5.3) ══════════════════════════════
  onGraphKeydown(e) {
    const frozen = window._kalcFrozen || {};
    const consume = () => { e.preventDefault(); e.stopPropagation(); };
    const xr = this.xMax - this.xMin, yr = this.yMax - this.yMin;

    if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey) {
      consume(); // also shields the global T-theme shortcut
      if (frozen.trace) return;
      if (this._kbTrace) this._kbTraceEnd(); else this._kbTraceStart();
      return;
    }
    if (e.key === 'Escape' && this._kbTrace) { consume(); this._kbTraceEnd(); return; }

    if (this._kbTrace) {
      const t = this._kbTrace;
      const step = xr / (e.shiftKey ? 200 : 50);
      if (e.key === 'ArrowLeft') { consume(); t.x -= step; this._kbTraceShow(); return; }
      if (e.key === 'ArrowRight') { consume(); t.x += step; this._kbTraceShow(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        consume(); this._kbTraceCycle(e.key === 'ArrowUp' ? -1 : 1); return;
      }
      return;
    }

    const panFrac = e.shiftKey ? 0.4 : 0.1;
    const pan = (dx, dy) => {
      consume();
      if (frozen.pan) return;
      this._stopMotion();
      this.xMin += dx; this.xMax += dx; this.yMin += dy; this.yMax += dy;
      this.scheduleRender();
    };
    if (e.key === 'ArrowLeft') return pan(-xr * panFrac, 0);
    if (e.key === 'ArrowRight') return pan(xr * panFrac, 0);
    if (e.key === 'ArrowUp') return pan(0, yr * panFrac);
    if (e.key === 'ArrowDown') return pan(0, -yr * panFrac);

    if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
      consume();
      if (frozen.zoom) return;
      const f = (e.key === '-' || e.key === '_') ? 1.25 : 0.8;
      const cx = (this.xMin + this.xMax) / 2, cy = (this.yMin + this.yMax) / 2;
      this._animateWindowTo({
        xMin: cx - xr / 2 * f, xMax: cx + xr / 2 * f,
        yMin: cy - yr / 2 * f, yMax: cy + yr / 2 * f,
      });
      this._announce((f < 1 ? 'Zoomed in. ' : 'Zoomed out. ')
        + 'x from ' + this.fmtTick(cx - xr / 2 * f) + ' to ' + this.fmtTick(cx + xr / 2 * f));
    }
  },

  _traceableExprs() {
    return this.expressions.filter((ex) => ex.visible && ex.fn && !ex.scatterData && !ex.action && !ex._ghost);
  },

  _kbTraceStart() {
    if (!this._traceableExprs().length) { this._announce('No curves to trace.'); return; }
    this._kbTrace = { idx: 0, x: (this.xMin + this.xMax) / 2 };
    this._kbTraceShow();
  },

  _kbTraceEnd() {
    if (!this._kbTrace) return;
    this._kbTrace = null;
    this.hideTrace();
    this._announce('Trace off.');
  },

  _kbTraceCycle(dir) {
    const list = this._traceableExprs();
    if (!list.length || !this._kbTrace) return;
    this._kbTrace.idx = (this._kbTrace.idx + dir + list.length) % list.length;
    this._kbTraceShow();
  },

  _kbTraceShow() {
    const list = this._traceableExprs();
    if (!list.length) { this._kbTraceEnd(); return; }
    const t = this._kbTrace;
    t.idx = Math.min(t.idx, list.length - 1);
    const entry = list[t.idx];
    t.x = Math.max(this.xMin, Math.min(this.xMax, t.x));
    let y = NaN;
    try { y = entry.fn(t.x); } catch (e) {}
    const rect = this.canvas.getBoundingClientRect();
    const sx = (t.x - this.xMin) / (this.xMax - this.xMin) * rect.width;
    const sy = rect.height - (y - this.yMin) / (this.yMax - this.yMin) * rect.height;
    if (isFinite(y) && this.traceDot && this.traceLabel) {
      this.traceDot.style.display = 'block';
      this.traceDot.style.left = sx + 'px';
      this.traceDot.style.top = sy + 'px';
      this.traceDot.style.background = entry.color;
      this.traceLabel.style.display = 'block';
      this.traceLabel.style.left = (sx + 12) + 'px';
      this.traceLabel.style.top = (sy - 24) + 'px';
      this.traceLabel.style.color = entry.color;
      this.traceLabel.textContent = '(' + this.fmtPi(t.x, 3) + ', ' + this.fmtPi(y, 3) + ')';
    } else {
      this.hideTrace();
    }
    this._announce(entry.expr + ': x = ' + this.fmtPi(t.x, 3)
      + (isFinite(y) ? ', y = ' + this.fmtPi(y, 3) : ', undefined here'));
  },

  _announce(msg) {
    if (this._srLive) this._srLive.textContent = msg;
  },

  onMouseDown(e) {
    if (window._kalcFrozen && window._kalcFrozen.pan) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    this._imageJustInteracted = false;

    // ─── Sketch mode: check if clicking on a sketch point to drag ───
    if (window._kalcSketch && window._kalcSketch.active) {
      if (window._kalcSketch.startDrag(mx, my, rect.width, rect.height)) {
        this._sketchDragging = true;
        this.canvas.style.cursor = 'grabbing';
        return; // don't start pan
      }
    }

    // ─── Image overlay: select / drag / resize / delete ───
    const hit = this._imageAt(mx, my, rect.width, rect.height);
    if (hit) {
      this._imageJustInteracted = true;
      this._images.forEach(o => o._selected = false);
      hit.im._selected = true;
      if (hit.mode === 'delete') {
        this._images.splice(hit.idx, 1);
        this._imageDrag = null;
        this.render();
        return;
      }
      this._imageDrag = {
        im: hit.im, mode: hit.mode, startMx: mx, startMy: my,
        orig: { x: hit.im.x, y: hit.im.y, w: hit.im.w, h: hit.im.h }
      };
      this.canvas.style.cursor = hit.mode === 'resize' ? 'nwse-resize' : 'grabbing';
      this.render();
      return;
    } else if (this._images && this._images.some(o => o._selected)) {
      this._images.forEach(o => o._selected = false);
      this.render();
    }

    // ─── Draggable scatter points (T5.1) — full mode only ───
    if (!(window._kalcFrozen && (window._kalcFrozen.input || window._kalcFrozen.pan))) {
      const hitPt = this._scatterPointAt(mx, my);
      if (hitPt) {
        this._stopMotion();
        this._ptDrag = hitPt;
        this.hideTrace();
        this.canvas.style.cursor = 'grabbing';
        return;
      }
    }

    this._stopMotion();
    this._panSamples = [];
    this.isDragging = true;
    this.dragStartX = mx;
    this.dragStartY = my;
    this.dragXMin = this.xMin; this.dragXMax = this.xMax;
    this.dragYMin = this.yMin; this.dragYMax = this.yMax;
    this.canvas.style.cursor = 'grabbing';
  },

  onMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const w = rect.width, h = rect.height;

    // ─── Sketch mode: handle point dragging ───
    if (this._sketchDragging && window._kalcSketch && window._kalcSketch.active) {
      window._kalcSketch.onDrag(mx, my, w, h);
      return;
    }

    // ─── Image overlay: move / resize (top-left corner stays put) ───
    if (this._imageDrag) {
      const d = this._imageDrag;
      const gxPerPx = (this.xMax - this.xMin) / w;
      const gyPerPx = (this.yMax - this.yMin) / h;
      const ddx = (mx - d.startMx) * gxPerPx;
      const ddy = (my - d.startMy) * gyPerPx;
      if (d.mode === 'move') {
        d.im.x = d.orig.x + ddx;
        d.im.y = d.orig.y - ddy;
      } else {
        const nw = Math.max(gxPerPx * 12, d.orig.w + ddx);
        const nh = Math.max(gyPerPx * 12, d.orig.h + ddy);
        d.im.x = d.orig.x + (nw - d.orig.w) / 2;
        d.im.y = d.orig.y - (nh - d.orig.h) / 2;
        d.im.w = nw; d.im.h = nh;
      }
      this.render();
      return;
    }

    // Coordinate readout
    const xRange = this.xMax - this.xMin, yRange = this.yMax - this.yMin;
    const gx = this.xMin + mx / w * xRange;
    const gy = this.yMax - my / h * yRange;
    this.coordsEl.textContent = `(${this.fmtPi(gx, 2)}, ${this.fmtPi(gy, 2)})`;

    // ─── Scatter-point drag (T5.1): move the point with the pointer ───
    if (this._ptDrag) {
      const { entry, idx } = this._ptDrag;
      entry.scatterData.xs[idx] = gx;
      entry.scatterData.ys[idx] = gy;
      this.hideTrace();
      this.scheduleRender();
      return;
    }

    if (!this.isDragging) {
      // Hover feedback for draggable points (T5.1)
      if (!(window._kalcFrozen && (window._kalcFrozen.input || window._kalcFrozen.pan))) {
        const overPt = this._scatterPointAt(mx, my);
        this.canvas.style.cursor = overPt ? 'grab' : 'crosshair';
        if (overPt) { this.hideTrace(); return; }
      }
      // Trace mode — snap to nearest curve
      if (window._kalcFrozen && window._kalcFrozen.trace) return;
      this.traceAt(mx, my);
      return;
    }
    this.hideTrace();
    const dx = (mx - this.dragStartX) / w * (this.dragXMax - this.dragXMin);
    const dy = (my - this.dragStartY) / h * (this.dragYMax - this.dragYMin);
    this.xMin = this.dragXMin - dx; this.xMax = this.dragXMax - dx;
    this.yMin = this.dragYMin + dy; this.yMax = this.dragYMax + dy;
    // Velocity samples over the last ~90ms feed inertial release (T1.4)
    const _now = performance.now();
    this._panSamples = (this._panSamples || []).filter(s => _now - s.t < 90);
    this._panSamples.push({ t: _now, xMin: this.xMin, yMin: this.yMin });
    this.scheduleRender();
  },

  onMouseUp() {
    // ─── Scatter-point drag: commit (T5.1/T5.2) ───
    if (this._ptDrag) {
      const { entry, idx } = this._ptDrag;
      this._ptDrag = null;
      if (this.canvas) this.canvas.style.cursor = 'crosshair';
      const xs = entry.scatterData.xs, ys = entry.scatterData.ys;
      if (entry._writeBack) {
        // List-backed plot: push through the table editor's commit path
        // (re-syncs stats + recreates the plot entry from the store).
        try { entry._writeBack(idx, xs[idx], ys[idx]); } catch (e) {}
      } else {
        // Typed tuple points: regenerate the row label from the new coords
        const fmtV = (v) => String(Math.round(v * 1000) / 1000);
        const txt = xs.map((x, i) => `(${fmtV(x)}, ${fmtV(ys[i])})`).join(', ');
        entry.expr = txt; entry.rawExpr = txt;
        entry.latex = this.exprToLatex ? this.exprToLatex(txt) : txt;
        this.updateRows();
      }
      this.scheduleRender();
      return;
    }

    // ─── Image overlay: end drag/resize ───
    if (this._imageDrag) {
      this._imageDrag = null;
      if (this.canvas) this.canvas.style.cursor = 'crosshair';
      return;
    }
    // ─── Sketch mode: end point drag ───
    if (this._sketchDragging) {
      this._sketchDragging = false;
      if (window._kalcSketch) window._kalcSketch.endDrag();
      if (this.canvas) this.canvas.style.cursor = 'crosshair';
      return;
    }
    if (this.isDragging) {
      const s = this._panSamples;
      if (s && s.length >= 2) {
        const first = s[0], lastS = s[s.length - 1];
        const dt = lastS.t - first.t;
        if (dt > 15) this._startInertia((lastS.xMin - first.xMin) / dt, (lastS.yMin - first.yMin) / dt);
      }
      this._panSamples = [];
    }
    this.isDragging = false;
    if (this.canvas) this.canvas.style.cursor = 'crosshair';
    this.scheduleRender();
  },

  onMouseLeave() {
    this.onMouseUp();
    this.hideTrace();
  },

  onWheel(e) {
    if (window._kalcFrozen && window._kalcFrozen.zoom) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;
    const factor = e.deltaY > 0 ? 1.15 : 1/1.15;
    // Zoom about the cursor, compounding on the CURRENT TARGET window so
    // rapid wheel ticks stack instead of fighting the easing (T1.2).
    const from = this._targetWin || { xMin: this.xMin, xMax: this.xMax, yMin: this.yMin, yMax: this.yMax };
    const xRange = from.xMax - from.xMin, yRange = from.yMax - from.yMin;
    const cx = from.xMin + mx * xRange, cy = from.yMax - my * yRange;
    this._animateWindowTo({
      xMin: cx - (cx - from.xMin) * factor,
      xMax: cx + (from.xMax - cx) * factor,
      yMin: cy - (cy - from.yMin) * factor,
      yMax: cy + (from.yMax - cy) * factor,
    });
  }
};

function buildDropdowns() {
  const container = document.createElement('div');
  container.className = 'card kalc-toolbar';

  // ─── Row 1: identity + state + actions. Row 2: the insert menus. ───
  // One wrapping flex row used to hold all eleven chips, so the toolbar
  // broke mid-list at every width (two rows even at the 920px desktop max,
  // four on a phone) and Plot/Table/Image/Help read as more categories.
  // Row 1 never wraps: brand menu, the Calc/AP Stats switch, DEG/RAD, and
  // the four actions right-aligned. Row 2 scrolls sideways when it must.
  const row1 = document.createElement('div');
  row1.className = 'header kalc-bar-top';
  row1.setAttribute('role', 'banner');

  // Title as a menu trigger
  const titleWrap = document.createElement('div');
  titleWrap.className = 'title-menu-wrap';
  const title = document.createElement('h1');
  title.innerHTML = '<span>KOVALNA</span> KALC <svg class="title-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4.5l3 3 3-3"/></svg>';
  if (Session.isTestMode()) {
    const badge = document.createElement('span');
    badge.style.cssText = 'font-size:9px;font-weight:600;background:var(--red);color:#fff;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:0.5px;margin-left:4px;vertical-align:middle;';
    badge.textContent = 'EXAM';
    // Insert before chevron
    title.insertBefore(badge, title.querySelector('.title-chevron'));
  }
  titleWrap.appendChild(title);

  // Settings dropdown menu
  const titleMenu = document.createElement('div');
  titleMenu.className = 'title-menu';
  let titleMenuOpen = false;
  title.onclick = (e) => {
    e.stopPropagation();
    titleMenuOpen = !titleMenuOpen;
    titleWrap.classList.toggle('open', titleMenuOpen);
    titleMenu.classList.toggle('open', titleMenuOpen);
  };
  document.addEventListener('click', (e) => {
    if (!titleWrap.contains(e.target)) {
      titleMenuOpen = false;
      titleWrap.classList.remove('open');
      titleMenu.classList.remove('open');
    }
  });

  // Mode switch — a two-segment control that shows BOTH modes with the
  // current one lit. It used to be one button in the title menu labelled
  // with the OTHER mode's name ("Calc" while in AP Stats), which reads as
  // the current mode, and it was hidden behind the logo.
  // Default is CALCULATOR mode, and it must match the restore in
  // 44-app-assemble (`Session.get('statsMode', false)`), which runs after
  // this builder and used to disagree: the switch lit "AP Stats" over the
  // calculator's own menus on every fresh session.
  let statsMode = Session.get('statsMode', false);
  const calcIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px"><path d="M2 8h12M8 2v12"/><path d="M3 3l2 2M3 5l2-2" stroke-width="1.4"/></svg>';
  const statsIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px"><rect x="2" y="9" width="3" height="5" rx="0.5"/><rect x="6.5" y="5" width="3" height="9" rx="0.5"/><rect x="11" y="2" width="3" height="12" rx="0.5"/></svg>';
  function segButton(html, title) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'kalc-seg-btn'; b.innerHTML = html; b.title = title;
    b.setAttribute('aria-pressed', 'false');
    return b;
  }
  const modeSeg = document.createElement('div');
  modeSeg.className = 'kalc-seg stats-mode-toggle';
  modeSeg.setAttribute('role', 'group'); modeSeg.setAttribute('aria-label', 'Calculator mode');
  const calcSegBtn = segButton(calcIcon + ' Calc', 'Calculator mode: algebra, trig, calculus');
  const statsSegBtn = segButton(statsIcon + ' AP Stats', 'AP Statistics mode: stats, distributions, inference');
  modeSeg.appendChild(calcSegBtn); modeSeg.appendChild(statsSegBtn);
  const updateModeBtn = () => {
    calcSegBtn.classList.toggle('on', !statsMode); calcSegBtn.setAttribute('aria-pressed', String(!statsMode));
    statsSegBtn.classList.toggle('on', statsMode); statsSegBtn.setAttribute('aria-pressed', String(statsMode));
    document.querySelector('.app').classList.toggle('stats-hidden', !statsMode);
    if (window._kalcSyncCatsFade) requestAnimationFrame(window._kalcSyncCatsFade);
  };
  const pickMode = (on) => (e) => {
    e.stopPropagation();
    if (statsMode === on) return;
    statsMode = on;
    Session.set('statsMode', statsMode);
    updateModeBtn();
  };
  calcSegBtn.onclick = pickMode(false);
  statsSegBtn.onclick = pickMode(true);
  // Set the mode outright (no toast) — kovalna-load restores the panel layout a

    statsMode = !!on;
    Session.set('statsMode', statsMode);
    updateModeBtn();
  };

  // DEG/RAD — graph STATE, not a preference (it changes what a trig curve

  const angleSeg = document.createElement('div');
  angleSeg.className = 'kalc-seg kalc-seg-mono';
  angleSeg.id = 'angleSeg';
  angleSeg.setAttribute('role', 'group'); angleSeg.setAttribute('aria-label', 'Angle mode');
  [['deg', 'DEG', 'Degrees'], ['rad', 'RAD', 'Radians']].forEach(([mode, label, title]) => {
    const b = segButton(label, title);
    b.dataset.mode = mode;
    b.onclick = (e) => {
      e.stopPropagation();

      if (typeof setAngleMode === 'function') setAngleMode(mode);
    };
    angleSeg.appendChild(b);
  });
  if (typeof syncAngleUI === 'function') setTimeout(syncAngleUI, 0);

  // Actions (Plot / Table / Image / Help) — built below, mounted right-aligned
  // in row 1 so they read as verbs rather than as four more categories.
  const actions = document.createElement('div');
  actions.className = 'kalc-actions';

  // Theme and View are HOST-OWNED when embedded: CalcStatlab mirrors
  // KOVALNA's theme into the iframe and drives fullscreen from the drawer's
  // own button (kovalna-theme / kovalna-fullscreen in 46-embed-api), so an
  // in-app toggle only ever fought the host. .kalc-host-owned hides both

  const themeBtn = document.createElement('button');
  themeBtn.className = 'fn-drop-trigger kalc-host-owned';
  themeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> Theme';
  themeBtn.title = 'Toggle dark/light mode';
  themeBtn.onclick = (e) => { e.stopPropagation(); if (typeof toggleTheme === 'function') toggleTheme(); };
  titleMenu.appendChild(themeBtn);

  // Fullscreen toggle
  const fsBtn = document.createElement('button');
  fsBtn.className = 'fn-drop-trigger kalc-host-owned';
  fsBtn.title = 'Toggle fullscreen';

    const app = document.querySelector('.app');

      if (!app.querySelector('.fs-sidebar')) {
        const sidebar = document.createElement('div');
        sidebar.className = 'fs-sidebar';
        sidebar.id = 'fsSidebar';

        // Collapsible section wrapper
        function wrapSection(id, label, opts = {}) {
          const sec = document.createElement('div');
          sec.className = 'fs-section'; sec.dataset.fsId = id;
          sec.id = 'fsSection-' + id;
          const hdr = document.createElement('div');
          hdr.className = 'fs-section-header';
          const chev = document.createElement('span');
          chev.className = 'fs-chevron'; chev.textContent = '▾';
          hdr.appendChild(chev);
          const lbl = document.createElement('span'); lbl.textContent = label;
          hdr.appendChild(lbl);
          if (opts.dismissable) {
            const btn = document.createElement('button');
            btn.className = 'fs-dismiss'; btn.textContent = '✕'; btn.title = 'Dismiss';
            btn.onclick = (ev) => { ev.stopPropagation(); sec.style.display = 'none'; };
            hdr.appendChild(btn);
          }
          hdr.onclick = () => sec.classList.toggle('collapsed');
          sec.appendChild(hdr);
          const body = document.createElement('div');
          body.className = 'fs-section-body'; body.id = 'fsBody-' + id;
          sec.appendChild(body);
          return sec;
        }

        sidebar.appendChild(wrapSection('menus', 'Menus'));
        sidebar.appendChild(wrapSection('expr', 'Expression'));
        sidebar.appendChild(wrapSection('results', 'Results'));

        // Divider — thin line, drag to resize
        const divider = document.createElement('div');
        divider.className = 'fs-divider';
        let divDragging = false;
        let rafId = null;

        divider.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          divDragging = true;
          divider.classList.add('dragging');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';

          const onMove = (e) => {
            if (!divDragging) return;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
              const newWidth = window.innerWidth - e.clientX;
              sidebar.style.width = Math.max(200, Math.min(window.innerWidth * 0.7, newWidth)) + 'px';
              if (typeof Graph !== 'undefined') Graph.render();
            });
          };
          const onUp = () => {
            divDragging = false;
            divider.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });

        // Insert order: graph (already in DOM) → divider → sidebar
        app.appendChild(divider);
        app.appendChild(sidebar);
      }

      // Move actual DOM elements into sidebar sections
      const menusBody = document.getElementById('fsBody-menus');
      const exprBody = document.getElementById('fsBody-expr');
      const resultsBody = document.getElementById('fsBody-results');
      const dropdownCard = document.querySelector('#dropdownsMount > .card');
      const exprWrapper = document.getElementById('exprBarWrapper');
      const resultsFeed = document.querySelector('#resultsFeedMount > .results-card');

      if (dropdownCard && menusBody) menusBody.appendChild(dropdownCard);
      if (exprWrapper && exprBody) exprBody.appendChild(exprWrapper);
      if (resultsFeed && resultsBody) resultsBody.appendChild(resultsFeed);

      // Keep expression section always open
      const exprSec = document.getElementById('fsSection-expr');
      if (exprSec) exprSec.classList.remove('collapsed');

      app.querySelector('.fs-sidebar').style.display = '';
      app.querySelector('.fs-divider').style.display = '';

      // Show graph with hide button in the graph header
      const gm = document.getElementById('graphMount');
      gm.style.display = '';

      const graphHeader = gm.querySelector('.graph-header-actions');

  // Menus are positioned FIXED from the trigger's rect: the category row
  // scrolls sideways (overflow-x: auto), and any overflow clip on a parent
  // would cut an absolutely positioned menu off at the row's edge.
  function placeMenu(trigger, menu) {
    const r = trigger.getBoundingClientRect();
    menu.style.position = 'fixed';
    menu.style.top = (r.bottom + 6) + 'px';
    menu.style.right = 'auto';
    menu.style.left = '0px';
    const mw = menu.offsetWidth || 220;
    let left = r.left;
    if (left + mw > window.innerWidth - 12) left = Math.max(8, window.innerWidth - 12 - mw);
    menu.style.left = left + 'px';
    menu.style.maxHeight = Math.max(160, Math.min(360, window.innerHeight - r.bottom - 16)) + 'px';
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('.fn-dropdown')) closeAll(); });

  // menu's own list) or resize rather than float loose.
  window.addEventListener('scroll', (e) => {
    if (openDropdown && !(e.target && e.target.closest && e.target.closest('.fn-drop-menu'))) closeAll();

    if (mqField && mqField._mqField) {
      rawLatex = mqField._mqField.latex();
      expr = window._latexToExpr ? window._latexToExpr(rawLatex) : rawLatex;
    } else if (fbInput) {
      expr = fbInput.value;
    }
    expr = expr.trim();
    if (!expr) { showToast('Type an expression first'); return; }

    // Auto-prepend "y = " if not present and the expression contains x
    let displayExpr = expr;
    let rhs = expr;
    let displayLatex = rawLatex;
    const yMatch = expr.match(/^y\s*=\s*(.+)$/i);
    const fxMatch = expr.match(/^[a-zA-Z]\s*\(\s*x\s*\)\s*=\s*(.+)$/);
    if (yMatch) {
      rhs = yMatch[1];
    } else if (fxMatch) {
      rhs = fxMatch[1];
    } else if (/\bx\b/i.test(expr)) {
      displayExpr = 'y = ' + expr;
      displayLatex = 'y=' + rawLatex;
    } else {
      showToast('Expression must contain x');
      return;
    }

    try {
      Graph.add(rhs, displayExpr, displayLatex || null);
      // Clear expression bar
      if (mqField && mqField._mqField) {
        mqField._mqField.latex('');
        mqField._mqField.focus();
      } else if (fbInput) {
        fbInput.value = '';
        fbInput.focus();
      }
      // Clear result/viz areas
      const resultEl = document.getElementById('exprResult');
      const vizEl = document.getElementById('exprVizArea');
      if (resultEl) { resultEl.classList.remove('visible'); resultEl.innerHTML = ''; }
      if (vizEl) { hideViz(vizEl); }
      // Hide placeholder
      if (typeof updatePlaceholder === 'function') updatePlaceholder();
    } catch(err) {
      showToast(err.msg || err.message || 'Cannot graph this expression');
    }
  };
  actions.appendChild(graphBtn);

  // ─── Table button ───
  const tableBtn = document.createElement('button');
  tableBtn.className = 'fn-drop-trigger kalc-action';
  tableBtn.setAttribute('data-cat', 'table');
  tableBtn.setAttribute('aria-label', 'Open data table');
  tableBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:11px;height:11px"><rect x="1" y="1" width="14" height="14" rx="1.5"/><line x1="1" y1="5.5" x2="15" y2="5.5"/><line x1="1" y1="10" x2="15" y2="10"/><line x1="8" y1="5.5" x2="8" y2="15"/></svg><span class="kalc-action-label">Table</span>';
  tableBtn.style.cursor = 'pointer';
  tableBtn.title = 'Open data table editor';
  tableBtn.onclick = () => {
    if (typeof Graph !== 'undefined' && Graph.toggleListEditor) {
      Graph.toggleListEditor();
    }
  };
  actions.appendChild(tableBtn);

  // ─── Image button ─── overlay a picture on the graph to trace/model
  const imgBtn = document.createElement('button');
  imgBtn.className = 'fn-drop-trigger kalc-action';
  imgBtn.setAttribute('data-cat', 'image');
  imgBtn.setAttribute('aria-label', 'Overlay an image');
  imgBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:11px;height:11px"><rect x="1" y="2.5" width="14" height="11" rx="1.5"/><circle cx="5" cy="6" r="1.4"/><path d="M2 12 L6 8 L9 11 L12 7.5 L14 10"/></svg><span class="kalc-action-label">Image</span>';
  imgBtn.style.cursor = 'pointer';
  imgBtn.title = 'Overlay an image to trace';
  const imgInput = document.createElement('input');
  imgInput.type = 'file'; imgInput.accept = 'image/*'; imgInput.style.display = 'none';
  imgInput.onchange = () => {
    const file = imgInput.files && imgInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { if (typeof Graph !== 'undefined' && Graph.addImage) Graph.addImage({ src: reader.result }); };
    reader.readAsDataURL(file);
    imgInput.value = '';
  };
  imgBtn.onclick = () => imgInput.click();
  actions.appendChild(imgBtn);
  actions.appendChild(imgInput);

  // ─── Help button ─── searchable syntax reference (domain restrictions,
  // piecewise, inequalities, calculus, stats…). Stays available in exam
  // mode — it documents syntax, like a calculator's manual.
  const helpBtn = document.createElement('button');
  helpBtn.className = 'fn-drop-trigger kalc-action';
  helpBtn.setAttribute('data-cat', 'help');
  helpBtn.setAttribute('aria-label', 'Syntax help');
  helpBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px"><circle cx="8" cy="8" r="6.5"/><path d="M6 6.2a2 2 0 113.4 1.6c-.7.6-1.4.9-1.4 1.9"/><circle cx="8" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg><span class="kalc-action-label">Help</span>';
  helpBtn.title = 'Syntax help — functions, domain restrictions, piecewise, inequalities…';
  helpBtn.onclick = (e) => { e.stopPropagation(); openKalcHelp(helpBtn); };
  actions.appendChild(helpBtn);

  // The category row scrolls with no scrollbar (it would cost the row's
  // height on every width), so the wrapper fades the edge that has more
  // chips beyond it. Which edge is state — read from the row's scroll
  // position on scroll, resize (the fullscreen sidebar drags), and a mode
  // switch (the visible chip set changes) — and painted as two classes.
  const catsWrap = document.createElement('div');
  catsWrap.className = 'kalc-cats-wrap';
  catsWrap.appendChild(dropdowns);
  const syncCatsFade = () => {
    const over = dropdowns.scrollWidth - dropdowns.clientWidth;
    catsWrap.classList.toggle('fade-right', over - dropdowns.scrollLeft > 2);
    catsWrap.classList.toggle('fade-left', dropdowns.scrollLeft > 2);
  };
  window._kalcSyncCatsFade = syncCatsFade;
  dropdowns.addEventListener('scroll', syncCatsFade, { passive: true });
  window.addEventListener('resize', syncCatsFade);
  if (typeof ResizeObserver === 'function') new ResizeObserver(syncCatsFade).observe(dropdowns);
  requestAnimationFrame(syncCatsFade);
  setTimeout(syncCatsFade, 120); // after fonts settle
  container.appendChild(catsWrap);
  updateModeBtn();
  return container;
}

function openKalcHelp(returnFocusEl) {
  let overlay = document.getElementById('kalcHelpOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'kalcHelpOverlay';
    overlay.className = 'kalc-help-overlay';

    const modal = document.createElement('div');
    modal.className = 'kalc-help';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-label', 'Syntax help');

    const head = document.createElement('div');
    head.className = 'kalc-help-head';
    const title = document.createElement('div');
    title.className = 'kalc-help-title';
    title.textContent = 'Syntax help';
    const search = document.createElement('input');
    search.className = 'kalc-help-search';
    search.type = 'search';
    search.placeholder = 'Search… e.g. piecewise';
    search.setAttribute('aria-label', 'Search help topics');
    const close = document.createElement('button');
    close.className = 'kalc-help-close';
    close.setAttribute('aria-label', 'Close help');
    close.textContent = '×';
    head.appendChild(title); head.appendChild(search); head.appendChild(close);

    const body = document.createElement('div');
    body.className = 'kalc-help-body';
    const hint = document.createElement('div');
    hint.className = 'kalc-help-hint';
    hint.textContent = 'Click any example to put it in the expression bar.';
    body.appendChild(hint);

    KALC_HELP.forEach(sec => {
      const s = document.createElement('div');
      s.className = 'kalc-help-section';
      const h = document.createElement('h3');
      h.textContent = sec.title;
      s.appendChild(h);
      if (sec.blurb) {
        const b = document.createElement('p');
        b.className = 'kalc-help-blurb';
        b.textContent = sec.blurb;
        s.appendChild(b);
      }
      sec.rows.forEach(row => {
        const r = document.createElement('div');
        r.className = 'kalc-help-row';
        r.dataset.search = ((row.code || '') + ' ' + row.desc + ' ' + sec.title).toLowerCase();
        if (row.code) {
          const c = document.createElement('button');
          c.className = 'kalc-help-code';
          c.textContent = row.code;
          c.title = 'Put this in the expression bar';
          c.onclick = () => { _helpInsertExample(row.code); closeHelp(); };
          r.appendChild(c);
        }
        const d = document.createElement('span');
        d.className = 'kalc-help-desc';
        d.textContent = row.desc;
        r.appendChild(d);
        s.appendChild(r);
      });
      body.appendChild(s);
    });

    const empty = document.createElement('div');
    empty.className = 'kalc-help-empty';
    empty.textContent = 'No matches — try a shorter search.';
    empty.style.display = 'none';
    body.appendChild(empty);

    search.oninput = () => {
      const q = search.value.trim().toLowerCase();
      let any = false;
      body.querySelectorAll('.kalc-help-section').forEach(sec => {
        let secAny = false;
        sec.querySelectorAll('.kalc-help-row').forEach(r => {
          const show = !q || r.dataset.search.includes(q);
          r.style.display = show ? '' : 'none';
          if (show) secAny = true;
        });
        sec.style.display = secAny ? '' : 'none';
        // Blurbs only make sense with their rows visible and unfiltered
        const blurb = sec.querySelector('.kalc-help-blurb');
        if (blurb) blurb.style.display = q ? 'none' : '';
        if (secAny) any = true;
      });
      empty.style.display = any ? 'none' : '';
    };

    function closeHelp() {
      overlay.classList.remove('open');
      document.removeEventListener('keydown', onKey, true);
      const rf = overlay._returnFocus;
      if (rf && rf.focus) { try { rf.focus(); } catch (e) {} }
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); closeHelp(); }
    }
    overlay._open = () => {
      overlay.classList.add('open');
      document.addEventListener('keydown', onKey, true);
      search.value = '';
      search.oninput();
      search.focus();
    };
    close.onclick = closeHelp;
    overlay.onclick = (e) => { if (e.target === overlay) closeHelp(); };

    modal.appendChild(head);
    modal.appendChild(body);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }
  overlay._returnFocus = returnFocusEl || null;
  overlay._open();
}

// Place a help example in the expression bar. Help and the empty state are
// "try it" galleries, so they CLEAR the bar first; the rendering is the
// menus' own _exprInsertTemplate (42-ui-panels), so an example reads the
// same whichever door it came through.
function _helpInsertExample(plain) {
  const mqField = document.getElementById('exprMqField');
  const fbInput = document.getElementById('exprInput');
  if (mqField && mqField._mqField) mqField._mqField.latex('');
  else if (fbInput) fbInput.value = '';
  if (window._exprInsertTemplate) window._exprInsertTemplate(plain);
}

function buildResultsFeed() {
  const card = document.createElement('div');
  card.className = 'results-card';
  const feed = document.createElement('div');
  feed.className = 'results-feed';
  feed.id = 'resultsFeed';
  card.appendChild(feed);

  function loadExpr(h) {
    const mqField = document.getElementById('exprMqField');
    if (mqField && mqField._mqField) {
      if (h.latex) mqField._mqField.latex(h.latex);
      else { mqField._mqField.latex(''); mqField._mqField.typedText(h.expr); }
      mqField._mqField.focus();
    } else {
      const inp = document.getElementById('exprInput');
      if (inp) { inp.value = h.expr; inp.focus(); }
    }
  }

  function insertAnswer(val) {
    const mqField = document.getElementById('exprMqField');
    if (mqField && mqField._mqField) {
      mqField._mqField.write(String(val));
      mqField._mqField.focus();
    } else {
      const inp = document.getElementById('exprInput');
      if (inp) {
        const s = inp.selectionStart || inp.value.length;
        inp.value = inp.value.slice(0, s) + String(val) + inp.value.slice(s);
        inp.focus();
      }
    }
  }

  function removeEntry(idx) {
    const history = Session.get('calcHistory', []);
    history.splice(idx, 1);
    Session.set('calcHistory', history);
    renderFeed();
  }

  function renderFeed() {
    const feedEl = document.getElementById('resultsFeed');
    if (!feedEl) return;
    const history = Session.get('calcHistory', []);
    if (!history.length) { feedEl.innerHTML = ''; return; }
    feedEl.innerHTML = '';
    const mqTargets = [];

    history.forEach((h, idx) => {
      if (h.richHtml) {
        // Rich result (inference, stats)
        const item = document.createElement('div');
        item.className = 'rf-rich';
        const hdr = document.createElement('div');
        hdr.className = 'rf-rich-header';
        const exprEl = document.createElement('span');
        exprEl.className = 'rf-rich-expr';
        exprEl.textContent = h.expr;
        exprEl.title = 'Click to re-enter expression';
        exprEl.onclick = (e) => { e.stopPropagation(); loadExpr(h); };
        hdr.appendChild(exprEl);
        if (h.keyValue != null) {
          const keyEl = document.createElement('span');
          keyEl.className = 'rf-rich-key';
          keyEl.textContent = h.keyValue;
          keyEl.title = 'Click to insert value';
          keyEl.onclick = (e) => { e.stopPropagation(); insertAnswer(h.keyValue); };
          hdr.appendChild(keyEl);
        }
        const colBtn = document.createElement('button');
        colBtn.className = 'rf-collapse';
        colBtn.textContent = '▾';
        colBtn.title = 'Collapse/expand';
        colBtn.onclick = (e) => { e.stopPropagation(); item.classList.toggle('collapsed'); };
        hdr.appendChild(colBtn);
        const delBtn = document.createElement('button');
        delBtn.className = 'rf-del';
        delBtn.textContent = '✕';
        delBtn.title = 'Remove';
        delBtn.onclick = (e) => { e.stopPropagation(); removeEntry(idx); };
        hdr.appendChild(delBtn);
        if (idx === 0 && history.length > 1) {
          const clearBtn = document.createElement('button');
          clearBtn.className = 'rf-clear-btn';
          clearBtn.style.opacity = '0.5';
          clearBtn.innerHTML = 'clear<br>feed';
          clearBtn.onclick = (e) => { e.stopPropagation(); Session.set('calcHistory', []); renderFeed(); };
          hdr.appendChild(clearBtn);
        }
        item.appendChild(hdr);
        const body = document.createElement('div');
        body.className = 'rf-rich-body';
        body.innerHTML = h.richHtml;
        item.appendChild(body);
        feedEl.appendChild(item);
      } else {
        // Simple result row
        const item = document.createElement('div');
        item.className = 'rf-item';
        const exprSpan = document.createElement('span');
        exprSpan.className = 'rf-expr';
        exprSpan.title = 'Click to re-enter expression';
        if (h.latex) {
          mqTargets.push({ el: exprSpan, latex: h.latex });
        } else {
          exprSpan.textContent = h.expr;
        }
        exprSpan.onclick = (e) => { e.stopPropagation(); loadExpr(h); };
        const eqSpan = document.createElement('span');
        eqSpan.className = 'rf-eq';
        eqSpan.textContent = '=';
        const ansSpan = document.createElement('span');
        ansSpan.className = 'rf-ans';
        ansSpan.textContent = h.result !== null ? M.fmt(h.result, 8) : '\u2014';
        ansSpan.title = 'Click to insert at cursor';
        if (h.result !== null) {
          ansSpan.onclick = (e) => { e.stopPropagation(); insertAnswer(M.fmt(h.result, 10)); };
        }
        const delBtn = document.createElement('button');
        delBtn.className = 'rf-del';
        delBtn.textContent = '✕';
        delBtn.title = 'Remove';
        delBtn.onclick = (e) => { e.stopPropagation(); removeEntry(idx); };
        item.appendChild(exprSpan);
        item.appendChild(eqSpan);
        item.appendChild(ansSpan);
        item.appendChild(delBtn);
        if (idx === 0 && history.length > 1) {
          const clearBtn = document.createElement('button');
          clearBtn.className = 'rf-clear-btn';
          clearBtn.innerHTML = 'clear<br>feed';
          clearBtn.onclick = (e) => { e.stopPropagation(); Session.set('calcHistory', []); renderFeed(); };
          item.appendChild(clearBtn);
        }
        feedEl.appendChild(item);
      }
    });

    // Deferred MathQuill rendering
    if (mqTargets.length && typeof MathQuill !== 'undefined') {
      requestAnimationFrame(() => {
        try {
          const MQ = MathQuill.getInterface(2);
          mqTargets.forEach(t => {
            try {
              const mqSpan = document.createElement('span');
              t.el.innerHTML = '';
              t.el.appendChild(mqSpan);
              MQ.StaticMath(mqSpan).latex(t.latex);
            } catch(e) { t.el.textContent = t.latex; }
          });
        } catch(e) {}
      });
    }

    // Auto-scroll to bottom (newest)
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  document.addEventListener('calc-history-change', renderFeed);
  setTimeout(renderFeed, 50);
  return card;
}
