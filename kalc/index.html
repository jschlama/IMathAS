  // ─── Did-you-mean suggestions for unknown functions ───
  suggest(name) {
    const lower = name.toLowerCase();
    const allNames = Object.keys(this.registry).concat(Object.keys(this.aliases));
    // Find closest by prefix
    const prefixMatches = allNames.filter(n => n.startsWith(lower.slice(0, 2)));
    if (prefixMatches.length) return prefixMatches.slice(0, 3);
    return [];
  },

  // ─── Resolve a named list reference or inline list literal ───
  resolveList(token) {
    token = token.trim();
    // Inline list: [1, 2, 3]
    if (token.startsWith('[') && token.endsWith(']')) {
      const inner = token.slice(1, -1);
      const parsed = M.parse(inner);
      if (!parsed.length) throw { msg: 'Empty list: ' + token, hint: 'Add values: [1, 2, 3]' };
      return parsed;
    }
    // Named list reference
    const name = token.toUpperCase();
    if (DataLists.has(name)) {
      return M.parse(DataLists.get(name));
    }
    // Check if it's a bare inline list without brackets (just numbers)
    const bare = M.parse(token);
    if (bare.length > 0 && bare.length === token.split(/[,\s]+/).filter(v => v).length) {
      return bare;
    }
    throw { msg: `No list named "${token}".`, hint: `Define it first: ${token} = [1, 2, 3]` };
  },

  // ─── Parse and execute an expression ───
  evaluate(input, latex) {
    let raw = input.trim();
    if (!raw) return null;

    // Store latex for graph handler
    this._currentLatex = latex || null;

    // Convert |expr| to abs(expr) — handle nested pipes from outside in
    while (/\|([^|]+)\|/.test(raw)) {
      raw = raw.replace(/\|([^|]+)\|/, 'abs($1)');
    }

    // Convert √ symbol to sqrt
    raw = raw.replace(/√/g, 'sqrt');

    // Convert n! to factorial(n) — handles integers and parenthesized expressions
    raw = raw.replace(/(\d+(?:\.\d+)?)!/g, 'factorial($1)'); // the decimal too: 5.5! used to become 5.factorial(5)
    raw = raw.replace(/\(([^)]+)\)!/g, 'factorial($1)');

    // Allow single-arg functions without parentheses: sin 30 → sin(30), sqrt 144 → sqrt(144)
    // Matches: funcname followed by a space then a numeric expression (number, pi, e, or expression with no commas)
    const bareArgFns = ['sin','cos','tan','asin','acos','atan','sqrt','cbrt','ln','log','exp','abs','round','factorial'];
    const bareRe = new RegExp('\\b(' + bareArgFns.join('|') + ')\\s+([^,=\\[\\]]+?)\\s*$', 'i');
    const bareMatch = raw.match(bareRe);
    if (bareMatch && !raw.includes('(')) {
      raw = raw.replace(bareRe, '$1($2)');
    }
    // Also handle mid-expression: 2 + sin 30 → 2 + sin(30)
    const bareReInline = new RegExp('\\b(' + bareArgFns.join('|') + ')\\s+([\\d.]+(?:\\s*[*/^]\\s*[\\d.a-z]+)*)', 'gi');
    raw = raw.replace(bareReInline, (match, fn, arg) => {
      // Only convert if fn isn't already followed by ( somewhere
      if (match.includes('(')) return match;
      return fn + '(' + arg.trim() + ')';
    });

    // Expand sequence/list generators (seq, arithseq, geomseq, recurseq) into
    // [v1, v2, ...] literals so they flow through assignment, stats, and plots.
    raw = this.expandSequences(raw);

    // Action: name -> expr (Desmos-style assignment action for buttons/tickers)
    if (/[A-Za-z]\w*\s*->/.test(raw)) {
      return this.handleAction(raw);
    }

    // Bare list literal → report it as a list
    if (/^\[[\s\S]*\]$/.test(raw)) {
      const data = M.parse(raw.slice(1, -1));
      if (data.length) return { type: 'list-info', name: null, val: null, data, label: `[${data.slice(0, 8).join(', ')}${data.length > 8 ? ', …' : ''}] (${data.length} values)` };
    }

    // 0) Point plotting: (x, y) or multiple (x1,y1) (x2,y2) ...
    // Single point: (3, 5) or (a, a^2) with slider params
    // Multiple points: (1,2) (3,4) (5,6) or (1,2);(3,4);(5,6)
    // One point whose coordinates hold parentheses of their own — (1.7, f(1.7)),
    // (2, sin(pi/6)) — which the plain pattern below cannot take: split at the
    // one top-level comma of a single balanced (…).
    {
      const t = raw.trim();
      if (t[0] === '(' && t[t.length - 1] === ')') {
        let depth = 0, comma = -1, closesAt = -1;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (c === '(' || c === '[') depth++;
          else if (c === ')' || c === ']') { depth--; if (depth === 0) { closesAt = i; break; } }
          else if (c === ',' && depth === 1) { if (comma >= 0) { comma = -2; break; } comma = i; }
        }
        if (closesAt === t.length - 1 && comma > 0) {
          const xExpr = t.slice(1, comma).trim(), yExpr = t.slice(comma + 1, -1).trim();
          if (xExpr && yExpr && /[()]/.test(xExpr + yExpr)) {
            return this.handlePointTuples([{ xExpr, yExpr }], raw);
          }
        }
      }
    }
    const tuplePattern = /^\s*\(\s*([^()]+?)\s*,\s*([^()]+?)\s*\)(?:\s*[;\s]\s*\(\s*([^()]+?)\s*,\s*([^()]+?)\s*\))*\s*$/;
    if (tuplePattern.test(raw) && !/^[a-zA-Z]+\s*\(/.test(raw)) {
      // Extract all (x,y) pairs
      const pairRe = /\(\s*([^(),]+?)\s*,\s*([^(),]+?)\s*\)/g;
      const pairs = [];
      let pm;
      while ((pm = pairRe.exec(raw)) !== null) {
        pairs.push({ xExpr: pm[1].trim(), yExpr: pm[2].trim() });
      }
      if (pairs.length > 0) {
        return this.handlePointTuples(pairs, raw);
      }
    }

    // 0sf) Slope field: dy/dx = f(x, y)  (also y' = …, and the (dy)/(dx) the
    // LaTeX converter makes of \frac{dy}{dx}). A field, not a curve: a lattice
    // of short segments, each with the slope at its own point.
    const fieldMatch = raw.match(/^(?:\(?\s*dy\s*\)?\s*\/\s*\(?\s*dx\s*\)?|y\s*['\u2032])\s*=\s*(.+)$/i);
    if (fieldMatch) {
      return this.handleSlopeField(fieldMatch[1].trim(), raw);
    }

    // 0par) Parametric equation: x = f(t), y = g(t), with an optional
    // restriction on t: x = t - sin(t), y = 1 - cos(t) {0 <= t <= 4pi}
    const paramCurve = this.splitCurveDomain(raw, 't');
    const paramMatch = paramCurve.body.match(/^x\s*=\s*(.+?)\s*,\s*y\s*=\s*(.+)$/i);
    if (paramMatch && /\bt\b/i.test(paramCurve.body)) {
      if (paramCurve.error) throw new Error(paramCurve.error);
      return this.handleParametric(paramMatch[1].trim(), paramMatch[2].trim(), raw, paramCurve.domain);
    }

    // 0p) Polar equation: r = f(theta) or r = f(θ), with an optional
    // restriction on theta: r = 2cos(2theta) {0 <= theta <= pi/4}. A
    // restricted constant (r = 2 {0 <= theta <= pi}) is polar too — an arc.
    const polarCurve = this.splitCurveDomain(raw.replace(/\u03B8/g, 'theta'), 'theta');
    const polarMatch = polarCurve.body.match(/^r\s*=\s*(.+)$/i);
    if (polarMatch && (/theta\b/i.test(polarMatch[1]) || polarCurve.domain)) {
      if (polarCurve.error) throw new Error(polarCurve.error);
      return this.handlePolar(polarMatch[1], raw, polarCurve.domain);
    }

    // 0pw) Bare piecewise: {cond: expr, …} with no leading y= — graph it like
    // y = {…} (matches Desmos and the Help examples).
    if (/^\{[\s\S]+:[\s\S]+\}$/.test(raw.trim()) && /\bx\b/i.test(raw)) {
      return this.handleGraph(raw.trim(), raw.trim());
    }

    // 0a-ineq) Inequality region: y <|<=|>|>= f(x) — shade the half-plane above
    // or below the boundary curve. Must run BEFORE the implicit (=) and y=f(x)
    // cases (a "<=" would otherwise be grabbed by the implicit-equation case).
    // A constant RHS (y < 3) shades against the horizontal line y = 3.
    const ineqMatch = raw.match(/^y\s*(<=|>=|<|>)\s*(.+)$/i);
    if (ineqMatch && !/\by\b/i.test(ineqMatch[2])) {
      const op = ineqMatch[1], ineqRhs = ineqMatch[2].trim();
      let curveRhs = null;
      if (/\bx\b/i.test(ineqRhs)) {
        curveRhs = ineqRhs;
      } else {
        try {
          const c = this.evaluate(ineqRhs);
          if (c && typeof c.val === 'number' && isFinite(c.val)) curveRhs = String(c.val);
        } catch(e) {}
      }
      if (curveRhs != null) {
        const res = this.handleGraph(curveRhs, raw);
        const e = Graph.expressions[Graph.expressions.length - 1];
        if (e) {
          e._fillSide = (op[0] === '>') ? 'above' : 'below';
          e._fillStrict = !op.includes('=');   // strict (<,>) → dashed boundary
          Graph.render(); // handleGraph already rendered, without the fill fields
        }
        return res;
      }
    }

    // 0a-ineqx) Vertical inequality: x <|<=|>|>= c — a vertical boundary line
    // at x = c with the left (<) or right (>) half-plane shaded. Same Desmos
    // conventions as the y-form: strict operator → dashed boundary line.
    const xIneqMatch = raw.match(/^x\s*(<=|>=|<|>)\s*(.+)$/i);
    if (xIneqMatch && !/\b[xy]\b/i.test(xIneqMatch[2])) {
      const op = xIneqMatch[1], xIneqRhs = xIneqMatch[2].trim();
      try {
        const c = this.evaluate(xIneqRhs);
        if (c && typeof c.val === 'number' && isFinite(c.val)) {
          Graph.addVLine(c.val, raw, this._currentLatex || null);
          const e = Graph.expressions[Graph.expressions.length - 1];
          if (e) {
            e._fillSide = (op[0] === '>') ? 'right' : 'left';
            e._fillStrict = !op.includes('=');
            Graph.render(); // addVLine already rendered, without the fill fields
          }
          return { type: 'graph', val: null, label: `Graphed: ${raw}`, viz: null };
        }
      } catch(e) {}
    }

    // 0a-ineqb) Compound inequality band: a < x < b (or <=) — the strip
    // between two vertical lines; a < y < b shades a horizontal band. Both
    // chain directions work (5 > x > -2 normalizes to -2 < x < 5), and each
    // bound keeps its own strictness for the dashed/solid boundary.
    const bandMatch = raw.match(/^(.+?)\s*(<=|<|>=|>)\s*([xy])\s*(<=|<|>=|>)\s*(.+)$/i);
    if (bandMatch && !/\b[xy]\b/i.test(bandMatch[1]) && !/\b[xy]\b/i.test(bandMatch[5])
        && bandMatch[2][0] === bandMatch[4][0]) {
      try {
        const v1 = this.evaluate(bandMatch[1].trim());
        const v2 = this.evaluate(bandMatch[5].trim());
        if (v1 && v2 && typeof v1.val === 'number' && typeof v2.val === 'number'
            && isFinite(v1.val) && isFinite(v2.val)) {
          let lo = v1.val, hi = v2.val;
          let loStrict = !bandMatch[2].includes('='), hiStrict = !bandMatch[4].includes('=');
          if (bandMatch[2][0] === '>') {
            lo = v2.val; hi = v1.val;
            loStrict = !bandMatch[4].includes('='); hiStrict = !bandMatch[2].includes('=');
          }
          if (lo < hi) {
            Graph.addBand(bandMatch[3].toLowerCase(), lo, hi, loStrict, hiStrict, raw, this._currentLatex || null);
            return { type: 'graph', val: null, label: `Graphed: ${raw}`, viz: null };
          }
        }
      } catch(e) {}
    }

    // 0a-ineqi) Implicit inequality: f(x,y) <op> g(x,y) — e.g. x+y < 10 or
    // x^2+y^2 <= 25. The boundary draws via the marching-squares implicit
    // renderer; the region where the inequality holds is filled from the same
    // sign grid. Must run BEFORE the implicit (=) case: "<=" contains '=' and
    // would otherwise be shredded at the equals sign.
    if (!/[{}]/.test(raw) && /\bx\b/i.test(raw) && /\by\b/i.test(raw)) {
      const gIneq = raw.match(/^([^<>=]+?)\s*(<=|>=|<|>)\s*([^<>=]+)$/);
      if (gIneq) {
        const iop = gIneq[2];
        const implicitRhs = `(${gIneq[1].trim()}) - (${gIneq[3].trim()})`;
        const win = { xMin: Graph.xMin, xMax: Graph.xMax, yMin: Graph.yMin, yMax: Graph.yMax };
        const res = this.handleGraph(implicitRhs, raw);
        const e = Graph.expressions[Graph.expressions.length - 1];
        if (e && e.implicitFn) {
          // A region has no meaningful bounding box — undo addSmart's implicit
          // auto-fit (a half-plane boundary spans the whole ±50 scan range,
          // which explodes the window) and keep the user's current view.
          Graph.xMin = win.xMin; Graph.xMax = win.xMax;
          Graph.yMin = win.yMin; Graph.yMax = win.yMax;
          e._regionOp = iop[0];              // fill where F<0 ('<') or F>0 ('>')
          e._fillStrict = !iop.includes('=');
          Graph.render(); // handleGraph already rendered, without the fill fields
        }
        return res;
      }
    }

    // 0a) Graph expression: y = f(x) or y = constant, or f(x) = expr
    const funcNotation = raw.match(/^([a-zA-Z])\s*\(\s*x\s*\)\s*=\s*(.+)$/);
    const graphMatch = raw.match(/^y\s*=\s*(.+)$/i) || funcNotation;
    if (graphMatch) {
      const rhs = funcNotation ? funcNotation[2] : graphMatch[1];
      if (funcNotation) Graph.namedFunctions[funcNotation[1].toLowerCase()] = rhs;
      // Desmos restricted-domain: "f(x) {restriction}" — a brace WITHOUT a colon
      // holding an inequality (y = x^2 {x > 0}, {-2 < x < 3}) OR interval notation
      // (y = x^2 {[0, 5]}, {(-2, 3]}). Render the curve only where the restriction
      // holds by reusing the piecewise engine: rewrite to "{restriction: f(x)}"
      // (compilePiecewise turns interval notation into inequalities). Disambiguated
      // from full piecewise by the absence of a ':' inside the brace.
      const restr = rhs.match(/^(.+?)\s*\{\s*([^:{}]+?)\s*\}\s*$/);
      if (restr && /\bx\b/i.test(rhs) &&
          (/[<>]/.test(restr[2]) || /^[\[(].*,.*[\])]$/.test(restr[2].trim()))) {
        return this.handleGraph(`{${restr[2].trim()}: ${restr[1].trim()}}`, raw);
      }
      if (/\bx\b/i.test(rhs)) {
        return this.handleGraph(rhs, raw);
      }
      // y = constant (no x) — horizontal line
      try {
        const constResult = this.evaluate(rhs);
        if (constResult && constResult.val !== null && typeof constResult.val === 'number') {
          return this.handleGraph(String(constResult.val), raw);
        }
      } catch(e) {}
      // If it has slider params, graph it anyway
      const params = Graph.detectParams(rhs);
      if (params.length > 0) {
        return this.handleGraph(rhs, raw);
      }
    }

    // 0a1) Vertical line: x = constant or x = f(y)
    const xEqMatch = raw.match(/^x\s*=\s*(.+)$/i);
    if (xEqMatch && !(/\bt\b/.test(raw) && /,/.test(raw))) {
      // Not parametric (x=..., y=...)
      const rhs = xEqMatch[1];
      try {
        let val;
        if (/\by\b/i.test(rhs)) {
          // x = f(y) — treat as implicit: x - f(y) = 0
          const implicitRhs = `(x) - (${rhs})`;
          return this.handleGraph(implicitRhs, raw);
        }
        const constResult = this.evaluate(rhs);
        if (constResult && constResult.val !== null && typeof constResult.val === 'number') {
          val = constResult.val;
          // True vertical line. (Routing "(x) - (val)" through handleGraph
          // fell through addSmart's implicit branch — which requires a `y`
          // in the expression — and compiled as the slanted line y = x - c.)
          Graph.addVLine(val, raw, this._currentLatex || null);
          return { type: 'graph', val: null, label: `Graphed: ${raw}`, viz: null };
        }
      } catch(e) {}
    }

    // 0a2) Implicit equation: both x and y present with = sign (e.g. x^2 + y^2 = 25)
    if (/=/.test(raw) && /\bx\b/i.test(raw) && /\by\b/i.test(raw)) {
      // Not y = f(x) — this is implicit
      const parts = raw.split('=');
      if (parts.length === 2) {
        const fullExpr = raw;
        const implicitRhs = `(${parts[0].trim()}) - (${parts[1].trim()})`;
        return this.handleGraph(implicitRhs, fullExpr);
      }
    }

    // 0b) Tilde regression: Y ~ model(X) — e.g. L2 ~ a + b*L1
    if (raw.includes('~')) {
      return this.handleTildeRegression(raw);
    }

    // 1) Assignment: NAME = value(s) or NAME = [values]
    const assignMatch = raw.match(/^([A-Za-z][A-Za-z0-9]{0,7})\s*=\s*(.+)$/);
    if (assignMatch) {
      return this.handleAssignment(assignMatch[1], assignMatch[2]);
    }

    // 2) Distribution method call: distname(params).method(args)
    const distMethodMatch = raw.match(/^([A-Za-z]+)\(([^)]*)\)\.(\w+)\(([^)]*)\)$/);
    if (distMethodMatch) {
      return this.handleDistMethod(distMethodMatch[1], distMethodMatch[2], distMethodMatch[3], distMethodMatch[4]);
    }

    // 2c) Calculus value: integral(a,b,expr) or nderiv(expr, point). These carry
    // a bound variable (x/t) so they must be compiled, not arithmetic-evaluated,
    // and must run before the generic function-call handler grabs them.
    if (/^(integral|nderiv)\s*\(/i.test(raw)) {
      return this.handleCalcValue(raw);
    }

    // 2c1) An indefinite ∫ typed in the math bar. Kalc is numeric — there is no
    // symbolic antiderivative — so say that plainly rather than guessing.
    if (raw.includes('_indefinite_integral_')) {
      throw {
        msg: 'Kalc evaluates definite integrals only.',
        hint: 'Add bounds to the ∫ (press _ and ^), or graph the accumulation function: y = integral(0, x, t^2)',
      };
    }

    // 2c2) Σ and lim. Matched ANYWHERE in the expression, not just as the whole
    // of it: a summand binds like a product, so "Σi² + 5" is a sum plus five
    // and has to compile as one expression.
    //
    // sum() is overloaded — sum(L1) and sum([1,2,3]) are the long-standing list
    // statistic (an alias of total) and must still fall through to
    // handleFunction. Arity decides, exactly as _rewriteCalculus does.
    if (/\b(?:sum|lim|limit)\s*\(/i.test(raw)) {
      const re = /\b(sum|lim|limit)\s*\(/gi;
      let m;
      while ((m = re.exec(raw)) !== null) {
        const open = m.index + m[0].length - 1;
        const close = Graph._matchParen(raw, open);
        if (close < 0) continue;
        const nm = m[1].toLowerCase();
        const nArgs = Graph._splitTopArgs(raw.slice(open + 1, close)).length;
        if ((nm === 'sum' && nArgs === 4) || (nm !== 'sum' && nArgs >= 3)) {
          return this.handleCalcValue(raw);
        }
      }
    }

    // 2d) Calculus graph builders: tangent(expr, a), riemann(a,b,n,expr[,type]),
    // area(a, b, expr).
    const calcGraphMatch = raw.match(/^(tangent|riemann|area)\s*\(([\s\S]*)\)$/i);
    if (calcGraphMatch) {
      const nm = calcGraphMatch[1].toLowerCase();
      if (nm === 'tangent') return this.handleTangent(calcGraphMatch[2]);
      if (nm === 'area') return this.handleArea(calcGraphMatch[2]);
      return this.handleRiemann(calcGraphMatch[2]);
    }

    // 3) Function call: funcname(args) — only when the "(" after the name
    // closes at the very END. The regex alone matched sqrt(2)/(2) with the
    // argument "2)/(2", which evaluated to sqrt(1) = 1 under a √ label; a
    // function inside arithmetic belongs to step 5b below.
    const funcMatch = raw.match(/^([A-Za-z]\w*)\((.+)\)$/s);
    if (funcMatch && Graph._matchParen(raw, funcMatch[1].length) === raw.length - 1) {
      return this.handleFunction(funcMatch[1], funcMatch[2]);
    }

    // 4) Simple name reference: "L1" or "x" — show stored value
    const simpleRef = raw.match(/^([A-Za-z][A-Za-z0-9]{0,7})$/);
    if (simpleRef) {
      const upper = simpleRef[1].toUpperCase();
      const pretty = this.fmtName(upper);
      // Check variables first (single values)
      const vars = Session.get('exprVars', {});
      if (upper in vars) {
        return { type: 'value', val: vars[upper], label: pretty };
      }
      // Check data lists
      if (DataLists.has(upper)) {
        const data = M.parse(DataLists.get(upper));
        return {
          type: 'list-info', name: upper, val: null,
          label: `${pretty}: ${data.length} values [${data.slice(0, 5).join(', ')}${data.length > 5 ? ', \u2026' : ''}]`,
          data: data
        };
      }
    }

    // 5) Arithmetic with variable substitution
    try {
      let e = this.substituteVars(raw);
      e = e.replace(/\^/g, '**').replace(/\u00D7/g, '*').replace(/\u00F7/g, '/').replace(/\u2212/g, '-');
      // The graph compiler's own repairs, so this path reads what it reads:
      // -2^2 is -(2^2) (JS refuses -2**2 outright, which used to surface as
      // "Could not parse"), and 2(3) multiplies. Step 5b never saw these —
      // it is gated on the expression containing a letter.
      e = Graph._fixUnaryPow(e);
      e = Graph._implicitMul(e);
      e = e.replace(/\bpi\b/gi, 'Math.PI');
      // A bare 'e' is Euler's number; one that follows a digit is the
      // exponent marker of a numeric literal (1e+21) and stays put.
      e = e.replace(/(?<![A-Za-z0-9.])e(?![A-Za-z0-9])/g, 'Math.E');
      // Allow safe math expressions
      const safeCheck = e.replace(/Math\.\w+/g, '').replace(/[0-9+\-*/().%\s,]/g, '');
      if (safeCheck.length === 0 || /^[eE]*$/.test(safeCheck)) {
        const r = Function('"use strict";return(' + e + ')')();
        if (typeof r === 'number' && isFinite(r)) {
          return { type: 'value', val: r, label: null };
        }
        if (typeof r === 'number') throw this._noFiniteValue();
      }
    } catch(err) { if (err && err.msg) throw err; /* else fall through */ }

    // 5b) A scalar expression with functions IN it: 2*sin(1)+1, sqrt(2)/2,
    // nCr(5,2)*2. Step 3 handles one whole call and step 5 refuses letters,
    // so every mixed form used to end here as "Could not parse". The graph
    // compiler already knows every function; a result that doesn't move
    // across three probe values of x is a constant.
    if (/[A-Za-z]/.test(raw)) {
      // First reduce every registry call to its number — mean([1,2,3])+1,
      // nCr(5,2)*2 — the graph compiler knows neither list literals nor the
      // stats functions, and the engine already evaluates each call alone.
      const reduced = this._reduceCalls(raw);
      if (reduced !== raw) return this.evaluate(reduced, latex);
      let fn = null;
      try { fn = Graph._buildFn(Graph._compileExpr(this.substituteVars(raw))); } catch (e) { fn = null; }
      if (fn) {
        const probes = [0, 1, 0.7317];
        let vals = null, callErr = null;
        try { vals = probes.map(x => fn(x)); } catch (err) { callErr = err; }
        if (callErr) {
          const nm = String(callErr.message || '').match(/^(\w+) is not (?:defined|a function)/);
          if (nm) {
            throw { msg: `"${nm[1]}" isn't a function or variable the calculator knows.`,
                    hint: 'Check the spelling, or open Help for the list of functions.' };
          }
        } else if (vals.every(v => typeof v === 'number')) {
          if (vals.every(v => isFinite(v))) {
            if (vals.every(v => Math.abs(v - vals[0]) < 1e-9)) return { type: 'value', val: vals[0], label: null };
            // A question's graph (?question=1) works like Desmos: an
            // expression in x is a curve, as if "y =" were typed before it.
            if (window._kalcBareGraphs) return this.evaluate('y=' + raw, latex ? 'y=' + latex : latex);
            throw { msg: 'That expression depends on x, so it has no single value.', hint: `Graph it: y = ${raw}` };
          }
          if (vals.every(v => !isFinite(v))) throw this._noFiniteValue();
        }
      }
    }

    if (/[+\-*/^(,]\s*$/.test(raw)) {
      throw { msg: 'That expression is incomplete.', hint: 'It ends with an operator — add the missing number or term.' };
    }
    throw { msg: `Could not parse: "${raw}"`, hint: 'Try: x = 3, mean([1,2,3]), or L1 = [10, 20, 30]' };
  },

  // Replace each registry function call INSIDE a longer expression with its
  // numeric value, e.g. "nCr(5,2)*2" → "(10)*2". A call whose arguments
  // mention x/y/t/θ is left alone (it is a curve, not a number), and a call
  // that raises a domain error surfaces that error rather than falling out
  // as "could not parse". Returns the input unchanged when nothing reduced.
  _reduceCalls(raw) {
    let s = raw;
    const re = /\b([A-Za-z]\w*)\s*\(/g;
    let m, guard = 0;
    while ((m = re.exec(s)) !== null && guard++ < 50) {
      const name = m[1];
      const known = this.registry[name.toLowerCase()] || this.aliases[name.toLowerCase()] || this.aliases[name];
      const open = m.index + m[0].length - 1;
      const close = Graph._matchParen(s, open);
      if (!known || close < 0) continue;
      if (m.index === 0 && close === s.length - 1) return s; // the whole thing is one call
      const call = s.slice(m.index, close + 1);
      if (/\b(x|y|t|theta)\b|\u03B8/i.test(call)) continue;
      const r = this.evaluate(call);
      if (!r || r.type !== 'value' || typeof r.val !== 'number' || !isFinite(r.val)) return s;
      s = s.slice(0, m.index) + '(' + r.val + ')' + s.slice(close + 1);
      re.lastIndex = 0;
    }
    return s;
  },

  _noFiniteValue() {
    return { msg: 'That expression has no finite value.',
             hint: 'Check for division by zero or a domain error (like the square root of a negative number).' };
  },

  // ─── Substitute variable names with their values in an expression ───
  substituteVars(expr) {
    const vars = Session.get('exprVars', {});
    // Replace variable references (uppercase letters/names not followed by '(' which would be functions)
    return expr.replace(/\b([A-Za-z][A-Za-z0-9]{0,7})\b(?!\s*\()/g, (match) => {
      const upper = match.toUpperCase();
      // Don't replace known function names, Math constants, or reserved words
      if (this.registry[match.toLowerCase()] || this.aliases[match.toLowerCase()] || this.aliases[match]) return match;
      if (['PI', 'E', 'ANS', 'MATH', 'NAN', 'INFINITY'].includes(upper)) return match;
      if (upper in vars) return String(vars[upper]);
      return match;
    });
  },

  // ─── Evaluate a calculus expression to a single number ───
  // integral(a, b, expr) and nderiv(expr, point) reduce to constants. If the
  // expression still varies with x (e.g. an accumulation integral(0, x, t^2)),
  // it's a function and belongs on the graph, so we steer the user to "y = ".
  handleCalcValue(raw) {
    const isSum = /^sum\s*\(/i.test(raw);
    const isLim = /^lim(?:it)?\s*\(/i.test(raw);
    try {
      const code = Graph._buildFn(Graph._compileExpr(raw));
      const v0 = code(0);
      const v1 = code(1);
      if (typeof v0 === 'number' && isFinite(v0)) {
        if (Math.abs(v0 - v1) > 1e-9) {
          throw { msg: 'That is a function of x.', hint: 'Prefix with "y =" to graph it, e.g. y = integral(0, x, t^2)' };
        }
        return { type: 'value', val: v0, label: null };
      }
      // An infinite limit is an ANSWER, not a failure — report it as one.
      if (isLim && (v0 === Infinity || v0 === -Infinity)) {
        return { type: 'value', val: v0, label: v0 > 0 ? '∞' : '-∞' };
      }
      // NaN out of Σ/lim means the evaluator declined to certify a value.
      // Say which, rather than "could not evaluate" — for these two, "it
      // doesn't converge" / "it doesn't exist" is the actual result.
      if (isSum && Number.isNaN(v0)) {
        throw {
          msg: 'That series does not converge to a value.',
          hint: 'Kalc sums a series only when it can confirm convergence. Check the terms — Σ1/n grows without bound.',
        };
      }
      if (isLim && Number.isNaN(v0)) {
        throw {
          msg: 'The limit does not exist.',
          hint: 'The two sides disagree or the values oscillate. Try one side: lim(abs(x)/x, x, 0, 1) for the right, -1 for the left.',
        };
      }
    } catch (err) {
      if (err && err.hint) throw err;
    }
    if (isSum) throw { msg: `Could not evaluate "${raw}"`, hint: 'Try sum(i^2, i, 1, 10) or sum(1/n^2, n, 1, infinity)' };
    if (isLim) throw { msg: `Could not evaluate "${raw}"`, hint: 'Try lim(sin(x)/x, x, 0)' };
    throw { msg: `Could not evaluate "${raw}"`, hint: 'Try integral(0, 1, x^2) or nderiv(x^2, 3)' };
  },

  // ─── Tangent line: tangent(expr, a) → graph y = f(a) + f'(a)(x - a) ───
  handleTangent(argStr) {
    const args = Graph._splitTopArgs(argStr);
    if (args.length < 2) throw { msg: 'tangent needs an expression and a point.', hint: 'tangent(x^2, 3)' };
    let fn, a;
    try {
      fn = Graph._buildFn(Graph._compileExpr(args[0]));
      a = Graph._buildFn(Graph._compileExpr(args[1]))(0);
    } catch (e) { throw { msg: 'Could not read tangent arguments.', hint: 'tangent(x^2, 3)' }; }
    if (!isFinite(a)) throw { msg: 'Tangent point must be a number.', hint: 'tangent(x^2, 3)' };
    const h = (Math.abs(a) > 1 ? Math.abs(a) : 1) * 1e-6;
    const slope = (fn(a + h) - fn(a - h)) / (2 * h);
    const fa = fn(a);
    if (!isFinite(slope) || !isFinite(fa)) throw { msg: 'Function is undefined at that point.', hint: 'Pick a point inside the domain.' };
    const lineExpr = `(${slope})*(x - (${a})) + (${fa})`;
    const res = this.handleGraph(lineExpr, `tangent to ${args[0].trim()} at x=${M.fmt(a, 4)}`);
    const entry = Graph.expressions[Graph.expressions.length - 1];
    if (entry) entry._tangentPoint = { x: a, y: fa };
    Graph.render();
    return res;
  },

  // ─── Riemann sum: riemann(a, b, n, expr [, left|right|mid]) ───
  // Draws n rectangles on the graph and reports the approximate area.
  handleRiemann(argStr) {
    const args = Graph._splitTopArgs(argStr);
    if (args.length < 4) throw { msg: 'riemann needs a, b, n, and an expression.', hint: 'riemann(0, 2, 8, x^2, left)' };
    let a, b, n, fn;
    try {
      a = Graph._buildFn(Graph._compileExpr(args[0]))(0);
      b = Graph._buildFn(Graph._compileExpr(args[1]))(0);
      n = Math.round(Graph._buildFn(Graph._compileExpr(args[2]))(0));
      fn = Graph._buildFn(Graph._compileExpr(args[3]));
    } catch (e) { throw { msg: 'Could not read riemann arguments.', hint: 'riemann(0, 2, 8, x^2, left)' }; }
    if (!isFinite(a) || !isFinite(b) || !Number.isFinite(n) || n < 1) {
      throw { msg: 'Check a, b, and n.', hint: 'n must be a positive integer.' };
    }
    n = Math.min(n, 500); // sanity cap on rectangle count
    let type = String(args[4] || 'left').toLowerCase().replace(/[^a-z]/g, '');
    if (type === 'midpoint') type = 'mid';
    if (!['left', 'right', 'mid'].includes(type)) type = 'left';
    const dx = (b - a) / n;
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const xl = a + i * dx;
      const xs = type === 'right' ? xl + dx : (type === 'mid' ? xl + dx / 2 : xl);
      const v = fn(xs);
      if (isFinite(v)) sum += v * dx;
    }
    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    Graph.expressions.push({
      id, expr: `riemann ${type} (n=${n})`, rawExpr: '',
      latex: '\\text{Riemann sum}', fn: null,
      color, visible: true, lineWidth: 1, dash: [],
      plainLabel: true,
      // `src` is the integrand's source text. `fn` can't be serialized, so a
      // saved state carries `src` and kovalna-load recompiles from it.
      riemannData: { a, b, n, type, fn, src: String(args[3]).trim() }
    });
    Graph.panel.classList.add('visible');
    Graph.updateRows(); Graph.render();
    return { type: 'graph', val: sum, label: `Riemann (${type}, n=${n}) ≈ ${M.fmt(sum, 6)}`, viz: null };
  },

  // ─── Area under a curve: area(a, b, expr) → shade region + report ∫ ───
  handleArea(argStr) {
    const args = Graph._splitTopArgs(argStr);
    if (args.length < 3) throw { msg: 'area needs a, b, and an expression.', hint: 'area(0, 2, x^2)' };
    let a, b, fn;
    try {
      a = Graph._buildFn(Graph._compileExpr(args[0]))(0);
      b = Graph._buildFn(Graph._compileExpr(args[1]))(0);
      fn = Graph._buildFn(Graph._compileExpr(args[2]));
    } catch (e) { throw { msg: 'Could not read area arguments.', hint: 'area(0, 2, x^2)' }; }
    if (!isFinite(a) || !isFinite(b)) throw { msg: 'Bounds must be numbers.', hint: 'area(0, 2, x^2)' };
    // Signed area via composite Simpson's rule.
    const integrate = (f, lo, hi) => {
      if (lo === hi) return 0;
      let sgn = 1; if (lo > hi) { const t = lo; lo = hi; hi = t; sgn = -1; }
      const n = 1000, h = (hi - lo) / n;
      let sum = f(lo) + f(hi);
      for (let i = 1; i < n; i++) sum += (i & 1 ? 4 : 2) * f(lo + i * h);
      return sgn * sum * h / 3;
    };
    const val = integrate(fn, a, b);
    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    Graph.expressions.push({
      id, expr: `area under ${args[2].trim()} on [${M.fmt(a, 3)}, ${M.fmt(b, 3)}]`, rawExpr: '',
      latex: '\\text{area}', fn: null,
      color, visible: true, lineWidth: 1, dash: [],
      plainLabel: true,
      // `src` lets kovalna-load recompile `fn`, which JSON can't carry.
      areaData: { a, b, fn, src: args[2].trim() }
    });
    Graph.panel.classList.add('visible');
    Graph.updateRows(); Graph.render();
    return { type: 'graph', val, label: `Area on [${M.fmt(a, 3)}, ${M.fmt(b, 3)}] ≈ ${M.fmt(val, 6)}`, viz: null };
  },

  // ─── Expand sequence/list generators into [v1, v2, ...] literals ───
  // Supports: seq(formula, var, from, to[, step]) — list comprehension;
  //           arithseq(a1, d, n); geomseq(a1, r, n);
  //           recurseq(first, stepExpr, n) — stepExpr uses `prev` and `n`.
  // Running before the rest of evaluate() lets sequences flow through
  // assignment, stats functions, tables, and plotting unchanged.
  expandSequences(str) {
    let s = String(str);
    const CAP = 100000;
    const round = v => Math.round(v * 1e9) / 1e9;
    const toList = arr => '[' + arr.map(v => isFinite(v) ? round(v) : 0).join(', ') + ']';
    const evalNum = e => { try { return Graph._buildFn(Graph._compileExpr(e))(0); } catch (err) { return NaN; } };

    const replaceFn = (name, builder) => {
      const re = new RegExp('\\b' + name + '\\s*\\(', 'g');
      for (let guard = 0; guard < 50; guard++) {
        re.lastIndex = 0;
        let m = null, cand;
        while ((cand = re.exec(s)) !== null) {
          // Skip method calls — normaldist(0,1).random(5) is the DISTRIBUTION'S
          // .random, not the list function.
          if (cand.index > 0 && s[cand.index - 1] === '.') continue;
          m = cand; break;
        }
        if (!m) break;
        const open = m.index + m[0].length - 1;
        const close = Graph._matchParen(s, open);
        if (close < 0) break;
        const args = Graph._splitTopArgs(s.slice(open + 1, close));
        let repl;
        try { repl = builder(args); } catch (e) { repl = null; }
        s = s.slice(0, m.index) + (repl == null ? '[]' : repl) + s.slice(close + 1);
      }
    };

    // ── Desmos list comprehension: [expr for var=a...b] or [expr for var=list] ──
    // Runs before the ellipsis expander (whose bracket regex skips 'for'
    // bodies would otherwise mangle the range inside the comprehension).
    for (let guard = 0; guard < 20; guard++) {
      const cm = s.match(/\[([^\[\]]+?)\s+for\s+([a-zA-Z]\w*)\s*=\s*(\[[^\[\]]*\]|[^\[\]]+?)\]/);
      if (!cm) break;
      const body = cm[1], varName = cm[2], srcTxt = cm[3].trim();
      let src = null;
      const rng = srcTxt.match(/^(.+?)\.\.\.(.+)$/);
      if (rng) {
        const from = evalNum(rng[1]), to = evalNum(rng[2]);
        if ([from, to].every(isFinite)) {
          const step = to >= from ? 1 : -1;
          const cnt = Math.floor(Math.abs(to - from) + 1e-9);
          if (cnt <= CAP) { src = []; for (let i = 0; i <= cnt; i++) src.push(from + i * step); }
        }
      } else if (/^\[[\s\S]*\]$/.test(srcTxt)) {
        src = M.parse(srcTxt.slice(1, -1));
      } else {
        const lists = Session.get('dataLists', {});
        const key = Object.keys(lists).find(k => k.toUpperCase() === srcTxt.toUpperCase());
        if (key != null) src = M.parse(String(lists[key]));
      }
      let repl = '[]';
      if (src && src.length) {
        try {
          const fn = Graph._buildFn(Graph._compileExpr(body, [varName]), [varName]);
          repl = toList(src.map(v => fn(0, { [varName]: v })));
        } catch (e) {}
      }
      s = s.slice(0, cm.index) + repl + s.slice(cm.index + cm[0].length);
    }

    // ── Desmos ellipsis lists: [1...10] (step ±1), [1, 3, ..., 21] (step
    // from the first two terms) ──
    for (let guard = 0; guard < 20; guard++) {
      const em = s.match(/\[([^\[\]]*?\.\.\.[^\[\]]*?)\]/);
      if (!em) break;
      const inner = em[1];
      let repl = null;
      let mm = inner.match(/^\s*([^,]+?)\s*,\s*([^,]+?)\s*,\s*\.\.\.\s*,?\s*([^,]+?)\s*$/);
      if (mm) {
        const a = evalNum(mm[1]), b = evalNum(mm[2]), z = evalNum(mm[3]);
        const step = b - a;
        if ([a, b, z].every(isFinite) && step !== 0 && (z - a) / step >= 0) {
          const cnt = Math.floor((z - a) / step + 1e-9);
          if (cnt <= CAP) { const out = []; for (let i = 0; i <= cnt; i++) out.push(a + i * step); repl = toList(out); }
        }
      } else {
        mm = inner.match(/^\s*([^,]+?)\s*,?\s*\.\.\.\s*,?\s*([^,]+?)\s*$/);
        if (mm) {
          const a = evalNum(mm[1]), z = evalNum(mm[2]);
          if ([a, z].every(isFinite)) {
            const step = z >= a ? 1 : -1;
            const cnt = Math.floor(Math.abs(z - a) + 1e-9);
            if (cnt <= CAP) { const out = []; for (let i = 0; i <= cnt; i++) out.push(a + i * step); repl = toList(out); }
          }
        }
      }
      if (repl == null) break; // malformed — leave for the normal error path
      s = s.slice(0, em.index) + repl + s.slice(em.index + em[0].length);
    }

    replaceFn('seq', args => {
      if (args.length < 4) return null;
      const formula = args[0];
      const varName = (args[1].match(/[a-zA-Z]+/) || ['n'])[0];
      const from = evalNum(args[2]), to = evalNum(args[3]);
      const step = args[4] ? evalNum(args[4]) : 1;
      if (![from, to, step].every(isFinite) || step === 0) return null;
      const cnt = Math.floor((to - from) / step + 1e-9);
      if (cnt < 0 || cnt > CAP) return null;
      const fn = Graph._buildFn(Graph._compileExpr(formula, [varName]), [varName]);
      const out = [];
      for (let i = 0; i <= cnt; i++) out.push(fn(0, { [varName]: from + i * step }));
      return toList(out);
    });

    replaceFn('arithseq', args => {
      if (args.length < 3) return null;
      const a1 = evalNum(args[0]), d = evalNum(args[1]), n = Math.round(evalNum(args[2]));
      if (![a1, d].every(isFinite) || !(n >= 1) || n > CAP) return null;
      const out = []; for (let k = 0; k < n; k++) out.push(a1 + k * d); return toList(out);
    });

    replaceFn('geomseq', args => {
      if (args.length < 3) return null;
      const a1 = evalNum(args[0]), r = evalNum(args[1]), n = Math.round(evalNum(args[2]));
      if (![a1, r].every(isFinite) || !(n >= 1) || n > CAP) return null;
      const out = []; let cur = a1; for (let k = 0; k < n; k++) { out.push(cur); cur *= r; } return toList(out);
    });

    replaceFn('recurseq', args => {
      if (args.length < 3) return null;
      const first = evalNum(args[0]), stepExpr = args[1], n = Math.round(evalNum(args[2]));
      if (!isFinite(first) || !(n >= 1) || n > CAP) return null;
      const fn = Graph._buildFn(Graph._compileExpr(stepExpr, ['prev', 'n']), ['prev', 'n']);
      const out = [first]; let prev = first;
      for (let k = 2; k <= n; k++) { const v = fn(0, { prev, n: k }); out.push(v); prev = v; }
      return toList(out);
    });

    // ── List operations (Desmos parity): sort, shuffle, unique, join ──
    // Registered AFTER the generators so their arguments arrive already
    // expanded; nested list-op calls expand recursively. Same textual
    // strategy, so results compose: mean(sort(L1)), L2 = shuffle(L1), …
    const resolveListArg = (txt) => {
      let t = String(txt || '').trim();
      if (/[a-z]\w*\s*\(/i.test(t)) t = this.expandSequences(t);
      if (/^\[[\s\S]*\]$/.test(t)) return M.parse(t.slice(1, -1));
      const lists = Session.get('dataLists', {});
      const key = Object.keys(lists).find(k => k.toUpperCase() === t.toUpperCase());
      return key != null ? M.parse(String(lists[key])) : null;
    };

    replaceFn('sort', args => {
      const d = resolveListArg(args[0]);
      if (!d || !d.length) return null;
      if (args[1] != null) {
        // sort(values, keys) — order `values` by ascending `keys` (Desmos)
        const k = resolveListArg(args[1]);
        if (!k || k.length !== d.length) return null;
        return toList(d.map((v, i) => [v, k[i]]).sort((a, b) => a[1] - b[1]).map(p => p[0]));
      }
      return toList([...d].sort((a, b) => a - b));
    });

    replaceFn('shuffle', args => {
      const d = resolveListArg(args[0]);
      if (!d || !d.length) return null;
      const out = [...d];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return toList(out);
    });

    replaceFn('unique', args => {
      const d = resolveListArg(args[0]);
      if (!d) return null;
      const seen = new Set(); const out = [];
      d.forEach(v => { const k = String(v); if (!seen.has(k)) { seen.add(k); out.push(v); } });
      return toList(out);
    });

    replaceFn('join', args => {
      if (args.length < 2) return null;
      const out = [];
      for (const a of args) {
        const d = resolveListArg(a);
        if (d) { out.push(...d); continue; }
        const v = evalNum(a);           // scalars join in too: join(L1, 99)
        if (!isFinite(v)) return null;
        out.push(v);
      }
      return toList(out);
    });

    // Desmos random(): () → one U(0,1); (n) → n of them; (list) → one
    // element; (list, n) → n elements without replacement. Integer random
    // numbers stay with randint(lo, hi, n).
    replaceFn('random', args => {
      const a0 = (args[0] || '').trim();
      if (!a0) return String(Math.random());
      const d = resolveListArg(a0);
      if (d && d.length) {
        if (args[1] != null) {
          const n = Math.round(evalNum(args[1]));
          if (!(n >= 1)) return null;
          const pool = [...d];
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }
          return toList(pool.slice(0, Math.min(n, pool.length)));
        }
        return String(round(d[Math.floor(Math.random() * d.length)]));
      }
      const n = Math.round(evalNum(a0));
      if (!(n >= 1) || n > CAP) return null;
      const out = [];
      for (let i = 0; i < n; i++) out.push(Math.random());
      return toList(out);
    });

    return s;
  },

  // ─── Action: name -> expr [, name -> expr] (buttons / tickers) ───
  // Defines an action that, when run, sets stored variables to the evaluated
  // right-hand sides (computed simultaneously, then assigned). Curves that use
  // those variables are recompiled so they react — enabling simulations.
  handleAction(raw) {
    const parts = Graph._splitTopArgs(raw);
    const assigns = [];
    for (const p of parts) {
      const m = p.match(/^([A-Za-z][A-Za-z0-9]{0,7})\s*->\s*(.+)$/);
      if (!m) throw { msg: 'Action syntax: name -> expression', hint: 'e.g. a -> a + 1' };
      assigns.push({ name: m[1], expr: m[2].trim() });
    }
    if (!assigns.length) throw { msg: 'No actions found.', hint: 'e.g. a -> a + 1' };
    // Seed referenced variables at 0 so the first run works without a setup line.
    const vars = Session.get('exprVars', {});
    let changed = false;
    assigns.forEach(a => { const u = a.name.toUpperCase(); if (!(u in vars)) { vars[u] = 0; changed = true; } });
    if (changed) Session.set('exprVars', vars);
    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    const text = assigns.map(a => `${a.name} → ${a.expr}`).join(',  ');
    Graph.expressions.push({
      id, expr: text, rawExpr: '', latex: '', fn: null,
      color, visible: true, lineWidth: 0, dash: [],
      plainLabel: true, action: { assigns }
    });
    Graph.panel.classList.add('visible');
    Graph.updateRows();
    return { type: 'action', val: null, label: `Action added: ${text}` };
  },

  // ─── Handle assignment — single value OR list ───
  handleAssignment(name, valueStr) {
    const upper = name.toUpperCase();
    const pretty = this.fmtName(upper);
    if (['PI', 'E', 'ANS'].includes(upper)) {
      throw { msg: `"${upper}" is a reserved name.`, hint: 'Use a different name like x, count, L1' };
    }
    const trimmed = valueStr.trim();

    // Try to evaluate as a single numeric expression first
    // (handles: x = 3, y = 2+3, z = sqrt(16), r = mean(L1))
    if (!trimmed.startsWith('[')) {
      try {
        const result = this.evaluate(trimmed);
        if (result && result.val !== null && typeof result.val === 'number') {
          // Store as a variable (single value)
          const vars = Session.get('exprVars', {});
          vars[upper] = result.val;
          Session.set('exprVars', vars);
          return {
            type: 'assignment', name: upper, count: 1, val: result.val,
            label: `${pretty} \u2190 ${M.fmt(result.val, 10)}`
          };
        }
        // List-producing results carry a data array (distribution .random(n);
        // sequence generators and list ops expand textually before this) \u2014
        // store as a list. Without this, the M.parse fallback below would
        // scrape numbers out of the SOURCE TEXT (0, 1, 20 from
        // "normaldist(0,1).random(20)") and store garbage.
        if (result && Array.isArray(result.data) && result.data.length > 1) {
          DataLists.save(upper, result.data.join(' '));
          return {
            type: 'assignment', name: upper, count: result.data.length, val: null,
            label: `${pretty} \u2190 [${result.data.slice(0, 6).map(v => M.fmt(v, 4)).join(', ')}${result.data.length > 6 ? ', \u2026' : ''}] (${result.data.length} values)`
          };
        }
      } catch(e) { /* fall through to list assignment */ }
    }

    // List assignment: [1, 2, 3] or bare values
    let values;
    if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
      values = M.parse(trimmed.slice(1, -1));
    } else {
      values = M.parse(trimmed);
    }
    if (!values.length) throw { msg: 'No numeric values found.', hint: `Try: ${pretty} = 42 or ${pretty} = [1, 2, 3]` };

    if (values.length === 1) {
      // Single number — store as variable
      const vars = Session.get('exprVars', {});
      vars[upper] = values[0];
      Session.set('exprVars', vars);
      return {
        type: 'assignment', name: upper, count: 1, val: values[0],
        label: `${pretty} \u2190 ${M.fmt(values[0], 10)}`
      };
    }

    // Multiple values — store as data list
    DataLists.save(upper, values.join(' '));
    return {
      type: 'assignment', name: upper, count: values.length, val: null,
      label: `${pretty} \u2190 [${values.slice(0, 6).join(', ')}${values.length > 6 ? ', \u2026' : ''}] (${values.length} values)`
    };
  },

  // ─── Handle tilde regression: Y ~ model(X) ───
  handleTildeRegression(raw) {
    const tildeParts = raw.split('~').map(s => s.trim());
    if (tildeParts.length !== 2) throw { msg: 'Tilde syntax requires exactly one ~', hint: 'Example: L2 ~ a + b*L1' };
    const yToken = tildeParts[0], model = tildeParts[1];

    // Resolve Y list
    const ys = this.resolveList(yToken);

    // Detect which X list is referenced in the model
    const xListMatch = model.match(/\b(L[1-6])\b/i);
    if (!xListMatch) throw { msg: 'Model must reference a data list (L1–L6).', hint: 'Example: L2 ~ a + b*L1' };
    const xName = xListMatch[1].toUpperCase();
    const xs = this.resolveList(xName);
    if (xs.length !== ys.length) throw { msg: `${yToken.toUpperCase()} has ${ys.length} values but ${xName} has ${xs.length}.`, hint: 'Lists must be equal length.' };
    if (xs.length < 3) throw { msg: 'Need at least 3 data points for regression.', hint: `Found ${xs.length}.` };

    // Detect model type from the RHS pattern
    const m = model.replace(/\s+/g, '');
    const xPat = xName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const xRe = new RegExp(xPat, 'gi');

    // Quadratic: a + b*X + c*X^2  OR  a*X^2 + b*X + c  (any order with X^2 present)
    const hasXSq = new RegExp(xPat + '\\^2|' + xPat + '\\*\\*2', 'i').test(m);

    // Power: a*X^b
    const isPower = new RegExp('^[a-z]\\*?' + xPat + '\\^[a-z]$', 'i').test(m);

    // Exponential: a*b^X
    const isExp = new RegExp('^[a-z]\\*?[a-z]\\^' + xPat + '$', 'i').test(m);

    // Logarithmic: a + b*ln(X) or a + b*log(X)
    // (a fresh non-global regex — `xRe` carries /g, so a second .test() on it
    // would resume from lastIndex and could answer false for a match it just
    // found.)
    const hasX = new RegExp(xPat, 'i');
    const isLog = /ln\(|log\(/.test(m) && hasX.test(m);

    // Logistic: c/(1 + a*b^X) — a quotient whose denominator is 1 ± something
    // involving X in an exponent.
    const isLogistic = new RegExp('\\/\\(1[+-][^)]*\\^[^)]*' + xPat + '[^)]*\\)', 'i').test(m)
      || new RegExp('\\/\\(1[+-][^)]*' + xPat + '[^)]*\\)', 'i').test(m) && /\^/.test(m);

    // Linear: coefficients and constants around ONE appearance of X, with no
    // parentheses, powers or function calls. Stated positively on purpose — a
    // "not any of the shapes above" test passes anything unfamiliar, which is
    // exactly the bug being fixed: an unrecognised model used to fall through
    // to a LINEAR fit, so asking for a curve Kalc cannot do handed back a
    // straight line reported as a "Strong linear association" rather than an
    // error. A blacklist of function names cannot work — `a*wibble(X)` is not
    // on it.
    const MARK = '\u0001';
    const skeleton = m.replace(new RegExp(xPat, 'gi'), MARK);
    const xCount = (skeleton.split(MARK).length - 1);
    const isLinear = xCount === 1 && new RegExp('^[+\\-*.a-z0-9' + MARK + ']+$', 'i').test(skeleton);

    let result;
    if (hasXSq) {
      result = M.quadReg(xs, ys);
    } else if (isPower) {
      result = M.powerReg(xs, ys);
    } else if (isExp) {
      result = M.expReg(xs, ys);
    } else if (isLog) {
      result = M.lnReg(xs, ys);
    } else if (isLogistic) {
      result = M.logisticReg(xs, ys);
    } else if (isLinear) {
      result = M.lsrl(xs, ys);
      result.modelType = 'linear';
    } else {
      throw {
        msg: `Cannot fit the model "${model}".`,
        hint: `Models Kalc knows: a + b${xName}, a${xName}^2 + b${xName} + c, ab^${xName}, a + b*ln(${xName}), a${xName}^b, c/(1 + ab^${xName}).`,
      };
    }

    const type = result.modelType;
    const strength = Math.abs(result.r) > 0.8 ? 'Strong' : Math.abs(result.r) > 0.5 ? 'Moderate' : 'Weak';

    // `eqn` is display text (ŷ, ·, ²) and cannot be recompiled. `srcExpr` is the
    // same curve in plain calculator syntax, saved as `_srcExpr` so a reloaded
    // state can rebuild `fn` (which JSON can't carry). Full precision, and every
    // coefficient parenthesized so a negative one can't produce `+ -0.6`.
    const p = (v) => `(${v})`;
    let eqn, label, srcExpr;
    if (type === 'linear') {
      eqn = `\u0177 = ${M.fmt(result.a,4)} + ${M.fmt(result.b,4)}x`;
      srcExpr = `${p(result.a)} + ${p(result.b)}*x`;
      label = `${eqn}\nr = ${M.fmt(result.r,6)}, r\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained. ${strength} linear association.`;
    } else if (type === 'quadratic') {
      eqn = `\u0177 = ${M.fmt(result.c,4)}x\u00B2 + ${M.fmt(result.b,4)}x + ${M.fmt(result.a,4)}`;
      srcExpr = `${p(result.c)}*x^2 + ${p(result.b)}*x + ${p(result.a)}`;
      label = `${eqn}\nR\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained.`;
    } else if (type === 'exponential') {
      eqn = `\u0177 = ${M.fmt(result.a,4)} \u00B7 ${M.fmt(result.b,4)}^x`;
      srcExpr = `${p(result.a)} * ${p(result.b)}^x`;
      label = `${eqn}\nr = ${M.fmt(result.r,6)}, r\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained. ${strength} exponential association.`;
    } else if (type === 'logarithmic') {
      eqn = `\u0177 = ${M.fmt(result.a,4)} + ${M.fmt(result.b,4)} ln(x)`;
      srcExpr = `${p(result.a)} + ${p(result.b)}*ln(x)`;
      label = `${eqn}\nr = ${M.fmt(result.r,6)}, r\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained. ${strength} logarithmic association.`;
    } else if (type === 'logistic') {
      eqn = `\u0177 = ${M.fmt(result.c,4)}/(1 + ${M.fmt(result.a,4)} \u00B7 ${M.fmt(result.b,4)}^x)`;
      label = `${eqn}\nR\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained. Carrying capacity \u2248 ${M.fmt(result.c,4)}.`;
    } else if (type === 'power') {
      eqn = `\u0177 = ${M.fmt(result.a,4)} \u00B7 x^${M.fmt(result.b,4)}`;
      srcExpr = `${p(result.a)} * x^${p(result.b)}`;
      label = `${eqn}\nr = ${M.fmt(result.r,6)}, r\u00B2 = ${M.fmt(result.r2,6)}\n${M.fmt(result.r2*100,1)}% of variability explained. ${strength} power association.`;
    }

    label += `\nResiduals: ${result.residuals.slice(0, 8).map((r, i) => `(${xs[i]}, ${M.fmt(r)})`).join('  ')}${result.residuals.length > 8 ? ' \u2026' : ''}`;

    // Also show on the interactive graph panel with data points + regression curve
    if (typeof Graph !== 'undefined' && Graph.panel) {
      // Add scatter points as a special non-function entry
      const scatterId = Graph.nextId++;
      const scatterColor = '#888';
      Graph.expressions.push({
        id: scatterId, expr: `${yToken.toUpperCase()} vs ${xName} data`, rawExpr: '',
        latex: null, plainLabel: true,
        fn: null, color: scatterColor, visible: true, lineWidth: 0, dash: [],
        scatterData: { xs, ys }
      });
      // Add regression curve
      const regId = Graph.nextId++;
      const regColor = Graph.colors[Graph.expressions.length % Graph.colors.length];
      Graph.expressions.push({
        id: regId, expr: eqn, rawExpr: '',
        latex: Graph.exprToLatex(eqn),
        fn: result.predict, color: regColor, visible: true, lineWidth: 2.5, dash: [],
        _srcExpr: srcExpr || null
      });
      // Add residual plot as scatter
      const residId = Graph.nextId++;
      const residXs = [...xs];
      const residYs = result.residuals;
      Graph.expressions.push({
        id: residId, expr: 'Residuals', rawExpr: '',
        latex: null, plainLabel: true,
        fn: null, color: '#e74c3c', visible: false, lineWidth: 0, dash: [],
        scatterData: { xs: residXs, ys: residYs },
        isResidual: true
      });
      // Auto-fit view to data with padding, quadrant 1 oriented
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      const xPad = (xMax - xMin) * 0.15 || 1;
      const yPad = (yMax - yMin) * 0.15 || 1;
      Graph.xMin = Math.min(0, xMin - xPad);
      Graph.xMax = xMax + xPad;
      Graph.yMin = Math.min(0, yMin - yPad);
      Graph.yMax = yMax + yPad;
      Graph.panel.classList.add('visible');
      Graph.updateRows();
      Graph.render();
    }

    return {
      type: 'inference', val: result.r2,
      label: label,
      viz: null
    };
  },

  // ─── Handle graph expression: y = f(x) ───
  handleGraph(rhs, fullExpr) {
    const latex = this._currentLatex || null;
    const id = Graph.addSmart(rhs, fullExpr, latex);
    return {
      type: 'graph', val: null,
      label: `Graphed: ${fullExpr}`,
      viz: null
    };
  },

  // ─── Handle (x,y) point tuples — supports sliders ───
  handlePointTuples(pairs, fullExpr) {
    // Check if any coordinate uses undefined single-letter variables (→ sliders)
    const allExprs = pairs.map(p => p.xExpr + ' ' + p.yExpr).join(' ');
    const params = Graph.detectParams(allExprs);

    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    const latex = this._currentLatex || null;

    if (params.length > 0) {
      // Slider mode: compile each coordinate as a function of the parameters
      const compiledPairs = pairs.map(p => ({
        xCode: Graph._compileExpr(p.xExpr, params),
        yCode: Graph._compileExpr(p.yExpr, params)
      }));
      const sliders = {};
      params.forEach(p => { sliders[p] = { min: -10, max: 10, value: 1, step: 0.1 }; });
      const sliderValues = {};
      params.forEach(p => { sliderValues[p] = 1; });

      // Build evaluator functions for each pair
      const _sind = a => Math.sin(a * Math.PI / 180);
      const _cosd = a => Math.cos(a * Math.PI / 180);
      const _tand = a => Math.tan(a * Math.PI / 180);
      const _logbase = (b, x) => Math.log(x) / Math.log(b);
      const buildEval = (code) => {
        const args = ['x', '_sind', '_cosd', '_tand', '_logbase', ...params];
        return new Function(...args, '"use strict"; return (' + code + ')');
      };
      const evalPairs = compiledPairs.map(cp => ({
        xFn: buildEval(cp.xCode),
        yFn: buildEval(cp.yCode)
      }));

      const entry = {
        id, expr: fullExpr, rawExpr: fullExpr,
        latex: latex || fullExpr,
        fn: null, color, visible: true, lineWidth: 0, dash: [],
        plainLabel: true,
        pointData: true,
        getPoints: () => {
          const vals = params.map(p => entry.sliderValues[p] || 0);
          return evalPairs.map(ep => {
            try {
              return {
                x: ep.xFn(0, _sind, _cosd, _tand, _logbase, ...vals),
                y: ep.yFn(0, _sind, _cosd, _tand, _logbase, ...vals)
              };
            } catch(e) { return null; }
          }).filter(Boolean);
        },
        sliders, sliderValues,
      };
      Graph.expressions.push(entry);
    } else {
      // Static mode: evaluate coordinates now
      const vars = Session.get('exprVars', {});
      const evalCoord = (expr) => {
        let e = expr;
        for (const [name, val] of Object.entries(vars)) {
          e = e.replace(new RegExp('\\b' + name + '\\b', 'gi'), String(val));
        }
        e = e.replace(/\bpi\b/gi, String(Math.PI));
        e = e.replace(/(?<![A-Za-z])e(?![A-Za-z0-9])/g, String(Math.E));
        try { return new Function('"use strict"; return (' + e + ')')(); }
        catch(err) { return parseFloat(e); }
      };
      const points = pairs.map(p => ({
        x: evalCoord(p.xExpr), y: evalCoord(p.yExpr)
      })).filter(p => isFinite(p.x) && isFinite(p.y));
      if (!points.length) throw { msg: 'Could not evaluate point coordinates.', hint: 'Use numbers: (3, 5) or expressions: (pi, 2)' };

      const xs = points.map(p => p.x);
      const ys = points.map(p => p.y);
      Graph.expressions.push({
        id, expr: fullExpr, rawExpr: fullExpr,
        latex: latex || fullExpr,
        fn: null, color, visible: true, lineWidth: 0, dash: [],
        plainLabel: true,
        scatterData: { xs, ys },
        _draggable: true, // T5.1: static coordinate points can be dragged
      });
      // Auto-fit
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      const xPad = Math.max((xMax - xMin) * 0.3, 2);
      const yPad = Math.max((yMax - yMin) * 0.3, 2);
      if (Graph.expressions.length === 1) {
        Graph.xMin = xMin - xPad; Graph.xMax = xMax + xPad;
        Graph.yMin = yMin - yPad; Graph.yMax = yMax + yPad;
      }
    }

    Graph.panel.classList.add('visible');
    Graph.updateRows();
    Graph.render();
    return { type: 'graph', val: null, label: `Plotted: ${fullExpr}`, viz: null };
  },

  // ─── A trailing {restriction} on a curve's own parameter ───
  // "body {0 <= theta <= pi/4}" → { body, domain: [lo, hi] }. The grammar is
  // the one y = f(x) {…} already reads: an inequality on the variable (one- or
  // two-sided) or interval notation. A side left open is ±Infinity, and the
  // drawing falls back to the default range there (Graph.curveRange).
  // No brace → { body: raw, domain: null }. A brace that is not a readable
  // restriction on THIS variable → `error`: drawing the whole curve where a
  // piece was asked for would be wrong and look right.
  splitCurveDomain(raw, varName) {
    const m = String(raw).match(/^([^{}]*?)\s*\{\s*([^:{}]+?)\s*\}\s*$/);
    if (!m || !m[1].trim()) return { body: raw, domain: null };
    const body = m[1].trim();
    const inner = m[2].trim().replace(/\u03B8/g, 'theta').replace(/\u2264/g, '<=').replace(/\u2265/g, '>=');
    const num = (t) => {
      const u = t.trim().toLowerCase().replace(/\u221E/g, 'oo');
      if (/^\+?(oo|inf|infinity)$/.test(u)) return Infinity;
      if (/^-(oo|inf|infinity)$/.test(u)) return -Infinity;
      try { const v = Graph.compile(t.trim())(0); return typeof v === 'number' && !isNaN(v) ? v : null; } catch (e) { return null; }
    };
    const bad = { body, domain: null, error: `Domain restriction not understood: {${m[2].trim()}}` };
    const V = varName.replace(/[^a-z]/gi, '');
    let lo = -Infinity, hi = Infinity, a, b, mm;
    if (/^[\[(].*,.*[\])]$/.test(inner)) {
      const parts = inner.slice(1, -1).split(',');
      if (parts.length !== 2) return bad;
      a = num(parts[0]); b = num(parts[1]);
      if (a === null || b === null) return bad;
      lo = a; hi = b;
    } else if ((mm = inner.match(new RegExp('^(.+?)\\s*(<=|>=|<|>)\\s*' + V + '\\s*(<=|>=|<|>)\\s*(.+)$', 'i'))) && mm[2][0] === mm[3][0]) {
      a = num(mm[1]); b = num(mm[4]);
      if (a === null || b === null) return bad;
      if (mm[2][0] === '<') { lo = a; hi = b; } else { lo = b; hi = a; }
    } else if ((mm = inner.match(new RegExp('^' + V + '\\s*(<=|>=|<|>)\\s*(.+)$', 'i')))) {
      a = num(mm[2]);
      if (a === null) return bad;
      if (mm[1][0] === '<') hi = a; else lo = a;
    } else if ((mm = inner.match(new RegExp('^(.+?)\\s*(<=|>=|<|>)\\s*' + V + '$', 'i')))) {
      a = num(mm[1]);
      if (a === null) return bad;
      if (mm[2][0] === '<') lo = a; else hi = a;
    } else {
      return bad;
    }
    if (!(lo < hi)) return bad;
    return { body, domain: [lo, hi] };
  },

  // The compiled halves of the three non-function forms, each from the SOURCE
  // an entry stores — so kovalna-load can rebuild one (a snapshot must be able
  // to rebuild what it describes; these `fn`s are built, never parsed).
  _curveHelpers() {
    return [
      a => Math.sin(a * Math.PI / 180),
      a => Math.cos(a * Math.PI / 180),
      a => Math.tan(a * Math.PI / 180),
      (b, x) => Math.log(x) / Math.log(b),
    ];
  },
  // rhs of r = …  →  (theta, sliderValues) => r
  compilePolarFn(rhs) {
    const expr = String(rhs).replace(/\u03B8/g, 'theta');
    const params = Graph.detectParams(expr.replace(/\btheta\b/gi, ''));
    // the compiler's variable is x: swap theta in, compile, call with theta
    const code = Graph._compileExpr(expr.replace(/\btheta\b/gi, 'x'), params);
    const rFn = new Function('x', '_sind', '_cosd', '_tand', '_logbase', ...params, '"use strict"; return (' + code + ')');
    const helpers = this._curveHelpers();
    const fn = (theta, sv) => {
      try { return rFn(theta, ...helpers, ...params.map(p => (sv && sv[p]) || 0)); } catch (e) { return NaN; }
    };
    return { fn, params };
  },
  // one component of x = f(t), y = g(t)  →  (t, sliderValues) => value
  compileParamFns(xExpr, yExpr) {
    const params = Graph.detectParams((xExpr + ' ' + yExpr).replace(/\bt\b/g, ''));
    const helpers = this._curveHelpers();
    const one = (src) => {
      const code = Graph._compileExpr(src.replace(/\bt\b/g, 'x'), params);
      const f = new Function('x', '_sind', '_cosd', '_tand', '_logbase', ...params, '"use strict"; return (' + code + ')');
      return (t, sv) => { try { return f(t, ...helpers, ...params.map(p => (sv && sv[p]) || 0)); } catch (e) { return NaN; } };
    };
    return { xFn: one(xExpr), yFn: one(yExpr), params };
  },
  // rhs of dy/dx = …  →  (x, y) => slope  (NaN where it is undefined)
  compileFieldFn(rhs) {
    const f = Graph.compileImplicit(rhs);
    return (x, y) => { try { return f(x, y); } catch (e) { return NaN; } };
  },

  // Rebuild the compiled half of a saved polar / parametric / slope-field
  // entry from its stored source. Returns the fields to spread onto the entry,
  // or null when the source no longer compiles.
  recompileCurveEntry(saved) {
    try {
      if (saved.slopeField) return { fieldFn: this.compileFieldFn(saved.rawExpr) };
      if (saved.polar) return { polarFn: this.compilePolarFn(saved.rawExpr).fn };
      if (saved.parametric) {
        const body = this.splitCurveDomain(saved.rawExpr, 't').body;
        const m = body.match(/^x\s*=\s*(.+?)\s*,\s*y\s*=\s*(.+)$/i);
        if (!m) return null;
        const c = this.compileParamFns(m[1].trim(), m[2].trim());
        return { paramXFn: c.xFn, paramYFn: c.yFn };
      }
    } catch (e) { /* fall through */ }
    return null;
  },

  // ─── A slope field's {step = …} ───
  // "step = 1" (both axes) or "step = 5, 20" (x then y) → [stepX, stepY], or
  // null when it is not a step. Each value is a positive constant written in
  // digits, operators, pi and e — the alphabet @kovalna/kalcgraph-core's
  // parser accepts, so the content build and this engine agree on what a
  // step is.
  parseFieldStep(inner) {
    const m = String(inner).trim().match(/^step\s*=\s*([^,]+?)(?:\s*,\s*([^,]+?))?$/i);
    if (!m) return null;
    const num = (t) => {
      const u = String(t).trim().replace(/\u03C0/g, 'pi');
      if (!u || !/^(?:pi|e|[\d.+\-*\/^()\s])+$/i.test(u)) return null;
      try { const v = Graph.compile(u)(0); return typeof v === 'number' && isFinite(v) && v > 0 ? v : null; } catch (e) { return null; }
    };
    const sx = num(m[1]);
    const sy = m[2] === undefined ? sx : num(m[2]);
    return sx && sy ? [sx, sy] : null;
  },

  // ─── Handle slope field: dy/dx = f(x, y), optionally {step = …} ───
  handleSlopeField(rhs, fullExpr) {
    const latex = this._currentLatex || null;
    // The one thing a field's brace may hold is its lattice step. Anything
    // else there is an error, never an ignored brace: a field drawn on a
    // lattice the author did not ask for looks exactly like one that is right.
    let body = rhs, fieldStep = null;
    const braced = rhs.match(/^([^{}]*?)\s*\{\s*([^{}]*?)\s*\}\s*$/);
    if (braced) {
      body = braced[1].trim();
      fieldStep = this.parseFieldStep(braced[2]);
      if (!fieldStep || !body) throw new Error(`A slope field takes {step = …} and nothing else: {${braced[2]}}`);
    }
    const fieldFn = this.compileFieldFn(body); // throws on an unknown name — the caller reports it
    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    const n = v => String(+v.toPrecision(6));
    const stepLabel = !fieldStep ? ''
      : ',\\ \\text{step } ' + (fieldStep[0] === fieldStep[1] ? n(fieldStep[0]) : n(fieldStep[0]) + ',\\ ' + n(fieldStep[1]));
    Graph.expressions.push({
      id, expr: fullExpr, rawExpr: body,
      latex: latex || ('\\frac{dy}{dx}=' + Graph.exprToLatex(body) + stepLabel), fn: null,
      color, visible: true, lineWidth: 1.6, dash: [],
      slopeField: true, fieldFn,
      // [stepX, stepY], or null for the lattice chosen from the scale.
      fieldStep,
    });
    // No auto-fit: a field fills whatever window it is given.
    Graph.panel.classList.add('visible');
    Graph.updateRows();
    Graph.render();
    return { type: 'graph', val: null, label: `Slope field: ${fullExpr}`, viz: null };
  },

  // ─── Handle polar equation: r = f(theta) ───
  handlePolar(rhs, fullExpr, domain) {
    const latex = this._currentLatex || null;
    const { fn: polarFn, params } = this.compilePolarFn(rhs);

    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    const displayLatex = latex || Graph.exprToLatex(fullExpr);

    const entry = {
      id, expr: fullExpr, rawExpr: rhs,
      latex: displayLatex, fn: null,
      color, visible: true, lineWidth: 2.5, dash: [],
      polar: true, polarFn,
      tDomain: domain || null,
    };
    if (params.length > 0) {
      entry.sliders = {}; entry.sliderValues = {};
      params.forEach(p => { entry.sliders[p] = { min: -10, max: 10, value: 1, step: 0.1 }; entry.sliderValues[p] = 1; });
    }
    Graph.expressions.push(entry);

    // Auto-fit: estimate range from sampling
    const testFn = Graph.expressions[Graph.expressions.length - 1];
    let maxR = 0;
    const [fitLo, fitHi] = domain ? Graph.curveRange(testFn) : [0, 2 * Math.PI];
    for (let i = 0; i <= 360; i++) {
      const theta = fitLo + (fitHi - fitLo) * i / 360;
      try {
        const r = Math.abs(testFn.polarFn(theta, testFn.sliderValues || {}));
        if (isFinite(r) && r > maxR) maxR = r;
      } catch(e) {}
    }
    if (maxR > 0) {
      const pad = maxR * 1.2;
      Graph.xMin = -pad; Graph.xMax = pad;
      Graph.yMin = -pad; Graph.yMax = pad;
    }

    Graph._polarGrid = true;
    const polarBtn = document.getElementById('gsPolarToggle');
    if (polarBtn) { polarBtn.textContent = '\u25C9 On'; polarBtn.style.color = 'var(--accent)'; polarBtn.style.borderColor = 'var(--accent)'; }
    Graph.panel.classList.add('visible');
    Graph.updateRows();
    Graph.render();
    return { type: 'graph', val: null, label: `Graphed: ${fullExpr}`, viz: null };
  },

  // ─── Handle parametric equation: x = f(t), y = g(t) ───
  handleParametric(xExpr, yExpr, fullExpr, domain) {
    const latex = this._currentLatex || null;
    const { xFn, yFn, params } = this.compileParamFns(xExpr, yExpr);

    const id = Graph.nextId++;
    const color = Graph.colors[Graph.expressions.length % Graph.colors.length];
    const displayLatex = latex || Graph.exprToLatex(fullExpr);

    const made = {
      id, expr: fullExpr, rawExpr: fullExpr,
      latex: displayLatex, fn: null,
      color, visible: true, lineWidth: 2.5, dash: [],
      parametric: true, paramXFn: xFn, paramYFn: yFn,
      tDomain: domain || null,
    };
    if (params.length > 0) {
      made.sliders = {}; made.sliderValues = {};
      params.forEach(p => { made.sliders[p] = { min: -10, max: 10, value: 1, step: 0.1 }; made.sliderValues[p] = 1; });
    }
    Graph.expressions.push(made);

    // Auto-fit by sampling
    const entry = Graph.expressions[Graph.expressions.length - 1];
    let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
    const sv = entry.sliderValues || {};
    const [fitLo, fitHi] = Graph.curveRange(entry);
    for (let i = 0; i <= 500; i++) {
      const t = fitLo + (fitHi - fitLo) * i / 500;
      try {
        const px = entry.paramXFn(t, sv), py = entry.paramYFn(t, sv);
        if (isFinite(px) && isFinite(py)) {
          xMin = Math.min(xMin, px); xMax = Math.max(xMax, px);
          yMin = Math.min(yMin, py); yMax = Math.max(yMax, py);
        }
      } catch(e) {}
    }
    if (isFinite(xMin)) {
      const xPad = Math.max((xMax-xMin)*0.2, 1), yPad = Math.max((yMax-yMin)*0.2, 1);
      Graph.xMin = xMin-xPad; Graph.xMax = xMax+xPad;
      Graph.yMin = yMin-yPad; Graph.yMax = yMax+yPad;
    }

    Graph.panel.classList.add('visible');
    Graph.updateRows();
    Graph.render();
    return { type: 'graph', val: null, label: `Graphed: ${fullExpr}`, viz: null };
  },

  handleDistMethod(distName, paramStr, method, argStr) {
    const resolved = this.aliases[distName] || this.aliases[distName.toLowerCase()] || distName.toLowerCase();
    const entry = this.registry[resolved];
    if (!entry || !entry.distFn) {
      const suggestions = this.suggest(distName);
      throw { msg: `Unknown distribution "${distName}".`, hint: suggestions.length ? `Did you mean: ${suggestions.join(', ')}?` : 'Available: normaldist, tdist, binomialdist, geometricdist, chisquareddist, poissondist, uniformdist' };
    }

    const params = paramStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    const args = argStr ? argStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n)) : [];
    const meth = method.toLowerCase();

    // .random(n) — sample any distribution family (Desmos parity). One draw
    // returns a value; n draws return a list, so L1 = normaldist(0,1).random(20)
    // stores a list (handleAssignment reads the data array).
    if (meth === 'random') {
      const n = args.length ? Math.round(args[0]) : 1;
      if (!(n >= 1) || n > 10000) throw { msg: '.random(n) expects 1 ≤ n ≤ 10000.', hint: 'Example: normaldist(0, 1).random(20)' };
      const sample = this._distSampler(resolved, params);
      if (!sample) throw { msg: `${resolved}(${paramStr}) can't be sampled — check the parameters.`, hint: entry.sig ? `${resolved}${entry.sig}` : '' };
      const vals = [];
      for (let i = 0; i < n; i++) vals.push(Math.round(sample() * 1e9) / 1e9);
      if (n === 1) return { type: 'value', val: vals[0], label: `random draw from ${resolved}(${paramStr})` };
      const shown = vals.slice(0, 6).map(v => M.fmt(v, 4)).join(', ');
      return {
        type: 'list-info', name: null, val: null, data: vals,
        label: `[${shown}${n > 6 ? ', …' : ''}] (${n} draws from ${resolved}(${paramStr}))`
      };
    }

    // Normal distribution
    if (resolved === 'normaldist') {
      if (params.length !== 2) throw { msg: 'normaldist expects 2 parameters (\u03BC, \u03C3).', hint: 'Example: normaldist(0, 1).cdf(1.96)' };
      const [mu, sigma] = params;
      if (sigma <= 0) throw { msg: '\u03C3 must be positive.', hint: 'Standard deviation cannot be zero or negative' };
      if (meth === 'cdf') {
        if (args.length === 1) {
          const z = (args[0] - mu) / sigma;
          const val = M.normcdf(z);
          return { type: 'value', val, label: `P(X \u2264 ${args[0]})`, viz: V.normalCurve(mu, sigma, -1e99, args[0]) };
        } else if (args.length === 2) {
          const zLo = (args[0] - mu) / sigma, zHi = (args[1] - mu) / sigma;
          const val = M.normcdf(zHi) - M.normcdf(zLo);
          return { type: 'value', val, label: `P(${args[0]} \u2264 X \u2264 ${args[1]})`, viz: V.normalCurve(mu, sigma, args[0], args[1]) };
        }
        throw { msg: '.cdf() expects 1 or 2 arguments.', hint: '.cdf(x) for P(X\u2264x), or .cdf(lo, hi) for P(lo\u2264X\u2264hi)' };
      }
      if (meth === 'pdf') {
        if (args.length !== 1) throw { msg: '.pdf() expects exactly 1 argument.', hint: 'Example: normaldist(0,1).pdf(0)' };
        const z = (args[0] - mu) / sigma;

  // Per-family samplers for .random(n) — inverse-CDF (continuous) or a

    const u = () => Math.random();
    if (dist === 'normaldist' && params.length === 2 && params[1] > 0) {
      return () => params[0] + M.invNorm(u()) * params[1];
    }
    if (dist === 'tdist' && params.length === 1 && params[0] > 0) {
      return () => M.invT(u(), params[0]);
    }
    if (dist === 'chisquareddist' && params.length === 1 && params[0] > 0) {
      return () => M.chi2Inv(u(), params[0]);
    }
    if (dist === 'uniformdist' && params.length === 2 && params[1] > params[0]) {
      return () => params[0] + u() * (params[1] - params[0]);

      if (p <= 0) return () => 0;

      return () => {

  // ─── Handle function calls ───
  handleFunction(name, argStr) {

    if (!entry) {

        ? `Did you mean: ${suggestions.map(s => s + (this.registry[s]?this.registry[s].sig:'')).join(', ')}?`

    }

    // Distribution constructors without a method call — show info
    if (entry.distFn) {
      throw { msg: `${resolved}${entry.sig} creates a distribution object.`, hint: `Chain a method: ${resolved}${entry.sig}.cdf(x) or .pdf(x) or .inversecdf(p)` };
    }

    // Inference functions — route to handleInference
    if (entry.inferenceFn) {

    // Numeric-arg functions (sin, cos, tan, log, ln, sqrt, nCr, nPr, factorial, etc.)

        const simple = parseFloat(trimmed);
        if (!isNaN(simple) && String(simple) === trimmed) return simple;
        // Try evaluating as an expression (handles things like pi/2, (1)/(2)*pi, 2+3)
        try {
          const result = this.evaluate(trimmed);
          if (result && result.val !== null && typeof result.val === 'number') return result.val;

        if (/\b(x|t|theta)\b|\u03B8/i.test(trimmed)) {

        }
        throw { msg: `Invalid argument: "${trimmed}"`, hint: `${resolved} expects numeric arguments` };

    }

    // Visualization functions — first arg is list, optional second args
    if (entry.vizFn) {
      // Parse: first arg is the list, rest are optional numeric params
      const parts = this.splitTopLevelArgs(argStr);
      const listData = this.resolveList(parts[0]);

    // Standard list-based stats functions
    const data = this.resolveList(argStr);
    if (!data.length) throw { msg: 'Empty list.', hint: `Try: ${resolved}([1, 2, 3])` };

  // ─── Split arguments at top-level commas (respecting brackets) ───
  splitTopLevelArgs(str) {
    const parts = []; let depth = 0; let current = '';

    }
