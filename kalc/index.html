// ═══ INPUT VALIDATION ═══
function validateNumeric(inputId, opts = {}) {
  const el = document.getElementById(inputId);
  if (!el) return null;
  const val = el.value.trim();
  if (!val) { el.classList.add('invalid'); return null; }
  const n = Number(val);
  if (isNaN(n)) { el.classList.add('invalid'); return null; }
  if (opts.min !== undefined && n < opts.min) { el.classList.add('invalid'); return null; }
  if (opts.max !== undefined && n > opts.max) { el.classList.add('invalid'); return null; }
  if (opts.int && !Number.isInteger(n)) { el.classList.add('invalid'); return null; }
  el.classList.remove('invalid');
  return n;
}
function clearValidation(...ids) { ids.forEach(id => { const el = document.getElementById(id); if(el) el.classList.remove('invalid'); }); }

// Validate multiple fields at once. Returns null if any fail, or object of values.
// fields: [{id, label, opts}]  where opts passed to validateNumeric
function validateFields(fields) {
  const result = {};
  const missing = [];
  fields.forEach(f => {
    const v = validateNumeric(f.id, f.opts || {});
    if (v === null) missing.push(f.label || f.id);
    else result[f.id] = v;
  });
  if (missing.length) return { ok: false, missing };
  return { ok: true, values: result };
}

// Show a styled error in a result element
function showError(resultId, message) {
  const el = document.getElementById(resultId);
  if (!el) return;
  el.innerHTML = `<div class="error-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>${message}</span></div>`;
}

// Show a styled error for missing fields
function showMissingError(resultId, missing) {
  showError(resultId, `Please fill in: <strong>${missing.join(', ')}</strong>`);
}

// Validate data textarea — returns parsed array or null
function validateData(textareaId, resultId, minLength = 1, label = 'data') {
  const el = document.getElementById(textareaId);
  if (!el) return null;
  const val = el.value.trim();
  if (!val) {
    el.classList.add('invalid');
    if (resultId) showError(resultId, `Enter ${label} in the field above — space, comma, or newline separated.`);
    return null;
  }
  const d = M.parse(val);
  if (d.length < minLength) {
    el.classList.add('invalid');
    if (resultId) showError(resultId, `Need at least ${minLength} numeric value${minLength > 1 ? 's' : ''} in ${label}. Found ${d.length}.`);
    return null;
  }
  el.classList.remove('invalid');
  return d;
}

// Empty state for result boxes
function showEmptyState(resultId, icon, message, hint) {
  const el = document.getElementById(resultId);
  if (!el) return;
  el.innerHTML = `<div class="empty-state">${icon ? '<div class="empty-icon">'+icon+'</div>' : ''}<div>${message}</div>${hint ? '<div class="empty-hint">'+hint+'</div>' : ''}</div>`;
}

// ═══ COPY RESULT ═══
function copyResult(id, btnEl) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    if (btnEl) {
      btnEl.classList.add('copied');
      const origText = btnEl.querySelector('.copy-text');
      if (origText) origText.textContent = 'Copied!';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        if (origText) origText.textContent = 'Copy';
      }, 1500);
    }
    showToast('Copied to clipboard');
  });
}

// ═══ VISUALIZATION ENGINE ═══
const V = {
  // Normal curve SVG
  normalCurve(mu, sigma, lo, hi, w=400, h=140) {
    const pad = { l:40, r:20, t:15, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const zMin = -3.5, zMax = 3.5;
    const xScale = z => pad.l + (z - zMin) / (zMax - zMin) * pw;
    const normPdf = z => Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
    const yMax = normPdf(0) * 1.08;
    const yScale = y => pad.t + ph - (y / yMax) * ph;

    // Curve path
    const steps = 120;
    let curvePath = '';
    for (let i = 0; i <= steps; i++) {
      const z = zMin + (zMax - zMin) * i / steps;
      const x = xScale(z), y = yScale(normPdf(z));
      curvePath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }

    // Shaded area
    const zLo = Math.max((lo - mu) / sigma, zMin);
    const zHi = Math.min((hi - mu) / sigma, zMax);
    let fillPath = `M${xScale(zLo).toFixed(1)},${yScale(0).toFixed(1)}`;
    for (let i = 0; i <= 60; i++) {
      const z = zLo + (zHi - zLo) * i / 60;
      fillPath += `L${xScale(z).toFixed(1)},${yScale(normPdf(z)).toFixed(1)}`;
    }
    fillPath += `L${xScale(zHi).toFixed(1)},${yScale(0).toFixed(1)}Z`;

    // Axis labels
    const labels = [-3,-2,-1,0,1,2,3].map(z =>
      `<text x="${xScale(z)}" y="${h - 4}" text-anchor="middle">${z === 0 ? (mu === 0 && sigma === 1 ? '0' : M.fmt(mu,1)) : M.fmt(mu + z * sigma, 1)}</text>`
    ).join('');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${yScale(0)}" x2="${w-pad.r}" y2="${yScale(0)}" class="viz-axis"/>
      <path d="${fillPath}" class="viz-fill"/>
      <path d="${curvePath}" class="viz-line"/>
      ${labels}
    </svg>`;
  },

  // Scatter plot with optional regression (linear or curved)
  scatter(xs, ys, reg, w=420, h=200) {
    const pad = { l:48, r:20, t:16, b:36 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    // Include predicted curve y-values in range calculation
    let allYs = [...ys];
    if (reg && reg.predict) {
      const steps = 40;
      const xPadR = (xMax - xMin) * 0.08;
      for (let i = 0; i <= steps; i++) {
        const xv = (xMin - xPadR) + (xMax - xMin + 2*xPadR) * i / steps;
        try { allYs.push(reg.predict(xv)); } catch(e) {}
      }
    }
    const yMin = Math.min(...allYs), yMax = Math.max(...allYs);
    const xRange = xMax - xMin || 1, yRange = yMax - yMin || 1;
    const xPad = xRange * 0.08, yPad = yRange * 0.08;
    const sx = x => pad.l + (x - (xMin - xPad)) / (xRange + 2*xPad) * pw;
    const sy = y => pad.t + ph - (y - (yMin - yPad)) / (yRange + 2*yPad) * ph;

    let points = xs.map((x, i) => `<circle cx="${sx(x).toFixed(1)}" cy="${sy(ys[i]).toFixed(1)}" r="4" class="viz-point" opacity="0.7"/>`).join('');

    let regLine = '';
    if (reg) {
      if (reg.predict && reg.modelType && reg.modelType !== 'linear') {
        // Curved regression: render as polyline with many sample points
        const steps = 80;
        const x1 = xMin - xPad*0.5, x2 = xMax + xPad*0.5;
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const xv = x1 + (x2 - x1) * i / steps;
          try {
            const yv = reg.predict(xv);
            if (isFinite(yv)) pts.push(`${sx(xv).toFixed(1)},${sy(yv).toFixed(1)}`);
          } catch(e) {}
        }
        if (pts.length > 1) {
          regLine = `<polyline points="${pts.join(' ')}" class="viz-reg" fill="none"/>`;
        }
      } else {
        // Linear regression: straight line
        const x1 = xMin - xPad, x2 = xMax + xPad;
        const yv1 = reg.predict ? reg.predict(x1) : reg.a + reg.b * x1;
        const yv2 = reg.predict ? reg.predict(x2) : reg.a + reg.b * x2;
        regLine = `<line x1="${sx(x1).toFixed(1)}" y1="${sy(yv1).toFixed(1)}" x2="${sx(x2).toFixed(1)}" y2="${sy(yv2).toFixed(1)}" class="viz-reg"/>`;
      }
    }

    // Axes
    const xTicks = V.niceTicks(xMin, xMax, 5);
    const yTicks = V.niceTicks(yMin, yMax, 4);
    const xLabels = xTicks.map(v => `<text x="${sx(v)}" y="${h - 6}" text-anchor="middle">${M.fmt(v,1)}</text>`).join('');
    const yLabels = yTicks.map(v => `<text x="${pad.l - 6}" y="${sy(v) + 3}" text-anchor="end">${M.fmt(v,1)}</text>`).join('');
    const gridLines = yTicks.map(v => `<line x1="${pad.l}" y1="${sy(v)}" x2="${w-pad.r}" y2="${sy(v)}" stroke="var(--bd)" stroke-width="0.5" stroke-dasharray="3 3"/>`).join('');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" class="viz-axis"/>
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${gridLines}${xLabels}${yLabels}${regLine}${points}
    </svg>`;
  },

  // Residual plot
  residuals(xs, resids, w=420, h=160) {
    const pad = { l:48, r:20, t:16, b:36 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const rMax = Math.max(...resids.map(Math.abs)) * 1.2 || 1;
    const xRange = xMax - xMin || 1;
    const sx = x => pad.l + (x - xMin + xRange*0.05) / (xRange * 1.1) * pw;
    const sy = r => pad.t + ph/2 - (r / rMax) * (ph/2);

    const refLine = `<line x1="${pad.l}" y1="${sy(0)}" x2="${w-pad.r}" y2="${sy(0)}" class="viz-ref"/>`;
    let points = xs.map((x, i) => {
      const cx = sx(x), cy = sy(resids[i]);
      return `<line x1="${cx}" y1="${sy(0)}" x2="${cx}" y2="${cy}" class="viz-resid"/>` +
             `<circle cx="${cx}" cy="${cy}" r="3.5" class="viz-point" opacity="0.7"/>`;
    }).join('');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" class="viz-axis"/>
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${refLine}${points}
      <text x="${pad.l - 6}" y="${sy(rMax*0.8)+3}" text-anchor="end" font-size="9">+</text>
      <text x="${pad.l - 6}" y="${sy(-rMax*0.8)+3}" text-anchor="end" font-size="9">−</text>
      <text x="${w/2}" y="${h-4}" text-anchor="middle" font-size="10">x</text>
      <text x="8" y="${h/2}" text-anchor="middle" font-size="10" transform="rotate(-90,8,${h/2})">residual</text>
    </svg>`;
  },

  // Boxplot
  boxplot(data, w=400, h=80) {
    const pad = { l:40, r:20, t:16, b:28 };
    const pw = w - pad.l - pad.r;
    const sorted = [...data].sort((a,b) => a-b);
    const mn = sorted[0], mx = sorted[sorted.length-1];
    const med = M.median(sorted);
    const {q1, q3} = M.q1q3(sorted);
    const iqr = q3 - q1;
    const fLo = q1 - 1.5*iqr, fHi = q3 + 1.5*iqr;
    const wLo = sorted.find(v => v >= fLo) || mn;
    const wHi = [...sorted].reverse().find(v => v <= fHi) || mx;
    const outliers = sorted.filter(v => v < fLo || v > fHi);
    const range = mx - mn || 1;
    const sx = v => pad.l + (v - mn + range*0.05) / (range * 1.1) * pw;
    const cy = pad.t + 18;

    const ticks = V.niceTicks(mn, mx, 6);
    const labels = ticks.map(v => `<text x="${sx(v)}" y="${h-4}" text-anchor="middle">${M.fmt(v,1)}</text>`).join('');
    const outlierDots = outliers.map(v => `<circle cx="${sx(v)}" cy="${cy}" r="3" class="viz-outlier"/>`).join('');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      <line x1="${sx(wLo)}" y1="${cy}" x2="${sx(q1)}" y2="${cy}" class="viz-whisker"/>
      <line x1="${sx(q3)}" y1="${cy}" x2="${sx(wHi)}" y2="${cy}" class="viz-whisker"/>
      <line x1="${sx(wLo)}" y1="${cy-8}" x2="${sx(wLo)}" y2="${cy+8}" class="viz-whisker"/>
      <line x1="${sx(wHi)}" y1="${cy-8}" x2="${sx(wHi)}" y2="${cy+8}" class="viz-whisker"/>
      <rect x="${sx(q1)}" y="${cy-14}" width="${sx(q3)-sx(q1)}" height="28" class="viz-box" rx="2"/>
      <line x1="${sx(med)}" y1="${cy-14}" x2="${sx(med)}" y2="${cy+14}" class="viz-median"/>
      ${outlierDots}${labels}
    </svg>`;
  },

  // Histogram
  dotplot(data, w=400, h=140) {
    const pad = { l: 20, r: 20, t: 10, b: 24 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const min = Math.min(...data), max = Math.max(...data);
    const span = max - min || 1;
    const groups = new Map();
    [...data].sort((a, b) => a - b).forEach(v => {
      const k = Math.round(v * 1e9) / 1e9;
      groups.set(k, (groups.get(k) || 0) + 1);
    });
    const maxStack = Math.max(...groups.values());
    const r = Math.max(2.5, Math.min(7, ph / (2 * maxStack + 1), pw / (2 * groups.size + 2)));
    let dots = '';
    groups.forEach((n, v) => {
      const x = pad.l + (v - min) / span * pw;
      for (let i = 0; i < n; i++) {
        dots += `<circle cx="${x.toFixed(1)}" cy="${(pad.t + ph - r - i * 2 * r).toFixed(1)}" r="${r}" class="viz-point"/>`;
      }
    });
    const ticks = [min, (min + max) / 2, max].map(v =>
      `<text x="${(pad.l + (v - min) / span * pw).toFixed(1)}" y="${h - 6}" text-anchor="middle">${M.fmt(v, 3)}</text>`
    ).join('');
    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${pad.t + ph}" x2="${w - pad.r}" y2="${pad.t + ph}" class="viz-axis"/>
      ${dots}${ticks}
    </svg>`;
  },

  histogram(data, bins=8, w=400, h=160) {
    const pad = { l:40, r:20, t:12, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const mn = Math.min(...data), mx = Math.max(...data);
    const range = mx - mn || 1;
    const binW = range / bins;
    const counts = new Array(bins).fill(0);
    data.forEach(v => { let b = Math.floor((v - mn) / binW); if (b >= bins) b = bins-1; counts[b]++; });
    const maxCount = Math.max(...counts);
    const sx = v => pad.l + (v - mn) / range * pw;
    const sy = c => pad.t + ph - (c / maxCount) * ph;

    let bars = '';
    for (let i = 0; i < bins; i++) {
      const x1 = sx(mn + i * binW), x2 = sx(mn + (i+1) * binW);
      bars += `<rect x="${x1}" y="${sy(counts[i])}" width="${x2-x1-1}" height="${sy(0)-sy(counts[i])}" class="viz-bar"/>`;
      bars += `<rect x="${x1}" y="${sy(counts[i])}" width="${x2-x1-1}" height="${sy(0)-sy(counts[i])}" class="viz-bar-outline"/>`;
    }
    const ticks = V.niceTicks(mn, mx, 5);
    const labels = ticks.map(v => `<text x="${sx(v)}" y="${h-6}" text-anchor="middle">${M.fmt(v,1)}</text>`).join('');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" class="viz-axis"/>
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${bars}${labels}
    </svg>`;
  },

  // Histogram with normal curve overlay (for CLT / sampling distributions)
  histogramWithNormal(data, mu, sigma, bins=15, w=420, h=180) {
    const pad = { l:40, r:20, t:16, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const mn = Math.min(...data), mx = Math.max(...data);
    const range = mx - mn || 1;
    const binW = range / bins;
    const counts = new Array(bins).fill(0);
    data.forEach(v => { let b = Math.floor((v - mn) / binW); if (b >= bins) b = bins-1; counts[b]++; });
    const maxCount = Math.max(...counts);
    const n = data.length;
    const sx = v => pad.l + (v - mn) / range * pw;
    const sy = c => pad.t + ph - (c / maxCount) * ph;

    // Histogram bars
    let bars = '';
    for (let i = 0; i < bins; i++) {
      const x1 = sx(mn + i * binW), x2 = sx(mn + (i+1) * binW);
      bars += `<rect x="${x1}" y="${sy(counts[i])}" width="${x2-x1-1}" height="${sy(0)-sy(counts[i])}" class="viz-bar"/>`;
      bars += `<rect x="${x1}" y="${sy(counts[i])}" width="${x2-x1-1}" height="${sy(0)-sy(counts[i])}" class="viz-bar-outline"/>`;
    }

    // Normal curve overlay — scaled to match histogram area
    const normPdf = z => Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI);
    // Scale: histogram area = n * binW, so curve height at x = n * binW * normPdf((x-mu)/sigma) / sigma
    const steps = 100;
    let curvePath = '';
    for (let i = 0; i <= steps; i++) {
      const x = mn + range * i / steps;
      const yNorm = n * binW * normPdf((x - mu) / sigma) / sigma;
      const px = sx(x), py = sy(yNorm > maxCount ? maxCount : yNorm);
      curvePath += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
    }

    // Mean marker
    const meanX = sx(mu);
    const meanLine = `<line x1="${meanX}" y1="${pad.t}" x2="${meanX}" y2="${pad.t + ph}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    const meanLabel = `<text x="${meanX}" y="${pad.t - 3}" text-anchor="middle" fill="var(--red)" font-size="10" font-weight="600">\u03BC=${M.fmt(mu,3)}</text>`;

    // Axis labels
    const ticks = V.niceTicks(mn, mx, 5);
    const labels = ticks.map(v => `<text x="${sx(v)}" y="${h-4}" text-anchor="middle">${M.fmt(v,3)}</text>`).join('');

    // CLT label
    const cltLabel = `<text x="${w - pad.r}" y="${pad.t + 10}" text-anchor="end" font-size="9" fill="var(--tx3)">Normal overlay: N(${M.fmt(mu,3)}, ${M.fmt(sigma,3)})</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" class="viz-axis"/>
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${bars}
      <path d="${curvePath}" fill="none" stroke="var(--red)" stroke-width="2" opacity="0.8"/>
      ${meanLine}${meanLabel}${labels}${cltLabel}
    </svg>`;
  },

  // Binomial bar chart
  binomChart(n, p, highlight, w=400, h=160) {
    const pad = { l:35, r:15, t:12, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const maxK = Math.min(n, 30); // cap at 30 bars
    const probs = [];
    let maxP = 0;
    for (let k = 0; k <= maxK; k++) { const pk = M.binompdf(n, p, k); probs.push(pk); if (pk > maxP) maxP = pk; }
    const barW = pw / (maxK + 1) - 1;
    const sx = k => pad.l + k / (maxK + 1) * pw + 1;
    const sy = prob => pad.t + ph - (prob / (maxP * 1.1)) * ph;

    let bars = '';
    for (let k = 0; k <= maxK; k++) {
      const isHl = k === highlight;
      bars += `<rect x="${sx(k)}" y="${sy(probs[k])}" width="${barW}" height="${sy(0)-sy(probs[k])}" rx="1" fill="${isHl ? 'var(--accent)' : 'var(--accent)'}" opacity="${isHl ? 0.9 : 0.25}"/>`;
    }
    // Label every few
    const step = maxK > 20 ? 5 : maxK > 10 ? 2 : 1;
    let labels = '';
    for (let k = 0; k <= maxK; k += step) {
      labels += `<text x="${sx(k) + barW/2}" y="${h-6}" text-anchor="middle" font-size="9">${k}</text>`;
    }

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${bars}${labels}
    </svg>`;
  },

  // t-distribution curve with shading
  tCurve(tVal, df, w=400, h=140) {
    const pad = { l:40, r:20, t:15, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const tMin = -4, tMax = 4;
    const xScale = t => pad.l + (t - tMin) / (tMax - tMin) * pw;

    // t-distribution PDF
    const tPdf = (t, v) => {
      const coeff = Math.exp(M.lnGamma((v+1)/2) - M.lnGamma(v/2)) / Math.sqrt(v * Math.PI);
      return coeff * Math.pow(1 + t*t/v, -(v+1)/2);
    };
    const yMax = tPdf(0, df) * 1.1;
    const yScale = y => pad.t + ph - (y / yMax) * ph;

    // Curve path
    const steps = 120;
    let curvePath = '';
    for (let i = 0; i <= steps; i++) {
      const t = tMin + (tMax - tMin) * i / steps;
      curvePath += (i === 0 ? 'M' : 'L') + xScale(t).toFixed(1) + ',' + yScale(tPdf(t, df)).toFixed(1);
    }

    // Shaded area (left tail up to tVal, capped to range)
    const tClamped = Math.max(tMin, Math.min(tMax, tVal));
    let fillPath = `M${xScale(tMin).toFixed(1)},${yScale(0).toFixed(1)}`;
    for (let i = 0; i <= 60; i++) {
      const t = tMin + (tClamped - tMin) * i / 60;
      fillPath += `L${xScale(t).toFixed(1)},${yScale(tPdf(t, df)).toFixed(1)}`;
    }
    fillPath += `L${xScale(tClamped).toFixed(1)},${yScale(0).toFixed(1)}Z`;

    // t-value marker line
    const marker = tClamped > tMin && tClamped < tMax
      ? `<line x1="${xScale(tClamped)}" y1="${pad.t}" x2="${xScale(tClamped)}" y2="${yScale(0)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 2"/>
         <text x="${xScale(tClamped)}" y="${pad.t - 3}" text-anchor="middle" fill="var(--red)" font-size="10" font-weight="600">t=${M.fmt(tVal,2)}</text>`
      : '';

    // Axis labels
    const labels = [-3,-2,-1,0,1,2,3].map(t =>
      `<text x="${xScale(t)}" y="${h - 4}" text-anchor="middle">${t}</text>`
    ).join('');

    // df label
    const dfLabel = `<text x="${w - pad.r}" y="${pad.t + 12}" text-anchor="end" font-size="10" fill="var(--tx2)">df = ${df}</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${yScale(0)}" x2="${w-pad.r}" y2="${yScale(0)}" class="viz-axis"/>
      <path d="${fillPath}" class="viz-fill"/>
      <path d="${curvePath}" class="viz-line"/>
      ${marker}${labels}${dfLabel}
    </svg>`;
  },

  // Chi-square distribution curve with right-tail shading
  chi2Curve(x, df, w=400, h=140) {
    const pad = { l:40, r:20, t:15, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;

    // Chi-square PDF
    const chi2Pdf = (x, k) => {
      if (x <= 0) return 0;
      const halfK = k / 2;
      return Math.exp((halfK - 1) * Math.log(x) - x/2 - halfK * Math.log(2) - M.lnGamma(halfK));
    };

    // Determine x range — go far enough to capture the tail
    const xMax = Math.max(x * 1.5, df + 4 * Math.sqrt(2 * df), 10);
    const xMin = 0;
    const xScale = v => pad.l + (v - xMin) / (xMax - xMin) * pw;

    // Find peak for y scaling
    let yMax = 0;
    for (let i = 0; i <= 200; i++) {
      const v = xMin + (xMax - xMin) * i / 200;
      const y = chi2Pdf(v, df);
      if (y > yMax) yMax = y;
    }
    yMax *= 1.1;
    const yScale = y => pad.t + ph - (y / yMax) * ph;

    // Curve path
    const steps = 150;
    let curvePath = '';
    for (let i = 0; i <= steps; i++) {
      const v = xMin + (xMax - xMin) * i / steps;
      const y = chi2Pdf(v, df);
      curvePath += (i === 0 ? 'M' : 'L') + xScale(v).toFixed(1) + ',' + yScale(y).toFixed(1);
    }

    // Right-tail shading (from x to xMax)
    const xClamped = Math.max(xMin, Math.min(xMax, x));
    let fillPath = `M${xScale(xClamped).toFixed(1)},${yScale(0).toFixed(1)}`;
    for (let i = 0; i <= 60; i++) {
      const v = xClamped + (xMax - xClamped) * i / 60;
      fillPath += `L${xScale(v).toFixed(1)},${yScale(chi2Pdf(v, df)).toFixed(1)}`;
    }
    fillPath += `L${xScale(xMax).toFixed(1)},${yScale(0).toFixed(1)}Z`;

    // x-value marker line
    const marker = xClamped > 0 && xClamped < xMax
      ? `<line x1="${xScale(xClamped)}" y1="${pad.t}" x2="${xScale(xClamped)}" y2="${yScale(0)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 2"/>
         <text x="${xScale(xClamped)}" y="${pad.t - 3}" text-anchor="middle" fill="var(--red)" font-size="10" font-weight="600">\u03C7\u00B2=${M.fmt(x,2)}</text>`
      : '';

    // Axis ticks
    const ticks = V.niceTicks(0, xMax, 5);
    const labels = ticks.map(v =>
      `<text x="${xScale(v)}" y="${h - 4}" text-anchor="middle">${M.fmt(v,1)}</text>`
    ).join('');

    const dfLabel = `<text x="${w - pad.r}" y="${pad.t + 12}" text-anchor="end" font-size="10" fill="var(--tx2)">df = ${df}</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${yScale(0)}" x2="${w-pad.r}" y2="${yScale(0)}" class="viz-axis"/>
      <path d="${fillPath}" class="viz-fill" style="fill:var(--red);opacity:0.12"/>
      <path d="${curvePath}" class="viz-line"/>
      ${marker}${labels}${dfLabel}
    </svg>`;
  },

  // Geometric bar chart
  geomChart(p, highlightX, w=400, h=140) {
    const pad = { l:35, r:15, t:12, b:28 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    // Show enough bars to capture 99% of probability
    const maxK = Math.min(Math.ceil(Math.log(0.01) / Math.log(1 - p)) + 1, 30);
    const probs = [];
    let maxP = 0;
    for (let k = 1; k <= maxK; k++) { const pk = M.geompdf(p, k); probs.push(pk); if (pk > maxP) maxP = pk; }
    const barW = pw / maxK - 1;
    const sx = k => pad.l + (k - 1) / maxK * pw + 1;
    const sy = prob => pad.t + ph - (prob / (maxP * 1.1)) * ph;

    let bars = '';
    for (let k = 1; k <= maxK; k++) {
      const isHl = k === highlightX;
      bars += `<rect x="${sx(k)}" y="${sy(probs[k-1])}" width="${barW}" height="${sy(0)-sy(probs[k-1])}" rx="1" fill="var(--accent)" opacity="${isHl ? 0.9 : 0.25}"/>`;
    }
    const step = maxK > 20 ? 5 : maxK > 10 ? 2 : 1;
    let labels = '';
    for (let k = 1; k <= maxK; k += step) {
      labels += `<text x="${sx(k) + barW/2}" y="${h-6}" text-anchor="middle" font-size="9">${k}</text>`;
    }

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" class="viz-axis"/>
      ${bars}${labels}
    </svg>`;
  },

  // Confidence interval number line
  // lo/hi = CI bounds, estimate = point estimate, nullVal = null hypothesis value (optional)
  // label = what we're estimating (e.g. 'p', 'μ', 'μ₁−μ₂')
  confidenceInterval(lo, hi, estimate, opts = {}) {
    const { nullVal, label, clevel, w = 460, h = 110 } = opts;
    const pad = { l: 40, r: 40, t: 38, b: 32 };
    const pw = w - pad.l - pad.r;
    const me = (hi - lo) / 2;

    let axMin = lo, axMax = hi;
    if (nullVal != null) { axMin = Math.min(axMin, nullVal); axMax = Math.max(axMax, nullVal); }
    const axRange = axMax - axMin || 0.1;
    axMin -= axRange * 0.25; axMax += axRange * 0.25;
    const totalRange = axMax - axMin;
    const sx = v => pad.l + (v - axMin) / totalRange * pw;
    const cy = pad.t + 16;

    let svg = '';

    // Confidence level label
    if (clevel) svg += `<text x="${pad.l}" y="14" class="viz-ci-label" font-size="10" font-weight="600">${clevel}% CI</text>`;

    // Axis line
    svg += `<line x1="${pad.l}" y1="${cy}" x2="${w - pad.r}" y2="${cy}" stroke="var(--bd)" stroke-width="1"/>`;

    // Tick marks — avoid overlap with CI bounds and null
    const ticks = V.niceTicks(axMin, axMax, 6);
    const usedX = []; // track label positions to avoid overlap
    const addLabel = (x, text, y, cls, anchor, extra) => {
      if (usedX.some(ux => Math.abs(ux - x) < 28)) return;
      usedX.push(x);
      svg += `<text x="${x}" y="${y}" text-anchor="${anchor || 'middle'}" class="${cls}"${extra || ''}>${text}</text>`;
    };

    // CI bar
    svg += `<line x1="${sx(lo)}" y1="${cy}" x2="${sx(hi)}" y2="${cy}" class="viz-ci-bar"/>`;
    svg += `<line x1="${sx(lo)}" y1="${cy - 6}" x2="${sx(lo)}" y2="${cy + 6}" class="viz-ci-cap"/>`;
    svg += `<line x1="${sx(hi)}" y1="${cy - 6}" x2="${sx(hi)}" y2="${cy + 6}" class="viz-ci-cap"/>`;

    // CI bound labels (above, priority)
    addLabel(sx(lo), M.fmt(lo, 4), cy - 10, 'viz-ci-val');
    addLabel(sx(hi), M.fmt(hi, 4), cy - 10, 'viz-ci-val');

    // Point estimate — small dot
    svg += `<circle cx="${sx(estimate)}" cy="${cy}" r="4" class="viz-ci-point"/>`;
    addLabel(sx(estimate), M.fmt(estimate, 4), cy - 10, 'viz-ci-val');

    // Null value — red diamond + dashed line
    if (nullVal != null) {
      const nx = sx(nullVal);
      svg += `<line x1="${nx}" y1="${cy - 22}" x2="${nx}" y2="${cy + 6}" stroke="var(--red)" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>`;
      svg += `<polygon points="${nx},${cy-14} ${nx+4},${cy-18} ${nx},${cy-22} ${nx-4},${cy-18}" class="viz-ci-null"/>`;
      addLabel(nx, (label ? label + '\u2080=' : '') + M.fmt(nullVal, 4), cy - 26, 'viz-ci-label', 'middle', ' fill="var(--red)"');
    }

    // Axis ticks (below line, skip if too close to existing labels)
    ticks.forEach(v => {
      const x = sx(v);
      if (x < pad.l + 5 || x > w - pad.r - 5) return;
      svg += `<line x1="${x}" y1="${cy + 4}" x2="${x}" y2="${cy + 8}" stroke="var(--bd)" stroke-width="1"/>`;
      // Only add tick label if not too close to CI bounds
      if (Math.abs(x - sx(lo)) > 25 && Math.abs(x - sx(hi)) > 25 && Math.abs(x - sx(estimate)) > 25) {
        svg += `<text x="${x}" y="${cy + 20}" text-anchor="middle" class="viz-ci-label">${M.fmt(v, 4)}</text>`;
      }
    });

    // ME label (below, centered)
    svg += `<text x="${sx(estimate)}" y="${cy + 20}" text-anchor="middle" class="viz-ci-label" font-size="9">ME=${M.fmt(me, 4)}</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
  },

  niceTicks(min, max, count) {
    const range = max - min || 1;
    const rough = range / count;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const nice = rough / mag >= 5 ? 5*mag : rough/mag >= 2 ? 2*mag : mag;
    const start = Math.ceil(min / nice) * nice;
    const ticks = [];
    for (let v = start; v <= max + nice*0.01; v += nice) { ticks.push(Math.round(v * 1e10) / 1e10); }
    return ticks;
  }
};

// ═══ MATH ENGINE ═══
const M = {
  mean(d) { return d.reduce((a,b) => a+b, 0) / d.length; },
  median(d) { const s = [...d].sort((a,b) => a-b); const m = Math.floor(s.length/2); return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; },
  q1q3(d) {
    const s = [...d].sort((a,b) => a-b); const n = s.length;

  },
  // p-th quantile by linear interpolation between order statistics (the
  // convention Desmos's quantile/quartile use). q1/q3 above deliberately
  // keep the AP-stats median-of-halves method — they may differ slightly.
  quantile(d, p) {
    const s = [...d].sort((a,b) => a-b);

  sVar(d) { const m = M.mean(d); return d.reduce((a,v) => a+(v-m)**2, 0)/(d.length-1); },

  sd(d) { return Math.sqrt(M.sVar(d)); },
  psd(d) { return Math.sqrt(M.pVar(d)); },
  sum(d) { return d.reduce((a,b) => a+b, 0); },
  parse(s) { s = s.trim(); if (!s) return []; return s.replace(/[,;\t]/g, ' ').split(/\s+/).filter(v => v !== '').map(Number).filter(v => !isNaN(v)); },

  normcdf(z) {

  betaCF(a, b, x) {

  chi2Pdf(x, k) {

  chi2Inv(p, k) {

  binomcdf(n,p,k) { let s=0; for(let i=0;i<=k;i++) s+=M.binompdf(n,p,i); return s; },

  geompdf(p,k) { return p*Math.pow(1-p,k-1); },

  fact(n) { if(n<0) return NaN; if(n<=1) return 1; let r=1; for(let i=2;i<=n;i++) r*=i; return r; },
  nPr(n,r) { let p=1; for(let i=n;i>n-r;i--) p*=i; return p; },
  nCr(n,r) { if(r>n) return 0; if(r===0||r===n) return 1; r=Math.min(r,n-r); let c=1; for(let i=0;i<r;i++) c=c*(n-i)/(i+1); return Math.round(c); },

  lsrl(xs, ys) {

    for (let col=0; col<3; col++) {

    const residuals = xs.map((x,i) => ys[i] - predict(x));

    const yb = M.mean(ys);
    const sst = ys.reduce((s,y) => s + (y-yb)**2, 0);
    const sse = residuals.reduce((s,r) => s + r*r, 0);

    const reg = M.lsrl(lnXs, ys);

    const residuals = xs.map((x,i) => ys[i] - predict(x));

  powerReg(xs, ys) {

    if (ys.some(y => y <= 0)) throw { msg: 'Power regression requires all Y > 0.', hint: 'Cannot take ln of non-positive values.' };
    const lnXs = xs.map(x => Math.log(x));
    const lnYs = ys.map(y => Math.log(y));
    const reg = M.lsrl(lnXs, lnYs);
    const a = Math.exp(reg.a), b = reg.b;
    const predict = x => a * Math.pow(x, b);
    const residuals = xs.map((x,i) => ys[i] - predict(x));
    // R^2 on original scale
    const yb = M.mean(ys);
    const sst = ys.reduce((s,y) => s + (y-yb)**2, 0);
    const sse = residuals.reduce((s,r) => s + r*r, 0);
    const r2 = 1 - sse/sst;
    return { a, b, r: reg.r, r2, n: xs.length, residuals, modelType:'power', predict };

  // Logistic regression: y = c / (1 + a*b^x)
  //
  // The only model here that does not linearise on its own — the carrying
  // capacity c sits inside the transform. But for a FIXED c it does:
  //     y = c/(1 + a*b^x)   ⇒   ln(c/y - 1) = ln(a) + x*ln(b)
  // is a straight line. So c is found by a one-dimensional search and a and b
  // fall out of the line fit at whichever c minimises the error on the
  // original scale. A search rather than a formula, but a deterministic one:
  // same data always gives the same answer.
  logisticReg(xs, ys) {
    if (ys.some(y => y <= 0)) throw { msg: 'Logistic regression requires all Y > 0.', hint: 'A logistic curve approaches zero but never reaches it.' };
    const n = xs.length;
    if (n < 4) throw { msg: 'Logistic regression needs at least 4 data points.', hint: `Found ${n}. Three points fit any S-curve exactly.` };

    const yMax = Math.max(...ys);
    const yb = M.mean(ys);
    const sst = ys.reduce((s,y) => s + (y-yb)**2, 0);

    // The fit at one carrying capacity, or null if c is not usable there.
    const fitAt = (c) => {
      if (!(c > yMax)) return null;
      const zs = ys.map(y => Math.log(c/y - 1));
      if (zs.some(z => !isFinite(z))) return null;
      const reg = M.lsrl(xs, zs);
      const a = Math.exp(reg.a), b = Math.exp(reg.b);
      if (!isFinite(a) || !isFinite(b) || a <= 0 || b <= 0) return null;
      const predict = x => c / (1 + a*Math.pow(b, x));
      let sse = 0;
      for (let i=0;i<n;i++) { const d = ys[i] - predict(xs[i]); if (!isFinite(d)) return null; sse += d*d; }
      return { c, a, b, sse, predict, r: reg.r };
    };

    // c is searched on a log scale above the largest observation: c = yMax(1+10^u).
    // That covers "the data has nearly levelled off" through "we are still on
    // the steep part" without the scan resolution depending on the data's size.
    const at = (u) => fitAt(yMax * (1 + Math.pow(10, u)));
    const U_LO = -6, U_HI = 2;
    let best = null, bestU = null;
    const STEPS = 400;
    for (let i = 0; i <= STEPS; i++) {
      const u = U_LO + (U_HI - U_LO) * i / STEPS;
      const f = at(u);
      if (f && (!best || f.sse < best.sse)) { best = f; bestU = u; }
    }
    if (!best) throw { msg: 'Logistic regression could not fit this data.', hint: 'Logistic data rises (or falls) toward a ceiling; this does not.' };

    // Golden-section refine inside the bracket either side of the best grid point.
    const step = (U_HI - U_LO) / STEPS;
    let lo = Math.max(U_LO, bestU - step), hi = Math.min(U_HI, bestU + step);
    const phi = (Math.sqrt(5) - 1) / 2;
    for (let k = 0; k < 60; k++) {

      else { lo = u1; if (f2 && f2.sse < best.sse) best = f2; }
    }

    const residuals = xs.map((x,i) => ys[i] - best.predict(x));
    const r2 = sst > 0 ? 1 - best.sse/sst : 1;
    return {
      a: best.a, b: best.b, c: best.c, r: best.r, r2,
      n, residuals, modelType:'logistic', predict: best.predict,
    };
  },

  welchDF(s1,n1,s2,n2) { const v1=s1*s1/n1, v2=s2*s2/n2; return (v1+v2)**2/((v1**2)/(n1-1)+(v2**2)/(n2-1)); },
  fmt(v, d=4) { return typeof v === 'number' ? Number(v.toFixed(d)) : v; },
};

          const ri = srcRows[idx];
          if (!dataRows[ri]) return;
          const fmtV = (v) => String(Math.round(v * 1000) / 1000);
          dataRows[ri][c0] = fmtV(x);
          dataRows[ri][c1] = fmtV(y);
          refreshCalcCells(); saveToStore(); renderTable();
        } : null,
      });
      // Auto-fit
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      if (!preserveWindow) {
        const xPad = Math.max((xMax - xMin) * 0.2, 1);
        const yPad = Math.max((yMax - yMin) * 0.2, 1);
        this.xMin = Math.min(0, xMin - xPad); this.xMax = xMax + xPad;
        this.yMin = Math.min(0, yMin - yPad); this.yMax = yMax + yPad;
      }
      this.updateRows();
      this.render();
    };
    plotToggle.onclick = () => {
      listPlotActive = !listPlotActive;
      plotToggle.className = 'gle-plot-toggle' + (listPlotActive ? ' on' : '');
      syncListPlot();
    };
    gleActions.appendChild(plotToggle);
    gleHeader.appendChild(gleActions);
    listEditor.appendChild(gleHeader);

    // Column headers (rebuilt by renderTable)
    const colHeaders = document.createElement('div');
    colHeaders.className = 'gle-col-headers';
    listEditor.appendChild(colHeaders);

    // Rows container
    const rowsEl = document.createElement('div');
    rowsEl.className = 'gle-rows';
    rowsEl.id = 'gleRows';
    listEditor.appendChild(rowsEl);

    // Add row button
    const addRowBtn = document.createElement('div');
    addRowBtn.className = 'gle-add-row';
    addRowBtn.textContent = '+ Add row';
    addRowBtn.onclick = () => { addRow(0); };
    listEditor.appendChild(addRowBtn);

    // \u2500\u2500 Row & column management \u2500\u2500
    const ensureDataRowsShape = () => {
      if (!dataRows.length) dataRows.push({});
      const cols = dataColNames();
      dataRows.forEach(r => cols.forEach(n => { if (r[n] === undefined) r[n] = ''; }));
    };

    const renameColumn = (col, newName) => {
      if (col.name === newName) return true;
      if (usedNames().includes(newName)) { try { showToast(newName + ' is already in use'); } catch (e) {} return false; }
      const old = col.name;
      dataRows.forEach(r => { if (r[old] !== undefined) { r[newName] = r[old]; delete r[old]; } });
      DataLists.remove(old);
      col.name = newName;
      return true;
    };

    // Apply a header edit: a bare name (L3) makes a data column; "L3 = L1^2" or
    // a bare formula (L1^2) makes a calculated column.
    const applyHeader = (col, text) => {
      const t = (text || '').trim();
      if (!t) return;
      let m;
      if (/^L\d+$/i.test(t)) {
        renameColumn(col, t.toUpperCase());
        col.formula = null;
      } else if ((m = t.match(/^(L\d+)\s*=\s*(.+)$/i))) {
        if (renameColumn(col, m[1].toUpperCase())) col.formula = m[2].trim();
      } else {
        // Bare formula \u2014 give a data column a fresh name so it can't reference itself.
        if (!col.formula) renameColumn(col, nextFreeName());
        col.formula = t;
      }
      ensureDataRowsShape(); saveToStore(); renderTable();
    };

    // Recompute just the calculated cells in place (no DOM rebuild).
    const refreshCalcCells = () => {
      const matrix = computeMatrix();
      rowsEl.querySelectorAll('.gle-row').forEach((rowEl, i) => {
        editorCols.forEach((col, ci) => {
          if (!col.formula) return;
          const cellEl = rowEl.children[ci];
          if (!cellEl) return;
          const v = matrix[col.name][i];
          cellEl.textContent = (v === '' || v === undefined) ? '' : (typeof v === 'number' ? formatCell(v) : v);
        });
      });
    };

    const cellKeydown = (e, cell) => {
      const inputs = [...rowsEl.querySelectorAll('input.gle-cell')];
      const idx = inputs.indexOf(cell);
      if (idx < 0) return;
      const rowEls = [...rowsEl.querySelectorAll('.gle-row')];
      const perRow = rowEls.length ? rowEls[0].querySelectorAll('input.gle-cell').length : 1;
      if (perRow === 0) return;
      const colIdx = idx % perRow, rowIdx = Math.floor(idx / perRow);
      const focusAt = (i) => { if (inputs[i]) inputs[i].focus(); };
      if (e.key === 'Enter') {
        e.preventDefault();
        if (rowIdx === rowEls.length - 1) addRow(colIdx); else focusAt(idx + perRow);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) focusAt(idx - 1);
        else if (idx === inputs.length - 1) addRow(0);
        else focusAt(idx + 1);
      } else if (e.key === 'ArrowDown') {
        if (inputs[idx + perRow]) { e.preventDefault(); focusAt(idx + perRow); }
      } else if (e.key === 'ArrowUp') {
        if (inputs[idx - perRow]) { e.preventDefault(); focusAt(idx - perRow); }
      } else if (e.key === 'ArrowRight') {
        if (cell.selectionStart === cell.value.length && colIdx < perRow - 1) { e.preventDefault(); focusAt(idx + 1); }
      } else if (e.key === 'ArrowLeft') {
        if (cell.selectionStart === 0 && colIdx > 0) { e.preventDefault(); focusAt(idx - 1); }
      }
    };

    // Rebuild the headers and rows from the model.
    const renderTable = () => {
      const matrix = computeMatrix();
      // Headers
      colHeaders.innerHTML = '';
      editorCols.forEach((col, ci) => {
        const hWrap = document.createElement('div');
        hWrap.className = 'gle-col-header';
        const hInput = document.createElement('input');
        hInput.className = 'gle-col-name';
        hInput.value = col.formula ? (col.name + ' = ' + col.formula) : col.name;
        hInput.title = 'Name (e.g. L3) or formula (e.g. L1^2)';
        hInput.onchange = () => applyHeader(col, hInput.value);
        hInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); hInput.blur(); } };
        hWrap.appendChild(hInput);
        if (editorCols.length > 1) {
          const delC = document.createElement('button');
          delC.className = 'gle-col-del'; delC.textContent = '\u00D7'; delC.title = 'Delete column';
          delC.onclick = () => {
            const removed = editorCols.splice(ci, 1)[0];
            if (removed) DataLists.remove(removed.name);
            ensureDataRowsShape(); saveToStore(); renderTable();
          };
          hWrap.appendChild(delC);
        }
        colHeaders.appendChild(hWrap);
      });
      // Rows
      rowsEl.innerHTML = '';
      const n = dataRows.length;
      for (let i = 0; i < n; i++) {
        const row = document.createElement('div');
        row.className = 'gle-row';
        editorCols.forEach(col => {
          if (col.formula) {
            const cell = document.createElement('div');
            cell.className = 'gle-cell gle-cell-calc';
            const v = matrix[col.name][i];
            cell.textContent = (v === '' || v === undefined) ? '' : (typeof v === 'number' ? formatCell(v) : v);
            row.appendChild(cell);
          } else {
            const cell = document.createElement('input');
            cell.className = 'gle-cell'; cell.type = 'text';
            cell.value = (dataRows[i] && dataRows[i][col.name]) || '';
            cell.placeholder = '\u2014'; cell.inputMode = 'decimal';
            const nm = col.name, ri = i;
            cell.onchange = () => {
              if (!dataRows[ri]) dataRows[ri] = {};
              dataRows[ri][nm] = cell.value.trim();
              refreshCalcCells(); saveToStore();
            };
            // Live link (T5.2): plot + stats follow the keystrokes, debounced
            // so the commit path doesn't run per character.
            let liveT = null;
            cell.oninput = () => {
              clearTimeout(liveT);
              liveT = setTimeout(() => {
                if (!dataRows[ri]) dataRows[ri] = {};
                if (dataRows[ri][nm] === cell.value.trim()) return;
                dataRows[ri][nm] = cell.value.trim();
                refreshCalcCells(); saveToStore();
              }, 200);
            };
            cell.addEventListener('keydown', (e) => cellKeydown(e, cell));
            row.appendChild(cell);
          }
        });
        const del = document.createElement('button');
        del.className = 'gle-row-del'; del.textContent = '\u00D7';
        const ri = i;
        del.onclick = () => { dataRows.splice(ri, 1); ensureDataRowsShape(); saveToStore(); renderTable(); };
        row.appendChild(del);
        rowsEl.appendChild(row);
      }
    };

    function addRow(focusColIdx) {
      const r = {}; dataColNames().forEach(n => r[n] = ''); dataRows.push(r);
      renderTable();
      const rowEls = [...rowsEl.querySelectorAll('.gle-row')];
      const last = rowEls[rowEls.length - 1];
      if (last) { const ins = last.querySelectorAll('input.gle-cell'); const target = ins[focusColIdx] || ins[0]; if (target) target.focus(); }
    }

    // Load data column values from the store into the editor.
    const loadEditor = () => {
      const cols = dataColNames();
      const arrays = {}; let maxLen = 0;
      cols.forEach(n => { const a = DataLists.has(n) ? M.parse(DataLists.get(n)) : []; arrays[n] = a; maxLen = Math.max(maxLen, a.length); });
      maxLen = Math.max(maxLen, 1);
      dataRows = [];
      for (let i = 0; i < maxLen; i++) { const r = {}; cols.forEach(n => { r[n] = arrays[n][i] !== undefined ? String(arrays[n][i]) : ''; }); dataRows.push(r); }
      renderTable();
    };

    body.appendChild(listEditor);
    this.panel.appendChild(body);

    // Expose list editor toggle as a public method
    this.toggleListEditor = () => {
      this.panel.classList.add('visible');
      listEditor.classList.toggle('hidden');
      if (!listEditor.classList.contains('hidden')) loadEditor();
    };

    // Rebuild the table from a saved column config (kovalna-load). `editorCols`
    // is read from Session once, at construction — without this the values come
    // back from `lists` but the column layout and every calculated-column
    // formula stay at whatever the browser happened to have.
    // Re-link a restored table plot (kovalna-load). The saved row carries its
    // points but not `_writeBack`, which closes over the editor — so instead of
    // patching the row we drop it and let syncListPlot build a fresh, fully
    // linked one from the table we just restored. Dragging a point therefore
    // writes back to the table again, exactly as before the save.
    this.restoreListPlot = (savedId) => {
      if (savedId != null) this.expressions = this.expressions.filter(e => e.id !== savedId);
      listPlotActive = true;
      plotToggle.className = 'gle-plot-toggle on';
      // The saved window is part of the saved state — don't re-auto-fit over it.
      syncListPlot({ preserveWindow: true });
    };

    this.reloadListEditor = (cols) => {
      if (Array.isArray(cols) && cols.length) {
        editorCols = cols
          .filter((c) => c && typeof c.name === 'string' && c.name)
          .map((c) => ({ name: c.name, formula: typeof c.formula === 'string' && c.formula ? c.formula : null }));
        if (!editorCols.length) editorCols = [{ name: 'L1', formula: null }, { name: 'L2', formula: null }];
        saveColsConfig();
      }
      loadEditor();
    };

    mount.appendChild(this.panel);
    this.ctx = this.canvas.getContext('2d');

    // ─── Events: Pointer Events unify mouse/touch/pen; a second touch
    // pointer starts a pinch (zoom about the finger midpoint + pan). (T1.3)
    wrap.style.touchAction = 'none';
    this._pointers = new Map();
    wrap.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, .sketch-gear-wrap, .sketch-gear-menu, .kalc-sketch-ui, select, input')) return;
      this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
      if (this._pointers.size === 2 && !this._sketchDragging && !this._imageDrag) {
        // Second finger: abandon the one-pointer gesture, start a pinch
        this.isDragging = false;
        this._clickStart = null;
        this._stopMotion();
        const [a, b] = [...this._pointers.values()];
        this._pinch = {
          dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
          mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
          win: { xMin: this.xMin, xMax: this.xMax, yMin: this.yMin, yMax: this.yMax },
        };
        this.hideTrace();
        return;
      }
      if (this._pointers.size > 2 || this._pinch) return;
      this._clickStart = { x: e.clientX, y: e.clientY };
      // Touch the curve to trace, touch empty space to pan. A mouse traces
      // by hovering, which a finger cannot do — it is always pressing — so
      // before this every finger movement was a pan and the dot was hidden.
      // The gesture locks to the curve under the finger (a finger wobbles;
      // jumping between curves would flicker) and stays readable after the
      // finger lifts, until the next touch on empty space.
      if (this._beginTouchTrace(e)) return;
      this.onMouseDown(e);
    });
    wrap.addEventListener('pointermove', (e) => {
      const p = this._pointers.get(e.pointerId);
      if (p) { p.x = e.clientX; p.y = e.clientY; }
      if (this._pinch) { if (this._pointers.size >= 2) this._onPinchMove(); return; }
      if (this._touchTrace) {
        const rect = this.canvas.getBoundingClientRect();
        this.traceAt(e.clientX - rect.left, e.clientY - rect.top, this._touchTrace);
        return;
      }
      this.onMouseMove(e);
    });
    const releasePointer = (e) => {
      this._pointers.delete(e.pointerId);
      if (this._pinch) {
        if (this._pointers.size < 2) {
          this._pinch = null;
          if (this._pointers.size === 1) {
            // One finger stays down — hand off into a fresh pan, not a click
            const [rp] = [...this._pointers.values()];
            this.onMouseDown({ clientX: rp.x, clientY: rp.y, target: this.canvas });
            this._clickStart = null;
          }
          this.scheduleRender();
        }
        return;
      }
      if (this._touchTrace) {
        // The readout stays where the finger left it — that is when it can
        // be read — until the next touch on empty space or a mouse hover.
        this._touchTrace = null;
        this._traceSticky = true;
      }
      this.onMouseUp();
      if (this._clickStart && e.type === 'pointerup') {
        const dx = e.clientX - this._clickStart.x, dy = e.clientY - this._clickStart.y;
        if (Math.sqrt(dx * dx + dy * dy) < 5) this.onCanvasClick(e);
      }
      this._clickStart = null;
    };
    wrap.addEventListener('pointerup', releasePointer);
    wrap.addEventListener('pointercancel', releasePointer);
    wrap.addEventListener('pointerleave', () => {
      // With pointer capture, drags survive leaving the wrap; only clear
      // hover state when nothing is held down.
      if (!this._pointers.size && !this._traceSticky) this.onMouseLeave();
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.onWheel(e); }, { passive: false });

    // ─── Keyboard access (T5.3): pan/zoom/trace without a pointer ───
    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'application');
    wrap.setAttribute('aria-label',
      'Interactive graph. Arrow keys pan, plus and minus zoom, T traces curves, Escape exits trace.');
    this._srLive = document.createElement('div');
    this._srLive.className = 'kalc-sr-only';
    this._srLive.setAttribute('aria-live', 'polite');
    wrap.appendChild(this._srLive);
    wrap.addEventListener('keydown', (e) => this.onGraphKeydown(e));
    wrap.addEventListener('blur', () => { if (this._kbTrace) this._kbTraceEnd(); });

    // Resize observer + window resize fallback
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { this.render(); }).observe(wrap);
    }
    window.addEventListener('resize', () => { this.render(); });

    // Close popovers when clicking outside
    document.addEventListener('click', () => this.closeAllPopovers());
  },

  // Compile an expression string into a callable function of x
  compile(exprStr) {
    // ─── Piecewise: {cond: expr, cond: expr, ...} ───
    if (exprStr.trim().startsWith('{') && exprStr.trim().endsWith('}')) {
      return this.compilePiecewise(exprStr);
    }
    const code = this._compileExpr(exprStr);
    return this._buildFn(code);
  },

  // Compile a standard y=f(x) expression
  // ─── Background images (overlay a picture to trace/model) ───
  addImage(opts = {}) {
    this._images = this._images || [];
    this._images.forEach(o => o._selected = false);
    const cx = (this.xMin + this.xMax) / 2, cy = (this.yMin + this.yMax) / 2;
    const im = {
      src: opts.src || '',
      x: opts.x != null ? Number(opts.x) : cx,
      y: opts.y != null ? Number(opts.y) : cy,
      w: opts.w != null ? Number(opts.w) : (this.xMax - this.xMin) / 2,
      h: opts.h != null ? Number(opts.h) : null,
      opacity: opts.opacity != null ? Number(opts.opacity) : 1,
      img: new Image(),
      _selected: true,
    };
    im.img.onload = () => {
      if (im.h == null && im.img.width) im.h = im.w * (im.img.height / im.img.width);
      if (this.panel) this.panel.classList.add('visible');
      this.render();
    };
    im.img.onerror = () => { try { showToast('Could not load image'); } catch (e) {} };
    if (im.h == null) im.h = im.w; // provisional until the real aspect loads
    if (opts.src) im.img.src = opts.src;
    this._images.push(im);
    this.render();
    return im;
  },

  clearImages() { this._images = []; this.render(); },

  // ─── Run an action entry: set stored vars to its RHS values, then react ───
  runAction(entry) {
    if (!entry || !entry.action || !Array.isArray(entry.action.assigns)) return;
    const vars = Session.get('exprVars', {});
    const results = [];
    // Compute every RHS against the CURRENT values first (simultaneous update).
    for (const a of entry.action.assigns) {
      let v;
      try { v = this._buildFn(this._compileExpr(a.expr))(0); } catch (e) { v = NaN; }
      if (typeof v === 'number' && isFinite(v)) results.push({ name: a.name.toUpperCase(), val: v });
    }
    if (!results.length) return;
    results.forEach(r => { vars[r.name] = r.val; });
    Session.set('exprVars', vars);
    this.recompileAll();
    this.render();
    try { if (typeof updateListPills === 'function') updateListPills(); } catch (e) {}
  },

  // Recompile every plottable expression so changes to stored variables take
  // effect (variables are substituted at compile time). Conservative: leaves an
  // entry untouched if recompilation throws.
  recompileAll() {
    this.expressions.forEach(e => {
      if (e.action || !e.rawExpr) return;
      try {
        if (e.implicitFn) {
          e.implicitFn = this.compileImplicit(e.rawExpr);
        } else if (e.piecewise) {
          e.fn = this.compilePiecewise(e.rawExpr);
        } else if (e.fn) {
          if (e.sliders && e.paramFn) {
            const params = Object.keys(e.sliders);
            e.paramFn = this._buildFn(this._compileExpr(e.rawExpr, params), params);
            e.fn = x => e.paramFn(x, e.sliderValues);
          } else {
            e.fn = this.compile(e.rawExpr);
          }
        }
      } catch (err) { /* keep previous compilation */ }
    });
  },

  // Hit-test images (topmost first) → { im, idx, mode } where mode is
  // 'delete' (top-right), 'resize' (bottom-right), or 'move'.
  _imageAt(mx, my, w, h) {
    if (!this._images) return null;
    for (let i = this._images.length - 1; i >= 0; i--) {
      const im = this._images[i];
      if (im.w == null || im.h == null) continue;
      const sx = (im.x - im.w / 2 - this.xMin) / (this.xMax - this.xMin) * w;
      const sy = (this.yMax - (im.y + im.h / 2)) / (this.yMax - this.yMin) * h;
      const sw = im.w / (this.xMax - this.xMin) * w;
      const sh = im.h / (this.yMax - this.yMin) * h;
      if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + sh) {
        const onDelete = mx >= sx + sw - 14 && my <= sy + 14;
        const onResize = mx >= sx + sw - 14 && my >= sy + sh - 14;
        return { im, idx: i, mode: onDelete ? 'delete' : (onResize ? 'resize' : 'move') };
      }
    }
    return null;
  },

  // ─── Calculus source rewriting ───
  // Find the index of the ')' that closes the '(' at openIdx (balanced).
  _matchParen(s, openIdx) {
    let depth = 0;
    for (let i = openIdx; i < s.length; i++) {
      if (s[i] === '(') depth++;
      else if (s[i] === ')') { depth--; if (depth === 0) return i; }
    }
    return -1;
  },

  // Split an argument string on top-level commas (ignoring nested brackets).
  _splitTopArgs(str) {
    const out = [];
    let depth = 0, start = 0;
    for (let i = 0; i <= str.length; i++) {
      const c = str[i];
      if (c === '(' || c === '[' || c === '{') depth++;
      else if (c === ')' || c === ']' || c === '}') depth--;
      else if ((c === ',' && depth === 0) || i === str.length) {
        out.push(str.slice(start, i).trim());
        start = i + 1;
      }
    }
    return out;
  },

  // Pick an integration/differentiation variable: prefer t when the integrand
  // uses t (so accumulation functions like integral(0, x, t^2) read naturally),
  // otherwise default to x.
  _calcVar(expr) {
    return (/\bt\b/.test(expr) && !/\bx\b/.test(expr)) ? 't' : 'x';
  },

  // Rewrite d/dx(...), nderiv(...), integral(...), sum(...), lim(...) into
  // calls to the numeric helpers injected by _buildFn.
  //
  // `boundOut`, when given, collects the bound variable of every sum/lim seen
  // (the i in Σ, the x in lim). _compileExpr adds those to its no-substitute
  // set: a student who has stored i = 5 must still be able to write
  // sum(i^2, i, 1, 10) without the loop variable being replaced by 5.
  _rewriteCalculus(str, boundOut) {
    let s = String(str);
    // d/dvar( EXPR ) — derivative operator with explicit variable.
    for (let guard = 0; guard < 50; guard++) {
      const m = s.match(/d\s*\/\s*d([a-zA-Z])\s*\(/);
      if (!m) break;
      const openIdx = m.index + m[0].length - 1;
      const close = this._matchParen(s, openIdx);
      if (close < 0) break;
      const v = m[1];
      const inner = s.slice(openIdx + 1, close);
      const repl = '_deriv(function(' + v + '){return (' + inner + ');},' + v + ')';
      s = s.slice(0, m.index) + repl + s.slice(close + 1);
    }
    // nderiv( EXPR , point ) — numeric derivative of EXPR at a point.
    for (let guard = 0; guard < 50; guard++) {
      const m = s.match(/\bnderiv\s*\(/);
      if (!m) break;
      const openIdx = m.index + m[0].length - 1;
      const close = this._matchParen(s, openIdx);
      if (close < 0) break;
      const args = this._splitTopArgs(s.slice(openIdx + 1, close));
      let repl;
      if (args.length >= 2) {
        const v = this._calcVar(args[0]);
        repl = '_deriv(function(' + v + '){return (' + args[0] + ');},(' + args[1] + '))';
      } else {
        repl = '(NaN)';
      }
      s = s.slice(0, m.index) + repl + s.slice(close + 1);
    }
    // integral( a , b , EXPR [, var] ) — definite integral via Simpson's rule.
    for (let guard = 0; guard < 50; guard++) {
      const m = s.match(/\bintegral\s*\(/);
      if (!m) break;
      const openIdx = m.index + m[0].length - 1;
      const close = this._matchParen(s, openIdx);
      if (close < 0) break;
      const args = this._splitTopArgs(s.slice(openIdx + 1, close));
      let repl;
      if (args.length >= 3) {
        const v = args[3] ? args[3].replace(/[^a-zA-Z]/g, '') || this._calcVar(args[2]) : this._calcVar(args[2]);
        repl = '_integ(function(' + v + '){return (' + args[2] + ');},(' + args[0] + '),(' + args[1] + '))';
      } else {
        repl = '(NaN)';
      }

    for (let guard = 0; guard < 50; guard++) {

    for (let guard = 0; guard < 50; guard++) {

  // ─── Unary sign in front of a power ───────────────────────────────────────
  // In maths -x^2 means -(x^2); after ^→** that is -x**2, which JavaScript
  // rejects outright ("Unary operator used immediately before exponentiation
  // expression"). The whole curve then fails to compile and the grid stays
  // empty with nothing to tell the user why.
  //
  // Rewrite the sign into an explicit product — -x**2 → -1*x**2. That parses,
  // and because ** binds tighter than * it keeps the mathematical meaning,
  // including for chains: -x**2**3 → -1*x**2**3 = -(x^(2^3)).
  //
  // Only a sign in UNARY position is touched: `5-x^2` is ordinary subtraction
  // and already legal, and `(-x)^2` is already parenthesised. The exponent
  // side needs no help — `x**-2` is legal JavaScript.
  // Implicit multiplication — 2x, 2(3), )(, )3, )x — spelled ONCE for the
  // graph compiler, the implicit-equation compiler, latexToExpr and the
  // calculator's arithmetic path. A digit followed by e/E and an (optionally
  // signed) digit is SCIENTIFIC NOTATION, never 2·e: `1e+21` is what M.fmt
  // prints for a large result and what a student types for Avogadro's number,
  // and splitting it read `1e+21` as e + 21 = 23.7.
  // sec / csc / cot are not Math functions: each becomes its reciprocal,
  // `sec(u)` → `(1/cos(u))`, with the whole argument found by balanced
  // parentheses (so `x^sec(x)` and `a/sec(x)` keep their meaning). Runs before
  // the sin/cos/tan rewrite, so DEG mode and implicit multiplication treat
  // the result like any cos(...) the student typed.
  _reciprocalTrig(src) {
    const RECIP = { sec: 'cos', csc: 'sin', cot: 'tan' };
    let e = src, guard = 0;
    for (;;) {
      const m = /(?<![A-Za-z_.])(sec|csc|cot)\s*\(/.exec(e);
      if (!m || ++guard > 200) return e;
      const open = m.index + m[0].length - 1;
      let depth = 0, close = -1;
      for (let i = open; i < e.length; i++) {
        if (e[i] === '(') depth++;
        else if (e[i] === ')') { depth--; if (depth === 0) { close = i; break; } }
      }
      if (close < 0) return e; // unbalanced: leave it for the parser to report
      e = e.slice(0, m.index) + '(1/' + RECIP[m[1]] + e.slice(open, close + 1) + ')' + e.slice(close + 1);
    }
  },

  _implicitMul(src) {
    let e = src.replace(/(\d)([A-Za-z])/g, (m, d, l, off, str) =>
      ((l === 'e' || l === 'E') && /^[+-]?\d/.test(str.slice(off + 2))) ? m : d + '*' + l);
    e = e.replace(/(\))(\()/g, '$1*$2');
    e = e.replace(/(\d)(\()/g, '$1*$2');

    e = e.replace(/(?<![A-Za-z0-9_.])pi\s*\(/g, 'pi*(');
    e = e.replace(/(\))(\d)/g, '$1*$2');
    e = e.replace(/(\))([A-Za-z])/g, '$1*$2');
    return e;
  },

  _fixUnaryPow(src) {
    const isSpace = (c) => c === ' ' || c === '\t';
    // Consume one operand starting at j: a parenthesised group, a number, or
    // an identifier/member chain plus any call or index groups. -1 if there is
    // no operand there.
    const skipBalanced = (s, j) => {
      let depth = 0;
      for (; j < s.length; j++) {
        const c = s[j];
        if (c === '(' || c === '[') depth++;
        else if (c === ')' || c === ']') { depth--; if (depth === 0) return j + 1; }
      }
      return j;                       // unbalanced input: treat as consumed
    };
    const skipOperand = (s, j) => {
      if (s[j] === '(') return skipBalanced(s, j);
      if (/[0-9.]/.test(s[j])) { while (j < s.length && /[0-9.]/.test(s[j])) j++; return j; }
      if (/[A-Za-z_$]/.test(s[j])) {
        while (j < s.length && /[A-Za-z0-9_$.]/.test(s[j])) j++;
        while (j < s.length && (s[j] === '(' || s[j] === '[')) j = skipBalanced(s, j);
        return j;

      return -1;

    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (c !== '-' && c !== '+') { out += c; continue; }

      let k = out.length - 1;
      while (k >= 0 && isSpace(out[k])) k--;
      const prev = k < 0 ? '' : out[k];
      if (prev !== '' && '+-*/%,(<>=!&|?:^['.indexOf(prev) < 0) { out += c; continue; }

      let j = i + 1;
      while (j < src.length && isSpace(src[j])) j++;
      const end = j < src.length ? skipOperand(src, j) : -1;
      if (end < 0 || end === j) { out += c; continue; }

      let p = end;
      while (p < src.length && isSpace(src[p])) p++;
      out += (src[p] === '*' && src[p + 1] === '*') ? c + '1*' : c;
    }
    return out;
  },

  _compileExpr(exprStr, extraVars) {

    // form with a negative coordinate is written); JavaScript would read "--"

    const boundVars = [];

    // reasons:

    //      \bsin\b would not match it and `sin` would survive to runtime
    //      undefined. Inserting the `*` first makes it `3*sin(x)`, which does
    //      match. Same for `2ln(x)`, `x^2sin(x)`, `2pi`, `4sqrt(x)`.
    //   2. `log` becomes `Math.log10`, and the digit-before-paren rule would
    //      then split its trailing digits from the call: `Math.log10*(x)`.
    //      Running first leaves the generated name untouched.
    e = this._reciprocalTrig(e);

    } else {
      e = e.replace(/\bsin\b/g, 'Math.sin'); e = e.replace(/\bcos\b/g, 'Math.cos'); e = e.replace(/\btan\b/g, 'Math.tan');
    }
    e = e.replace(/\basin\b/g, 'Math.asin');
    e = e.replace(/\bacos\b/g, 'Math.acos');
    e = e.replace(/\batan\b/g, 'Math.atan');
    e = e.replace(/\bsqrt\b/g, 'Math.sqrt');
    e = e.replace(/\bcbrt\b/g, 'Math.cbrt');
    e = e.replace(/\babs\b/g, 'Math.abs');
    // log BEFORE ln. The other order lets the `log` rule re-match the
    // `Math.log` the `ln` rule just produced, turning it into
    // `Math.Math.log10` — natural log then throws at every sample point and
    // the curve silently never draws. (Same ordering fix already applied in
    // client calcEngine.js and server graders/graphlab.js.)
    e = e.replace(/\blogbase\b/g, '_logbase');
    e = e.replace(/\blog\b/g, 'Math.log10');
    e = e.replace(/\bln\b/g, 'Math.log');
    e = e.replace(/\bexp\b/g, 'Math.exp');
    e = e.replace(/\bfloor\b/g, 'Math.floor');
    e = e.replace(/\bceil\b/g, 'Math.ceil');
    e = e.replace(/\bround\b/g, 'Math.round');

    // approach point. All the spellings the graders accept (oo and infty
    // included). Bounded on both sides so it cannot fire inside a name: by
    // this point floor() has become Math.floor, which contains "oo".
    // (Piecewise interval bounds resolve their own inf before reaching here,
    // so this does not double-handle them.)
    e = e.replace(/(?<![A-Za-z0-9])(?:infinity|infty|inf|oo|∞)(?![A-Za-z0-9])/gi, 'Infinity');
    e = e.replace(/(?<![A-Za-z0-9.])e(?![A-Za-z0-9])/g, 'Math.E'); // 1e+21 is a literal, not 1·e
    // (Implicit multiplication already ran, above the name rewrites.)
    // Substitute stored variables (except x and slider params)
    const vars = Session.get('exprVars', {});
    // Bound variables of sum/lim are loop-locals of the emitted closures, not
    // references to stored values — never substitute them.
    const skip = new Set([
      'X',
      ...(extraVars || []).map(v => v.toUpperCase()),
      ...boundVars.map(v => v.toUpperCase()),

      if (skip.has(name)) continue;

      // front of a `**` (A = -3 in `A^2` → `-3**2`, a SyntaxError) or bind
      // wrongly after a `-`. `(-3)**2` is both legal and correct.
      e = e.replace(re, '(' + String(val) + ')');
    }
    return e;
  },

  // Build a callable function from a compiled expression string
  _buildFn(compiledExpr, paramNames) {

    const _cosd = a => Math.cos(a * Math.PI / 180);
    const _tand = a => Math.tan(a * Math.PI / 180);
    const _logbase = (b, x) => Math.log(x) / Math.log(b);

    const _deriv = (f, x0) => {

    const _integ = (f, a, b) => {
      if (!isFinite(a) || !isFinite(b)) return NaN;
      if (a === b) return 0;

      if (a > b) { const tmp = a; a = b; b = tmp; sign = -1; }
      const n = 1000;
      const h = (b - a) / n;

    // (slowly-converging limits). Returns NaN unless the extrapolants settle,
    // so a non-convergent sequence is never handed a plausible-looking number.
    const _aitken = (vals) => {
      let seq = vals.filter(v => Number.isFinite(v));
      if (seq.length < 3) return NaN;
      for (let pass = 0; pass < 8 && seq.length >= 3; pass++) {
        const out = [];

          const d1 = seq[i + 1] - seq[i], d2 = seq[i + 2] - seq[i + 1], den = d2 - d1;
          if (!(Math.abs(den) > 1e-13 * Math.max(Math.abs(d1), Math.abs(d2)))) { out.push(seq[i + 2]); continue; }
          const v = seq[i] - (d1 * d1) / den;
          out.push(Number.isFinite(v) ? v : seq[i + 2]);

      }
      const best = seq[seq.length - 1];
      if (!Number.isFinite(best)) return NaN;
      if (seq.length >= 2 && Math.abs(best - seq[seq.length - 2]) > 1e-7 * Math.max(1, Math.abs(best))) return NaN;
      return best;
    };
    // Σ f(i) from lo to hi. A finite range is summed directly (capped so a
    // typo like sum(i, i, 1, 10^9) can't lock the tab); hi = Infinity runs the
    // convergent-series evaluator, mirroring server/graders/expression.js so
    // the calculator and the grader agree on what a series is worth. Partial
    // sums at doubling checkpoints, extrapolated; convergence must be
    // certified (terms → 0 AND per-block mass decaying geometrically) or the
    // result is NaN, so a divergent series reports "no value" instead of a
    // partial sum. See infiniteSum() there for the full rationale.
    const _sum = (f, lo, hi) => {

    //

    // four values: a numerator with cancellation — 1−cos(h), e^h−1−h —
    // rounds to exactly 0 there, the tail read [0, 0, 0, 0], and
    // lim (1−cos x)/x² came back 0 with full confidence. Now:
    //   · divergence is read off the shape of the sequence (one sign, |f|
    //     growing, steps not shrinking), so ln(x) → 0⁺ is −∞ even though
    //     ln(1e-8) is only −18; the old test demanded |f| > 1e8.
    //   · the value is POLYNOMIAL EXTRAPOLATION TO h = 0 (Neville) over the
    //     LARGE steps, h = 0.1 … 1e-5, where roundoff is negligible and
    //     f(a+h) = L + c₁h + c₂h² + … holds for anything analytic; the node
    //     set with the smallest extrapolation error is kept. Aitken over the
    //     whole sequence is the fallback for non-analytic approaches such as
    //     sqrt(h), and the raw tail for a squeeze like x·sin(1/x).
    //   · the result carries that error estimate and is ROUNDED to the digits
    //     it supports, so a limit known to 3e-9 reports 0.5, not 0.4999999973
    //     — which reads as "wrong" on a 10-decimal display. An estimate is

    const _roundToErr = (v, err) => {

    const _nevilleZero = (hs, vs) => {
      const n = hs.length, T = vs.slice(), diag = [T[0]];

      if (fin.length < 3 || vals.slice(-3).some(v => Number.isNaN(v))) return NaN;
      const rel = (a, b) => Math.abs(a - b) / Math.max(1, Math.abs(a), Math.abs(b));
      // Divergence: |f| grows over the WHOLE sequence, the last four keep one
      // sign, and the steps between them do not shrink (geometric or
      // logarithmic). Growth over the last four alone is not enough: a
      // numerator with cancellation blows up from roundoff at the smallest
      // steps while the large steps sit calmly on the limit.
      // A roundoff blowup is preceded by a calm plateau where the steps
      // SHRINK; real divergence never has a step less than half the one
      // before it. That is what tells (e^x−1−x)/x² from the left (values
      // creeping up through the noise) apart from ln(x) → 0⁺.
      const seq = fin.slice(-6).map(p => p[1]);
      if (seq.length >= 4) {
        const growing = seq.every((v, i) => i === 0 || Math.abs(v) > Math.abs(seq[i - 1]));
        const oneSign = seq.slice(-4).every(v => v !== 0 && Math.sign(v) === Math.sign(seq[seq.length - 1]));
        const st = seq.slice(1).map((v, i) => Math.abs(v - seq[i]));
        const noShrink = st.every((v, i) => i === 0 || v >= 0.5 * st[i - 1]);
        const n = st.length;
        const hold = st[n - 1] >= 0.9 * st[n - 2] && st[n - 2] >= 0.9 * st[n - 3];
        const last = seq[seq.length - 1];
        if (oneSign && growing && noShrink && (hold || Math.abs(last) > 1e3)) return Math.sign(last) * Infinity;
      }
      // Convergence, first choice: extrapolate to h = 0 over the large steps.
      // Each node set is extrapolated with and WITHOUT its smallest node, and
      // the difference is that node's contribution — the error estimate. A
      // set can fit noise or a non-analytic approach (sqrt(h), x·sin(1/x))
      // by accident, but dropping a node changes such a fit wholesale, while

      const big = fin.filter(p => p[0] >= 1e-5 - 1e-15);

        const vp = dp[dp.length - 1];
        if (!Number.isFinite(v) || !Number.isFinite(vp)) continue;

      }

        if (best.err <= 1e-5 * Math.max(1, Math.abs(best.v))) return _roundToErr(best.v, best.err);
      }
      // Second: Aitken over the whole sequence (geometric approaches, sqrt(h)).
      const last = fin[fin.length - 1][1];
      const ext = _aitken(fin.map(p => p[1]));
      if (Number.isFinite(ext) && rel(ext, last) <= 1e-3) return _roundToErr(ext, Math.abs(ext - last));
      // Third: the raw tail has settled (a squeeze such as x·sin(1/x)).
      const d1 = rel(fin[fin.length - 1][1], fin[fin.length - 2][1]), d2 = rel(fin[fin.length - 2][1], fin[fin.length - 3][1]);
      if (d1 <= 1e-5 && d2 <= 1e-4) return _roundToErr(last, Math.max(d1, d2) * Math.max(1, Math.abs(last)));
      return NaN;
    };
    // lim f(v) as v → at. side 0 = two-sided: both sides must exist AND agree,
    // which is what makes lim |x|/x at 0 report NaN (does not exist).
    const _lim = (f, at, side) => {
      if (!isFinite(at)) return _limSide(f, at, at > 0 ? 1 : -1);
      if (side) return _limSide(f, at, side);
      const L = _limSide(f, at, -1), R = _limSide(f, at, 1);
      if (Number.isNaN(L) || Number.isNaN(R)) return NaN;
      if (L === R) return L; // covers matching ±Infinity
      return Math.abs(L - R) <= 1e-6 * Math.max(1, Math.abs(L), Math.abs(R)) ? (L + R) / 2 : NaN;
    };
    const args = ['x', '_sind', '_cosd', '_tand', '_logbase', '_deriv', '_integ', '_sum', '_lim', ...(paramNames || [])];
    const fn = new Function(...args, '"use strict"; return (' + compiledExpr + ')');
    if (paramNames && paramNames.length) {
      return (x, params) => fn(x, _sind, _cosd, _tand, _logbase, _deriv, _integ, _sum, _lim, ...(paramNames.map(p => params[p] || 0)));
    }
    const bound = x => fn(x, _sind, _cosd, _tand, _logbase, _deriv, _integ, _sum, _lim);
    bound(0); // test
    return bound;
  },

  // ─── Piecewise function compiler ───
  compilePiecewise(exprStr) {
    const inner = exprStr.trim().slice(1, -1).trim(); // remove { }
    const pieces = [];
    // Split on commas, respecting nested parens/braces
    let depth = 0, start = 0;
    for (let i = 0; i <= inner.length; i++) {
      const ch = inner[i];
      if (ch === '(' || ch === '[' || ch === '{') depth++;
      else if (ch === ')' || ch === ']' || ch === '}') depth--;
      if ((ch === ',' && depth === 0) || i === inner.length) {
        const piece = inner.slice(start, i).trim();
        if (piece) pieces.push(piece);
        start = i + 1;
      }
    }
    if (!pieces.length) throw { msg: 'Empty piecewise', hint: 'Use {x < 0: x^2, x >= 0: 2x+1} or {[3,5]: x^2} or {[3,5], x^2}' };

    // Pre-process: merge interval + expression pairs separated by comma (no colon)
    // e.g., ["[3,5]", "x^2", "(-inf,3)", "2x"] → ["[3,5]: x^2", "(-inf,3): 2x"]
    const isInterval = s => /^[(\[].*[)\]]$/.test(s.trim());
    const merged = [];
    for (let i = 0; i < pieces.length; i++) {
      if (isInterval(pieces[i]) && !pieces[i].includes(':') && i + 1 < pieces.length && !isInterval(pieces[i + 1]) && !pieces[i + 1].includes(':')) {
        merged.push(pieces[i] + ': ' + pieces[i + 1]);
        i++; // skip next
      } else {
        merged.push(pieces[i]);
      }
    }

    // Parse each piece: "condition: expression" or "otherwise" as last piece
    const parsed = [];
    merged.forEach((piece, idx) => {
      const colonIdx = piece.indexOf(':');
      if (colonIdx < 0) {
        if (piece.toLowerCase().startsWith('otherwise')) {
          parsed.push({ cond: null, expr: piece.replace(/^otherwise\s*/i, '').trim() || '0' });
        } else {
          parsed.push({ cond: null, expr: piece });
        }
        return;
      }
      let cond = piece.slice(0, colonIdx).trim();
      const expr = piece.slice(colonIdx + 1).trim();
      if (!cond || !expr) throw { msg: 'Piecewise syntax error in: ' + piece, hint: 'Use condition: expression' };
      // "otherwise: expr" — same catch-all as the colon-less "otherwise expr"
      if (/^otherwise$/i.test(cond)) { parsed.push({ cond: null, expr }); return; }
      // Convert interval notation to inequality: [a, b) → a <= x && x < b
      const intervalMatch = cond.match(/^([(\[])([^,]+),\s*([^)\]]+)([)\]])$/);
      if (intervalMatch) {
        const loInc = intervalMatch[1] === '[';
        let lo = intervalMatch[2].trim().replace(/inf(inity)?|\u221E/gi, 'Infinity');
        let hi = intervalMatch[3].trim().replace(/inf(inity)?|\u221E/gi, 'Infinity');
        const hiInc = intervalMatch[4] === ']';
        const parts = [];
        if (lo !== '-Infinity' && lo !== 'Infinity') {
          parts.push(`x ${loInc ? '>=' : '>'} ${lo}`);
        }
        if (hi !== 'Infinity' && hi !== '-Infinity') {
          parts.push(`x ${hiInc ? '<=' : '<'} ${hi}`);
        }
        cond = parts.length ? parts.join(' && ') : 'true';
      }
      parsed.push({ cond, expr });
    });

    // Compile each piece
    const compiledPieces = parsed.map(p => {
      const exprCode = this._compileExpr(p.expr);
      const exprFn = this._buildFn(exprCode);
      let condFn;
      if (p.cond) {
        const condCode = this._compileCondition(p.cond);
        try {
          const cfn = new Function('x', '"use strict"; return (' + condCode + ');');
          cfn(0); // test
          condFn = cfn;
        } catch(e) {
          throw { msg: 'Invalid condition: ' + p.cond, hint: e.message };
        }
      } else {
        condFn = () => true; // otherwise
      }
      return { exprFn, condFn, rawCond: p.cond, rawExpr: p.expr };
    });

    const bound = (x) => {
      for (let i = 0; i < compiledPieces.length; i++) {
        try {
          if (compiledPieces[i].condFn(x)) return compiledPieces[i].exprFn(x);
        } catch(e) {}
      }
      return NaN;
    };
    bound(0); // test
    bound._piecewise = parsed; // store for boundary dot rendering
    return bound;
  },

  // Compile a condition string like "x < 0", "x >= 3", "-1 < x <= 2"
  _compileCondition(cond) {
    let c = cond.trim();
    // Normalize unicode comparison operators
    c = c.replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u2260/g, '!=');
    // π in a bound: "x < pi", "0 <= x <= 2pi". A condition is spliced into JS
    // as written, so `pi` was a ReferenceError — "Invalid condition", and from
    // a display slot (which swallows the error) a curve that silently did not
    // draw. Polar and parametric restrictions are written in π, and a y = f(x)
    // restriction on a trig stem is too.
    c = c.replace(/\u03C0/g, 'pi').replace(/(\d)\s*pi(?![A-Za-z0-9_])/gi, '$1*pi')
      .replace(/(?<![A-Za-z0-9_.])pi(?![A-Za-z0-9_])/gi, '(Math.PI)');
    // Handle compound inequality: a < x <= b  →  (x > a && x <= b)
    const compound = c.match(/^([^<>=]+?)\s*(<=?)\s*x\s*(<=?)\s*([^<>=]+)$/);
    if (compound) {
      const lo = compound[1].trim(), op1 = compound[2], op2 = compound[3], hi = compound[4].trim();
      // Flip: a < x means x > a
      const flipped1 = op1 === '<' ? '>' : '>=';
      return `(x ${flipped1} ${lo} && x ${op2} ${hi})`;
    }
    // Handle compound: a > x >= b  →  (x < a && x >= b)
    const compound2 = c.match(/^([^<>=]+?)\s*(>=?)\s*x\s*(>=?)\s*([^<>=]+)$/);
    if (compound2) {
      const hi = compound2[1].trim(), op1 = compound2[2], op2 = compound2[3], lo = compound2[4].trim();
      const flipped1 = op1 === '>' ? '<' : '<=';
      return `(x ${flipped1} ${hi} && x ${op2.replace('>', '<').replace('>=', '<=')} ${lo})`;
    }
    // Simple: x < 0, x >= 3, etc — pass through with minimal cleanup
    c = c.replace(/(?<![<>!])=(?!=)/g, '==='); // lone = to ===
    return c;
  },

  // ─── Implicit equation compiler: F(x,y) = 0 ───
  compileImplicit(exprStr) {
    // exprStr is like "x^2 + y^2 - 25" (already rearranged to = 0)
    let e = exprStr;
    // Two minus signs in a row are a plus ("y - -5", the way a point-slope
    // form with a negative coordinate is written); JavaScript would read "--"
    // as a decrement.
    e = e.replace(/-(\s*)-/g, '+');
    e = e.replace(/\^/g, '**');
    e = Graph._fixUnaryPow(e);
    // Implicit multiplication first, log before ln, and the unary-sign repair
    // above — see _compileExpr for why; this chain must stay in step with it.
    e = Graph._reciprocalTrig(e);
    e = Graph._implicitMul(e);
    if (typeof angleMode !== 'undefined' && angleMode === 'deg') {
      e = e.replace(/\bsin\b/g, '_sind'); e = e.replace(/\bcos\b/g, '_cosd'); e = e.replace(/\btan\b/g, '_tand');
    } else {
      e = e.replace(/\bsin\b/g, 'Math.sin'); e = e.replace(/\bcos\b/g, 'Math.cos'); e = e.replace(/\btan\b/g, 'Math.tan');
    }
    e = e.replace(/\basin\b/g, 'Math.asin'); e = e.replace(/\bacos\b/g, 'Math.acos'); e = e.replace(/\batan\b/g, 'Math.atan');
    e = e.replace(/\bsqrt\b/g, 'Math.sqrt'); e = e.replace(/\bcbrt\b/g, 'Math.cbrt'); e = e.replace(/\babs\b/g, 'Math.abs');
