// ═══ SKETCH SYSTEM — Interactive student graphing ═══
// Students place/drag points to construct curves. Results reported to parent.
(function() {
  'use strict';

  const POINT_RADIUS = 5;
  const SNAP_RADIUS = 16; // pixels to grab a point
  const HANDLE_RADIUS = 6;

  // ─── Scale options for grid snap ───
  const SCALES = [
    { label: '1', value: 1 },
    { label: '\u03C0', value: Math.PI },
    { label: '\u03C0/2', value: Math.PI / 2 },
    { label: '\u03C0/4', value: Math.PI / 4 },
    { label: '\u03C0/6', value: Math.PI / 6 },
  ];

  // ─── Curve fitting functions ───
  const Fit = {
    line(p1, p2) {
      if (Math.abs(p2.x - p1.x) < 1e-12) return { eq: `x = ${p1.x}`, m: Infinity, b: p1.y };
      const m = (p2.y - p1.y) / (p2.x - p1.x);
      const b = p1.y - m * p1.x;
      return { eq: `y = ${fmtN(m)}x + ${fmtN(b)}`, coefficients: { m, b }, fn: x => m * x + b };
    },
    parabola(vertex, pt) {
      const h = vertex.x, k = vertex.y;
      const dx = pt.x - h;
      if (Math.abs(dx) < 1e-12) return null;
      const a = (pt.y - k) / (dx * dx);
      return { eq: `y = ${fmtN(a)}(x - ${fmtN(h)})² + ${fmtN(k)}`, coefficients: { a, h, k }, fn: x => a * (x - h) * (x - h) + k };
    },
    abs(vertex, pt) {
      const h = vertex.x, k = vertex.y;
      const dx = Math.abs(pt.x - h);
      if (dx < 1e-12) return null;
      const a = (pt.y - k) / dx;
      return { eq: `y = ${fmtN(a)}|x - ${fmtN(h)}| + ${fmtN(k)}`, coefficients: { a, h, k }, fn: x => a * Math.abs(x - h) + k };
    },
    exponential(yInt, pt, asymptote) {
      const c = asymptote || 0;
      const a = yInt.y - c;
      if (Math.abs(a) < 1e-12 || Math.abs(pt.x) < 1e-12) return null;
      const b = Math.pow((pt.y - c) / a, 1 / pt.x);
      if (!isFinite(b) || b <= 0) return null;
      return { eq: `y = ${fmtN(a)}·${fmtN(b)}^x + ${fmtN(c)}`, coefficients: { a, b, c }, fn: x => a * Math.pow(b, x) + c };
    },
    sqrt(start, pt) {
      const h = start.x, k = start.y;
      const dx = pt.x - h;
      if (dx <= 0) return null;
      const a = (pt.y - k) / Math.sqrt(dx);
      return { eq: `y = ${fmtN(a)}√(x - ${fmtN(h)}) + ${fmtN(k)}`, coefficients: { a, h, k }, fn: x => (x >= h) ? a * Math.sqrt(x - h) + k : NaN };
    },
    sine(midPt, extremePt) {
      const d = midPt.y; // midline
      const a = extremePt.y - d; // amplitude (positive=max, negative=min)
      const quarterPeriod = Math.abs(extremePt.x - midPt.x);
      if (quarterPeriod < 1e-12) return null;
      const period = 4 * quarterPeriod;
      const b = (2 * Math.PI) / period;
      const c = midPt.x; // phase shift
      return { eq: `y = ${fmtN(a)}sin(${fmtN(b)}(x - ${fmtN(c)})) + ${fmtN(d)}`, coefficients: { a, b, c, d }, fn: x => a * Math.sin(b * (x - c)) + d };
    },
    cosine(ext1, ext2) {
      const d = (ext1.y + ext2.y) / 2; // midline
      const a = ext1.y - d; // amplitude from first point
      const halfPeriod = Math.abs(ext2.x - ext1.x);
      if (halfPeriod < 1e-12) return null;
      const period = 2 * halfPeriod;
      const b = (2 * Math.PI) / period;
      const c = ext1.x; // phase shift
      return { eq: `y = ${fmtN(a)}cos(${fmtN(b)}(x - ${fmtN(c)})) + ${fmtN(d)}`, coefficients: { a, b, c, d }, fn: x => a * Math.cos(b * (x - c)) + d };
    },
    circle(center, pt) {
      const h = center.x, k = center.y;
      const r = Math.sqrt((pt.x - h) ** 2 + (pt.y - k) ** 2);
      if (r < 1e-12) return null;
      return { eq: `(x - ${fmtN(h)})² + (y - ${fmtN(k)})² = ${fmtN(r * r)}`, coefficients: { h, k, r }, implicitFn: (x, y) => (x - h) * (x - h) + (y - k) * (y - k) - r * r };
    },
    ellipse(center, corner, minorRadius) {
      const h = center.x, k = center.y;
      const a = Math.abs(corner.x - h); // semi-major
      const b = (minorRadius !== undefined) ? Math.abs(minorRadius) : Math.abs(corner.y - k);
      if (a < 1e-12 || b < 1e-12) return null;
      return { eq: `(x-${fmtN(h)})²/${fmtN(a*a)} + (y-${fmtN(k)})²/${fmtN(b*b)} = 1`, coefficients: { h, k, a, b }, implicitFn: (x, y) => ((x-h)*(x-h))/(a*a) + ((y-k)*(y-k))/(b*b) - 1 };
    },
    hyperbola(center, corner, vertexDist) {
      const h = center.x, k = center.y;
      const a = Math.abs(corner.x - h);
      const bBox = Math.abs(corner.y - k);
      const b = (vertexDist !== undefined) ? Math.abs(vertexDist) : bBox;
      if (a < 1e-12 || b < 1e-12) return null;
      // Horizontal opening
      return { eq: `(x-${fmtN(h)})²/${fmtN(a*a)} - (y-${fmtN(k)})²/${fmtN(b*b)} = 1`, coefficients: { h, k, a, b }, implicitFn: (x, y) => ((x-h)*(x-h))/(a*a) - ((y-k)*(y-k))/(b*b) - 1 };
    },
    focusDirectrix(directrixPt, focus) {
      // Vertical directrix: x = d, focus at (fx, fy)
      // Horizontal directrix: y = d, focus at (fx, fy)
      const dx = Math.abs(focus.x - directrixPt.x);
      const dy = Math.abs(focus.y - directrixPt.y);
      if (dx > dy) {
        // Vertical directrix (parabola opens left/right)
        const d = directrixPt.x;
        const fx = focus.x, fy = focus.y;
        const p = (fx - d) / 2; // distance from vertex to focus
        const vx = d + p, vy = fy;
        return { eq: `(y-${fmtN(vy)})² = ${fmtN(4*p)}(x-${fmtN(vx)})`, coefficients: { vx, vy, p, directrix: d, horizontal: false },
          implicitFn: (x, y) => (y - vy) * (y - vy) - 4 * p * (x - vx),
          directrixLine: { vertical: true, val: d }, focusPt: { x: fx, y: fy } };
      } else {
        // Horizontal directrix (parabola opens up/down)
        const d = directrixPt.y;
        const fx = focus.x, fy = focus.y;
        const p = (fy - d) / 2;
        const vx = fx, vy = d + p;
        return { eq: `(x-${fmtN(vx)})² = ${fmtN(4*p)}(y-${fmtN(vy)})`, coefficients: { vx, vy, p, directrix: d, horizontal: true },
          implicitFn: (x, y) => (x - vx) * (x - vx) - 4 * p * (y - vy),
          directrixLine: { vertical: false, val: d }, focusPt: { x: fx, y: fy } };
      }
    }
  };

  function fmtN(n) {
    if (Number.isInteger(n)) return String(n);
    return n.toFixed(4).replace(/\.?0+$/, '');
  }

  // ─── Main sketch state ───
  const sketch = {
    active: false,
    shape: null,
    points: [],     // [{ x, y, role }] — math coordinates
    handle: null,   // optional 3rd handle for ellipse/hyperbola { x, y }
    color: '#c0392b',
    snapGrid: true,
    snapScale: 1,   // grid snap unit
    showEq: false,
    replyTo: null,
    locked: false,
    submitted: false,
    feedbackColor: null,  // override color after feedback
    asymptote: 0,
    _dragging: null,      // index of point being dragged, or 'handle'
    _uiEl: null,          // sketch UI container

    // ─── Snap a math coordinate to grid ───
    snap(val, axis) {
      if (!this.snapGrid) return val;
      // X uses the selected scale (π, π/2, etc.), Y always snaps to 1
      const s = axis === 'y' ? 1 : this.snapScale;
      return Math.round(val / s) * s;
    },

    // ─── Convert screen to math coords (using Graph) ───
    screenToMath(sx, sy, w, h) {
      const xRange = Graph.xMax - Graph.xMin, yRange = Graph.yMax - Graph.yMin;
      return { x: Graph.xMin + sx / w * xRange, y: Graph.yMax - sy / h * yRange };
    },

    // ─── Handle click on canvas ───
    handleClick(mx, my, w, h) {
      if (this.locked) return;
      const raw = this.screenToMath(mx, my, w, h);
      const pt = { x: this.snap(raw.x, 'x'), y: this.snap(raw.y, 'y') };

      if (this.points.length === 0) {
        pt.role = 'anchor';
        this.points.push(pt);
        Graph.render();
        this.reportState();
      } else if (this.points.length === 1) {
        pt.role = 'shaper';
        this.points.push(pt);

        // For ellipse/hyperbola, auto-create the third handle
        if (this.shape === 'ellipse' || this.shape === 'hyperbola') {
          const center = this.points[0];
          const corner = this.points[1];
          const b = Math.abs(corner.y - center.y);
          // Place handle on the minor axis (perpendicular)
          this.handle = { x: center.x, y: center.y + (b || Math.abs(corner.x - center.x) * 0.6) };
        }

        Graph.render();
        this.reportState();
      }
    },

    // ─── Start dragging a point ───
    startDrag(mx, my, w, h) {
      if (this.locked) return false;
      // Check each point
      for (let i = 0; i < this.points.length; i++) {
        const xRange = Graph.xMax - Graph.xMin, yRange = Graph.yMax - Graph.yMin;
        const sx = (this.points[i].x - Graph.xMin) / xRange * w;
        const sy = (Graph.yMax - this.points[i].y) / yRange * h;
        if (Math.sqrt((sx - mx) ** 2 + (sy - my) ** 2) < SNAP_RADIUS) {
          this._dragging = i;
          return true;
        }
      }
      // Check handle
      if (this.handle) {
        const xRange = Graph.xMax - Graph.xMin, yRange = Graph.yMax - Graph.yMin;
        const sx = (this.handle.x - Graph.xMin) / xRange * w;
        const sy = (Graph.yMax - this.handle.y) / yRange * h;
        if (Math.sqrt((sx - mx) ** 2 + (sy - my) ** 2) < SNAP_RADIUS) {
          this._dragging = 'handle';
          return true;
        }
      }
      return false;
    },

    // ─── Drag point ───
    onDrag(mx, my, w, h) {
      if (this._dragging === null || this.locked) return;
      const raw = this.screenToMath(mx, my, w, h);
      const pt = { x: this.snap(raw.x, 'x'), y: this.snap(raw.y, 'y') };
      if (this._dragging === 'handle') {
        // Constrain handle to minor axis for ellipse: same x as center
        if (this.shape === 'ellipse' && this.points[0]) {
          this.handle = { x: this.points[0].x, y: pt.y };
        } else {
          this.handle = pt;
        }
      } else {
        const idx = this._dragging;
        this.points[idx].x = pt.x;
        this.points[idx].y = pt.y;
      }
      Graph.render();
      this.reportState();
    },

    // ─── End drag ───
    endDrag() {
      this._dragging = null;
    },

    // ─── Compute the fit and report to parent ───
    reportState() {
      if (this.points.length < 2) {
        if (this.replyTo && window.parent) {
          window.parent.postMessage({ type: this.replyTo, shape: this.shape, points: [...this.points], eq: null, coefficients: null, partial: true }, '*');
        }
        return;
      }
      const result = this.computeFit();
      if (result && this.replyTo && window.parent) {
        window.parent.postMessage({
          type: this.replyTo,
          shape: this.shape,
          points: this.points.map(p => ({ x: p.x, y: p.y })),
          handle: this.handle ? { x: this.handle.x, y: this.handle.y } : null,
          eq: result.eq,
          coefficients: result.coefficients || null,
          partial: false
        }, '*');
      }
    },

    // ─── Compute the curve fit ───
    computeFit() {
      if (this.points.length < 2) return null;
      const p1 = this.points[0], p2 = this.points[1];
      switch (this.shape) {
        case 'line': return Fit.line(p1, p2);
        case 'parabola': return Fit.parabola(p1, p2);
        case 'abs': return Fit.abs(p1, p2);
        case 'exponential': return Fit.exponential(p1, p2, this.asymptote);
        case 'sqrt': return Fit.sqrt(p1, p2);
        case 'sine': return Fit.sine(p1, p2);
        case 'cosine': return Fit.cosine(p1, p2);
        case 'circle': return Fit.circle(p1, p2);
        case 'ellipse': {
          const minorR = this.handle ? Math.abs(this.handle.y - p1.y) : undefined;
          return Fit.ellipse(p1, p2, minorR);
        }
        case 'hyperbola': {
          const vDist = this.handle ? Math.abs(this.handle.y - p1.y) : undefined;
          return Fit.hyperbola(p1, p2, vDist);
        }
        case 'focus-directrix': return Fit.focusDirectrix(p1, p2);
        default: return null;
      }
    },

    // ─── Render sketch overlay on canvas ───
    renderOverlay(ctx, w, h, toSX, toSY, fromSX, fromSY) {
      const fit = this.computeFit();
      const drawColor = this.feedbackColor || this.color;

      // Draw the curve if we have a fit
      if (fit) {
        ctx.save();
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([]);

        if (fit.fn) {
          // Standard y=f(x) curve
          ctx.beginPath();
          let started = false;
          for (let px = 0; px <= w; px += 1) {
            const x = fromSX(px);
            try {
              const y = fit.fn(x);
              if (!isFinite(y)) { started = false; continue; }
              const sy = toSY(y);
              if (!started) { ctx.moveTo(px, sy); started = true; }
              else ctx.lineTo(px, sy);
            } catch(e) { started = false; }
          }
          ctx.stroke();

        const res = ExprEngine.evaluate(eq, null);

        // If it produced a graph, find the newly added expression
        if (res && res.type === 'graph') {
          // The expression was pushed to Graph.expressions by handleGraph/addSmart
          const newEntry = Graph.expressions[Graph.expressions.length - 1];
          if (newEntry) {
            _tagMap[tag] = newEntry.id;
            newEntry._tag = tag;

            // Apply style overrides
            if (msg.color) {
              const c = resolveColor(msg.color);
              if (c) newEntry.color = c;
            }
            if (msg.style) {
              const d = resolveDash(msg.style);
              if (d !== null) newEntry.dash = d;
            }
            if (msg.weight !== undefined) newEntry.lineWidth = msg.weight;
            if (msg.visible !== undefined) newEntry.visible = msg.visible;
            if (msg.ghost !== undefined) newEntry._ghost = msg.ghost; if (msg.fixed !== undefined) newEntry._fixed = !!msg.fixed;
            // Labeled / open-style scatter points (for given-diagram point sets).
            if (msg.labels !== undefined) newEntry._ptLabels = msg.labels;
            if (msg.pointStyle !== undefined) newEntry._ptStyle = msg.pointStyle;
            if (msg.connect !== undefined) newEntry._ptConnect = msg.connect;

            Graph.updateRows();
            Graph.render();
          }
        } else if (res && res.type === 'assignment') {
          // Variable/list assignment — store tag for reference but no graph entry
          _tagMap[tag] = '_var_' + (res.name || tag);
        }
        // Other types (numeric eval, inference, viz) — still computed but no graph
      } catch(e) {
        // Expression couldn't be parsed — still try as a raw graph add
        try {
          const id = Graph.addSmart(eq, eq, null);
          if (id !== undefined) {
            const newEntry = Graph.expressions.find(e => e.id === id);
            if (newEntry) {
              _tagMap[tag] = id;
              newEntry._tag = tag;
              if (msg.color) {
                const c = resolveColor(msg.color);
                if (c) newEntry.color = c;
              }
              if (msg.style) {
                const d = resolveDash(msg.style);
                if (d !== null) newEntry.dash = d;
              }
              if (msg.weight !== undefined) newEntry.lineWidth = msg.weight;
              if (msg.visible !== undefined) newEntry.visible = msg.visible;
              if (msg.ghost !== undefined) newEntry._ghost = msg.ghost; if (msg.fixed !== undefined) newEntry._fixed = !!msg.fixed;
              Graph.updateRows();
              Graph.render();
            }
          }
        } catch(e2) {}
      }
    },

    // ── Remove expression by tag ──
    'kovalna-remove': function(msg) {
      if (!msg.tag) return;
      const id = _tagMap[msg.tag];
      if (id === undefined) return;

      // If it's a variable reference, remove the variable
      if (typeof id === 'string' && id.startsWith('_var_')) {
        const varName = id.replace('_var_', '');
        const vars = Session.get('exprVars', {});
        delete vars[varName.toUpperCase()];
        Session.set('exprVars', vars);
        if (typeof DataLists !== 'undefined') {
          DataLists.remove(varName.toUpperCase());
        }
        try { if (typeof updateListPills === 'function') updateListPills(); } catch(e) {}
      } else {
        // Graph expression
        Graph.remove(id);
      }
      delete _tagMap[msg.tag];
    },

    // ── Save full state snapshot ──
    'kovalna-save': function(msg) {
      const state = {
        // Graph state. Nothing on the graph is skipped: entries whose compiled
        // `fn` can't be serialized (Riemann/area, regression curves) carry a
        // source string instead and kovalna-load recompiles from it.
        expressions: Graph.expressions.map(e => ({
          id: e.id, expr: e.expr, rawExpr: e.rawExpr, latex: e.latex,
          color: e.color, visible: e.visible, lineWidth: e.lineWidth, dash: e.dash,
          _tag: e._tag || null, _ghost: e._ghost || false,
          piecewise: e.piecewise || false,
          // Polar / parametric / slope field. Their compiled halves are built,
          // not parsed, so the flag + `rawExpr` (+ the parameter restriction)
          // are what kovalna-load rebuilds them from. Without the flags a
          // saved rose reloaded as y = f(x) of an unknown "theta": a row over
          // an empty plane.
          polar: e.polar || false,
          parametric: e.parametric || false,
          slopeField: e.slopeField || false,
          // A field's {step = …}: plain numbers, restored as they are.
          fieldStep: e.fieldStep || null,
          // JSON has no Infinity — an open side is stored as null.
          tDomain: e.tDomain ? e.tDomain.map(v => (isFinite(v) ? v : null)) : null,
          sliderValues: (e.polar || e.parametric) && e.sliderValues ? { ...e.sliderValues } : undefined,
          vlineX: e.vlineX != null ? e.vlineX : null,
          // Inequality region metadata — without these, a saved/mirrored
          // inequality reloads as its bare boundary curve (no shading).
          _fillSide: e._fillSide || null,
          _fillStrict: e._fillStrict || false,
          _regionOp: e._regionOp || null,
          bandX: e.bandX || null,
          bandY: e.bandY || null,
          _loStrict: e._loStrict || false,
          _hiStrict: e._hiStrict || false,
          plainLabel: e.plainLabel || false,
          histData: e.histData || null,
          boxData: e.boxData || null,
          dotData: e.dotData || null,
          pointData: e.pointData || false,
          // Plotted data sets: scatterplots, regression point clouds, list
          // plots. Plain arrays, so they store as-is — without this a saved
          // regression comes back as labelled rows over an empty grid.
          scatterData: e.scatterData ? { xs: [...e.scatterData.xs], ys: [...e.scatterData.ys] } : null,
          isResidual: e.isResidual || false,
          // Draggability survives. Typed tuple points need nothing but this flag
          // (their drag rewrites their own row). The table's plot also needs
          // `_writeBack`, a closure — `_listPlot` marks it so kovalna-load can
          // rebuild that row against the live table instead.
          _draggable: e._draggable || false,
          _listPlot: e._listPlot || false,
          // Recompile sources for entries whose `fn` is built, not parsed.
          _srcExpr: e._srcExpr || null,
          riemannData: e.riemannData
            ? { a: e.riemannData.a, b: e.riemannData.b, n: e.riemannData.n, type: e.riemannData.type, src: e.riemannData.src || null }
            : null,
          areaData: e.areaData
            ? { a: e.areaData.a, b: e.areaData.b, src: e.areaData.src || null }
            : null,
          action: e.action && Array.isArray(e.action.assigns)
            ? { assigns: e.action.assigns.map(a => ({ name: a.name, expr: a.expr })) }
            : null
        })),
        namedFunctions: { ...Graph.namedFunctions },
        // `free` rides only when the aspect is unlocked, so every snapshot
        // saved under equal units is byte-identical to before.
        window: Object.assign({ xMin: Graph.xMin, xMax: Graph.xMax, yMin: Graph.yMin, yMax: Graph.yMax },
          Graph.aspectLock ? {} : { free: true }),
        polarGrid: Graph._polarGrid || false,
        nextId: Graph.nextId,
        // Overlay images (src is a serializable data-URI / URL)
        images: (Graph._images || []).map(im => ({ src: im.src, x: im.x, y: im.y, w: im.w, h: im.h, opacity: im.opacity })),
        // Calculator state
        vars: Session.get('exprVars', {}),
        lists: Session.get('dataLists', {}),
        history: Session.get('calcHistory', []),
        // DEG/RAD changes what a trig graph means, so it is graph state, not a
        // display preference. `dataCols` is the table's column layout and its
        // calculated-column formulas — `lists` holds only the resulting values.
        // `statsMode` is the panel layout the demo was built in. Theme is
        // deliberately NOT saved: it stays the viewer's own preference.
        angleMode: (typeof angleMode !== 'undefined' && angleMode === 'deg') ? 'deg' : 'rad',
        statsMode: Session.get('statsMode', true),
        dataCols: Session.get('dataCols', null),
        // Tag map
        tagMap: { ..._tagMap }
      };

      if (msg.replyTo && window.parent) {
        window.parent.postMessage({ type: msg.replyTo, state: state }, '*');
      }
    },

    // ── Load state from snapshot ──
    'kovalna-load': function(msg) {
      if (!msg.state) return;
      const s = msg.state;

      // Restore calculator state
      if (s.vars) Session.set('exprVars', s.vars);
      if (s.lists) {
        Session.set('dataLists', s.lists);
        if (typeof DataLists !== 'undefined') {
          DataLists.lists = { ...s.lists };
          if (typeof DataLists.updateAllUI === 'function') DataLists.updateAllUI();
        }
      }
      if (s.history) {
        Session.set('calcHistory', s.history);
        try { document.dispatchEvent(new CustomEvent('calc-history-change')); } catch(e) {}
      }
      // Absent on states saved before these were part of the snapshot — leave
      // the current setting alone rather than forcing a default onto it.
      if (s.angleMode && typeof setAngleMode === 'function') setAngleMode(s.angleMode);
      if (s.statsMode !== undefined && typeof window.setStatsMode === 'function') window.setStatsMode(s.statsMode);
      // Rebuild the table AFTER `lists` is in place: the editor reads its cell
      // values back out of the list store.
      if (Array.isArray(s.dataCols) && typeof Graph.reloadListEditor === 'function') {
        try { Graph.reloadListEditor(s.dataCols); } catch(e) {}
      }

      // Restore graph state
      if (s.window) {
        Graph.xMin = s.window.xMin; Graph.xMax = s.window.xMax;
        Graph.yMin = s.window.yMin; Graph.yMax = s.window.yMax;
        Graph.aspectLock = s.window.free !== true; // absent = locked: old rows reopen as they were
      }
      if (s.namedFunctions) Graph.namedFunctions = { ...s.namedFunctions };
      if (s.nextId) Graph.nextId = s.nextId;
      if (s.polarGrid !== undefined) Graph._polarGrid = s.polarGrid;

      // Rebuild expressions — recompile each one
      Graph.expressions = [];
      if (s.expressions && Array.isArray(s.expressions)) {
        s.expressions.forEach(saved => {
          try {
            if (saved.polar || saved.parametric || saved.slopeField) {
              // Built from source, like the shading below. One we can no
              // longer compile is kept as a row that draws nothing.
              const tDomain = Array.isArray(saved.tDomain)
                ? [saved.tDomain[0] == null ? -Infinity : saved.tDomain[0], saved.tDomain[1] == null ? Infinity : saved.tDomain[1]]
                : null;
              const built = ExprEngine.recompileCurveEntry(saved);
              Graph.expressions.push(built
                ? { ...saved, fn: null, tDomain, ...built }
                : { ...saved, fn: null, tDomain, polar: false, parametric: false, slopeField: false });
            } else if (saved.riemannData || saved.areaData) {
              // Riemann/area shading: the bounds are data, but the integrand is
              // a function, so rebuild it from `src`. The renderer calls that fn
              // unconditionally, so a payload we can't rebuild (a state saved
              // before `src` existed) is dropped outright — restoring it fn-less
              // would throw on every frame.
              const d = saved.riemannData || saved.areaData;
              const key = saved.riemannData ? 'riemannData' : 'areaData';
              let fn = null;
              try { if (d.src) fn = Graph.compile(d.src); } catch(e) { fn = null; }
              if (typeof fn !== 'function') return;
              Graph.expressions.push({ ...saved, fn: null, [key]: { ...d, fn } });
            } else if (saved.action) {
              // List-only action entries — plain data, never drawn.
              Graph.expressions.push({ ...saved, fn: null });
            } else if (saved.vlineX != null || saved.bandX || saved.bandY) {
              // Vertical line / compound-inequality band — no compile needed
              Graph.expressions.push({ ...saved, fn: null });
            } else if (saved.scatterData) {
              // Plotted points. A regression pairs a scatter row with a curve
              // row; the curve is handled by the _srcExpr branch below.
              // The table's own plot must NOT come back draggable yet: without
              // `_writeBack` a drag would take the typed-tuple path and rewrite
              // this row's label instead of the table. restoreListPlot() below
              // replaces it with a properly linked one.
              Graph.expressions.push(saved._listPlot
                ? { ...saved, fn: null, _draggable: false }
                : { ...saved, fn: null });
            } else if (saved._srcExpr) {
              // Derived curve (regression fit) — recompile from its source.
              Graph.expressions.push({ ...saved, fn: Graph.compile(saved._srcExpr) });
            } else if (saved.histData || saved.boxData || saved.dotData || saved.pointData) {
              // Data visualizations — restore as-is (no recompile needed)
              Graph.expressions.push({
                ...saved,
                fn: null
              });
            } else if (saved.piecewise && saved.rawExpr) {
              const fn = Graph.compilePiecewise(saved.rawExpr);
              Graph.expressions.push({ ...saved, fn });
            } else if (saved.rawExpr) {
              // Try to recompile
              try {
                const fn = Graph.compile(saved.rawExpr);
                Graph.expressions.push({ ...saved, fn });
              } catch(e) {
                // Try implicit
                try {
                  const implicitFn = Graph.compileImplicit(saved.rawExpr);
                  Graph.expressions.push({ ...saved, fn: null, implicitFn });
                } catch(e2) {
                  Graph.expressions.push({ ...saved, fn: null });
                }
              }
            } else {
              Graph.expressions.push({ ...saved, fn: null });
            }
          } catch(e) {
            Graph.expressions.push({ ...saved, fn: null });
          }
        });
      }

      // Re-link the table's plot to the table. Runs after the expressions loop
      // (the row has to exist to be replaced) and after the dataCols/lists
      // restore above (the rebuilt row is computed from that table). Absent in
      // display/minimal embeds that have no list editor — the points still draw,
      // they just aren't drag-linked, which is what those embeds want anyway.
      const listPlotRow = Graph.expressions.find(e => e._listPlot);
      if (listPlotRow && typeof Graph.restoreListPlot === 'function') {
        try { Graph.restoreListPlot(listPlotRow.id); } catch(e) {}
      }

      // Restore overlay images
      Graph._images = [];
      if (Array.isArray(s.images)) {
        s.images.forEach(im => { if (im && im.src) Graph.addImage({ src: im.src, x: im.x, y: im.y, w: im.w, h: im.h, opacity: im.opacity }); });
      }

      // Restore tag map
      if (s.tagMap) {
        Object.keys(_tagMap).forEach(k => delete _tagMap[k]);
        Object.assign(_tagMap, s.tagMap);
      }

      // Update UI
      if (Graph.expressions.length) Graph.panel.classList.add('visible');
      else Graph.panel.classList.remove('visible');
      Graph.updateRows();
      Graph.render();
      try { if (typeof updateListPills === 'function') updateListPills(); } catch(e) {}
    },

    // ── Set graph view window ──
    'kovalna-window': function(msg) {
      if (typeof Graph === 'undefined') return;
      // x: [min, max], y: [min, max]
      if (Array.isArray(msg.x) && msg.x.length === 2) {
        Graph.xMin = msg.x[0]; Graph.xMax = msg.x[1];
      }
      if (Array.isArray(msg.y) && msg.y.length === 2) {
        Graph.yMin = msg.y[0]; Graph.yMax = msg.y[1];
      }
      Graph._lockedWindow = { xMin: Graph.xMin, xMax: Graph.xMax, yMin: Graph.yMin, yMax: Graph.yMax };
      // A host window keeps equal units unless it asks for the literal
      // window (aspect: 'free'), so every existing slot renders as it did.
      Graph.aspectLock = msg.aspect !== 'free';
      // step: { x: number, y: number }
      if (msg.step) {
        if (msg.step.x !== undefined) {
          Graph._xStep = String(msg.step.x);
          // Remember the author's default so we can revert when student
          // switches from trig (which auto-bumps to π/2) back to algebraic.
          Graph._authorXStep = String(msg.step.x);
        }
        if (msg.step.y !== undefined) Graph._yStep = String(msg.step.y);
        // Sync sketch snap scale with x-step
        if (msg.step.x !== undefined) {
          const xs = String(msg.step.x).toLowerCase();
          let sv = parseFloat(xs);
          if (xs === 'pi') sv = Math.PI;
          else if (xs === 'pi/2') sv = Math.PI / 2;
          else if (xs === 'pi/3') sv = Math.PI / 3;
          else if (xs === 'pi/4') sv = Math.PI / 4;
          else if (xs === 'pi/6') sv = Math.PI / 6;
          if (!isNaN(sv) && sv > 0 && typeof Sketch !== 'undefined') Sketch.snapScale = sv;
        }
        // Update settings inputs if visible
        const xsEl = document.getElementById('gsXstep');
        const ysEl = document.getElementById('gsYstep');
        if (xsEl && msg.step.x !== undefined) xsEl.value = msg.step.x;
        if (ysEl && msg.step.y !== undefined) ysEl.value = msg.step.y;
      }
      // polar: boolean
      if (msg.polar !== undefined) {
        Graph._polarGrid = !!msg.polar;
        const polarBtn = document.getElementById('gsPolarToggle');
        if (polarBtn) {
          polarBtn.textContent = Graph._polarGrid ? '\u25C9 On' : '\u25CB Off';
          polarBtn.style.color = Graph._polarGrid ? 'var(--accent)' : '';
          polarBtn.style.borderColor = Graph._polarGrid ? 'var(--accent)' : '';
        }
      }
      // Show graph panel if not already visible
      if (Graph.panel && !Graph.panel.classList.contains('visible')) {
        Graph.panel.classList.add('visible');
      }
      Graph.render();
      // Deferred renders to catch late iframe layout
      setTimeout(function() { Graph.render(); }, 100);
      setTimeout(function() { Graph.render(); }, 500);
      setTimeout(function() { Graph.render(); }, 1500);
    },

    // ── Show statistical visualization ──
    'kovalna-show': function(msg) {
      if (!msg.viz) return;
      const vizEl = document.getElementById('exprVizArea');
      if (!vizEl) return;

      let html = '';
      try {
        switch (msg.viz) {
          case 'ci':
            html = V.confidenceInterval(
              msg.lo, msg.hi, msg.estimate,
              { nullVal: msg.null, label: msg.label, clevel: msg.level }
            );
            break;

          case 'normal':
            html = V.normalCurve(
              msg.mean || 0, msg.sd || 1,
              Array.isArray(msg.shade) ? msg.shade[0] : (msg.mean || 0) - 2 * (msg.sd || 1),
              Array.isArray(msg.shade) ? msg.shade[1] : (msg.mean || 0) + 2 * (msg.sd || 1)
            );
            break;

          case 'tdist':
            html = V.tCurve(msg.stat || 0, msg.df || 10);
            break;

          case 'chisq':
            html = V.chi2Curve(msg.stat || 0, msg.df || 5);
            break;

          case 'histogram':
            if (Array.isArray(msg.data) && msg.data.length) {
              html = V.histogram(msg.data, msg.bins || 8);
            }
            break;

          case 'boxplot':
            if (Array.isArray(msg.data) && msg.data.length) {
              html = V.boxplot(msg.data);
            }
            break;

          default:
            return;
        }
      } catch(e) { return; }

      if (!html) return;

      // Render into the viz area
      vizEl.innerHTML = html;
      vizEl.className = 'calc-expr-viz visible';
      // Add dismiss button
      if (!vizEl.querySelector('.viz-dismiss')) {
        const btn = document.createElement('button');
        btn.className = 'viz-dismiss';
        btn.textContent = '\u2715';
        btn.title = 'Dismiss';
        btn.onclick = () => { vizEl.innerHTML = ''; vizEl.className = 'calc-expr-viz'; };
        vizEl.appendChild(btn);
      }
    },

    // ── Enter interactive sketch mode ──
    'kovalna-sketch': function(msg) {
      if (!window._kalcSketch) return;
      if (msg.cancel) {
        window._kalcSketch.deactivate();
        return;
      }
      window._kalcSketch.activate({
        shape: msg.shape || 'line',
        snap: msg.snap,
        showEq: msg.showEq,
        color: msg.color,
        replyTo: msg.replyTo,
        asymptote: msg.asymptote,
        hideScaleButtons: msg.hideScaleButtons,
        hideTrace: msg.hideTrace,
      });
      // Restore previously placed points
      if (msg.points && Array.isArray(msg.points) && msg.points.length > 0) {
        var sk = window._kalcSketch;
        sk.points = msg.points.map(function(p, i) {
          return { x: p.x, y: p.y, role: i === 0 ? 'anchor' : 'shaper' };
        });
        if (msg.handle) sk.handle = msg.handle;
        if (typeof Graph !== 'undefined') Graph.render();
        // Fire the replyTo callback so the parent gets the restored state
        if (sk.replyTo) {
          setTimeout(function() { sk.reportState(); }, 100);
        }
      }
      // Square grid: equalize x and y ranges
      if (msg.square && typeof Graph !== 'undefined') {
        var cx = (Graph.xMin + Graph.xMax) / 2, cy = (Graph.yMin + Graph.yMax) / 2;
        var range = Math.max(Graph.xMax - Graph.xMin, Graph.yMax - Graph.yMin) / 2;
        Graph.xMin = cx - range; Graph.xMax = cx + range;
        Graph.yMin = cy - range; Graph.yMax = cy + range;
        Graph.render();
      }
    },

    // ── Sketch restore: load points into active sketch (delayed restore) ──
    'kovalna-sketch-restore': function(msg) {
      if (!window._kalcSketch || !window._kalcSketch.active) return;
      if (!msg.points || !Array.isArray(msg.points) || msg.points.length < 1) return;
      var sk = window._kalcSketch;
      sk.points = msg.points.map(function(p, i) {
        return { x: p.x, y: p.y, role: i === 0 ? 'anchor' : 'shaper' };
      });
      if (msg.handle) sk.handle = msg.handle;
      if (typeof Graph !== 'undefined') Graph.render();
      if (sk.replyTo) {
        setTimeout(function() { sk.reportState(); }, 100);
      }
    },

    // ── Sketch feedback: recolor student curve, lock points ──
    'kovalna-sketch-feedback': function(msg) {
      if (!window._kalcSketch || !window._kalcSketch.active) return;
      if (msg.color) {
        const c = resolveColor(msg.color);
        window._kalcSketch.feedbackColor = c || msg.color;
      }
      if (msg.lock !== false) {
        window._kalcSketch.locked = true;
      }
      Graph.render();
    },

    // ── Visual feedback on graph border + toast ──
    'kovalna-feedback': function(msg) {
      const panel = document.getElementById('graphPanel');
      if (!panel) return;
      panel.classList.add('kalc-feedback-border');

      // Remove any existing feedback classes
      panel.classList.remove('kalc-feedback-correct', 'kalc-feedback-incorrect');

      if (msg.result === 'correct') {
        panel.classList.add('kalc-feedback-correct');
      } else if (msg.result === 'incorrect') {
        panel.classList.add('kalc-feedback-incorrect');
      }

      // Toast message
      if (msg.message && typeof showToast === 'function') {
        showToast(msg.message);
      }

      // Auto-clear border after 4 seconds unless persist is set
      if (!msg.persist) {
        setTimeout(() => {
          panel.classList.remove('kalc-feedback-correct', 'kalc-feedback-incorrect', 'kalc-feedback-border');
        }, 4000);
      }
    },

    // ── Freeze controls ──
    'kovalna-freeze': function(msg) {
      // Any field not specified defaults to true (frozen)
      _frozen.input = msg.input !== false;
      _frozen.pan   = msg.pan   !== false;
      _frozen.zoom  = msg.zoom  !== false;
      _frozen.trace = msg.trace !== false;
      // keyPoints is opt-OUT (default allowed): only frozen when explicitly
      // sent true, so callers that don't mention it keep click-to-label on.
      _frozen.keyPoints = msg.keyPoints === true;
      applyFreeze();
    },

    // ── Thaw (unlock all) ──
    'kovalna-thaw': function(msg) {
      _frozen.input = false;
      _frozen.pan   = false;
      _frozen.zoom  = false;
      _frozen.trace = false;
      applyFreeze();
    },

    // ── List every expression (tagged by the parent or typed by the student) ──
    'kovalna-list': function(msg) {
      if (!msg.replyTo || !window.parent) return;
      window.parent.postMessage({ type: msg.replyTo, expressions: listExpressions() }, '*');
    },

    // ── Watch expression changes by tag ('*' = any expression) ──
    'kovalna-watch': function(msg) {
      if (!msg.tag || !msg.replyTo) return;
      _watchers[msg.tag] = msg.replyTo;
    },

    // ── Unwatch expression changes ──
    'kovalna-unwatch': function(msg) {
      if (!msg.tag) return;
      delete _watchers[msg.tag];
    },

    // ── Force re-render (used by parent after layout settles) ──
    'kovalna-render': function(msg) {
      if (typeof Graph !== 'undefined') Graph.render();
    },

    // ── Overlay an image on the graph (trace/model) ──
    'kovalna-image': function(msg) {
      if (typeof Graph === 'undefined') return;
      if (msg.clear) { if (Graph.clearImages) Graph.clearImages(); return; }
      if (!msg.src || !Graph.addImage) return;
      Graph.addImage({
        src: msg.src, x: msg.x, y: msg.y,
        w: msg.width, h: msg.height, opacity: msg.opacity
      });
    }
  };

  // ─── Watcher system ───
  // Maps tag → replyTo channel. Fires when a watched expression changes.
  const _watchers = {};

  // What a parent sees of each expression: its tag (null = the student typed
  // it), the source text, its LaTeX, and how it's drawn.
  function listExpressions() {
    return Graph.expressions.map(e => ({
      id: e.id, tag: e._tag || null, expr: e.expr || '', latex: e.latex || '',
      visible: e.visible !== false, color: e.color || null, ghost: !!e._ghost, fixed: !!e._fixed
    }));
  }

  // Poll for changes to watched expressions (runs on Graph render)
  let _lastWatchState = {};
  let _lastAllState = null;
  // While a parent's message is being handled, the graph renders in steps (an
  // add draws the row, THEN tags it); a watcher reported from inside would see
  // a half-made row — untagged, so a parent takes the author's own row for
  // the student's. The dispatcher below reports once, after the handler.
  let _inHandler = false;
  function checkWatchers() {
    if (_inHandler) return;
    if (!Object.keys(_watchers).length) return;
    if (_watchers['*'] && window.parent) {
      const all = listExpressions();
      const key = JSON.stringify(all.map(e => [e.id, e.tag, e.expr, e.visible, e.color, e.ghost, e.fixed]));
      if (key !== _lastAllState) {
        _lastAllState = key;
        window.parent.postMessage({ type: _watchers['*'], tag: '*', expressions: all }, '*');
      }
    }
    for (const [tag, replyTo] of Object.entries(_watchers)) {
      if (tag === '*') continue;
      const id = _tagMap[tag];
      if (id === undefined) continue;
      const entry = Graph.expressions.find(e => e.id === id);
      if (!entry) continue;
      // Build current state string for comparison
      const stateKey = `${entry.expr}|${entry.color}|${entry.visible}|${entry.lineWidth}|${JSON.stringify(entry.dash)}`;
      if (_lastWatchState[tag] !== stateKey) {
        _lastWatchState[tag] = stateKey;
        if (window.parent) {
          window.parent.postMessage({
            type: replyTo,
            tag: tag,
            eq: entry.expr || null,
            visible: entry.visible,
            color: entry.color
          }, '*');
        }
      }
    }
  }

  // Hook into Graph.render to trigger watcher checks
  const _origRender = Graph.render.bind(Graph);
  Graph.render = function() {
    _origRender();
    try { checkWatchers(); } catch(e) {}
  };

  // ─── Single listener, dispatch by type ───
  window.addEventListener('message', function(e) {
    if (!e.data || typeof e.data !== 'object') return;
    const handler = handlers[e.data.type];
    if (!handler) return;
    _inHandler = true;
    try { handler(e.data); } finally { _inHandler = false; }
    try { checkWatchers(); } catch (err) {}
  });

  // ─── Tell an embedding page the API is listening ───
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'kovalna-ready' }, '*');
  }

  // ─── CSS for frozen state ───
  const style = document.createElement('style');
  style.textContent = `
    .kalc-frozen { pointer-events: none !important; opacity: 0.4 !important; }
    .calc-expr-bar.kalc-frozen math-field,
    .calc-expr-bar.kalc-frozen .mq-editable-field,
    .calc-expr-bar.kalc-frozen input,
    .calc-expr-bar.kalc-frozen button { pointer-events: none !important; }
  `;
  document.head.appendChild(style);

})();

// ═══ Perf overlay (?debug=1) — T0.2 ═══════════════════════════════
// Renders/sec, per-render ms (avg over the last second), and fn evals per
// render when the plot loop exposes a counter. Zero cost without the flag.
(function () {
  if (!new URLSearchParams(window.location.search).has('debug')) return;
  if (typeof Graph === 'undefined' || !Graph.render) return;
  const el = document.createElement('div');
  el.id = 'kalcPerfOverlay';
  el.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:99999;' +
    'font:11px/1.5 "JetBrains Mono",monospace;background:rgba(0,0,0,0.72);' +
    'color:#7fdc7f;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:pre;';
  document.body.appendChild(el);
  let renders = 0, msTotal = 0, msMax = 0;
  const origRender = Graph.render.bind(Graph);
  Graph.render = function () {
    const t0 = performance.now();
    const out = origRender.apply(this, arguments);
    const dt = performance.now() - t0;
    renders++; msTotal += dt; if (dt > msMax) msMax = dt;
    return out;
  };
  let last = performance.now(), frames = 0;
  (function tick(now) {
    frames++;
    if (now - last >= 1000) {
      const avg = renders ? (msTotal / renders) : 0;
      el.textContent =
        'fps     ' + Math.round(frames * 1000 / (now - last)) + '\n' +
        'renders ' + renders + '/s\n' +
        'render  ' + avg.toFixed(2) + 'ms avg  ' + msMax.toFixed(2) + 'ms max' +
        (Graph._perfEvals ? '\nevals   ' + Graph._perfEvals : '');
      renders = 0; msTotal = 0; msMax = 0; frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  })(performance.now());
})();

</script>
